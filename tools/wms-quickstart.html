<title>WMS 現場ナビ — ONEsLOGI クラウドWMS 運用者ツール</title>
<style>
:root{
  --ink:#242b35; --ink2:#5b6572; --paper:#f7f5f1; --card:#ffffff;
  --line:#e2ded5; --acc:#e8630a; --acc-ink:#ffffff; --acc-soft:#fdeadd;
  --ok:#2e7d5b; --warn:#9a7100; --err:#c43d3d; --info:#3a6ea5;
  --chip:#edeae2; --code:#f0eee7; --hl:#fff3c4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#e9e7e1; --ink2:#9aa3ad; --paper:#15181e; --card:#1e232b;
  --line:#323a45; --acc:#ff7a1a; --acc-ink:#1a1206; --acc-soft:#3a2716;
  --ok:#5cbe94; --warn:#d9a821; --err:#e07070; --info:#7aa7d4;
  --chip:#2a313b; --code:#262c35; --hl:#4a3d14;}}
:root[data-theme="dark"]{
  --ink:#e9e7e1; --ink2:#9aa3ad; --paper:#15181e; --card:#1e232b;
  --line:#323a45; --acc:#ff7a1a; --acc-ink:#1a1206; --acc-soft:#3a2716;
  --ok:#5cbe94; --warn:#d9a821; --err:#e07070; --info:#7aa7d4;
  --chip:#2a313b; --code:#262c35; --hl:#4a3d14;}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  font-size:15px;line-height:1.75;-webkit-text-size-adjust:100%}
button{font-family:inherit}

header{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:2px solid var(--acc);padding:8px 14px}
.hrow{display:flex;gap:10px;align-items:center;max-width:960px;margin:0 auto}
.logo{font-weight:800;font-size:15px;letter-spacing:.02em;white-space:nowrap;cursor:pointer;user-select:none}
.logo small{color:var(--acc);display:block;font-size:9.5px;letter-spacing:.18em;font-weight:700}
#q{flex:1;min-width:120px;padding:9px 14px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);font-size:15px}
#q::placeholder{color:var(--ink2)}
#q:focus{outline:2px solid var(--acc);outline-offset:1px}
.navchips{display:flex;gap:4px;overflow-x:auto;max-width:960px;margin:8px auto 0;padding-bottom:2px;scrollbar-width:none}
.navchips::-webkit-scrollbar{display:none}
.navchips button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:99px;padding:5px 14px;font-size:13px;cursor:pointer;font-weight:600}
.navchips button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

main{max-width:960px;margin:0 auto;padding:18px 14px 90px}
h2{font-size:20px;margin:8px 0 4px;text-wrap:balance}
h2 .eye{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--acc);font-weight:700}
h3{font-size:16px;margin:20px 0 8px}
.lead{color:var(--ink2);margin:0 0 16px;max-width:64ch;font-size:14px}

/* home */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:14px 0 6px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;
  text-align:left;display:flex;flex-direction:column;gap:4px;border-bottom:3px solid var(--line)}
.tile:hover{border-color:var(--acc)}
.tile .ti{font-size:16.5px;font-weight:800}
.tile .td{color:var(--ink2);font-size:13px;line-height:1.6}
.tile .ic{font-size:22px}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin:10px 0}
.rule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13.5px}
.rule b{display:block;font-size:14px}
.rule .n{color:var(--acc);font-weight:800;margin-right:6px}

/* chips & cards */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:99px;
  padding:4px 13px;font-size:13px;cursor:pointer;font-weight:600}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.count{color:var(--ink2);font-size:12.5px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.card.open{border-color:var(--acc)}
.chead{width:100%;text-align:left;background:none;border:none;color:var(--ink);cursor:pointer;
  padding:12px 14px;font-size:15px;font-weight:700;display:flex;gap:9px;align-items:baseline;line-height:1.5}
.chead .arr{color:var(--acc);flex-shrink:0;transition:transform .12s;font-size:13px}
@media (prefers-reduced-motion:reduce){.chead .arr{transition:none}}
.card.open .chead .arr{transform:rotate(90deg)}
.chead .cat{margin-left:auto;flex-shrink:0;background:var(--chip);color:var(--ink2);font-size:11px;
  font-weight:700;border-radius:99px;padding:1px 10px;align-self:center}
.cbody{display:none;padding:0 16px 14px;border-top:1px solid var(--line)}
.card.open .cbody{display:block}
.where{color:var(--ink2);font-size:13px;margin:10px 0 2px}
.where b{color:var(--ink)}
ol.steps{margin:8px 0;padding:0;counter-reset:s;list-style:none}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 4px 36px;max-width:66ch}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:23px;height:23px;border-radius:50%;
  background:var(--chip);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums}
.note{border-left:4px solid var(--warn);background:var(--code);padding:7px 12px;margin:8px 0;border-radius:0 8px 8px 0;
  font-size:13.5px;max-width:66ch}
.note.danger{border-left-color:var(--err)}
.note.info{border-left-color:var(--info)}
.note .nt{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--warn)}
.note.danger .nt{color:var(--err)}
.note.info .nt{color:var(--info)}

/* wizard */
.wz{background:var(--card);border:1.5px solid var(--acc);border-radius:12px;padding:18px;margin:12px 0}
.wz .bc{font-size:12.5px;color:var(--ink2);margin-bottom:10px;line-height:1.9}
.wz .bc span{background:var(--chip);border-radius:6px;padding:2px 8px;margin-right:6px;display:inline-block}
.wz .q{font-size:17px;font-weight:800;margin:2px 0 14px;text-wrap:balance}
.wzopts{display:flex;flex-direction:column;gap:8px;max-width:520px}
.wzopts button{text-align:left;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:10px;padding:11px 16px;font-size:14.5px;cursor:pointer;font-weight:600}
.wzopts button:hover{border-color:var(--acc)}
.wzback{margin-top:14px;display:flex;gap:8px}
.ghost{border:1px solid var(--line);background:none;color:var(--ink2);border-radius:8px;padding:6px 14px;
  font-size:13px;cursor:pointer}
.result .cause{background:var(--acc-soft);border-radius:8px;padding:10px 14px;margin:6px 0 12px;font-size:14px}
.result .cause b{color:var(--acc)}
.result h4{margin:12px 0 4px;font-size:14px}
.prevent{border-left:4px solid var(--ok);background:var(--code);padding:7px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
.prevent b{color:var(--ok);font-size:11px;letter-spacing:.08em}

/* status */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 16px}
.flow .st{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:5px 13px;font-size:13px;font-weight:700}
.flow .st.hl{border-color:var(--acc);color:var(--acc)}
.flow .ar{color:var(--ink2)}
.opgrid{display:grid;gap:8px}
.oprow{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.oprow b{display:block;margin-bottom:2px}
.oprow .cond{color:var(--ink2);font-size:13.5px}
.oprow .cond em{font-style:normal;color:var(--ink);font-weight:600}

/* checklist */
.cktabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.ckwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ckitem{display:flex;gap:11px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ckitem:last-of-type{border-bottom:none}
.ckitem input{width:19px;height:19px;margin-top:4px;accent-color:var(--acc);flex-shrink:0;cursor:pointer}
.ckitem .kt{font-size:14.5px;font-weight:600}
.ckitem .kd{font-size:13px;color:var(--ink2)}
.ckitem.done .kt{text-decoration:line-through;color:var(--ink2)}
.ckbar{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;gap:10px}
.ckprog{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ckprog b{color:var(--acc);font-size:16px}

/* params */
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:0 0 10px}
.pcard .sym{font-size:14.5px;font-weight:700;text-wrap:balance}
.pcard .sym::before{content:"こんな現象 → ";color:var(--acc);font-size:11.5px;font-weight:800;letter-spacing:.05em}
.pcard .pn{margin:7px 0 1px;font-size:13.5px}
.pcard .pn b{background:var(--code);border-radius:5px;padding:1px 8px}
.pcard .pw{color:var(--ink2);font-size:12.5px}
.pcard .pe{font-size:13.5px;margin-top:5px;max-width:70ch}

/* terms */
.term{padding:9px 2px;border-bottom:1px solid var(--line);max-width:72ch}
.term dt{font-weight:800;font-size:14.5px;display:flex;gap:8px;align-items:baseline}
.term dt .cat{background:var(--chip);color:var(--ink2);font-size:10.5px;border-radius:99px;padding:0 9px;font-weight:700}
.term dd{margin:2px 0 0;color:var(--ink2);font-size:13.5px}

/* search results */
.sr h3{display:flex;gap:8px;align-items:baseline}
.sr h3 small{color:var(--ink2);font-weight:normal;font-size:12px}
.srow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 14px;margin:0 0 8px;cursor:pointer;color:var(--ink);font-size:14px}
.srow:hover{border-color:var(--acc)}
.srow b{display:block}
.srow small{color:var(--ink2);font-size:12.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--ink2);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}

.twrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--chip);font-size:12.5px}
kbd{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:12.5px;font-family:inherit}
footer{color:var(--ink2);font-size:11.5px;padding:22px 14px;border-top:1px solid var(--line);max-width:960px;margin:20px auto 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.topbtn{position:fixed;right:14px;bottom:14px;z-index:25;border:1px solid var(--line);background:var(--card);color:var(--ink2);
  border-radius:99px;width:42px;height:42px;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
@media print{
  header,.navchips,.topbtn,footer,.chips,.cktabs,#q{display:none!important}
  body{background:#fff;color:#000}
  .card{break-inside:avoid}
  .card .cbody{display:block!important}
}
</style>

<header>
  <div class="hrow">
    <div class="logo" id="logo">WMS 現場ナビ<small>ONEsLOGI GUIDE</small></div>
    <input id="q" type="search" enterkeyhint="search" placeholder="なんでも検索：症状・作業・用語（例: 検品 固まった）" aria-label="全体検索">
  </div>
  <nav class="navchips" id="nav" aria-label="メニュー"></nav>
</header>
<main id="app" aria-live="polite"></main>
<button class="topbtn" id="topbtn" title="上へ戻る" aria-label="上へ戻る">↑</button>
<footer>出典: Box「三生」フォルダ内 ONEsLOGI クラウドWMS 公式マニュアル一式（PC編・共通操作編・HT編・SD編・EC受注業務編・トラブルシューティング編・ヘルプ編・荷札用紙設定編）／ご利用の手引き／機能一覧 Ver4.6／用語辞書／ステータス遷移表。挙動はセンタ・荷主のパラメータマスタ設定に依存するため、細部は原本と自倉庫の設定を優先してください。チェックリストのチェック状態はこの端末のブラウザにのみ保存されます。</footer>

"入力していた内容が消えた","result":{"cause":"F5・更新ボタンを押すと画面が初期化され入力内容がクリアされる。タイムアウトからの復帰時も中断前画面は「表示直後の状態」で復元され、入力内容は再表示されない。SDではブラウザの「最新の情報に更新」で『メインメニュー』へ遷移し入力内容がクリアされる。","steps":["消えた内容は再入力する","登録処理の開始後にブラウザの戻る・閉じるを押していた場合、処理は継続されている（取消にはならない）。取消・修正が必要な場合は各画面の機能で行う"],"prevent":"入力中にF5・更新ボタンを押さない。ボタン押下後は処理終了まで操作しない（二度押しで二重処理の恐れ）。"}}]}}},{"id":"button-disabled","title":"修正・解除のボタンが押せない/押すとエラーになる","kw":["修正できない","解除できない","指示修正","出庫指示解除","出荷検品解除","入荷予定修正","ステータス","エラー"],"start":"q1","nodes":{"q1":{"q":"どの操作でエラーになるか？","opts":[{"label":"出荷指示の修正（【指示修正】）","result":{"cause":"出荷指示の修正はステータスが「未出荷」または「エラー有」のときのみ可能。「出庫指示済」以降は修正できない。","steps":["『出庫指示一覧』で対象をチェックし【出庫指示解除】を押してステータスを「未出荷」に戻す","『商品別出荷一覧』から【指示修正】で『出荷指示入力』を開き、修正して【登録】を押す"]}},{"label":"出荷確定済の指示の変更（作業日・出荷日・配送コース等）","result":{"cause":"出荷確定済の指示は作業日・出荷日・配送コースの変更ができない。出荷確定済以降は出荷業務を行えない。","steps":["『出荷確定一覧』で表示を「未確定のみ表示」から「全件表示」に変えて検索する","対象をチェックし【出荷確定解除】を押す（確定解除は出荷確定済のみ可）","解除後に必要な変更を行う"]}},{"label":"入荷予定の修正・削除","result":{"cause":"入荷予定の修正・削除は「未入荷」または「エラー有」のときのみ可能。また修正はWMS入荷伝票No.を1件のみチェックすることが条件。","steps":["『伝票別入荷一覧』で対象のWMS入荷伝票No.を1件のみチェックし【入荷予定修正】を押す","既に実績計上済の場合は、一覧から【入荷実績入力】で内容を訂正して【登録】するか、【入荷取消】でステータスを「未入荷」に戻してから予定を修正する","修正時に明細0行で登録すると予定の削除になる点に注意する"]}},{"label":"【出庫指示解除】【出荷検品解除】などの解除系","result":{"cause":"出庫指示解除は「出庫指示済」〜「検品中」のステータスのみ可能。出荷確定済（確定解除は出荷確定済のみ）などステータス条件を満たさないと実行できない。また出荷検品解除・入荷予定修正・ピッキングリスト遷移などの修正系はWMS伝票No.を1件のみチェックすることが条件のものが多い。","steps":["対象のステータスを一覧で確認する","チェックを1件のみにして再実行する","出荷確定済の場合は『出荷確定一覧』で「全件表示」に変えて検索し【出荷確定解除】で戻してから解除・修正を行う"]}}]}}},{"id":"ht-power-off","title":"HTが作業の途中で電源が切れた/電池切れになった","kw":["HT","ハンディ","電源","電池切れ","中断","再開"],"result":{"cause":"電池切れ・長時間放置による電源OFF等で処理が中断しても、作業状態は保持されており、再ログイン時に再開できる。","steps":["HTの電源を入れ、『ログイン』でユーザCDを入力し【F3】または【ENT】を押す","再開確認画面が表示されたら【F3】を押して中断前の画面へ復帰する","中断箇所から作業を継続する（やり直しは不要）"]}},{"id":"tanaoroshi-sai","title":"棚卸の数が合わない/差異が出る","kw":["棚卸","差異","数が合わない","棚差異リスト","引当済","在庫調整"],"start":"q1","nodes":{"q1":{"q":"棚卸データ作成の後に、入出荷や在庫移動などの荷動きがあったか？","opts":[{"label":"はい（作成後に荷動きがあった）","result":{"cause":"棚卸データ作成後の在庫変動は差異の原因になる。先付棚卸で荷動きが出た場合は再度データ作成からやり直す。","steps":["『棚卸データ作成』で棚卸データを再作成する（再作成時は棚卸数量を保持し在庫数のみ最新化される。在庫追加分は棚卸データが追加される）","『棚卸差異リスト発行』で差異を確認する（「差異数以上」で絞込、比較単位は「商品単位」「ロケーション単位」）","差異が確定したら『棚卸入力』の【在庫調整】または『棚卸在庫一括更新』の【在庫一括更新】で在庫を調整する"],"prevent":"棚卸は入出荷業務の終了後に実施する。予定登録は可能だが、入出荷作業は棚卸終了後に行う。"}},{"label":"いいえ（荷動きはない）","next":"q2"}]},"q2":{"q":"差異のある在庫に引当済数があるか？","opts":[{"label":"はい（引当済数がある）","result":{"cause":"引当済がある場合、引当可能数のみが棚卸対象数量となる。現物と一致しないように見えるのは引当済分が含まれるため。","steps":["現物と棚卸対象数量が不一致の場合は、対象商品がピッキング済かどうかを確認する","引当済分を除いた引当可能数で棚卸数量を判断する"]}},{"label":"いいえ（純粋な数量差異）","result":{"cause":"実在庫と帳簿在庫の差異。棚卸差異は在庫調整で処理する。","steps":["『棚卸差異リスト発行』で差異を確認する（「差異数以上」で絞込可）","個別調整は『棚卸入力』で対象を1行チェックし【在庫調整】を押す（未調整のみ遷移可。処理区分・調整総数・備考は自動入力）","一括調整は『棚卸在庫一括更新』で検索→チェック→【在庫一括更新】を押す（棚卸入力数に合わせ差分調整。作成後に在庫変動した行は赤背景で表示）"]}}]}}}],"glossary":[{"term":"10日残数","def":"在庫情報のひとつ。当月10日時点の在庫数。『在庫問合せ』画面に表示される","cat":"在庫"},{"term":"15日残数","def":"在庫情報のひとつ。当月15日時点の在庫数","cat":"在庫"},{"term":"20日残数","def":"在庫情報のひとつ。当月20日時点の在庫数","cat":"在庫"},{"term":"CD","def":"CODEの略","cat":"基本"},{"term":"EDI","def":"電子データ交換（Electronic Data Interchange）","cat":"EDI・連携"},{"term":"EDIデータ受信","def":"各一括取込画面で使用するフォーマットで、WebAPIによるデータ受信が可能。受信可能データは取引先マスタ・ロケーションマスタ・商品マスタ・商品荷姿マスタ・入荷予定データ・出荷指示データ","cat":"EDI・連携"},{"term":"EDIデータ送信","def":"EDIフォーマットでWebAPIによるデータ送信が可能。送信可能データは入庫実績データ・出荷実績データ・在庫データ","cat":"EDI・連携"},{"term":"ETL","def":"Extract/Transform/Load。基幹システム等のデータを抽出・加工・書き出しする一連の処理を支援するソフトウェア","cat":"EDI・連携"},{"term":"HT","def":"ハンディーターミナル","cat":"基本"},{"term":"HTケースピック使用フラグ","def":"HTケースピッキング時、HTの使用可否を設定するフラグ（パラメータマスタでセンタ・荷主単位に設定）","cat":"設定"},{"term":"HT文字認識使用フラグ","def":"HT入荷検品・入荷検品格納時、ロットと期限日の入力でHTの文字認識機能の使用可否を設定するフラグ","cat":"設定"},{"term":"HTロット入力方式","def":"HTの文字認識機能使用時、ロットに入力法則がある場合の入力方式（法則外の入力をはじく）を設定する","cat":"設定"},{"term":"SD","def":"スマートデバイス（スマートフォン、タブレットなど）","cat":"基本"},{"term":"WAS","def":"Warehouse Analytics System（倉庫分析システム）","cat":"基本"},{"term":"WAS連携","def":"WMSのDBに蓄積されたデータを抽出しCSVファイルに書き出す。対象は荷主マスタ・荷主センタマスタ・センタマスタ・ユーザマスタ・作業実績データ・入荷予定データ・出荷指示データ・定義補充指示データ・緊急補充指示データ・セット組指示データ・セット組解除指示データ・棚卸データ・HT在庫移動出庫データ","cat":"EDI・連携"},{"term":"WMS","def":"Warehouse Management System（倉庫管理システム）","cat":"基本"},{"term":"WMS出荷伝票No.","def":"出荷指示の登録時に採番される番号（センタ単位に採番）","cat":"出荷"},{"term":"WMS入荷伝票No.","def":"入荷予定の登録時に採番される番号（センタ単位に採番）","cat":"入荷"},{"term":"一次ピッキング","def":"保管ロケーションから商品をピッキングし、仮置き場へ格納すること","cat":"ピッキング"},{"term":"一斉棚卸","def":"棚卸データ作成で条件を指定しない場合、在庫データ全件が対象となる棚卸","cat":"棚卸"},{"term":"移動","def":"処理区分のひとつ。ロケーション移動・荷姿切替・在庫区分切替","cat":"在庫"},{"term":"入数","def":"在庫情報のひとつ。商品の入数","cat":"在庫"},{"term":"入数内訳","def":"在庫情報のひとつ。商品の入数内訳","cat":"在庫"},{"term":"エラー有（出荷指示）","def":"作業進捗のひとつ。マスタ設定等でエラーになっている出荷指示（進捗率では未出荷に含まれる）。『出庫指示一覧』『商品別出荷一覧』『配送コース別出荷進捗』画面等で表示","cat":"出荷"},{"term":"エラー有（入荷予定）","def":"作業進捗のひとつ。マスタ設定等でエラーになっている入荷予定（進捗率では未入荷に含まれる）。『伝票別入荷一覧』『商品別入荷一覧』画面で表示","cat":"入荷"},{"term":"エラー音再生フラグ","def":"出荷検品・単行出荷検品時にエラーが発生した場合、エラー音を出力するか否かを設定するフラグ（パラメータマスタでセンタ・荷主単位に設定）","cat":"設定"},{"term":"オーダーピッキング","def":"引当てられた商品を納品先（出庫作業No.）単位でピッキングすること","cat":"ピッキング"},{"term":"オーダーピッキングリスト","def":"オーダーピッキング用のピッキングリスト","cat":"帳票・ラベル"},{"term":"格納ロケーション","def":"入荷予定リストに表示された商品を格納すべきロケーション。前回入庫したロケーションが表示される（新規商品の場合は空白）。渋滞の場合や新規商品の場合は人の判断で別ロケーションに格納し、『入荷実績入力』画面で入荷実績を入力する","cat":"入荷"},{"term":"過去日入力可フラグ","def":"HTの入荷検品時、期限日入力に過去日の入力可否を設定するフラグ","cat":"設定"},{"term":"過入荷可フラグ","def":"HTの入荷検品時、予定数を超過する入荷数の入力可否を設定するフラグ","cat":"設定"},{"term":"仮置きNo.","def":"ピッキングした商品を仮置きするロケーション","cat":"ピッキング"},{"term":"カルチャ","def":"ユーザが使用する言語や数値・日時・通貨などの書式、年号・暦などのロケールに関する情報","cat":"基本"},{"term":"期限日","def":"賞味期限日、または消費期限日","cat":"在庫"},{"term":"期限日管理品","def":"期限日管理の対象となる商品","cat":"在庫"},{"term":"期限日管理フラグ","def":"期限日管理を実施するか否かを設定するフラグ（商品マスタで荷主単位に設定）。登録した商品は期限日管理品となり、『入荷実績入力』画面や『在庫調整』画面で在庫が発生する際に期限日が必須入力となる","cat":"設定"},{"term":"期限日逆転防止フラグ","def":"期限日逆転防止の管理を行うと、前回出荷の期限日以前の在庫は引当されない（商品マスタ・取引先マスタで荷主単位に、商品単位・取引先単位の設定が可能）","cat":"設定"},{"term":"キャンセル","def":"作業進捗のひとつ。1度正常に入力後、キャンセルされた出荷指示。『出庫指示一覧』『商品別出荷一覧』『配送コース別出荷進捗』画面で表示","cat":"出荷"},{"term":"強制移動","def":"処理区分のひとつ。出荷確定解除時に入庫ラベルNo.が重複した場合、強制的に在庫があるロケーションへ移動する処理","cat":"在庫"},{"term":"強制確定","def":"目視で出荷検品した場合など、出荷検品処理を行わずに『出荷確定一覧』画面から「強制確定」を行い出荷確定にすること","cat":"出荷"},{"term":"強制確定フラグ","def":"強制確定した場合、『出荷確定一覧』画面の「強制確定フラグ」欄に「強制確定」と表示される","cat":"出荷"},{"term":"共通送り状","def":"3社（日本郵政・佐川急便・ヤマト運輸）以外で使用する送り状として設定するもの","cat":"帳票・ラベル"},{"term":"緊急補充","def":"処理区分のひとつ。引当の際に補充点を割った場合、バックヤードからピックロケへの移動指示（緊急補充）を自動的にかける","cat":"補充"},{"term":"緊急補充倉庫","def":"緊急補充ゾーンの絞り込みに使用する。未設定でも可（パラメータマスタでセンタ・荷主単位に設定）","cat":"補充"},{"term":"緊急補充ゾーン","def":"ロケーションマスタに補充ロケ（ピックロケーション以外）が設定されていない商品を補充するためのゾーン。設定しない場合、補充ロケ未設定の商品は緊急補充対象外。ピックロケに直接緊急補充は行わず、バックロケまでピッキングに行かずに済むようピックロケの近くに作成し、バックロケから商品を集めておくゾーンを指す","cat":"補充"},{"term":"緊急補充ゾーン補充荷姿","def":"緊急補充ゾーンへの補充時、緊急補充単位が「1: 最大梱包数荷姿以上」の設定の場合に補充を行う荷姿","cat":"補充"},{"term":"緊急補充単位","def":"緊急補充指示時、荷姿単位で指定する在庫移動単位","cat":"補充"},{"term":"緊急補充ラベル","def":"緊急補充用の指示ラベル","cat":"帳票・ラベル"},{"term":"緊急補充ロケ割付方法","def":"緊急補充ゾーンに補充する際、どのように商品を割り付けるかを設定する","cat":"補充"},{"term":"警告音再生フラグ","def":"出荷検品・単行出荷検品時に警告が発生した場合、警告音を出力するか否かを設定するフラグ","cat":"設定"},{"term":"ケース","def":"いくつかのバラ商品、またはいくつかのボールを梱包した荷姿","cat":"基本"},{"term":"ケース入数","def":"1ケースあたりに入る商品の個数","cat":"基本"},{"term":"ケース荷姿","def":"各商品に共通して使用するケースの荷姿","cat":"基本"},{"term":"ケース引当","def":"ケース単位での引当て","cat":"出荷"},{"term":"ケースピッキング","def":"ケース引当された商品をケース単位でピッキングすること（一次ピッキング）。バラピッキングされた商品と纏めて納品先毎に仕分する","cat":"ピッキング"},{"term":"ケースピックフラグ","def":"ケースピッキングの引当有無を設定するフラグ","cat":"設定"},{"term":"欠品","def":"作業進捗のひとつ。在庫引当時に在庫の引当可能数が出荷指示数より少ない状態。『出庫指示一覧』『商品別出荷一覧』『配送コース別出荷進捗』画面で青文字で表示","cat":"出荷"},{"term":"欠品時自動出庫指示フラグ","def":"欠品商品を含む出庫指示を自動出庫指示の対象とするか否かを設定するフラグ","cat":"設定"},{"term":"欠品時出荷指示分割フラグ","def":"出庫指示時に欠品が発生した場合、出荷指示を欠品分のみ分離させるかを設定する","cat":"設定"},{"term":"欠品時出庫指示取消フラグ","def":"出庫指示時に欠品が発生した場合、出庫指示を取り消すか否かを設定するフラグ","cat":"設定"},{"term":"欠品時引当区分","def":"出庫指示時に欠品が発生した場合の引当方法を設定する区分","cat":"設定"},{"term":"検品","def":"入荷検品・出荷検品は、画面・HTのどちらからでも行える","cat":"基本"},{"term":"検品音再生フラグ","def":"出荷検品・単行出荷検品時に検品音を出力するか否かを設定するフラグ","cat":"設定"},{"term":"検品完了音再生フラグ","def":"出荷検品時に検品完了音を出力するか否かを設定するフラグ","cat":"設定"},{"term":"検品後荷札出力フラグ","def":"出荷検品後に荷札を出力するかを設定するフラグ","cat":"設定"},{"term":"検品後納品明細","def":"検品後に出力する納品明細等を設定する（パラメータマスタでセンタ・荷主単位に設定）","cat":"設定"},{"term":"検品後納品明細出力フラグ","def":"検品後に納品明細を出力するかを設定するフラグ","cat":"設定"},{"term":"検品済伝票数","def":"検品済みの合計伝票数","cat":"出荷"},{"term":"検品済み","def":"検品済みの伝票数","cat":"出荷"},{"term":"顧客出荷指示No","def":"伝票に顧客独自の伝票番号の記載がある場合に使用する番号。ピッキングリストと伝票の照合に活用できる","cat":"出荷"},{"term":"混載フラグ","def":"同一の梱包内に商品CDの異なる商品を積載しているか否かを設定するフラグ","cat":"設定"},{"term":"梱包計算処理区分","def":"梱包計算の有無を設定する区分","cat":"設定"},{"term":"梱包資材グループ","def":"梱包計算時に使用する資材グループ（パラメータマスタでセンタ・荷主単位に設定）","cat":"設定"},{"term":"在庫","def":"在庫を管理するキー項目は「荷主CD」「センタCD」「預託CD」「在庫区分」「商品CD」「ロケーション」「入庫ラベルNo.」「ロット」「期限日」。同一商品CDでもこれらの項目が異なると別在庫として管理できる","cat":"在庫"},{"term":"在庫内訳","def":"在庫情報のひとつ。商品の在庫内訳","cat":"在庫"},{"term":"在庫管理単位","def":"商品の在庫を管理する単位（荷姿グループマスタで単位を設定）","cat":"在庫"},{"term":"在庫区分","def":"同一の商品CDを在庫の状態ごとに管理する区分。導入時に任意で設定できる","cat":"在庫"},{"term":"最新出庫年月日","def":"在庫情報のひとつ。直近の出庫年月日。『在庫問合せ』画面に表示され、在庫の滞留期間を把握できる","cat":"在庫"},{"term":"最新入庫年月日","def":"在庫情報のひとつ。直近の入庫年月日。在庫の滞留期間を把握できる","cat":"在庫"},{"term":"最大格納数","def":"ピックロケーションの最大格納数（ロケーションマスタでセンタ単位に設定）。この値を超えて定期補充されることはない","cat":"補充"},{"term":"最大格納数商品荷姿","def":"ピックロケーションの最大格納数を決める荷姿","cat":"補充"},{"term":"再提案","def":"ピッキング提案により再度提案を促すこと","cat":"ピッキング"},{"term":"最適ピック提案APIキー","def":"ピッキング提案利用時に用いるAPIキーを設定する","cat":"設定"},{"term":"最適ピック提案フラグ","def":"ピッキング提案を使用するか否かを設定するフラグ","cat":"設定"},{"term":"最適ピック提案ブレイクキー","def":"ピッキング提案使用時のピッキング提案単位を設定する","cat":"設定"},{"term":"再引当","def":"欠品を確認後、出庫指示の解除を行い、出荷指示内容の修正または在庫状況が変わった後に再度引当を行うこと","cat":"出荷"},{"term":"作業指示数","def":"出荷指示単位で作業の対象となる指示数","cat":"出荷"},{"term":"作業中数","def":"在庫情報のひとつ。在庫移動、セット組等の際に入庫から出庫までの間で引当不可となる在庫数","cat":"在庫"},{"term":"作業中内訳","def":"作業中の在庫内訳","cat":"在庫"},{"term":"作業日","def":"出荷作業を行う日付","cat":"出荷"},{"term":"削除保持期間","def":"日次締処理で未作業のトランザクションデータを削除するまでの日数","cat":"設定"},{"term":"仕事量","def":"各ピッキングにかかる仕事量。大きい方が時間がかかる。『ピッキング提案』画面に表示される","cat":"ピッキング"},{"term":"実績入力後商品ラベル出力フラグ","def":"入荷実績入力後、商品ラベルを出力するか否かを設定するフラグ","cat":"設定"},{"term":"自動緊急フラグ判断時間(分)","def":"自動緊急フラグ設定の判断に用いる、逆算した判断時間（分）を設定する","cat":"設定"},{"term":"自動緊急フラグ設定フラグ","def":"自動緊急フラグ設定を行うかを設定する","cat":"設定"},{"term":"自動緊急フラグ判断対象","def":"自動緊急フラグ設定を行う対象を設定する","cat":"設定"},{"term":"自動出庫指示フラグ","def":"出荷指示に対し、自動で出庫指示を出すか否かを設定するフラグ","cat":"設定"},{"term":"社内入荷センタ","def":"社内のセンタ間移動を実施する入荷センタ（取引先マスタで荷主単位に設定）","cat":"入荷"},{"term":"出荷","def":"納品先へ商品を発送した時点のこと","cat":"出荷"},{"term":"出荷確定済","def":"作業進捗のひとつ。出荷確定が完了した状態（仕組上、出荷業務は行えない）","cat":"出荷"},{"term":"出荷期限日数","def":"期限日までの残り日数がこの値を切っている場合、出荷対象としない（商品マスタで荷主単位に設定）。在庫指定の出荷指示の場合は対象となる","cat":"出荷"},{"term":"出荷検品済","def":"作業進捗のひとつ。出荷検品が完了した状態","cat":"出荷"},{"term":"出荷梱包No.","def":"出荷検品時に梱包単位に採番される番号（システム単位に採番）","cat":"出荷"},{"term":"出荷時HT使用フラグ","def":"HTケースピッキング時、HTの使用可否を設定するフラグ","cat":"設定"},{"term":"出荷停止","def":"作業進捗のひとつ。商品マスタ・取引先マスタで出荷停止が設定されている出荷指示","cat":"出荷"},{"term":"出荷停止フラグ","def":"商品単位・納品先単位で出荷停止にする場合に使用するフラグ（商品マスタ・取引先マスタで荷主単位に設定）","cat":"設定"},{"term":"出荷日","def":"センタから出荷する日付","cat":"出荷"},{"term":"出庫","def":"所定の場所から出庫予定の商品をピッキングすること","cat":"出荷"},{"term":"出庫作業No.","def":"出庫指示時に採番（センタ単位）。1回の出庫指示の中で同一出荷日・納品先CD・配送コースを集約して設定する作業番号で、納品先単位に連番で採番する。同一納品先に複数伝票がある場合は名寄せされ1つの出庫作業No.になる（納品指定日・時間帯が異なると別扱い）。オーダーピッキング・出荷検品・梱包などの単位となり、荷札・送り状等とのアタッチが可能","cat":"出荷"},{"term":"出庫作業No.バーコード","def":"出荷検品やHT作業に使用できるバーコード","cat":"出荷"},{"term":"出庫作業メッセージ","def":"『出庫指示一覧』画面から出庫作業指示者への作業上の連絡事項として登録できるメッセージ","cat":"出荷"},{"term":"出庫指示","def":"在庫の引当、ピッキング指示を作成すること","cat":"出荷"},{"term":"出庫指示済","def":"作業進捗のひとつ。出庫指示済、ピッキング中の状態","cat":"出荷"},{"term":"出庫指示バッチNo.","def":"出庫指示をした1纏まりの番号（出庫指示時に採番）。ピッキングリストと伝票の照合に活用できる","cat":"出荷"},{"term":"指定棚卸","def":"棚卸範囲を絞りたい場合、棚卸データ作成で条件を指定し、その範囲の棚卸データを作成できる","cat":"棚卸"},{"term":"品目毎に0引当","def":"パラメータマスタの欠品時引当区分の選択肢のひとつ。商品単位で引当数を0にする","cat":"設定"},{"term":"商品毎別梱包","def":"商品毎に梱包が分かれて良いかを設定する区分","cat":"設定"},{"term":"商品ラベル","def":"バーコードがついていない商品に対して発行し、HTの操作を行えるようにするラベル","cat":"帳票・ラベル"},{"term":"商品ラベル出力単位","def":"入 のひとつ。当日の移動（＋）の数量","cat":"在庫"},{"term":"当日出庫数","def":"在庫情報のひとつ。当日の出庫数量","cat":"在庫"},{"term":"当日調整数－","def":"在庫情報のひとつ。当日の調整（－）の数量","cat":"在庫"},{"term":"当日調整数＋","def":"在庫情報のひとつ。当日の調整（＋）の数量","cat":"在庫"},{"term":"当日入庫数","def":"在庫情報のひとつ。当日の入庫数量","cat":"在庫"},{"term":"登録日時","def":"在庫情報のひとつ。初回に在庫を計上した時の日時","cat":"在庫"},{"term":"トータルピッキング","def":"複数オーダーや複数店舗の総数をピッキングすること。ピッキング後に種蒔きや摘み取りによる二次ピッキングが必要になる","cat":"ピッキング"},{"term":"トータルピッキング＋種蒔き","def":"トータルで商品をピッキングし（一次ピッキング）、その後、種蒔きリストで納品先別に仕分する（二次ピッキング）方式","cat":"ピッキング"},{"term":"トータルピッキング＋摘み取り","def":"トータルで商品をピッキングし（一次ピッキング）、その後、摘み取りリストで納品先（出庫作業No.）単位にピッキングする（二次ピッキング）方式","cat":"ピッキング"},{"term":"トータルピッキングリスト","def":"トータルピッキング用のピッキングリスト","cat":"帳票・ラベル"},{"term":"トータルピックフラグ","def":"トータルピッキングを行うか否かを設定するフラグ","cat":"設定"},{"term":"届先単位No.","def":"出庫指示時に採番（センタ単位）。複数の納品先で届け先が同一の場合に同じ番号で採番される。同一納品先でも取引先ごとに別の出庫作業No.が採番されるため、別々の梱包に荷合わせが必要な場合に使用できる","cat":"出荷"},{"term":"トランザクション保持期間","def":"日次締処理のトランザクションデータ洗替時のデータ保持期間（日数単位）","cat":"設定"},{"term":"資材選択スキップ","def":"出荷検品時、資材選択をスキップするか否かを設定する","cat":"設定"},{"term":"二次ピッキング","def":"仮置き場から商品を納品先別に仕分、またはピッキングすること","cat":"ピッキング"},{"term":"荷主","def":"荷物の所有者、または業務を委託した事業者のこと","cat":"基本"},{"term":"荷札","def":"WMSより荷札を出力し、他システムで行っていた作業の簡略化や梱包アタッチの容易さを改善する。専用荷札の同梱が可能で、日本郵政・佐川急便・ヤマト運輸を対象とする","cat":"帳票・ラベル"},{"term":"納品書在中出力フラグ","def":"汎用荷札の「納品書在中」の表記を出力するか否かを設定するフラグ","cat":"設定"},{"term":"入荷","def":"仕入先との荷受けが完了した時点のこと","cat":"入荷"},{"term":"入荷期限日数","def":"期限日までの残り日数がこの値を切っている場合、警告表示する（商品マスタで荷主単位に設定）","cat":"入荷"},{"term":"入荷削除","def":"作業進捗のひとつ。削除された入荷予定","cat":"入荷"},{"term":"入荷済","def":"作業進捗のひとつ。入荷予定に対して全て在庫計上が完了した状態","cat":"入荷"},{"term":"入荷中","def":"作業進捗のひとつ。入荷予定に対して一部を在庫計上した状態","cat":"入荷"},{"term":"入荷予定","def":"仕入先からあらかじめ通知される入荷数などに関する予定情報","cat":"入荷"},{"term":"入荷予定日","def":"入荷の予定日","cat":"入荷"},{"term":"入荷予定リスト","def":"仕入先からあらかじめ通知される入荷数などの予定情報のリスト","cat":"帳票・ラベル"},{"term":"入庫","def":"入荷した商品を所定の場所に格納すること","cat":"入荷"},{"term":"入庫No.","def":"入庫ラベルNo.の略称","cat":"在庫"},{"term":"入庫No.管理フラグ","def":"入庫No.で在庫をマージするか否かを設定するフラグ。入庫No.マージ区分との組み合わせで管理方法が変わる","cat":"設定"},{"term":"入庫No.管理","def":"在庫に付与された管理番号でロット・賞味期限別に在庫を管理すること。入庫No.の管理レベルは入庫No.管理フラグと入庫No.マージ区分で設定する","cat":"在庫"},{"term":"入庫No.分割","def":"処理区分のひとつ。入庫ラベルNo.で管理している在庫の一部を移動する時、新しい入庫ラベルNo.を採番して分割されること","cat":"在庫"},{"term":"入庫No.マージ区分","def":"入庫No.での在庫マージを行うレベルを設定する区分（パラメータマスタ・商品マスタで設定）","cat":"設定"},{"term":"入庫格納","def":"処理区分のひとつ。入荷した在庫を通常ロケへ格納する処理","cat":"入荷"},{"term":"入庫仮ロケ","def":"入荷検品後、正規ロケーションへ格納するまでの間、一時的に在庫を計上するためのロケーション","cat":"入荷"},{"term":"入庫日","def":"在庫情報のひとつ。在庫が入庫した日付","cat":"在庫"},{"term":"入庫日管理フラグ","def":"管理しない場合、入庫日を無視して在庫マージが実施されるフラグ","cat":"設定"},{"term":"入庫ラベル","def":"在庫作成時に取得した入庫No.を目で見て分かるようにラベルに印字したもの。通常、棚に貼り付けて使用する","cat":"帳票・ラベル"},{"term":"入庫ラベルNo.","def":"在庫計上時または汎用ラベル発行時に採番（システム単位）。入庫時に画面またはHTで表示する、在庫に付けられた管理番号。在庫が作成された単位で「入庫No.」を採番して在庫を管理し、入庫No.を指定するだけで商品コード・ロケーション・期限日・在庫区分等の在庫情報を取得できる","cat":"在庫"},{"term":"納品先毎に0引当","def":"パラメータマスタの欠品時引当区分の選択肢のひとつ。納品先単位で引当数を0にする","cat":"設定"},{"term":"納品指定日・納品時間帯","def":"『出荷指示入力』画面、『出荷実績入力（予定なし）』画面で納品先への納品日・時間指定ができる。同一納品先でも指定日ごとに別の出庫作業No.が採番されるため、別々の梱包で出荷できる","cat":"出荷"},{"term":"納品予定日","def":"納品先に到着予定の日付","cat":"出荷"},{"term":"バーコードスキャナ","def":"パソコンにバーコードスキャナ（USB／Bluetooth）を接続して出荷検品ができる","cat":"基本"},{"term":"配送コース","def":"出荷して納品先へ配送する際の運送業者・方面ごとに設定するグループ。同じ運送業者でも地域によって引取時間を分けた出庫作業や、方面／曜日毎に配車した車両の出発時間に合わせた出庫作業を行うために設定できる。取引先マスタ・配送コースマスタで設定し、出荷指示入力時にコースを指定する","cat":"出荷"},{"term":"パケット段数","def":"パケットの段数を整数で設定する。マルチピッキングリストの計算時に使用する","cat":"設定"},{"term":"パケット列数","def":"パケットの列数を整数で設定する。マルチピッキングリストの計算時に使用する","cat":"設定"},{"term":"バックヤード","def":"バックロケーションの集まったエリア","cat":"補充"},{"term":"バックロケ","def":"バックロケーションの略称","cat":"補充"},{"term":"バックロケーション","def":"補充用にケース単位などで在庫を保管するロケーション","cat":"補充"},{"term":"発行区分","def":"『ピッキングリスト発行』画面で一次ピッキング・二次ピッキングを指定する区分","cat":"帳票・ラベル"},{"term":"バラ引当","def":"単品単位での在庫引当","cat":"出荷"},{"term":"バラピッキング","def":"単品ごとにピッキングすること","cat":"ピッキング"},{"term":"搬送ラベル","def":"在庫移動指示後に発行し、在庫移動時に使用するラベル","cat":"帳票・ラベル"},{"term":"汎用ラベル","def":"在庫の変動に関連する作業の前に発行して使用するラベル。作成する在庫に貼り付け、印字されている入庫ラベルNo.を入荷実績入力時に登録することで、指定した入庫ラベルNo.で在庫が作成される","cat":"帳票・ラベル"},{"term":"ピース荷姿","def":"各商品に共通して使用するピース荷姿を設定する区分","cat":"基本"},{"term":"引当可能数","def":"在庫情報のひとつ。在庫引当が可能な在庫数","cat":"在庫"},{"term":"引当可能数を引当","def":"パラメータマスタの欠品時引当区分の選択肢のひとつ。引当可能数を在庫から引き当てる","cat":"設定"},{"term":"引当禁止フラグ","def":"ロケーション単位で引当禁止に設定するフラグ（ロケーションマスタでセンタ単位に設定）","cat":"設定"},{"term":"引当順序","def":"引当の順序（ロケーションマスタでセンタ単位、取引先マスタで荷主単位に設定）。デフォルトの引当順序（引当ソートキー未設定時）は、取引先マスタの引当順序>ロット>期限日>ロケーションマスタの引当順序>ロケーションCD>入庫ラベルNo.。パラメータマスタで引当ソートキーの設定がある場合は、取引先マスタの引当順序>引当ソートキーの設定順","cat":"出荷"},{"term":"引当済数","def":"在庫情報のひとつ。在庫引当済で出荷確定していない在庫数（未出荷数）","cat":"在庫"},{"term":"引当ソートキー1〜8","def":"引当の順番（パラメータマスタでセンタ・荷主単位に設定）。設定可能項目はlot（ロット）、lotOrder（ロットソート順）、limitDt（期限日）、zoneCd（ゾーンCD）、locationCd（ロケーションCD）、locationOrder（ロケーション引当順序）、storeLabelNo（入庫ラベルNo）、storeDt（入庫日）。ロットソート順は現状システムで使用不可","cat":"設定"},{"term":"ピッキング","def":"出荷指示に対して品物を在庫から選び出す作業","cat":"ピッキング"},{"term":"ピッキンググループNo.","def":"一次ピッキングリスト発行時に採番される番号（作業日単位で採番）。ピッキンググループNo.ごとにピッキングが行われる","cat":"ピッキング"},{"term":"ピッキング順序","def":"ピッキングルートに合わせたピッキング順序（ゾーンマスタ・ロケーションマスタでセンタ単位に設定）","cat":"ピッキング"},{"term":"ピッキング提案","def":"効率の良い最適なピッキング方法を提案するサービス","cat":"ピッキング"},{"term":"ピッキングロケーション","def":"バラピッキング対象の在庫を保管するロケーション","cat":"ピッキング"},{"term":"ピックロケ","def":"ピッキングロケーションの略称","cat":"ピッキング"},{"term":"ピックロケーション以外","def":"補充用にケース単位などで在庫を保管するロケーション。ロケーションマスタのピックロケフラグの設定で使用する","cat":"補充"},{"term":"ピックロケフラグ","def":"ピックロケ・バックロケを設定するフラグ（ロケーションマスタでセンタ単位に設定）","cat":"設定"},{"term":"返品出荷","def":"処理区分のひとつ。仕入先への返品","cat":"出荷"},{"term":"返品入荷","def":"処理区分のひとつ。納品先からの返品","cat":"入荷"},{"term":"ボール","def":"いくつかのバラ商品を梱包した荷姿（中箱）","cat":"基本"},{"term":"ボール荷姿","def":"各商品に共通して使用するボール荷姿を設定する区分","cat":"基本"},{"term":"補充在庫区分","def":"補充対象となる商品の在庫区分を設定する区分（ロケーションマスタでセンタ単位に設定）","cat":"設定"},{"term":"補充商品","def":"補充対象とする商品（ロケーションマスタでセンタ単位に設定）。複数ロケーションに同一商品を指定した場合、交互に緊急補充される","cat":"補充"},{"term":"補充点","def":"該当ロケーションで指定された補充商品を定期補充すべき基準在庫量。補充点荷姿の単位で整数で設定し、補充点を切った商品が定期補充の対象となる","cat":"補充"},{"term":"補充点荷姿","def":"定期補充の補充点に設定する数量をどの荷姿で指定するかを設定する","cat":"補充"},{"term":"補充預託","def":"補充対象となる商品の預託先を設定する（ロケーションマスタでセンタ単位に設定）","cat":"補充"},{"term":"末日残数","def":"在庫情報のひとつ。前月末時点での在庫数。『在庫問合せ』画面に表示される","cat":"在庫"},{"term":"マルチピッキング","def":"複数オーダーや複数店舗の同時ピッキング","cat":"ピッキング"},{"term":"マルチピッキング＋摘み取り","def":"マルチで商品をピッキングし（一次ピッキング）、その後、摘み取りリストで納品先（出庫作業No.）単位にピッキングする（二次ピッキング）方式","cat":"ピッキング"},{"term":"マルチピック計算区分","def":"マルチピックの計算の有無を設定する区分","cat":"設定"},{"term":"マルチピック摘み取りリスト出力フラグ","def":"マルチピッキングリスト発行後、続けて摘み取りリストを発行するか否かを設定するフラグ","cat":"設定"},{"term":"未出荷","def":"作業進捗のひとつ。出荷指示を入力しただけの状態","cat":"出荷"},{"term":"未入荷","def":"作業進捗のひとつ。入荷予定を入力しただけの状態","cat":"入荷"},{"term":"元入庫ラベルNo.","def":"在庫情報のひとつ。入庫ラベルNo.を分割した時の分割元の入庫ラベルNo.","cat":"在庫"},{"term":"預託","def":"在庫自体は物流センタで保管しているが、所有権は荷主先にある状態。通販等で同一センタ内に複数荷主の在庫を管理する場合など","cat":"在庫"},{"term":"リスト発行区分","def":"『ピッキングリスト発行』画面で一次ピッキング・二次ピッキングそれぞれのピッキング方式を選択する区分","cat":"帳票・ラベル"},{"term":"履歴保持期間","def":"日次締処理のデータ洗替時の履歴保持期間（日数）","cat":"設定"},{"term":"ロケーション","def":"倉庫の棚の場所が分かるように、棚1つ1つに割り当てた番号","cat":"基本"},{"term":"ロット管理品","def":"ロット管理の対象となる商品","cat":"在庫"},{"term":"ロット管理フラグ","def":"ロット管理を実施するか否かを設定するフラグ（商品マスタで荷主単位に設定）。登録した商品はロット管理品となり、『入荷実績入力』画面や『在庫調整』画面で在庫が発生する際にロットが必須入力となる","cat":"設定"},{"term":"ワンタイムフラグ","def":"ワンタイム扱いの納品先に設定するフラグ。ワンタイムに指定された納品先は各出荷指示No.毎に納品先名や住所等の設定が可能（取引先マスタで荷主単位に設定）","cat":"設定"}],"params":[{"name":"欠品時出庫指示取消フラグ","where":"パラメータマスタ（センタ・荷主単位）","symptom":"欠品が1商品でもあると伝票ごと出庫指示が取消され未出荷に戻る倉庫と、在庫があるだけ引当される倉庫がある","effect":"1なら伝票内に1商品でも欠品があると出庫指示を取消し「未出荷」に戻す。0なら欠品時引当区分の設定に従って引当する","kw":["欠品","未出荷","出庫指示取消","引当","伝票"]},{"name":"欠品時引当区分","where":"パラメータマスタ（センタ・荷主単位）。処理区分別パラメータマスタ（v4.2追加）にも設定項目あり","symptom":"同じ欠品でも「あるだけ出荷」「その商品だけ引当ゼロ」「納品先の伝票ごと引当ゼロ」と倉庫で挙動が違う","effect":"欠品時出庫指示取消フラグ=0のときに有効。0:引当可能数を引当／1:商品毎に0引当／2:納品先毎に0引当（伝票単位取消）","kw":["欠品","引当区分","0引当","納品先","伝票単位"]},{"name":"入庫No.管理フラグ","where":"パラメータマスタ（センタ・荷主単位）","symptom":"HTの画面フローが倉庫で違う（入荷検品でラベル選択画面が出る/出ない、ピッキングで商品ではなく入庫ラベルNo.をスキャンする等）。棚卸作業リストに入庫ラベルNo.が載る倉庫と入庫日が載る倉庫がある","effect":"管理対象だとHT入荷検品等 /* ============ ユーティリティ ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){
  s = String(s||'').normalize('NFKC').toLowerCase();
  return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60));
}
function expandQuery(q){
  const words = norm(q).split(/[\s、。,]+/).filter(Boolean);
  return words.map(w => {
    const set = new Set([w]);
    SYN.forEach(g => { if(g.some(t => norm(t).includes(w) || w.includes(norm(t)))) g.forEach(t => set.add(norm(t))); });
    return [...set];
  });
}
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }

/* ============ 検索インデックス ============ */
const INDEX = [];
function buildIndex(){
  (DB.tasks||[]).forEach(t => INDEX.push({type:'task', ref:t,
    f:[[t.title,3],[ (t.kw||[]).join(' '),2.5],[t.cat,1.5],[t.where,1],[(t.steps||[]).join(' '),1],[(t.notes||[]).map(n=>n.text).join(' '),1]]}));
  (DB.trouble||[]).forEach(t => {
    let body = '';
    if(t.result) body = t.result.cause+' '+(t.result.steps||[]).join(' ');
    if(t.nodes) Object.values(t.nodes).forEach(n=>{ body += ' '+n.q+' '+(n.opts||[]).map(o=>o.label+' '+(o.result?o.result.cause+' '+(o.result.steps||[]).join(' '):'')).join(' '); });
    INDEX.push({type:'sos', ref:t, f:[[t.title,3.5],[(t.kw||[]).join(' '),2.5],[body,1]]});
  });
  (DB.params||[]).forEach(p => INDEX.push({type:'param', ref:p,
    f:[[p.symptom,3],[p.name,2.5],[(p.kw||[]).join(' '),2],[p.effect,1]]}));
  (DB.glossary||[]).forEach((g,i) => INDEX.push({type:'term', ref:g, idx:i,
    f:[[g.term,3],[g.def,1]]}));
  Object.entries(STATUS).forEach(([k,s]) => s.ops.forEach((o,i)=>INDEX.push({type:'status', ref:{k,i,o,label:s.label},
    f:[[o.op,3],[o.cond.replace(/<[^>]+>/g,''),1.2]]})));
  INDEX.forEach(it => { it.nf = it.f.map(([txt,w]) => [norm(txt), w]); });
}
function search(q){
  const groups = expandQuery(q);
  if(!groups.length) return [];
  const out = [];
  INDEX.forEach(it => {
    let score = 0;
    const okAll = groups.every(alts => {
      let best = 0;
      it.nf.forEach(([txt,w]) => { alts.forEach(a => { if(a && txt.includes(a)) best = Math.max(best, w * (a.length>=2?1:.5)); }); });
      score += best;
      return best > 0;
    });
    if(okAll) out.push({it, score});
  });
  out.sort((a,b)=>b.score-a.score);
  return out;
}

let suppressHash = false;
function go(hash){
  if(location.hash !== '#'+hash){ suppressHash = true; location.hash = hash; }
  route();
}
function route(){
  const h = decodeURIComponent(location.hash.slice(1)) || 'home';
  const [view, arg] = h.split('/', 2).length ? [h.split('/')[0], h.split('/').slice(1).join('/')] : ['home',''];
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v===view || (view==='search'&&b.dataset.v==='home')));
  if(view!=='sos') wizardState = null;
  if(view==='home') renderHome();
  else if(view==='tasks'){ openTask = arg||openTask; renderTasks(); }
  else if(view==='sos') renderSos(arg);
  else if(view==='status') renderStatus(arg||'shukka');
  else if(view==='check'){ if(arg) curCheck = arg; renderCheck(); }
  else if(view==='params') renderParams();
  else if(view==='terms') renderTerms(arg);
  else if(view==='search') renderSearch(arg);
  else renderHome();
  if(!(view==='tasks'&&arg)) window.scrollTo(0,0);
}

  const total = tasks.length+sos.length+params.length+terms.length+stat.length;
  const hl = txt => { let h = esc(txt); expandQuery(q).flat().filter(w=>w.length>=2).slice(0,12).forEach(w=>{
    try{ h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`);}catch(e){} }); return h; };

  <div class="sr">
  ${sos.length?`<h3>🚨 困った・診断 <small>${sos.length}</small></h3>`+sos.map(r=>`<button class="srow" data-nav="sos/${esc(r.it.ref.id)}"><b>${hl(r.it.ref.title)}</b></button>`).join(''):''}
  ${tasks.length?`<h3>📋 手順 <small>${tasks.length}</small></h3>`+tasks.map(r=>`<button class="srow" data-nav="tasks/${esc(r.it.ref.id)}" data-cat="${esc(r.it.ref.cat)}"><b>${hl(r.it.ref.title)}</b><small>${esc(r.it.ref.cat)}｜${esc(r.it.ref.where||'')}</small></button>`).join(''):''}
  ${stat.length?`<h3>🚦 できる？できない？ <small>${stat.length}</small></h3>`+stat.map(r=>`<button class="srow" data-nav="status/${esc(r.it.ref.k)}"><b>${hl(r.it.ref.o.op)}</b><small>${esc(r.it.ref.label)}のステータス条件</small></button>`).join(''):''}
  ${params.length?`<h3>⚙️ 設定辞典 <small>${params.length}</small></h3>`+params.map(r=>`<button class="srow" data-nav="params"><b>${hl(r.it.ref.name)}</b><small>${esc(r.it.ref.symptom)}</small></button>`).join(''):''}
  ${terms.length?`<h3>📖 用語 <small>${terms.length}</small></h3>`+terms.map(r=>`<button class="srow" data-nav="terms/${(DB.glossary||[]).indexOf(r.it.ref)}"><b>${hl(r.it.ref.term)}</b><small>${esc(r.it.ref.def.slice(0,60))}…</small></button>`).join(''):''}
  </div>`;
  app.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', ()=>{
    if(b.dataset.cat) curCat = 'すべて';
    if(b.dataset.nav==='params') paramQ = q;
    go(b.dataset.nav);
  }));
}

/* ============ 初期化 ============ */
$('#nav').innerHTML = VIEWS.map(v=>`<button data-v="${v.id}">${v.label}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', ()=>{ paramQ=''; $('#q').value=''; go(b.dataset.v); }));
$('#logo').addEventListener('click', ()=>go('home'));
let debounce = null;
$('#q').addEventListener('input', ()=>{
  clearTimeout(debounce);
  const v = $('#q').value.trim();
  debounce = setTimeout(()=>{
    if(v.length>=1){ paramQ=''; history.replaceState(null,'','#search/'+encodeURIComponent(v)); renderSearch(v); }
    else if(location.hash.startsWith('#search')) go('home');
  }, 180);
});
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#q').blur(); } });
$('#topbtn').addEventListener('click', ()=>window.scrollTo({top:0}));
window.addEventListener('hashchange', ()=>{ if(suppressHash){ suppressHash = false; return; } route(); });
buildIndex();
route();
</script>
