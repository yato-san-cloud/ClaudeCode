<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>whsim — 倉庫シミュレータ</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./js/cody.css" />
</head>
<body>
  <header>
    <div class="brand-group">
      <button id="sidebarToggle" type="button" class="icon-btn" title="メニューの開閉" aria-label="メニューの開閉">☰</button>
      <div class="brand">
        <svg class="brand-mark" width="22" height="22" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect width="32" height="32" rx="7" fill="var(--accent)"/>
          <g fill="#fff">
            <rect x="7" y="15" width="7" height="10" rx="1"/>
            <rect x="18" y="11" width="7" height="14" rx="1"/>
            <path d="M5 12 16 6l11 6v1.6L16 7.8 5 13.6z"/>
          </g>
        </svg>whsim<span>倉庫シミュレータ</span></div>
    </div>
    <div class="header-tools">
      <div class="provenance" id="provenance">— your data</div>
      <button id="themeToggle" type="button" title="表示テーマを切り替え" aria-label="ダークモード切替">🌙 ダーク</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="card">
        <h2>1. プロジェクト</h2>
        <div class="row proj-row">
          <select id="projectSelect" aria-label="プロジェクトを選択"><option value="">（新規作成）</option></select>
          <div class="proj-menu-wrap">
            <button id="projMenuBtn" type="button" class="icon-btn" title="プロジェクト操作"
                    aria-label="プロジェクト操作メニュー" aria-haspopup="menu" aria-expanded="false"
                    aria-controls="projMenu" disabled>⋯</button>
            <div id="projMenu" class="proj-menu" role="menu" aria-label="プロジェクト操作" hidden>
              <button type="button" role="menuitem" data-act="duplicate">複製</button>
              <button type="button" role="menuitem" data-act="rename">名前変更</button>
              <button type="button" role="menuitem" data-act="delete" class="danger-item">削除</button>
            </div>
          </div>
        </div>
        <div class="row new-proj">
          <input id="newName" placeholder="プロジェクト名 例: acme" />
          <select id="templateSelect"></select>
          <button id="createBtn" class="primary">作成</button>
        </div>
      </section>

      <section class="card">
        <h2>2. 顧客データ取り込み <small>任意</small></h2>
        <div id="dropzone" class="dropzone">
          <strong>ZIP をドラッグ&ドロップ</strong>
          <span>商品マスタ / 出荷 / 入荷 …（足りない分は仮値で補完）</span>
          <input type="file" id="fileInput" accept=".zip" hidden />
        </div>
        <div class="row" style="margin-top:8px">
          <button id="cadBtn" style="flex:1">CAD図面(DXF)を取込</button>
          <input type="file" id="cadInput" accept=".dxf" hidden />
        </div>
        <div class="row" style="margin-top:8px">
          <button id="distBtn" style="flex:1">棚間距離(CSV/JSON)を取込</button>
          <input type="file" id="distInput" accept=".csv,.json" hidden />
        </div>
        <div id="importLog" class="log"></div>
      </section>

      <section class="card">
        <h2>3. キー項目</h2>
        <div id="headline" class="headline"></div>
        <button id="applyBtn">反映</button>
      </section>

      <section class="card">
        <button id="runBtn" class="primary big" disabled>▶ シミュレーション実行</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>

      <section class="card settings-card">
        <h2>
          <button id="settingsToggle" type="button" class="settings-summary"
                  aria-expanded="false" aria-controls="settingsBody" disabled>
            <span class="settings-gear" aria-hidden="true">⚙</span>コスト・稼働条件
            <span class="settings-chevron" aria-hidden="true">▾</span>
          </button>
        </h2>
        <div id="settingsBody" class="settings-body" hidden>
          <form id="settingsForm" class="settings-form">
            <div class="settings-field">
              <label for="set_currency">通貨</label>
              <select id="set_currency" name="currency">
                <option value="¥">¥ (円)</option>
                <option value="$">$ (ドル)</option>
                <option value="€">€ (ユーロ)</option>
              </select>
            </div>
            <div class="settings-field">
              <label for="set_labor">人件費</label>
              <input id="set_labor" name="labor_cost_per_hour" type="number"
                     min="0" step="50" inputmode="numeric" />
              <span class="unit">¥/時</span>
            </div>
            <div class="settings-field">
              <label for="set_hours">1日の稼働時間</label>
              <input id="set_hours" name="working_hours_per_day" type="number"
                     min="0" max="24" step="0.5" inputmode="decimal" />
              <span class="unit">時間</span>
            </div>
            <div class="settings-field">
              <label for="set_days">月の稼働日数</label>
              <input id="set_days" name="working_days_per_month" type="number"
                     min="0" max="31" step="1" inputmode="numeric" />
              <span class="unit">日</span>
            </div>
            <div class="settings-field">
              <label for="set_agv">AGV費用</label>
              <input id="set_agv" name="agv_cost_per_month" type="number"
                     min="0" step="1000" inputmode="numeric" />
              <span class="unit">¥/月</span>
            </div>
            <button id="settingsSave" type="submit" class="primary" style="width:100%;margin-top:6px">保存</button>
            <div id="settingsStatus" class="status" role="status" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </aside>

    <main class="main">
      <div class="tabs" role="tablist" aria-label="ビュー切り替え">
        <button data-tab="chat" class="tab active" role="tab" id="tab-chat" aria-selected="true" aria-controls="chat" tabindex="0">💬 Cody</button>
        <button data-tab="design" class="tab" role="tab" id="tab-design" aria-selected="false" aria-controls="design" tabindex="-1">設計</button>
        <button data-tab="analysis" class="tab" role="tab" id="tab-analysis" aria-selected="false" aria-controls="analysis" tabindex="-1">分析</button>
        <button data-tab="view2d" class="tab" role="tab" id="tab-view2d" aria-selected="false" aria-controls="view2d" tabindex="-1">2D アニメーション</button>
        <button data-tab="view3d" class="tab" role="tab" id="tab-view3d" aria-selected="false" aria-controls="view3d" tabindex="-1">3D</button>
        <button data-tab="viewpng" class="tab" role="tab" id="tab-viewpng" aria-selected="false" aria-controls="viewpng" tabindex="-1">提案PNG</button>
        <button data-tab="compare" class="tab" role="tab" id="tab-compare" aria-selected="false" aria-controls="compare" tabindex="-1">比較</button>
        <button data-tab="export" class="tab" role="tab" id="tab-export" aria-selected="false" aria-controls="export" tabindex="-1">エクスポート</button>
        <label class="preset-ctl" title="3D表現">3D表現
          <select id="presetSelect">
            <option value="natural">ナチュラル</option>
            <option value="evening">夕</option>
            <option value="night">夜</option>
            <option value="mono">モノ</option>
          </select>
        </label>
      </div>

      <div class="stage">
        <div id="chat" class="panel active" role="tabpanel" aria-labelledby="tab-chat" tabindex="0"></div>
        <div id="design" class="panel" role="tabpanel" aria-labelledby="tab-design" tabindex="0" hidden></div>
        <div id="analysis" class="panel" role="tabpanel" aria-labelledby="tab-analysis" tabindex="0" hidden></div>
        <div id="view2d" class="panel" role="tabpanel" aria-labelledby="tab-view2d" tabindex="0" hidden>
          <canvas id="canvas2d" aria-label="2Dシミュレーション再生"></canvas>
        </div>
        <div id="view3d" class="panel" role="tabpanel" aria-labelledby="tab-view3d" tabindex="0" hidden></div>
        <div id="viewpng" class="panel" role="tabpanel" aria-labelledby="tab-viewpng" tabindex="0" hidden>
          <img id="pngImg" alt="提案PNG（実行後に表示）" />
        </div>
        <div id="compare" class="panel" role="tabpanel" aria-labelledby="tab-compare" tabindex="0" hidden>
          <div class="compare-bar">
            <button id="runScenariosBtn" class="primary">シナリオを比較（現行 / ピーク日 / AGV導入）</button>
            <span id="compareStatus" class="status" role="status" aria-live="polite"></span>
          </div>
          <div id="compareView"></div>
        </div>
        <div id="export" class="panel" role="tabpanel" aria-labelledby="tab-export" tabindex="0" hidden></div>

        <div class="transport">
          <button id="playBtn">⏸</button>
          <input type="range" id="scrub" min="0" max="1000" value="0" />
          <span id="clock" class="clock">0.0 min</span>
          <label class="speed">速度
            <select id="speed">
              <option value="30">30×</option>
              <option value="60" selected>60×</option>
              <option value="120">120×</option>
            </select>
          </label>
          <span class="legend">
            <i style="background:#9e9e9e"></i>待機
            <i style="background:#1f78b4"></i>移動
            <i style="background:#33a02c"></i>ピック
            <i style="background:#6a3d9a"></i>運搬
            <i style="background:#e31a1c"></i>梱包
          </span>
        </div>
      </div>

      <div id="kpiBar" class="kpibar"></div>
    </main>
  </div>

  <div id="toastHost" class="toast-host" role="region" aria-label="通知" aria-live="polite" aria-atomic="false"></div>

  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
