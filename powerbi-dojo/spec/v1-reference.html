<div id="app"></div>

<script>
"use strict";

/* ============================================================
   コースデータ
   ============================================================ */
const COURSES = [];

COURSES.push({
  id: "m-basic", icon: "🔰", name: "M言語 基礎",
  desc: "Power Queryの裏側で動く言語のキホン",
  lessons: [
    {
      title: "Power QueryとM言語の世界",
      doc: `
<p>Power Queryエディターで行う操作(列の削除、フィルター、型変更…)は、すべて裏側で <b>M言語</b> のコードとして記録されています。「適用したステップ」の1つ1つがM式です。</p>
<p>Mクエリの基本構造は <code>let ... in</code>。<code>let</code> にステップを並べ、<code>in</code> で最終結果を返します。</p>
<pre>let
    ソース = Excel.Workbook(File.Contents("C:\\売上.xlsx")),
    絞り込み = Table.SelectRows(ソース, each [売上] > 0)
in
    絞り込み</pre>
<p>M言語は<b>大文字と小文字を区別</b>します。<code>Text.Upper</code> は動きますが <code>text.upper</code> はエラーです。</p>
<p class="tip">💡 実務メモ: リボンの「表示」→「詳細エディター」で、クエリ全体のMコードをいつでも確認・編集できます。まずは自動生成されたコードを読むことから始めましょう。</p>`,
      quiz: [
        { q: "Power Queryの各ステップの裏側で自動生成されている言語は?",
          c: ["DAX", "M言語", "VBA", "SQL"], a: 1,
          e: "「適用したステップ」はすべてM式です。DAXはモデル側(メジャー・計算列)の言語で、まったく別物です。" },
        { q: "Mクエリの基本構造として正しいのは?",
          c: ["let ~ in", "SELECT ~ FROM", "BEGIN ~ END", "function ~ return"], a: 0,
          e: "letブロックにステップ(変数)を定義し、inで最終的に返す値を指定します。" },
        { q: "M言語の仕様として正しいのは?",
          c: ["大文字小文字を区別しない", "大文字小文字を区別する", "DAXと同じ言語である", "Excelでは使えない"], a: 1,
          e: "Mは大文字小文字を区別します。<code>text.upper</code> と書くと「認識されませんでした」エラーになります。" },
        { q: "クエリ全体のMコードを確認・編集できる場所は?",
          c: ["数式バーのみ", "詳細エディター", "DAXエディター", "モデルビュー"], a: 1,
          e: "詳細エディターでlet~in全体を編集できます。数式バーは選択中の1ステップだけを表示します。" },
      ]
    },
    {
      title: "データ型とリテラル",
      doc: `
<p>Mには豊富なデータ型があります。特に重要なのが3つの「構造型」です。</p>
<pre>{1, 2, 3}                  // リスト(list)  ← 波かっこ!
[名前 = "佐藤", 年齢 = 30]   // レコード(record) ← 角かっこ!
#table(...)                // テーブル(table)</pre>
<p><b>Excelや他言語と逆</b>なので要注意: Mでは <code>{ }</code> がリスト、<code>[ ]</code> がレコードです。</p>
<p>日付などは <code>#date(2026, 7, 16)</code>、<code>#datetime(...)</code> のように「#」付きで書きます。レコードのフィールドは <code>rec[名前]</code> でアクセスします。</p>
<p class="tip">💡 実務メモ: <code>null</code> は「値が存在しない」、<code>""</code> は「空のテキスト」。フィルターや結合で挙動が変わるので、区別を常に意識しましょう。</p>`,
      quiz: [
        { q: "Mでリスト(list)を作るリテラルは?",
          c: ["{1, 2, 3}", "[1, 2, 3]", "(1, 2, 3)", "LIST(1, 2, 3)"], a: 0,
          e: "Mでは波かっこ { } がリスト。[ ] はレコードです。多くの言語と逆なので最初に体で覚えましょう。" },
        { q: "#date(2026, 7, 16) が作るものは?",
          c: ["テキスト \"2026/7/16\"", "date型の値", "datetime型の値", "数値 20260716"], a: 1,
          e: "#date(年, 月, 日) はdate型の値を作ります。時刻も含むなら #datetime(y,m,d,h,m,s) を使います。" },
        { q: "レコード rec = [名前=\"佐藤\", 年齢=30] の「名前」を取り出す書き方は?",
          code: "rec = [名前 = \"佐藤\", 年齢 = 30]",
          c: ["rec[名前]", "rec.名前", "rec->名前", "rec(\"名前\")"], a: 0,
          e: "レコードのフィールドアクセスは 角かっこ rec[名前]。テーブルの行内で [列名] と書くのも同じ仕組みです。" },
        { q: "null と \"\"(空文字)の違いとして正しいのは?",
          c: ["完全に同じ意味", "nullは「値が無い」、\"\"は「空のテキスト」", "nullはエラーを表す", "\"\"は使えない"], a: 1,
          e: "nullは値の不在。null > 1 のような比較はnullを返し、フィルターの挙動にも影響します。" },
      ]
    },
    {
      title: "よく使うテキスト関数",
      doc: `
<p>データクレンジングの主役、テキスト関数。まずはこのあたりから。</p>
<pre>Text.Trim("  abc  ")          // "abc"(前後の空白除去)
Text.Upper("power bi")        // "POWER BI"
Text.Start("PowerBI", 5)      // "Power"(先頭5文字)
Text.Combine({"A","B","C"}, "-")  // "A-B-C"
"売上: " & Text.From(123)     // 連結は & 演算子</pre>
<p>Mは型に厳格です。数値とテキストをそのまま <code>&</code> で連結するとエラーになるため、<code>Text.From(123)</code> のように変換が必要です。</p>
<p class="tip">💡 実務メモ: 全角/半角スペース混在のデータには <code>Text.Trim</code> + <code>Text.Clean</code>(印刷不能文字除去)のコンボが効きます。Excel出身データの定番クレンジングです。</p>`,
      quiz: [
        { q: "\"  abc  \" の前後の空白を取り除く関数は?",
          c: ["Text.Clean", "Text.Trim", "Text.Remove", "Text.Strip"], a: 1,
          e: "Text.Trimが前後の空白除去。Text.Cleanは改行などの印刷不能文字を除去します。両方使うことも多いです。" },
        { q: "Mでテキストを連結する演算子は?",
          c: ["+", "&", "||", "CONCAT"], a: 1,
          e: "\"A\" & \"B\" → \"AB\"。+ は数値専用なのでテキストに使うとエラーです。" },
        { q: "Text.Start(\"PowerBI\", 5) の結果は?",
          c: ["\"Power\"", "\"werBI\"", "\"P\"", "エラー"], a: 0,
          e: "Text.Startは先頭からn文字。末尾はText.End、途中はText.Middleです。" },
        { q: "数値 123 を \"売上: \" と連結するには?",
          c: ["\"売上: \" & 123", "\"売上: \" & Text.From(123)", "\"売上: \" + 123", "CONCATENATE(\"売上: \", 123)"], a: 1,
          e: "Mは暗黙の型変換をしないため、Text.From(またはNumber.ToText)で明示的にテキスト化が必要です。" },
      ]
    },
    {
      title: "数値・日付の関数",
      doc: `
<p>日付操作はレポートの土台。よく使う関数を押さえましょう。</p>
<pre>Date.Year(#date(2026,7,16))       // 2026
Date.AddMonths(#date(2026,1,31), 1) // #date(2026,2,28) ← 自動調整!
DateTime.LocalNow()                // 現在日時
Date.From(DateTime.LocalNow())     // 今日の日付</pre>
<p>意外な落とし穴が丸め処理。<code>Number.Round(2.5)</code> は <b>2</b> になります。Mの既定は「銀行家の丸め(偶数丸め)」だからです。</p>
<pre>Number.Round(2.5)                              // 2
Number.Round(2.5, 0, RoundingMode.AwayFromZero) // 3(四捨五入)</pre>
<p class="tip">💡 実務メモ: Excelの ROUND と合わせたいときは必ず <code>RoundingMode.AwayFromZero</code> を指定。金額集計の「1円ズレ」の定番原因です。</p>`,
      quiz: [
        { q: "Number.Round(2.5) の結果は?",
          c: ["2", "3", "2.5", "エラー"], a: 0,
          e: "Mの既定は銀行家の丸め(最近接偶数へ)。四捨五入にしたいなら RoundingMode.AwayFromZero を指定します。Excelとズレる定番ポイント!" },
        { q: "現在の日時を取得する関数は?",
          c: ["Now()", "DateTime.LocalNow()", "Date.Today()", "GetDate()"], a: 1,
          e: "DateTime.LocalNow()が現在日時。日付だけ欲しければ Date.From(DateTime.LocalNow()) とします。" },
        { q: "Date.AddMonths(#date(2026,1,31), 1) の結果は?",
          c: ["#date(2026, 2, 28)", "#date(2026, 3, 3)", "エラー", "#date(2026, 2, 31)"], a: 0,
          e: "存在しない日付にならないよう月末に自動調整されます(2026年2月は28日まで)。" },
        { q: "#date(2026,7,16) から「2026」を取り出す関数は?",
          c: ["Date.Year", "Year.From", "Date.GetYear", "Text.Year"], a: 0,
          e: "Date.Year / Date.Month / Date.Day のシリーズで各部分を取り出せます。" },
      ]
    },
    {
      title: "each と _ の正体",
      doc: `
<p>Mコードに頻出する <code>each</code>。実はこれ、<b>関数を短く書くための糖衣構文</b>です。</p>
<pre>each [売上] > 100
// ↑は↓とまったく同じ意味
(_) => _[売上] > 100</pre>
<p><code>each</code> は「引数を1つ(名前は <code>_</code>)受け取る関数」を作ります。<code>[売上]</code> は <code>_[売上]</code> の省略形。つまり <code>Table.SelectRows(t, each [売上] > 100)</code> は「各行 <code>_</code> を受け取り、その行の売上が100超なら true を返す関数」を渡しているのです。</p>
<pre>List.Transform({1, 2, 3}, each _ * 2)   // {2, 4, 6}</pre>
<p class="tip">💡 実務メモ: この仕組みが分かると、自動生成コードの改造が一気に怖くなくなります。「eachの中は1行(1要素)ずつ処理される関数」と覚えましょう。</p>`,
      quiz: [
        { q: "each [売上] > 100 と完全に等価な書き方は?",
          c: ["(_) => _[売上] > 100", "(x, y) => x > y", "function([売上] > 100)", "lambda 売上 > 100"], a: 0,
          e: "eachは「_という名前の引数を1つ取る関数」の糖衣構文。[売上]は _[売上] の省略形です。" },
        { q: "Table.SelectRows(t, each ...) の第2引数の役割は?",
          c: ["列名のリスト", "各行を受け取ってtrue/falseを返す関数", "抽出する行番号", "SQLのWHERE句文字列"], a: 1,
          e: "各行(レコード)が順に渡され、trueを返した行だけが残ります。フィルターの正体は関数なのです。" },
        { q: "List.Transform({1,2,3}, each _ * 2) の結果は?",
          c: ["{2, 4, 6}", "{1, 2, 3, 1, 2, 3}", "6", "{3, 6}"], a: 0,
          e: "List.Transformは各要素に関数を適用します。_ に 1, 2, 3 が順に入り、2倍されます。" },
        { q: "each が存在する理由として正しいのは?",
          c: ["高速化のため", "単なる糖衣構文(短く書くため)", "DAXとの互換のため", "エラー処理のため"], a: 1,
          e: "機能は増えません。(_) => ... を短く書けるようにするだけの構文です。でも読みやすさは段違い。" },
      ]
    },
    {
      title: "リスト操作の基本",
      doc: `
<p>リスト関数はM上級への登竜門。連番・集計・重複除去が自在になります。</p>
<pre>{1..5}                       // {1,2,3,4,5}(連番!)
List.Sum({1, 2, 3})          // 6
List.Distinct({1,1,2,3,3})   // {1,2,3}
List.Max({10, 5, 8})         // 10
List.Dates(#date(2026,1,1), 365, #duration(1,0,0,0))
                             // 365日分の日付リスト</pre>
<p><code>{1..5}</code> の範囲記法は超便利。<code>{"A".."Z"}</code> で文字の連続も作れます。</p>
<p class="tip">💡 実務メモ: <code>List.Dates</code> はM言語製の日付テーブル作成の心臓部。連番リスト→テーブル変換→列追加、という流れは応用範囲が広いです。</p>`,
      quiz: [
        { q: "{1..5} の結果は?",
          c: ["{1, 5}", "{1, 2, 3, 4, 5}", "エラー", "{15}"], a: 1,
          e: "「..」は範囲記法。{1..5}で連番リストが作れます。日付テーブルや連番生成の第一歩。" },

③ 「例からの列」— 欲しい結果を2〜3個入力すると
   Mコードを自動生成。複雑な文字列抽出の時短に絶大
④ クエリのグループ化(フォルダー)で整理
   「01_ソース」「02_変換」「03_出力」など</pre>
<p>「参照」は共通の整形(ソース接続+基本クレンジング)を1つのベースクエリにまとめ、そこから用途別に分岐する設計に使います。修正がベース1か所で済むのが強み。</p>
<p class="tip">💡 実務メモ: 引き継ぎ資料を書く前に、まずステップ名を日本語で意味の通る名前にリネームしましょう。それ自体が最高のドキュメントになります。</p>`,
      quiz: [
        { q: "適用したステップの名前は?",
          c: ["変更できない", "右クリックで変更でき、後から読んで分かる名前にすべき", "英数字のみ使用可", "変更するとエラーになる"], a: 1,
          e: "「フィルターされた行3」が並ぶクエリは未来の自分への呪い。意図が分かる名前+説明欄のメモが最高の引き継ぎ資料です。" },
        { q: "クエリの「参照」と「複製」の違いは?",
          c: ["同じもの", "参照は元クエリの結果を入力とする(連動)、複製は独立コピー", "参照は読み取り専用", "複製は自動更新されない"], a: 1,
          e: "ベースクエリ+参照で分岐、が保守しやすい設計。元の修正が参照先に自動で波及します。" },
        { q: "「例からの列」の機能は?",
          c: ["サンプルデータの生成", "入力した結果例からMの変換コードを自動生成", "列のコピー", "AIによるデータ予測"], a: 1,
          e: "「この列からこう取り出したい」を2〜3例入力するだけでText.BetweenDelimiters等の式を自動生成。まず試す価値ありです。" },
        { q: "クエリが増えてきたときの整理方法は?",
          c: ["名前を長くする", "グループ(フォルダー)を作って役割別に整理", "ファイルを分けるしかない", "整理する方法はない"], a: 1,
          e: "「ソース」「パラメータ」「中間」「出力」などのグループ分けが定番。読み込みオフの中間クエリも一目で分かります。" },
      ]
    },
    {
      title: "トラブルシューティング事典",
      doc: `
<p>現場で遭遇率の高いトラブルと、最初に疑うべきポイント集。</p>
<pre>【症状】合計行だけ値がおかしい
【原因】行ごとに計算すべき式を集計後に計算している
【処方】SUMXで「行ごとに計算→合計」に書き換え

【症状】循環依存エラー
【原因】計算列同士の相互参照や、CALCULATEを含む
        計算列が同テーブルの列と依存し合う
【処方】依存の連鎖を図に描く/計算列をPower Queryへ移す

【症状】前年比・YTDがBLANKや変な値
【原因】日付テーブル未マーク/ファクト側日付列を軸に使用
【処方】日付テーブルの3条件(連続・マーク・軸に使用)を確認

【症状】BLANKの比較で意図しない動き
【原因】DAXでは BLANK() = 0 がTRUE!
【処方】ISBLANKで明示的に判定する</pre>
<p>Power Query側の型エラー「テキストを数値に変換できません」は、対象列に混じった文字(全角数字、単位、空白)が原因のことがほとんど。エラー値のフィルターで現物を確認するのが最短です。</p>
<p class="tip">💡 実務メモ: トラブルの再現手順と原因をメモに残しておくと、チームの「事典」が育ちます。同じ穴に2度落ちないのが上級者への近道。</p>`,
      quiz: [
        { q: "マトリックスで「明細は正しいのに合計行だけおかしい」典型原因は?",
          c: ["Power BIのバグ", "行ごとに計算すべき式を集計後に計算している(SUMXで解決)", "データが壊れている", "リレーションの向き"], a: 1,
          e: "合計行では「単価合計×数量合計」のような誤った計算に。SUMX(明細, 単価*数量)で行ごとに計算してから足します。" },
        { q: "DAXにおける BLANK() = 0 の評価結果は?",
          c: ["FALSE", "TRUE", "エラー", "BLANK"], a: 1,
          e: "衝撃の仕様ですがTRUEです。「0のときだけ」の条件がBLANKも拾ってしまう罠。ISBLANKで明示的に区別しましょう。" },
        { q: "循環依存エラーの典型的な原因は?",
          c: ["メジャーが多すぎる", "計算列同士の相互参照など依存関係のループ", "リレーションの数", "データ量"], a: 1,
          e: "列Aが列Bを参照し、列BがAを参照…のループ。計算列にCALCULATEが絡むと気づきにくい形でも発生します。" },
        { q: "「テキストを数値に変換できません」エラーへの最初の一手は?",
          c: ["モデルを作り直す", "Power Query側でエラー行を表示し、混入した文字(全角数字・単位等)の現物を確認", "DAXで回避する", "列を削除する"], a: 1,
          e: "「エラーの保持」で現物確認→原因に応じてText.Trim/置換/try変換を仕込む。現物を見るのが常に最短ルートです。" },
      ]
    },
  ]
});
/*__COURSES_END__*/

/* ============================================================
   帯(レベル)システム
   ============================================================ */
const BELTS = [
  { xp: 0,    name: "白帯",  icon: "🤍" },
  { xp: 80,   name: "黄帯",  icon: "💛" },
  { xp: 200,  name: "橙帯",  icon: "🧡" },
  { xp: 360,  name: "緑帯",  icon: "💚" },
  { xp: 560,  name: "青帯",  icon: "💙" },
  { xp: 800,  name: "紫帯",  icon: "💜" },
  { xp: 1100, name: "茶帯",  icon: "🤎" },
  { xp: 1450, name: "赤帯",  icon: "❤️" },
  { xp: 1850, name: "黒帯",  icon: "🖤" },
  { xp: 2300, name: "師範",  icon: "🏆" },
];

/* ============================================================
   状態管理(localStorage)
   ============================================================ */
const KEY = "pbdojo_v1";
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { xp: 0, streak: 0, best: 0, lastDay: "", done: {}, best_score: {}, qs: {}, dailyDay: "", dailyScore: null };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function touchStreak() {
  const t = today();
  if (S.lastDay === t) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yest = y.getFullYear() + "-" + String(y.getMonth() + 1).padStart(2, "0") + "-" + String(y.getDate()).padStart(2, "0");
  S.streak = (S.lastDay === yest) ? S.streak + 1 : 1;
  S.best = Math.max(S.best, S.streak);
  S.lastDay = t;
}
function addXP(n) { touchStreak(); S.xp += n; save(); }
function belt() {
  let b = BELTS[0], next = null;
  for (let i = 0; i < BELTS.length; i++) {
    if (S.xp >= BELTS[i].xp) b = BELTS[i];
    else { next = BELTS[i]; break; }
  }
  return { cur: b, next: next };
}

/* 全問題にIDを振ってフラットにも持つ */
const ALLQ = [];
COURSES.forEach((c, ci) => c.lessons.forEach((l, li) => l.quiz.forEach((q, qi) => {
  q.id = ci + "-" + li + "-" + qi;
  q.course = c.name;
  ALLQ.push(q);
})));

function qstat(id) { return S.qs[id] || { c: 0, w: 0 }; }
function recordAnswer(id, ok) {
  const s = S.qs[id] || { c: 0, w: 0 };
  if (ok) s.c++; else s.w++;
  S.qs[id] = s;
}
function weakQuestions() {
  return ALLQ.filter(q => { const s = qstat(q.id); return s.w > 0 && s.w >= s.c; });
}
function totalProgress() {
  const total = COURSES.reduce((n, c) => n + c.lessons.length, 0);
  const done = Object.keys(S.done).length;
  return Math.round(done / total * 100);
}

/* ============================================================
   描画
   ============================================================ */
const app = document.getElementById("app");
let session = null; // {mode, qs, idx, correct, courseIdx, lessonIdx, answered}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function header() {
  return `<header class="top" onclick="go('home')">
    <h1>🥋 Power BI 道場</h1><span class="sub">M &amp; DAX 毎日修行</span>
  </header>`;
}

function viewHome() {
  const b = belt();
  const t = today();
  const dailyDone = S.dailyDay === t;
  const weak = weakQuestions();
  const pct = totalProgress();
  const nextTxt = b.next ? `次の${b.next.name}まで あと${b.next.xp - S.xp} XP` : "最高位です!";
  let html = header();
  html += `<div class="statrow">
    <div class="stat"><div class="v">🔥 ${S.streak}</div><div class="l">連続日数(最高 ${S.best})</div></div>
    <div class="stat"><div class="v">⭐ ${S.xp}</div><div class="l">XP</div></div>
    <div class="stat"><div class="v belt">${b.cur.icon} ${b.cur.name}</div><div class="l">${nextTxt}</div></div>
    <div class="stat"><div class="v">${pct}%</div><div class="l">全レッスン進捗</div></div>
  </div>`;
  html += `<button class="bigbtn ${dailyDone ? "done-today" : ""}" onclick="startDaily()">
    <span class="ico">${dailyDone ? "✅" : "⚔️"}</span>
    <span><div class="t">今日の腕試し(5問)</div>
    <div class="d">${dailyDone ? `本日クリア済み! ${S.dailyScore}/5 正解。また明日🌅` : "全コースからランダム出題・XP2倍!"}</div></span>
  </button>`;
  if (weak.length > 0) {
    html += `<button class="bigbtn" onclick="startReview()">
      <span class="ico">📝</span>
      <span><div class="t">弱点復習</div><div class="d">間違えた問題 ${weak.length} 問が復習待ち</div></span>
    </button>`;
  }
  html += `<h2 class="sec">コース一覧</h2>`;
  COURSES.forEach((c, ci) => {
    const done = c.lessons.filter((_, li) => S.done[ci + "-" + li]).length;
    const p = Math.round(done / c.lessons.length * 100);
    html += `<button class="bigbtn" onclick="go('course', ${ci})">
      <span class="ico">${c.icon}</span>
      <span style="flex:1"><div class="t">${c.name}</div><div class="d">${c.desc}</div>
      <div class="bar"><i style="width:${p}%"></i></div></span>
      <span class="right">${done}/${c.lessons.length}</span>
    </button>`;
  });
  html += `<div class="footer-note">毎日1レッスン+腕試しで、3週間で師範クラス。焦らずコツコツ🍵</div>`;
  app.innerHTML = html;
}

function viewCourse(ci) {
  const c = COURSES[ci];
  let html = header();
  html += `<div class="crumb" onclick="go('home')">← ホーム</div>`;
  html += `<div class="card"><div style="font-size:22px">${c.icon} <b>${c.name}</b></div><div style="color:var(--sub);font-size:13.5px">${c.desc}</div></div>`;
  c.lessons.forEach((l, li) => {
    const key = ci + "-" + li;
    const cleared = S.done[key];
    const bs = S.best_score[key];
    html += `<button class="lessonrow ${cleared ? "cleared" : ""}" onclick="go('lesson', ${ci}, ${li})">
      <span class="no">${cleared ? "✓" : li + 1}</span>
      <span><div class="lt">${l.title}</div>
      <div class="ls">クイズ${l.quiz.length}問${bs !== undefined ? ` ・ ベスト ${bs}/${l.quiz.length}` : ""}</div></span>
    </button>`;
  });
  app.innerHTML = html;
}

function viewLesson(ci, li) {
  const c = COURSES[ci], l = c.lessons[li];
  let html = header();
  html += `<div class="crumb" onclick="go('course', ${ci})">← ${c.name}</div>`;
  html += `<div class="card"><h3 style="margin:4px 0 2px">${c.icon} ${l.title}</h3><div class="doc">${l.doc}</div>
  <button class="btn" onclick="startLessonQuiz(${ci}, ${li})">🎯 クイズに挑戦(${l.quiz.length}問)</button></div>`;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ============================================================
   クイズセッション
   ============================================================ */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startLessonQuiz(ci, li) {
  session = { mode: "lesson", qs: COURSES[ci].lessons[li].quiz.slice(), idx: 0, correct: 0, ci: ci, li: li, answered: false };
  renderQuestion();
}
function startDaily() {
  if (S.dailyDay === today()) { go("home"); return; }
  const weak = shuffle(weakQuestions()).slice(0, 2);
  const rest = shuffle(ALLQ.filter(q => !weak.includes(q))).slice(0, 5 - weak.length);
  session = { mode: "daily", qs: shuffle(weak.concat(rest)), idx: 0, correct: 0, answered: false };
  renderQuestion();
}
function startReview() {
  const weak = shuffle(weakQuestions()).slice(0, 10);
  if (weak.length === 0) { go("home"); return; }
  session = { mode: "review", qs: weak, idx: 0, correct: 0, answered: false };
  renderQuestion();
}

function modeLabel() {
  return session.mode === "daily" ? "⚔️ 今日の腕試し" : session.mode === "review" ? "📝 弱点復習" : "🎯 " + COURSES[session.ci].lessons[session.li].title;
}

function renderQuestion() {
  const q = session.qs[session.idx];
  let html = header();
  html += `<div class="crumb" onclick="confirmQuit()">← 中断してホームへ</div>`;
  html += `<div class="card">
    <div class="qhead"><span>${modeLabel()}</span><span>${session.idx + 1} / ${session.qs.length}</span></div>
    <div class="bar" style="margin:0 0 14px"><i style="width:${session.idx / session.qs.length * 100}%"></i></div>
    <div class="qtext">${q.q}</div>
    ${q.code ? `<pre class="qcode">${esc(q.code)}</pre>` : ""}
    <div id="choices">${q.c.map((c, i) => `<button class="choice" onclick="answer(${i})">${esc(c)}</button>`).join("")}</div>
    <div id="feedback"></div>
  </div>`;
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

function confirmQuit() { if (confirm("クイズを中断しますか?(進捗は保存されません)")) go("home"); }

function answer(i) {
  if (session.answered) return;
  session.answered = true;
  const q = session.qs[session.idx];
  const ok = i === q.a;
  if (ok) session.correct++;
  recordAnswer(q.id, ok);
  save();
  const btns = document.querySelectorAll(".choice");
  btns.forEach((b, bi) => {
    b.disabled = true;
    if (bi === q.a) b.classList.add("correct");
    else if (bi === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = session.idx === session.qs.length - 1;
  document.getElementById("feedback").innerHTML =
    `<div class="explain"><b>${ok ? "⭕ 正解!" : "❌ 残念…"}</b> ${q.e}</div>
     <button class="btn" onclick="next()">${last ? "結果を見る 🏁" : "次の問題 →"}</button>`;
}

function next() {
  session.answered = false;
  session.idx++;
  if (session.idx < session.qs.length) renderQuestion();
  else finishSession();
}

function finishSession() {
  const n = session.qs.length, c = session.correct;
  const perQ = session.mode === "daily" ? 20 : 10;
  let xp = c * perQ;
  let bonusTxt = "";
  if (session.mode === "lesson") {
    const key = session.ci + "-" + session.li;
    if (!S.done[key]) { S.done[key] = true; xp += 20; bonusTxt = "(初クリアボーナス +20)"; }
    S.best_score[key] = Math.max(S.best_score[key] || 0, c);
  }
  if (session.mode === "daily") {
    S.dailyDay = today(); S.dailyScore = c;
    if (c === n) { xp += 30; bonusTxt = "(全問正解ボーナス +30)"; }
  }
  const beforeBelt = belt().cur;
  addXP(xp);
  const afterBelt = belt().cur;
  const rate = c / n;
  const face = rate === 1 ? "🎉" : rate >= 0.8 ? "😄" : rate >= 0.5 ? "🙂" : "💪";
  const msg = rate === 1 ? "完璧!今日も冴えてます。" :
              rate >= 0.8 ? "素晴らしい!あと一歩で完璧。" :
              rate >= 0.5 ? "いい調子。間違えた問題は「弱点復習」へ回りました。" :
              "難しかった?解説を読み直せば必ず伸びます。復習で会いましょう。";
  const beltUp = beforeBelt !== afterBelt ? `<div style="font-size:17px;margin-top:10px">🎊 昇段! <b>${afterBelt.icon} ${afterBelt.name}</b> になりました!</div>` : "";
  let html = header();
  html += `<div class="card resultbox">
    <div class="big">${face}</div>
    <h3>${c} / ${n} 問正解</h3>
    <div class="xp">+${xp} XP ${bonusTxt}</div>
    ${beltUp}
    <div class="msg">${msg}</div>
    <div class="msg">🔥 連続学習 ${S.streak} 日目</div>
    <div style="margin-top:18px">
      <button class="btn" onclick="go('home')">ホームへ</button>
      ${session.mode === "lesson" ? `<button class="btn ghost" onclick="go('course', ${session.ci})">コースに戻る</button>` : ""}
    </div>
  </div>`;
  app.innerHTML = html;
  session = null;
}

/* ============================================================
   ルーティング
   ============================================================ */
function go(view, a, b) {
  if (view === "home") viewHome();
  else if (view === "course") viewCourse(a);
  else if (view === "lesson") viewLesson(a, b);
}
window.go = go; window.answer = answer; window.next = next;
window.startLessonQuiz = startLessonQuiz; window.startDaily = startDaily;
window.startReview = startReview; window.confirmQuit = confirmQuit;

viewHome();
</script>
