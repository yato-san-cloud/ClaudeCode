<title>Power BI 道場 〜物流データアナリスト養成〜</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================
 * Power BI 道場 v2 — style.css(シェル担当)
 * 世界観: 道場 × 物流現場。トークン方式・ライト/ダーク両対応。
 * ============================================================ */

/* ---------------- デザイントークン ---------------- */
:root {
  --bg: #f5f2ea;
  --bg-soft: #eae5d6;
  --card: #fffdf6;
  --ink: #26241f;
  --ink-dim: #6b6456;
  --line: #ddd6c3;
  --accent: #e8641b;
  --accent-deep: #a94a10;
  --accent-soft: #fdeadd;
  /* 白文字を載せる「塗り」専用アクセント(両テーマ共通)。
     #c2560f は白文字とのコントラスト約4.5:1でWCAG AAを満たす。 */
  --accent-strong: #c2560f;
  --accent-strong-deep: #8f3e0a;
  --sub: #f2b705;
  --sub-deep: #a37b01;
  --ok: #2f8f46;
  --ok-deep: #1f6330;
  --ok-soft: #e2f2e5;
  --bad: #c2452d;
  --bad-deep: #8d2f1e;
  --bad-soft: #f9e2dc;
  --lock: #c7c1b0;
  --lock-deep: #a09a89;
  /* 獲得★の色(ライトは濃色で未獲得★・背景と判別可能に) */
  --star-on: #a37b01;
  /* 正解/不正解ソフト地の上に載せる文字色(テーマごとにコントラスト確保) */
  --ok-text: #1f6330;
  --bad-text: #8d2f1e;
  --shadow: 0 2px 10px rgba(38, 36, 31, 0.08);
  /* コードは常に濃色地(可読性優先・両テーマ共通) */
  --code-bg: #14161c;
  --code-ink: #d7dce6;
  --tok-kw: #7cb0ff;
  --tok-fn: #ffd479;
  --tok-str: #9ece6a;
  --tok-num: #f2955e;
  --tok-com: #6a7387;
  --tok-pun: #8b93a8;
  --r: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
    "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, monospace;
}

/* 夜間配送(ダーク)テーマ */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15140f;
    --bg-soft: #1d1b14;
    --card: #221f17;
    --ink: #ece7d9;
    --ink-dim: #a49d8c;
    --line: #3a3628;
    --accent: #ff7d33;
    --accent-deep: #c2560f;
    --accent-soft: #3a2413;
    --sub: #ffc82e;
    --sub-deep: #8f6e04;
    --ok: #48b866;
    --ok-deep: #2c7d42;
    --ok-soft: #1c2f20;
    --bad: #e0654c;
    --bad-deep: #a03a26;
    --bad-soft: #35201b;
    --lock: #4a463a;
    --lock-deep: #332f26;
    --star-on: #ffc82e;
    --ok-text: #7fd695;
    --bad-text: #ff9a80;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
  }
}
:root[data-theme="dark"] {
  --bg: #15140f;
  --bg-soft: #1d1b14;
  --card: #221f17;
  --ink: #ece7d9;
  --ink-dim: #a49d8c;
  --line: #3a3628;
  --accent: #ff7d33;
  --accent-deep: #c2560f;
  --accent-soft: #3a2413;
  --sub: #ffc82e;
  --sub-deep: #8f6e04;
  --ok: #48b866;
  --ok-deep: #2c7d42;
  --ok-soft: #1c2f20;
  --bad: #e0654c;
  --bad-deep: #a03a26;
  --bad-soft: #35201b;
  --lock: #4a463a;
  --lock-deep: #332f26;
  --star-on: #ffc82e;
  --ok-text: #7fd695;
  --bad-text: #ff9a80;
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
}
:root[data-theme="light"] {
  --bg: #f5f2ea;
  --bg-soft: #eae5d6;
  --card: #fffdf6;
  --ink: #26241f;
  --ink-dim: #6b6456;
  --line: #ddd6c3;
  --accent: #e8641b;
  --accent-deep: #a94a10;
  --accent-soft: #fdeadd;
  --sub: #f2b705;
  --sub-deep: #a37b01;
  --ok: #2f8f46;
  --ok-deep: #1f6330;
  --ok-soft: #e2f2e5;
  --bad: #c2452d;
  --bad-deep: #8d2f1e;
  --bad-soft: #f9e2dc;
  --lock: #c7c1b0;
  --lock-deep: #a09a89;
  --star-on: #a37b01;
  --ok-text: #1f6330;
  --bad-text: #8d2f1e;
  --shadow: 0 2px 10px rgba(38, 36, 31, 0.08);
}

/* ---------------- ベース ---------------- */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.6;
  font-size: 16px;
}
#app {
  max-width: 540px;
  margin: 0 auto;
  padding: 12px 14px 90px;
}
h1 { font-size: 1.25rem; margin: 0.3em 0; }
h2 { font-size: 1.05rem; margin: 0.2em 0 0.6em; }
b, strong { font-weight: 700; }
button { font-family: inherit; }
button:focus-visible,
a:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid var(--sub);
  outline-offset: 2px;
}
.num, .stat b, .xp-line b { font-variant-numeric: tabular-nums; }

.boot-msg { text-align: center; color: var(--ink-dim); padding: 40px 0; }
.fatal {
  margin: 24px auto;
  max-width: 480px;
  background: var(--bad-soft);
  color: var(--bad-deep);
  border: 2px solid var(--bad);
  border-radius: var(--r);
  padding: 16px;
  font-weight: 700;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  margin: 12px 0;
}

/* ---------------- ボタン(Duolingo風 押し込み) ---------------- */
.btn {
  display: inline-block;
  font-weight: 700;
  font-size: 1rem;
  color: #fff;
  background: var(--accent-strong);
  border: 0;
  border-bottom: 4px solid var(--accent-strong-deep);
  border-radius: var(--r);
  padding: 12px 18px;
  cursor: pointer;
  transition: transform 0.05s;
}
.btn:active {
  transform: translateY(2px);
  border-bottom-width: 2px;
}
.btn.big { width: 100%; padding: 14px 18px; font-size: 1.1rem; }
.btn.ghost {
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
}
.btn.danger { background: var(--bad); border-bottom-color: var(--bad-deep); }
.btn:disabled,
.btn.ghost:disabled {
  background: var(--lock);
  border-color: var(--lock-deep);
  border-bottom-color: var(--lock-deep);
  color: var(--ink-dim);
  cursor: not-allowed;
  transform: none;
}
.icon-btn {
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  border-radius: 12px;
  width: 40px;
  height: 40px;
  font-size: 1rem;
  cursor: pointer;
  flex: 0 0 auto;
}
.icon-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

/* ---------------- トップバー ---------------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 8px 12px;
  position: sticky;
  top: 8px;
  z-index: 10;
}
.stat { font-size: 0.95rem; white-space: nowrap; }
.stat b { margin: 0 2px; }
.belt {
  background: var(--ink);
  color: var(--bg);
  border-radius: 999px;
  padding: 2px 12px;
  font-weight: 700;
  font-size: 0.85rem;
  white-space: nowrap;
}
.ring { width: 44px; height: 44px; margin-left: auto; flex: 0 0 auto; }
.ring .ring-bg { fill: none; stroke: var(--bg-soft); stroke-width: 4; }
.ring .ring-fg {
  fill: none;
  stroke: var(--accent);
  stroke-width: 4;
  stroke-linecap: round;
  transform: rotate(-90deg);
  transform-origin: 20px 20px;
  transition: stroke-dasharray 0.4s;
}
.ring text { fill: var(--ink); font-size: 9px; font-weight: 700; }

/* ---------------- ロジ柴 ---------------- */
.mascot { display: flex; align-items: flex-start; gap: 8px; margin: 14px 2px 8px; }
.m-dog { font-size: 2rem; line-height: 1; }
.bubble {
  position: relative;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 0.92rem;
}
.bubble::before {
  content: "";
  position: absolute;
  left: -8px;
  top: 12px;
  border: 5px solid transparent;
  border-right-color: var(--line);
}

/* ---------------- アクション行 ---------------- */
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 10px 0;
}
.actions .btn { padding: 10px 8px; font-size: 0.92rem; }

/* ---------------- デイリークエスト ---------------- */
.quests { margin: 12px 0; }
.quest {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  border-bottom: 1px dashed var(--line);
}
.quest:last-of-type { border-bottom: 0; }
.quest.done { opacity: 0.75; }
.q-ic { font-size: 1.2rem; }
.q-body { flex: 1; min-width: 0; }
.q-text { font-size: 0.9rem; }
.q-bar {
  height: 8px;
  background: var(--bg-soft);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 3px;
}
.q-bar i {
  display: block;
  height: 100%;
  background: var(--sub);
  border-radius: 99px;
  transition: width 0.4s;
}
.q-r { font-size: 0.8rem; color: var(--ink-dim); white-space: nowrap; }
.q-all { text-align: center; font-weight: 700; color: var(--accent); padding-top: 6px; }

/* ---------------- スキルパス ---------------- */
.unit { margin: 20px 0; }
.unit-head {
  display: flex;
  align-items: center;
  gap: 10px;
  /* ユニット色を両テーマで暗色化し白文字のコントラストを確保(WCAG 4.5:1目安)。
     color-mix 非対応ブラウザは前行の生ユニット色にフォールバック。 */
  background: var(--uc, var(--accent));
  background: color-mix(in srgb, var(--uc, var(--accent)) 65%, #000);
  color: #fff;
  border-radius: var(--r);
  border-bottom: 4px solid rgba(0, 0, 0, 0.28);
  padding: 10px 14px;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}
.unit.locked .unit-head { filter: grayscale(0.85); opacity: 0.7; }
.u-icon { font-size: 1.6rem; }
.u-name { font-weight: 700; }
.u-desc { font-size: 0.8rem; opacity: 0.92; }
.path {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 18px 0 6px;
}
.node-wrap { text-align: center; width: 150px; }
.node {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  border: 0;
  border-bottom: 6px solid rgba(0, 0, 0, 0.3);
  background: var(--uc, var(--accent));
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  box-shadow: var(--shadow);
}
.node:active { transform: translateY(2px); border-bottom-width: 3px; }
.node.lock {
  background: var(--lock);
  border-bottom-color: var(--lock-deep);
  cursor: not-allowed;
  filter: grayscale(1);
}
.node.next { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232, 100, 27, 0.55); }
  60% { box-shadow: 0 0 0 14px rgba(232, 100, 27, 0); }
}
.stars { font-size: 0.9rem; letter-spacing: 2px; margin-top: 2px; }
.stars .on { color: var(--star-on, var(--sub)); }
.stars .off { color: var(--lock); }
.node-name { font-size: 0.78rem; color: var(--ink-dim); line-height: 1.3; }

/* ---------------- サブ画面ヘッダー ---------------- */
.sub-head { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.sub-head h1 { flex: 1; min-width: 0; }

/* ---------------- 解説doc ---------------- */
.doc p { margin: 0.7em 0; }
.doc p.tip {
  background: var(--accent-soft);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 0.92rem;
}
.doc pre, pre.code {
  background: var(--code-bg);
  color: var(--code-ink);
  font-family: var(--mono);
  font-size: 0.86rem;
  line-height: 1.55;
  border-radius: 10px;
  padding: 12px 14px;
  overflow-x: auto;
  white-space: pre-wrap;
  /* トークン途中(数値・識別子内)での折返しを防ぐ。
     折返せない長い行は overflow-x: auto の横スクロールに任せる。 */
  word-break: normal;
}
.doc code, .ex-q code, .fb-exp code, .hint code {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 0 4px;
  font-family: var(--mono);
  font-size: 0.88em;
}
.tok-kw { color: var(--tok-kw); }
.tok-fn { color: var(--tok-fn); }
.tok-str { color: var(--tok-str); }
.tok-num { color: var(--tok-num); }
.tok-com { color: var(--tok-com); font-style: italic; }
.tok-pun { color: var(--tok-pun); }

/* ---------------- 演習セッション ---------------- */
.s-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 4px 0 12px;
}
.p-bar {
  flex: 1;
  height: 14px;
  background: var(--bg-soft);
  border-radius: 99px;
  overflow: hidden;
}
.p-bar i {
  display: block;
  height: 100%;
  background: var(--ok);
  border-radius: 99px;
  transition: width 0.3s;
}
.combo { font-weight: 700; color: var(--accent); white-space: nowrap; }
.combo.dim { color: var(--ink-dim); font-weight: 400; font-size: 0.85rem; }

.ex-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 16px;
}
.ex-no { color: var(--ink-dim); font-size: 0.8rem; }
.ex-q { font-weight: 700; margin: 6px 0 12px; }
.ex-card.pop { animation: pop 0.35s; }
.ex-card.shake { animation: shake 0.4s; }
@keyframes pop {
  0% { transform: scale(1); }
  40% { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(4px); }
}

/* mc 選択肢 */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt {
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
  font-size: 0.96rem;
  background: var(--card);
  color: var(--ink);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  border-radius: var(--r);
  padding: 10px 12px;
  cursor: pointer;
}
.opt:not(:disabled):active { transform: translateY(2px); border-bottom-width: 2px; }
.opt-key {
  flex: 0 0 auto;
  width: 24px;
  height: 24px;
  line-height: 22px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 0.8rem;
  color: var(--ink-dim);
}
.opt.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok-text, var(--ok-deep)); font-weight: 700; }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad-text, var(--bad-deep)); }
.opt.locked { cursor: default; opacity: 0.9; }

/* fill 穴埋め */
pre.fill-code .slot {
  display: inline-block;
  min-width: 64px;
  font-family: var(--mono);
  font-size: 0.86rem;
  background: rgba(255, 255, 255, 0.06);
  color: var(--sub);
  border: 2px dashed var(--tok-pun);
  border-radius: 8px;
  padding: 1px 8px;
  margin: 1px 2px;
  cursor: pointer;
  vertical-align: baseline;
}
pre.fill-code .slot.empty { color: var(--tok-com); }
pre.fill-code .slot.ok { border-style: solid; border-color: var(--ok); color: #9ece6a; }
pre.fill-code .slot.bad { border-style: solid; border-color: var(--bad); color: #ff8a70; }
.bank {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.chip {
  font-family: var(--mono);
  font-size: 0.88rem;
  background: var(--bg-soft);
  color: var(--ink);
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
}
.chip:not(:disabled):active { transform: translateY(2px); border-bottom-width: 2px; }
.chip.used { opacity: 0.35; }

/* type エディター */
.ed-host {
  position: relative;
  background: var(--code-bg);
  border-radius: 10px;
  border: 2px solid var(--line);
  font-family: var(--mono);
  font-size: 0.9rem;
  margin: 8px 0;
  overflow: hidden;
}
.ed-host:focus-within { border-color: var(--accent); }
.ed-host pre, .ed-host textarea {
  font-family: var(--mono);
  font-size: 0.9rem;
  line-height: 1.55;
  color: var(--code-ink);
}
.type-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.hint {
  background: var(--accent-soft);
  border-left: 4px solid var(--sub);
  border-radius: 8px;
  padding: 8px 12px;
  margin: 8px 0;
  font-size: 0.9rem;
}
.close-msg {
  background: var(--ok-soft);
  border-left: 4px solid var(--ok);
  border-radius: 8px;
  padding: 8px 12px;
  margin: 8px 0;
  font-weight: 700;
  font-size: 0.9rem;
}

/* フィードバック */
.feedback {
  border-radius: var(--r);
  padding: 14px 16px;
  margin: 12px 0;
  border: 2px solid;
}
.feedback.good { background: var(--ok-soft); border-color: var(--ok); }
.feedback.ouch { background: var(--bad-soft); border-color: var(--bad); }
.fb-head { font-weight: 700; margin-bottom: 6px; }
.feedback.good .fb-head { color: var(--ok-text, var(--ok-deep)); }
.feedback.ouch .fb-head { color: var(--bad-text, var(--bad-deep)); }
.fb-shiba { display: block; font-weight: 400; font-size: 0.88rem; margin-top: 2px; color: var(--ink); }
.fb-label { font-size: 0.78rem; color: var(--ink-dim); margin-top: 8px; }
.fb-exp { font-size: 0.92rem; margin: 8px 0; }
.feedback .btn { margin-top: 6px; width: 100%; }

/* ---------------- 結果画面 ---------------- */
.result { text-align: center; }
.r-shiba { font-size: 0.92rem; margin-bottom: 6px; }
.r-score { font-size: 1.15rem; font-weight: 700; margin: 6px 0; }
.xp-lines {
  text-align: left;
  max-width: 320px;
  margin: 12px auto;
  border-top: 1px dashed var(--line);
}
.xp-line {
  display: flex;
  justify-content: space-between;
  padding: 6px 4px;
  border-bottom: 1px dashed var(--line);
  font-size: 0.94rem;
}
.xp-line.total { font-weight: 700; font-size: 1.05rem; color: var(--accent); }
.promo {
  background: var(--accent-soft);
  border: 2px solid var(--accent);
  border-radius: var(--r);
  padding: 10px;
  margin: 10px 0;
  font-size: 1.05rem;
  animation: pop 0.5s;
}
.r-streak { margin: 8px 0; font-weight: 700; }
.r-freeze {
  background: var(--bg-soft);
  border-radius: 10px;
  padding: 8px;
  margin: 8px 0;
  font-size: 0.88rem;
}

/* ---------------- プロフィール ---------------- */
.prof-top { text-align: center; }
.belt-big {
  display: inline-block;
  background: var(--ink);
  color: var(--bg);
  border-radius: 999px;
  padding: 6px 22px;
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 6px;
}
.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.sbox {
  background: var(--bg-soft);
  border-radius: 10px;
  text-align: center;
  padding: 8px 4px;
}
.sbox b { display: block; font-size: 1.2rem; }
.sbox span { font-size: 0.75rem; color: var(--ink-dim); }
.u-progress { margin-top: 12px; }
.up-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.85rem; }
.up-row > span { flex: 0 0 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-row .q-bar { flex: 1; }

 * Power BI 道場 v2 — editor.js

   * 各言語ごとに「1本の結合正規表現+グループ番号→トークン種別」で走査。

   * span class: tok-kw / tok-fn / tok-str / tok-num / tok-com / tok-pun

  //  1: コメント  2: 文字列  3: 関数(大文字始まり.名前( )  4: キーワード(#date系含む)
  //  5: 数値  6: 記号

    "(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)" +
      "|(\"(?:\"\"|[^\"])*\"?)" +
      "|(#?[A-Z][A-Za-z0-9]*(?:\\.[A-Za-z][A-Za-z0-9]*)+(?=\\s*\\())" +
      "|(#(?:datetimezone|datetime|date|duration|time|table|binary|infinity|nan)\\b" +
      "|\\b(?:let|in|each|if|then|else|try|otherwise|type|as|and|or|not|true|false|null|meta|error|is|section|shared)\\b)" +

  //  1: コメント(// -- /* */)  2: 文字列  3: メジャー/列参照 [...](tok-fn系の色)
  //  4: 関数(大文字英字列( )  5: キーワード  6: 数値  7: 記号
  var DAX_RE = new RegExp(
    "(\\/\\/[^\\n]*|--[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)" +
      "|(\"(?:\"\"|[^\"])*\"?)" +
      "|(\\[[^\\]\\r\\n]*\\]?)" +
      "|([A-Z][A-Z0-9._]*(?=\\s*\\())" +
      "|(\\b(?:VAR|RETURN|TRUE|FALSE|BLANK|IN|NOT|EVALUATE|DEFINE|MEASURE|ORDER|BY|ASC|DESC" +
      "|var|return|true|false|blank|in|not)\\b)" +
      "|(\\b\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?\\b)" +
      "|([()\\[\\]{}=,;.*+\\-\\/<>&^%@?:!])",

    var last = 0;
    var m;

      var cls = null;
      for (var g = 1; g < m.length; g++) {

    var cur = new Array(lb + 1);

      prev = cur;
      cur = tmp;

    ex: "日付 = CALENDARAUTO()" },
  { name: "TOTALYTD", lang: "dax", cat: "時間",
    syntax: "TOTALYTD(<式>, <日付列>, [<フィルター>], [<年度末日>])",
    desc: "年初(または指定した会計年度の期首)から現在までの累計を計算する。第4引数で\"3/31\"のように会計年度末を指定できる。",
    ex: "出荷数量YTD = TOTALYTD([出荷数量], '日付'[Date], \"3/31\")" },
  { name: "SAMEPERIODLASTYEAR", lang: "dax", cat: "時間",
    syntax: "SAMEPERIODLASTYEAR(<日付列>)",
    desc: "現在のフィルターコンテキストの期間をちょうど1年前にずらした日付テーブルを返す。前年同月比メジャーで使う。",
    ex: "CALCULATE([出荷数量], SAMEPERIODLASTYEAR('日付'[Date]))" },
  { name: "DATEADD", lang: "dax", cat: "時間",
    syntax: "DATEADD(<日付列>, <間隔数>, <単位>)",
    desc: "現在の期間を指定した単位(DAY/MONTH/QUARTER/YEAR)だけ前後にずらした日付テーブルを返す。SAMEPERIODLASTYEARより汎用的。",
    ex: "CALCULATE([出荷数量], DATEADD('日付'[Date], -1, YEAR))" },
  { name: "DATESINPERIOD", lang: "dax", cat: "時間",
    syntax: "DATESINPERIOD(<日付列>, <開始日>, <間隔数>, <単位>)",
    desc: "基準日から指定した間隔数・単位だけ遡った(または進んだ)期間の日付テーブルを返す。7日移動平均などの窓を作るのに使う。",
    ex: "出荷数量7日平均 = AVERAGEX(DATESINPERIOD('日付'[Date], MAX('日付'[Date]), -7, DAY), [出荷数量])" },
  { name: "DATESBETWEEN", lang: "dax", cat: "時間",
    syntax: "DATESBETWEEN(<日付列>, <開始日>, <終了日>)",
    desc: "開始日から終了日までの日付テーブルを返す。開始日または終了日にBLANKを指定すると範囲の端まで伸ばせる。",
    ex: "DATESBETWEEN('日付'[Date], BLANK(), MIN('日付'[Date]) - 1)" },
  { name: "PARALLELPERIOD", lang: "dax", cat: "時間",
    syntax: "PARALLELPERIOD(<日付列>, <間隔数>, <単位>)",
    desc: "現在の期間を月/四半期/年単位で丸ごと前後にずらした日付テーブルを返す。DATEADDと違い期間全体(月初〜月末など)にそろえる。",
    ex: "CALCULATE([出荷数量], PARALLELPERIOD('日付'[Date], -1, MONTH))" },
  { name: "PREVIOUSMONTH", lang: "dax", cat: "時間",
    syntax: "PREVIOUSMONTH(<日付列>)",
    desc: "現在のフィルターコンテキストの前月をまるごと表す日付テーブルを返す。前月比メジャーの定番。",
    ex: "CALCULATE([出荷数量], PREVIOUSMONTH('日付'[Date]))" },
  { name: "NEXTDAY", lang: "dax", cat: "時間",
    syntax: "NEXTDAY(<日付列>)",
    desc: "現在のフィルターコンテキストの翌日を表す日付テーブルを返す。",
    ex: "CALCULATE([出荷件数], NEXTDAY('日付'[Date]))" },
  { name: "LASTDATE", lang: "dax", cat: "時間",
    syntax: "LASTDATE(<日付列>)",
    desc: "現在のフィルターコンテキストにおける最後の日付を1行のテーブルとして返す。半加法メジャー(在庫など)で月末残高を求める定番。",
    ex: "月末在庫数 = CALCULATE(SUM(F_在庫[在庫数]), LASTDATE('日付'[Date]))" },
  { name: "FIRSTDATE", lang: "dax", cat: "時間",
    syntax: "FIRSTDATE(<日付列>)",
    desc: "現在のフィルターコンテキストにおける最初の日付を1行のテーブルとして返す。LASTDATEと対になる。",
    ex: "CALCULATE(SUM(F_在庫[在庫数]), FIRSTDATE('日付'[Date]))" },
  { name: "LASTNONBLANK", lang: "dax", cat: "時間",
    syntax: "LASTNONBLANK(<日付列>, <式>)",
    desc: "式の結果が空白でない最後の日付を返す。月末までデータが届いていない月でも、実際にデータがある最終日を拾える点がLASTDATEと異なる。",
    ex: "CALCULATE(SUM(F_在庫[在庫数]), LASTNONBLANK('日付'[Date], SUM(F_在庫[在庫数])))" },
  { name: "OPENINGBALANCEMONTH", lang: "dax", cat: "時間",
    syntax: "OPENINGBALANCEMONTH(<式>, <日付列>)",
    desc: "月初時点(前月末)の値を評価する半加法メジャー専用関数。残高系データの月初残高を求める。",
    ex: "OPENINGBALANCEMONTH(SUM(F_在庫[在庫数]), '日付'[Date])" },
  { name: "CLOSINGBALANCEMONTH", lang: "dax", cat: "時間",
    syntax: "CLOSINGBALANCEMONTH(<式>, <日付列>)",
    desc: "月末時点の値を評価する半加法メジャー専用関数。内部的にはLASTDATEでCALCULATEするのとほぼ同義だが意図が読み取りやすい。",
    ex: "CLOSINGBALANCEMONTH(SUM(F_在庫[在庫数]), '日付'[Date])" },
  { name: "NETWORKDAYS", lang: "dax", cat: "時間",
    syntax: "NETWORKDAYS(<開始日>, <終了日>, [<週末指定>], [<祝日テーブル>])",
    desc: "開始日から終了日までの営業日数を数える。週末パターンや祝日テーブルを指定でき、納期計算で休日を除外したいときに使う。",
    ex: "営業日数 = NETWORKDAYS(F_出荷明細[受注日], F_出荷明細[実納品日], 1, 祝日[日付])" },

  // ==================== DAX: テーブル ====================
  { name: "VALUES", lang: "dax", cat: "テーブル",
    syntax: "VALUES(<テーブルまたは列>)",
    desc: "現在のフィルターコンテキストにおける列のユニーク値一覧をテーブルとして返す。CALCULATE内やイテレーターの対象テーブルとしてよく使う。",
    ex: "COUNTROWS(VALUES(D_顧客[顧客名]))" },
  { name: "DISTINCT", lang: "dax", cat: "テーブル",
    syntax: "DISTINCT(<列>)",
    desc: "列のユニーク値一覧をテーブルとして返す。VALUESと似るが、関連テーブルの空白行を自動追加しない点が異なる。",
    ex: "DISTINCT(D_商品[カテゴリ])" },
  { name: "SUMMARIZE", lang: "dax", cat: "テーブル",
    syntax: "SUMMARIZE(<テーブル>, <グループ化列1>, ..., [<集計名>, <集計式>])",
    desc: "指定した列でグループ化した集計テーブルを作る。集計列の追加はADDCOLUMNSと組み合わせる方が性能面で推奨されることが多い。",
    ex: "SUMMARIZE(F_出荷明細, D_拠点[倉庫名])" },
  { name: "SUMMARIZECOLUMNS", lang: "dax", cat: "テーブル",
    syntax: "SUMMARIZECOLUMNS(<グループ化列1>, ..., <フィルター>, <\"名前\", 式>, ...)",
    desc: "ビジュアルが裏側で生成するクエリの中核となるテーブル関数。グループ化・フィルター・集計を1関数でまとめて行うが、メジャー内での利用には制約がある。",
    ex: "SUMMARIZECOLUMNS(D_拠点[倉庫名], \"数量\", [出荷数量])" },
  { name: "ADDCOLUMNS", lang: "dax", cat: "テーブル",
    syntax: "ADDCOLUMNS(<テーブル>, <\"名前1\">, <式1>, ...)",
    desc: "既存のテーブルに計算列を追加した新しいテーブルを返す。行コンテキストが発生するのでRELATEDやイテレーターと組み合わせられる。",
    ex: "ADDCOLUMNS(VALUES(D_顧客[顧客名]), \"OTD\", [OTD])" },
  { name: "SELECTCOLUMNS", lang: "dax", cat: "テーブル",
    syntax: "SELECTCOLUMNS(<テーブル>, <\"名前1\">, <式1>, ...)",
    desc: "テーブルから必要な列だけを選び直す、または計算した列に差し替えて新しいテーブルを返す。",
    ex: "SELECTCOLUMNS(D_商品, \"商品名\", D_商品[商品名], \"単価\", D_商品[単価])" },
  { name: "CROSSJOIN", lang: "dax", cat: "テーブル",
    syntax: "CROSSJOIN(<テーブル1>, <テーブル2>, ...)",
    desc: "複数のテーブルのすべての行の組み合わせ(直積)を返す。全拠点×全月のような欠損なしグリッドを作るのに使う。",
    ex: "CROSSJOIN(VALUES(D_拠点[倉庫名]), VALUES('日付'[年月]))" },
  { name: "GENERATE", lang: "dax", cat: "テーブル",
    syntax: "GENERATE(<テーブル1>, <テーブル2>)",
    desc: "テーブル1の各行に対してテーブル2を行コンテキスト付きで評価し、結合した結果を返す。行ごとに異なるテーブル式を展開したいときに使う。",
    ex: "GENERATE(VALUES(D_商品[カテゴリ]), TOPN(1, F_出荷明細))" },
  { name: "UNION", lang: "dax", cat: "テーブル",
    syntax: "UNION(<テーブル1>, <テーブル2>, ...)",
    desc: "列構成が同じ複数のテーブルを縦に結合する。重複行はそのまま残る。",
    ex: "UNION(VALUES(D_顧客[顧客名]), VALUES(D_顧客[顧客名]))" },
  { name: "EXCEPT", lang: "dax", cat: "テーブル",
    syntax: "EXCEPT(<テーブル1>, <テーブル2>)",
    desc: "テーブル1にあってテーブル2には無い行だけを返す。新規顧客(今期にいるが過去にいない顧客)の抽出に使う。",
    ex: "新規顧客数 = COUNTROWS(EXCEPT(VALUES(売上[顧客ID]), CALCULATETABLE(VALUES(売上[顧客ID]), DATESBETWEEN('日付'[Date], BLANK(), MIN('日付'[Date]) - 1))))" },
  { name: "INTERSECT", lang: "dax", cat: "テーブル",
    syntax: "INTERSECT(<テーブル1>, <テーブル2>)",
    desc: "テーブル1とテーブル2の両方に存在する行だけを返す。2つの商品カテゴリを両方買っている顧客の抽出(バスケット分析)などに使う。",
    ex: "INTERSECT(VALUES(売上A[顧客ID]), VALUES(売上B[顧客ID]))" },

  // ==================== DAX: ランキング ====================
  { name: "RANKX", lang: "dax", cat: "ランキング",
    syntax: "RANKX(<テーブル>, <式>, [<値>], [<順序>], [<Ties>])",
    desc: "テーブルを式で評価した結果に基づいて順位を返す。ALLでコンテキストを復元しないと、常に順位1になってしまう点に注意。",
    ex: "顧客ランク = RANKX(ALL(D_顧客[顧客名]), [出荷数量])" },
  { name: "TOPN", lang: "dax", cat: "ランキング",
    syntax: "TOPN(<行数>, <テーブル>, [<式>], [<順序>])",
    desc: "指定した式で並べ替えたテーブルの上位N行を返す。TOPNは順位が同点の場合に指定行数を超えることがある点に注意。",
    ex: "TOPN(10, VALUES(D_顧客[顧客名]), [出荷数量], DESC)" },

  // ==================== DAX: ウィンドウ ====================
  { name: "RANK", lang: "dax", cat: "ウィンドウ",
    syntax: "RANK(<順序>, <パーティション解除>, <ORDERBY>, [<PARTITIONBY>], [<Ties>])",
    desc: "ウィンドウ関数として順位を返す新しい構文。ORDERBY/PARTITIONBYと組み合わせて使い、同順位(タイ)には同じ順位が付く。",
    ex: "売上ランク = RANK(DENSE, ALLSELECTED('製品'[製品名]), ORDERBY([売上], DESC), PARTITIONBY('製品'[カテゴリ]))" },
  { name: "ROWNUMBER", lang: "dax", cat: "ウィンドウ",
    syntax: "ROWNUMBER(<パーティション解除>, <ORDERBY>, [<PARTITIONBY>])",
    desc: "一意な連番を返すウィンドウ関数。同順位のタイがあっても内部的に一意性を補って区別する点がRANKと異なる。",
    ex: "ROWNUMBER(ALLSELECTED(D_顧客[顧客名]), ORDERBY([出荷数量], DESC))" },
  { name: "INDEX", lang: "dax", cat: "ウィンドウ",
    syntax: "INDEX(<n>, <パーティション解除>, [<ORDERBY>], [<PARTITIONBY>], [<Blanks>])",
    desc: "パーティション内のn番目(絶対位置)の行を評価するウィンドウ関数。",
    ex: "INDEX(1, ALLSELECTED('日付'[年月]), ORDERBY('日付'[年月]))" },
  { name: "OFFSET", lang: "dax", cat: "ウィンドウ",
    syntax: "OFFSET(<デルタ>, <パーティション解除>, [<ORDERBY>], [<PARTITIONBY>], [<Blanks>])",
    desc: "現在の行から相対的にn行前後の行を評価するウィンドウ関数。前月比・前年同月比のような「1つ前との比較」を簡潔に書ける。",
    ex: "前月比較 = VAR CurrentSales = [売上] VAR PreviousSales = CALCULATE([売上], OFFSET(-1, ORDERBY('日付'[年月]))) RETURN CurrentSales - PreviousSales" },
  { name: "WINDOW", lang: "dax", cat: "ウィンドウ",
    syntax: "WINDOW(<開始>, <開始基準>, <終了>, <終了基準>, <パーティション解除>, [<ORDERBY>], [<PARTITIONBY>], [<Blanks>])",
    desc: "開始行から終了行までの範囲(ウィンドウ)を行の集合として返す。移動平均や累計の土台となる汎用のウィンドウ関数。",
    ex: "AVERAGEX(WINDOW(-2, REL, 0, REL, ALLSELECTED('日付'[年月]), ORDERBY('日付'[年月])), [売上])" },
  { name: "ORDERBY", lang: "dax", cat: "ウィンドウ",
    syntax: "ORDERBY(<式>, [<順序>], ...)",
    desc: "ウィンドウ関数(RANK/ROWNUMBER/INDEX/OFFSET/WINDOW)の内部でのみ使う並び替え指定のサブ関数。単独では使えない。",
    ex: "ORDERBY([売上], DESC)" },
  { name: "PARTITIONBY", lang: "dax", cat: "ウィンドウ",
    syntax: "PARTITIONBY(<列1>, ...)",
    desc: "ウィンドウ関数の計算をグループ(パーティション)単位に分割するサブ関数。カテゴリ内ランキングのように「グループごとにリセットして」計算したいときに指定する。",
    ex: "PARTITIONBY('製品'[カテゴリ])" },
  { name: "MATCHBY", lang: "dax", cat: "ウィンドウ",
    syntax: "MATCHBY(<列1>, ...)",
    desc: "計算列でウィンドウ関数を使う際に、行を一意に識別するキー列を明示するサブ関数。自己参照エラーの回避とパフォーマンス改善が目的。",
    ex: "OFFSET(-1, ORDERBY('日付'[Date]), MATCHBY('日付'[Date]))" },

  // ==================== DAX: ビジュアル計算/計算グループ ====================
  { name: "RUNNINGSUM", lang: "dax", cat: "ウィンドウ",
    syntax: "RUNNINGSUM(<式>, [<ORDERBY>])",
    desc: "ビジュアル計算専用の累計関数。ビジュアル上に表示された集計結果に対して直接累計を計算し、モデルにメジャーを追加せずに使える。",
    ex: "累計売上 = RUNNINGSUM([売上])" },
  { name: "MOVINGAVERAGE", lang: "dax", cat: "ウィンドウ",
    syntax: "MOVINGAVERAGE(<式>, <n>, [<ORDERBY>])",
    desc: "ビジュアル計算専用の移動平均関数。直近n行分の平均をビジュアル上で計算する。他のビジュアルやメジャーからは再利用できない点に注意。",
    ex: "移動平均_3ヶ月 = MOVINGAVERAGE([売上], 3)" },
  { name: "PREVIOUS", lang: "dax", cat: "ウィンドウ",
    syntax: "PREVIOUS(<式>, [<ORDERBY>])",
    desc: "ビジュアル計算専用関数。ビジュアル上で1つ前の行の値を返し、前行比のような計算に使う。",
    ex: "前月比 = [売上] - PREVIOUS([売上])" },
  { name: "SELECTEDMEASURE", lang: "dax", cat: "ウィンドウ",
    syntax: "SELECTEDMEASURE()",
    desc: "計算グループのアイテム内で、ユーザーが選択したメジャーに差し替えて評価するための関数。1つの計算グループアイテムを全メジャーに一括適用できる。",
    ex: "YTD = TOTALYTD(SELECTEDMEASURE(), '日付'[Date])" },

  // ==================== DAX: 情報(INFO) ====================
  { name: "INFO.VIEW.TABLES", lang: "dax", cat: "情報",
    syntax: "INFO.VIEW.TABLES()",
    desc: "モデル内のテーブル一覧をテーブルとして返すINFO関数。名前ベースで扱いやすく、DAXクエリだけでなく計算テーブル等にも埋め込める。日付テーブルの特定などに使う。",
    ex: "EVALUATE FILTER(INFO.VIEW.TABLES(), [Data Category] = \"Time\")" },
  { name: "INFO.VIEW.MEASURES", lang: "dax", cat: "情報",
    syntax: "INFO.VIEW.MEASURES()",
    desc: "モデル内の全メジャーの名前・DAX式などをテーブルとして返すINFO関数。メジャー一覧のドキュメント化に使う。",
    ex: "EVALUATE INFO.VIEW.MEASURES()" },
  { name: "INFO.VIEW.COLUMNS", lang: "dax", cat: "情報",
    syntax: "INFO.VIEW.COLUMNS()",
    desc: "モデル内の全列のメタデータ(所属テーブル・データ型など)をテーブルとして返すINFO関数。",
    ex: "EVALUATE INFO.VIEW.COLUMNS()" },
  { name: "INFO.VIEW.RELATIONSHIPS", lang: "dax", cat: "情報",
    syntax: "INFO.VIEW.RELATIONSHIPS()",
    desc: "モデル内のリレーション一覧(テーブル間の結合キーや方向)をテーブルとして返すINFO関数。モデルの棚卸しに使う。",
    ex: "EVALUATE INFO.VIEW.RELATIONSHIPS()" },
  { name: "INFO.CALCDEPENDENCY", lang: "dax", cat: "情報",
    syntax: "INFO.CALCDEPENDENCY()",
    desc: "メジャーや計算列が互いにどう依存しているかを返すINFO関数。DAXクエリでのみ使用可能で、複雑なメジャーの影響範囲調査に使う。",
    ex: "EVALUATE INFO.CALCDEPENDENCY()" },

  // ==================== DAX: 構文・その他 ====================
  { name: "VAR / RETURN", lang: "dax", cat: "構文",
    syntax: "VAR <名前> = <式> RETURN <式>",
    desc: "式の途中結果を変数として1回だけ評価して名前を付ける構文。同じ計算を使い回して可読性と性能を上げ、RETURN部分を差し替えるだけでデバッグもしやすくなる。",
    ex: "VAR 今月 = [出荷数量] VAR 前月 = CALCULATE([出荷数量], PREVIOUSMONTH('日付'[Date])) RETURN 今月 - 前月" },
  { name: "EVALUATEANDLOG", lang: "dax", cat: "構文",
    syntax: "EVALUATEANDLOG(<式>, [<ラベル>])",
    desc: "式の値をそのまま返しつつ、評価過程をDAX Evaluation Logへ出力するデバッグ専用関数。Power BI Desktopでのみ完全に動作する。",
    ex: "テスト = EVALUATEANDLOG(SUMX(売上, 売上[数量] * 売上[単価]))" },
  { name: "NAMEOF", lang: "dax", cat: "構文",
    syntax: "NAMEOF(<オブジェクト参照>)",
    desc: "テーブル・列・メジャーの完全修飾名を文字列として返す。フィールドパラメーターの定義テーブルを組み立てる際に使う。",
    ex: "NAMEOF('メジャー'[売上合計])" },

  // ==================== M: 構文 ====================
  { name: "let ... in", lang: "m", cat: "構文",
    syntax: "let\n  ステップ名 = 式,\n  ...\nin\n  最終ステップ名",
    desc: "Mクエリの基本構造。letで複数のステップ(変数)を順に定義し、inで返す値を指定する。各ステップは遅延評価され、使われないステップは評価されない。",
    ex: "let\n  ソース = Csv.Document(File.Contents(\"C:\\出荷.csv\")),\n  昇格 = Table.PromoteHeaders(ソース)\nin\n  昇格" },
  { name: "each", lang: "m", cat: "構文",
    syntax: "each <式>",
    desc: "唯一の引数を暗黙のパラメーター_として受け取る関数を作る糖衣構文。(_) => <式> と同じ意味で、Table.SelectRowsなどによく渡す。",
    ex: "Table.SelectRows(ソース, each [数量] > 0)" },
  { name: "try ... otherwise", lang: "m", cat: "エラー処理",
    syntax: "try <式> otherwise <代替式>",
    desc: "式の評価でエラーが発生した場合に代替式の結果を返す。try単体ならエラーレコード([HasError],[Error])を取得でき、列単位のエラー検出に使える。",
    ex: "try Number.From([数量テキスト]) otherwise null" },
  { name: "if ... then ... else", lang: "m", cat: "構文",
    syntax: "if <条件> then <真の場合> else <偽の場合>",
    desc: "Mにおける条件分岐は文ではなく式であり、必ず値を返す。elseの省略はできない。",
    ex: "if [数量] > 0 then \"有効\" else \"除外\"" },
  { name: "#table", lang: "m", cat: "構文",
    syntax: "#table({\"列1\", \"列2\"}, {{値1, 値2}, ...})",
    desc: "列名のリストと行データのリストから直接テーブルを組み立てる構文。テスト用データやList.Generateの出力整形に使う。",
    ex: "#table({\"商品ID\", \"数量\"}, {{\"A001\", 10}, {\"A002\", 5}})" },
  { name: "(x) => ...", lang: "m", cat: "構文",
    syntax: "(<パラメーター> as <型>) as <戻り型> => <式>",
    desc: "無名関数(ラムダ式)を定義する構文。関数もただの値として変数に代入したりTable.AddColumnに渡したりできる。",
    ex: "税込価格 = (x as number) as number => x * 1.1" },

  // ==================== M: テーブル ====================
  { name: "Table.SelectRows", lang: "m", cat: "テーブル",
    syntax: "Table.SelectRows(<テーブル>, <条件関数>)",
    desc: "条件関数(通常はeach)がtrueを返す行だけを残す。テスト出荷やキャンセル行の除外などUIの「行のフィルター」に対応する。",
    ex: "Table.SelectRows(ソース, each [誤出荷フラグ] <> 1)" },
  { name: "Table.RemoveColumns", lang: "m", cat: "テーブル",
    syntax: "Table.RemoveColumns(<テーブル>, <列名またはリスト>)",
    desc: "指定した列を削除する。不要な列は早い段階で削るとクエリの処理量が減りパフォーマンスが向上する。",
    ex: "Table.RemoveColumns(ソース, {\"備考\", \"内部メモ\"})" },
  { name: "Table.SelectColumns", lang: "m", cat: "テーブル",
    syntax: "Table.SelectColumns(<テーブル>, <残す列名のリスト>)",
    desc: "指定した列だけを残す。RemoveColumnsの逆で、最終的に必要な列が少ない場合はこちらの方が意図が明確。",
    ex: "Table.SelectColumns(ソース, {\"商品ID\", \"数量\", \"実出荷日\"})" },
  { name: "Table.Sort", lang: "m", cat: "テーブル",
    syntax: "Table.Sort(<テーブル>, {{<列名>, Order.Ascending}})",
    desc: "指定した列でテーブルを並べ替える。複数列を指定すれば第2、第3ソートキーとして機能する。",
    ex: "Table.Sort(ソース, {{\"実出荷日\", Order.Descending}})" },
  { name: "Table.Distinct", lang: "m", cat: "テーブル",
    syntax: "Table.Distinct(<テーブル>, [<列>])",
    desc: "重複行を取り除く。列を指定するとその列だけで重複判定を行う。",
    ex: "Table.Distinct(ソース, {\"商品ID\"})" },
  { name: "Table.FirstN", lang: "m", cat: "テーブル",
    syntax: "Table.FirstN(<テーブル>, <件数>)",
    desc: "先頭から指定件数の行だけを取得する。Table.Groupの「すべての行」からトップNを抽出する際にも使う。",
    ex: "Table.FirstN(ソート済み, 10)" },
  { name: "Table.Group", lang: "m", cat: "テーブル",
    syntax: "Table.Group(<テーブル>, <グループ化列>, <集計定義のリスト>)",
    desc: "指定した列でグループ化し、各グループに対する集計や「すべての行(部分テーブル)」を新しい列として追加する。便別集計など集約処理の中核。",
    ex: "Table.Group(ソース, {\"便ID\"}, {{\"個口数合計\", each List.Sum([個口数]), type number}})" },
  { name: "Table.NestedJoin", lang: "m", cat: "テーブル",
    syntax: "Table.NestedJoin(<テーブル1>, <キー1>, <テーブル2>, <キー2>, <新列名>, <JoinKind>)",
    desc: "2つのテーブルをキーで結合し、一致した相手側の行をネストしたテーブルとして新しい列に格納する。JoinKind.LeftAntiでマスタ未登録行の検出に使える。",
    ex: "Table.NestedJoin(出荷, {\"商品ID\"}, 商品マスタ, {\"商品ID\"}, \"商品情報\", JoinKind.LeftAnti)" },
  { name: "Table.Pivot", lang: "m", cat: "テーブル",
    syntax: "Table.Pivot(<テーブル>, <ピボットする値のリスト>, <属性列>, <値列>, [<集計関数>])",
    desc: "縦持ちのデータを横持ちに変換する。属性列の値がそれぞれ新しい列名になる。",
    ex: "Table.Pivot(縦持ち, List.Distinct(縦持ち[年月]), \"年月\", \"数量\")" },
  { name: "Table.Unpivot", lang: "m", cat: "テーブル",
    syntax: "Table.Unpivot(<テーブル>, <対象列のリスト>, <属性列名>, <値列名>)",
    desc: "指定した列を縦持ちに変換する。「月が列に並んだExcel」を正規化する定番操作。",
    ex: "Table.Unpivot(横持ち, {\"1月\", \"2月\", \"3月\"}, \"月\", \"数量\")" },
  { name: "Table.UnpivotOtherColumns", lang: "m", cat: "テーブル",
    syntax: "Table.UnpivotOtherColumns(<テーブル>, <固定する列のリスト>, <属性列名>, <値列名>)",
    desc: "指定した列以外のすべての列を縦持ちに変換する。列数が変動するデータでも安全にアンピボットできる。",

  { name: "Table.AddColumn", lang: "m", cat: "テーブル",
    syntax: "Table.AddColumn(<テーブル>, <新列名>, <各行に対する関数>, [<型>])",
    desc: "各行に対して関数を評価した結果を新しい列として追加する。カスタム列の作成やカスタム関数の適用に使う。",
    ex: "Table.AddColumn(ソース, \"リードタイム\", each Duration.Days([実納品日] - [受注日]), Int64.Type)" },
  { name: "Table.Buffer", lang: "m", cat: "テーブル",
    syntax: "Table.Buffer(<テーブル>)",
    desc: "テーブルをメモリ上に読み込んで固定する。同じデータへの複数回参照を避けられる一方、クエリフォールディングが切れ性能が落ちる副作用もあるため使い所を見極める。",
    ex: "buffered = Table.Buffer(ソース)" },
  { name: "Table.PromoteHeaders", lang: "m", cat: "テーブル",
    syntax: "Table.PromoteHeaders(<テーブル>, [<オプション>])",
    desc: "テーブルの1行目を列見出しに昇格させる。CSV取込の定番3点セット(取込→ヘッダー昇格→型変更)の2番目。",
    ex: "Table.PromoteHeaders(ソース, [PromoteAllScalars = true])" },
  { name: "Table.TransformColumnTypes", lang: "m", cat: "テーブル",
    syntax: "Table.TransformColumnTypes(<テーブル>, {{<列名>, <型>}, ...}, [<ロケール>])",
    desc: "指定した列のデータ型を一括で変更する。ロケール引数で日付や数値の解釈方法(1/2/2026問題など)を制御できる。",

  { name: "Table.CombineColumns", lang: "m", cat: "テーブル",
    syntax: "Table.CombineColumns(<テーブル>, <結合する列のリスト>, <結合関数>, <新列名>)",
    desc: "複数の列を1つの列に結合する。姓と名を氏名列にまとめる、といった用途に使う。",
    ex: "Table.CombineColumns(ソース, {\"姓\", \"名\"}, Combiner.CombineTextByDelimiter(\" \"), \"氏名\")" },

  // ==================== M: 接続・変換 ====================
  { name: "Csv.Document", lang: "m", cat: "変換",
    syntax: "Csv.Document(<バイナリ>, [<列区切り>, <エンコード>, ...])",
    desc: "CSVファイルの内容をテーブルとして解釈する。CSV取込の定番3点セットの1番目。",
    ex: "Csv.Document(File.Contents(\"出荷.csv\"), [Delimiter=\",\", Encoding=932])" },
  { name: "Excel.Workbook", lang: "m", cat: "変換",
    syntax: "Excel.Workbook(<バイナリ>, [<ヘッダーあり>])",
    desc: "Excelブックの内容をシート・テーブル・名前付き範囲の一覧として返す。ナビゲーションで目的のシートを選ぶ前段階として使う。",
    ex: "Excel.Workbook(File.Contents(\"配車実績.xlsx\"), true)" },
  { name: "Web.Contents", lang: "m", cat: "変換",
    syntax: "Web.Contents(<URL>, [<オプション>])",
    desc: "Web APIやWebページからバイナリデータを取得する。資格情報とプライバシーレベルの設定が必要になることが多い。",
    ex: "Web.Contents(\"https://api.example.com/orders\")" },
  { name: "Sql.Database", lang: "m", cat: "変換",
    syntax: "Sql.Database(<サーバー>, <データベース>, [<オプション>])",
    desc: "SQL Serverデータベースに接続する。可能な操作(フィルター等)はサーバー側にクエリフォールディングされ、大規模データでも高速に処理できる。",
    ex: "Sql.Database(\"dbserver01\", \"物流DWH\")" },
  { name: "Folder.Files", lang: "m", cat: "変換",
    syntax: "Folder.Files(<フォルダーパス>)",
    desc: "指定フォルダー内の全ファイルの一覧(バイナリ含む)をテーブルとして返す。拠点別CSVの一括取込のような「フォルダー結合」の起点になる。",
    ex: "Folder.Files(\"C:\\出荷データ\\拠点別\")" },

  // ==================== M: テキスト ====================
  { name: "Text.Trim", lang: "m", cat: "テキスト",
    syntax: "Text.Trim(<テキスト>, [<除去文字>])",
    desc: "文字列の先頭・末尾の空白(または指定した文字)を取り除く。",
    ex: "Text.Trim(\"  A001  \")" },
  { name: "Text.Clean", lang: "m", cat: "テキスト",
    syntax: "Text.Clean(<テキスト>)",
    desc: "改行やタブなどの制御文字(表示されない文字)を取り除く。他システムから出力されたデータの前処理に使う。",
    ex: "Text.Clean([商品名])" },
  { name: "Text.Upper", lang: "m", cat: "テキスト",
    syntax: "Text.Upper(<テキスト>)",
    desc: "アルファベットをすべて大文字に変換する。SKUコードの表記ゆれ統一によく使う。",
    ex: "Text.Upper(\"a001\")" },
  { name: "Text.Lower", lang: "m", cat: "テキスト",
    syntax: "Text.Lower(<テキスト>)",
    desc: "アルファベットをすべて小文字に変換する。",
    ex: "Text.Lower([メールアドレス])" },
  { name: "Text.Proper", lang: "m", cat: "テキスト",
    syntax: "Text.Proper(<テキスト>)",
    desc: "各単語の先頭だけを大文字にする(先頭大文字化)。",
    ex: "Text.Proper(\"tokyo warehouse\")" },
  { name: "Text.PadStart", lang: "m", cat: "テキスト",
    syntax: "Text.PadStart(<テキスト>, <長さ>, <埋め文字>)",
    desc: "文字列が指定の長さになるまで先頭に文字を埋める。Excelでゼロ落ちした\"00123\"→\"123\"のようなSKUコードを8桁に復元する定番。",

  { name: "Text.Split", lang: "m", cat: "テキスト",
    syntax: "Text.Split(<テキスト>, <区切り記号>)",
    desc: "区切り記号で文字列を分割し、リストとして返す。列の分割機能の裏側で使われている。",

  { name: "Text.Combine", lang: "m", cat: "テキスト",
    syntax: "Text.Combine(<テキストのリスト>, [<区切り記号>])",
    desc: "テキストのリストを区切り記号でつなげて1つの文字列にする。姓と名の結合などに使う。",
    ex: "Text.Combine({[姓], [名]}, \" \")" },
  { name: "Text.Replace", lang: "m", cat: "テキスト",
    syntax: "Text.Replace(<テキスト>, <検索文字列>, <置換文字列>)",
    desc: "文字列内の指定した部分をすべて置換する。",
    ex: "Text.Replace([数量テキスト], \"個\", \"\")" },
  { name: "Text.Contains", lang: "m", cat: "テキスト",
    syntax: "Text.Contains(<テキスト>, <検索文字列>)",
    desc: "文字列に指定した部分文字列が含まれるかを判定する。テスト出荷行の除外条件などに使う。",
    ex: "Text.Contains([備考], \"テスト\")" },
  { name: "Text.StartsWith", lang: "m", cat: "テキスト",
    syntax: "Text.StartsWith(<テキスト>, <検索文字列>)",
    desc: "文字列が指定した部分文字列で始まるかを判定する。",
    ex: "Text.StartsWith([商品ID], \"TEST\")" },
  { name: "Text.Select", lang: "m", cat: "テキスト",
    syntax: "Text.Select(<テキスト>, <許可する文字のリストまたは範囲>)",
    desc: "文字列から指定した文字だけを残す。単位付き数値(\"1,200個\")から数字だけを抜き出す定番手段。",

  { name: "Text.From", lang: "m", cat: "テキスト",
    syntax: "Text.From(<値>, [<カルチャ>])",
    desc: "数値・日付などの値を文字列に変換する。Text.PadStartなどテキスト関数に渡す前の型合わせによく使う。",
    ex: "Text.From([商品ID])" },

  // ==================== M: 数値 ====================
  { name: "Number.From", lang: "m", cat: "数値",
    syntax: "Number.From(<値>, [<カルチャ>])",

  { name: "Number.Round", lang: "m", cat: "数値",

  { name: "Number.RoundUp", lang: "m", cat: "数値",

  { name: "Number.Mod", lang: "m", cat: "数値",
    syntax: "Number.Mod(<数値>, <除数>)",

  { name: "Date.From", lang: "m", cat: "日付",

  { name: "Date.Year", lang: "m", cat: "日付",

  { name: "Date.Month", lang: "m", cat: "日付",

  { name: "List.Transform", lang: "m", cat: "リスト",

  { name: "List.Count", lang: "m", cat: "リスト",

  { name: "List.Max", lang: "m", cat: "リスト",
    syntax: "List.Max(<リスト>)",

  { name: "List.Sort", lang: "m", cat: "リスト",

    desc: "リストの要素を並べ替える。",

  { name: "List.Generate", lang: "m", cat: "リスト",
    syntax: "List.Generate(<初期値関数>, <条件関数>, <次の値関数>, [<選択関数>])",
    desc: "初期値から条件を満たす間、値を1つずつ生成し続けるループ的な処理を書ける。連番展開や日付リストの生成に使う。",

  { name: "List.Accumulate", lang: "m", cat: "リスト",

  { name: "Value.NativeQuery", lang: "m", cat: "変換",

  { name: "error", lang: "m", cat: "エラー処理",

);

<p>営業部長から「OTDが悪い顧客を10社ピックアップして」と頼まれました。[OTD]メジャーはあくまで<b>現在のフィルターコンテキストに対する1つの値</b>を返すだけなので、「顧客ごとに」計算するには、顧客を1件ずつ巡回しながら[OTD]を評価し直す仕組みが必要です。ここでAVERAGEXのようなイテレーター関数の中でメジャーを参照したときに起きる、DAXでも特に重要な挙動を理解します。</p>
<p><code>AVERAGEX(VALUES(D_顧客[顧客名]), [OTD])</code>と書くと、VALUES(D_顧客[顧客名])が返す「顧客名の一意なリスト」を1行ずつ巡回します。そして、各行で<code>[OTD]</code>というメジャー参照が評価される瞬間、DAXは自動的に<b>暗黙のCALCULATE</b>を発動させます。つまり、今処理している行の顧客名を条件としたフィルターが一時的にかけられた状態で[OTD]が再計算されるのです。これを<b>コンテキスト遷移</b>と呼びます。行コンテキスト(今どの顧客の行を処理しているか)が、フィルターコンテキスト(その顧客だけに絞り込む)に変換されるイメージです。</p>

<p>ランキングができるようになると、次に求められるのが「上位10社だけを抜き出したランキング表」です。経営会議の資料では、取引先350社を全部並べるのではなく「上位10顧客の売上と、それ以外をまとめた『その他』」という2段構成の円グラフがよく使われます。ここで使うのが<b>TOPN</b>です。</p>
<p>TOPNは<code>TOPN(&lt;n_value&gt;, &lt;table&gt;, &lt;orderBy_expression&gt;, [order])</code>という形で、第2引数のテーブルを第3引数の式で並べ替え、上位n_value件相当の行だけを残した<b>テーブル</b>を返します。RANKXと同じくorder引数を省略した既定は降順(値が大きい順)なので、<code>TOPN(10, ALL(D_顧客[顧客名]), [売上金額])</code>と書くだけで「売上金額が大きい上位10顧客」の行が求まります。ただしTOPN自体はテーブルを返すだけの関数なので、カードビジュアルのような1つの数値として表示するには、CALCULATEでラップして「その10顧客に絞り込んだ状態で売上金額を集計する」という手順が必要です。</p>
<pre>上位10顧客売上 = CALCULATE([売上金額], TOPN(10, ALL(D_顧客[顧客名]), [売上金額]))</pre>
<p>「その他」は難しく考える必要はなく、<b>全体から上位10顧客分を引くだけ</b>です。全体を求めるときも、顧客名に対するフィルターだけをALLで解除する点がポイントです。業態や地域など他のスライサーがかかっている場合、その条件は残したまま顧客名の絞り込みだけを外したいからです。</p>
<pre>全体売上 = CALCULATE([売上金額], ALL(D_顧客[顧客名]))
その他顧客売上 = [全体売上] - [上位10顧客売上]</pre>

      doc: `
<p>ABC分析のミーティングで、倉庫の棚割り担当者から「動きの良い商品から順に並べて、上位から数えて売上の80%を占めるところまでをA区分にしたい」と依頼されました。RANKXで順位はわかりましたが、「上位から数えて何パーセントに達しているか」という<b>累積構成比</b>は、順位とはまた別の計算が必要です。ここで組み立てるのが、パレート図の土台になる累積構成比メジャーです。</p>
<p>考え方はシンプルです。ある顧客の累積構成比は「自分と同じか、自分より売上の大きいすべての顧客の売上合計」÷「全顧客の売上合計」で求まります。売上の大きい顧客から数えていって、自分にたどり着くまでの積み上げがどこまで来ているか、という割合です。ポイントは、まず自分自身の売上を<b>先にVARで固定</b>しておくことです。次の計算でフィルターコンテキストが変わってしまうため、先に確保しておかないと比較対象そのものがずれてしまいます(Unit06で学んだ「VARは定義時点で一度だけ評価される」という性質そのものです)。</p>
<pre>顧客別売上累積構成比 =

<p>複数の条件を順番に判定して結果を出し分けるには<code>SWITCH(TRUE(), 条件1, 結果1, 条件2, 結果2, ..., 既定値)</code>というイディオムを使います。SWITCHは本来1つの式の値を候補と一致させる関数ですが、第1引数に<code>TRUE()</code>を渡し、以降の各引数に比較式(真偽値)を並べることで、「上から順に条件を評価し、最初にTRUEになったものを採用する」というIF文の連鎖のように使えます。ここで絶対に外せないのが<b>条件を書く順番</b>です。緩い条件を先に書いてしまうと、本来もっと厳しい条件に当てはまるはずの行まで先に拾われてしまいます。</p>

<p>行を絞り込む基本は<b>Table.SelectRows(テーブル, 条件関数)</b>です。第2引数には通常<code>each</code>で始まる条件式を渡し、trueを返す行だけが残ります。列については、いらない列を消す<b>Table.RemoveColumns</b>と、必要な列だけを残す<b>Table.SelectColumns</b>という正反対の関数が用意されており、最終的に残したい列が少ない場合はSelectColumnsのほうが意図がはっきりします。並べ替えは<b>Table.Sort</b>で、<code>Order.Ascending</code>/<code>Order.Descending</code>という列挙値を組み合わせます。重複行を取り除く<b>Table.Distinct</b>、先頭からN行だけを取る<b>Table.FirstN</b>も、UIの「行の保持」グループにあるボタンにそのまま対応しています。</p>

Table.RemoveColumns(売上, {"売上ID"})
Table.SelectColumns(売上, {"売上ID", "顧客ID", "金額"})
Table.Sort(売上, {{"金額", Order.Descending}})
Table.Distinct(顧客, {"顧客ID"})
Table.FirstN(売上, 10)</pre>

      title: "List.Generate と List.Accumulate",
      doc: `
<p>「請求日から支払期限まで、平日だけを1日ずつ数えて期限日を求めたい」「1月から今月まで、月初日を連番で並べたリストを先に作ってから日付テーブルの土台にしたい」——こうした「決まった手続きを条件を満たすまで繰り返す」処理は、表計算のドラッグ操作では対応しにくく、M言語の<b>List.Generate</b>や<b>List.Accumulate</b>というループ的な関数の出番になります。</p>
<p><b>List.Generate(初期値の関数, 継続条件の関数, 次の値を作る関数, 任意で取り出す値の関数)</b>は、他言語の<code>while</code>ループに近い動きをします。第1引数で最初の値を作り、第2引数がtrueを返す間だけ、第3引数で次の値を作り続けます。第4引数を省略すると生成された値そのものがリストの要素になります。</p>
<pre>// 1から10までの連番リストを生成
List.Generate(() => 1, each _ &lt;= 10, each _ + 1)
// {1, 2, 3, ..., 10}

// 2026年1月1日から6か月分の月初日リストを生成
List.Generate(
    () => #date(2026, 1, 1),
    each _ &lt;= #date(2026, 6, 1),
    each Date.AddMonths(_, 1)
)</pre>
<p>一方の<b>List.Accumulate(リスト, 初期値, アキュムレーター関数)</b>は「畳み込み(fold)」と呼ばれる処理で、リストの要素を先頭から順に処理しながら、それまでの<b>累積結果</b>を次の処理に引き継いでいきます。第3引数の関数は<code>(state, current) =&gt; 次のstate</code>という形で、stateには「これまでの計算結果」、currentには「今見ている要素」が渡されます。合計値を求めるだけならList.Sumで足りますが、「1つ前までの合計を保持しながら、それぞれの行に累積値を持たせたい」といった、単純な集計関数では表現しにくい処理に向いています。</p>
<pre>// {10, 20, 30} の合計をList.Accumulateで求める(List.Sumと同じ結果になる例)
List.Accumulate({10, 20, 30}, 0, (state, current) => state + current)
// 60

// カンマ区切りのテキストに結合する
List.Accumulate({"A", "B", "C"}, "", (state, current) =>
    if state = "" then current else state & "," & current)
// "A,B,C"</pre>
<p>List.GenerateとList.Accumulateは役割が異なります。<b>List.Generate</b>は「条件を満たすまで新しい値を生み出し、リストそのものを作る」ためのもの(連番や日付リストの展開)、<b>List.Accumulate</b>は「既にあるリストを順番に読みながら、1つの累積結果に畳み込む」ためのもの(合計・連結・段階的な変換)です。どちらも書式に慣れるまでは読みにくく感じますが、繰り返し処理をUIのボタン操作だけでは表現できない場面での強力な武器になります。</p>

<p>売上テーブルが何年分も積み上がって数千万行になると、毎回全件を洗い替えする更新は時間がかかりすぎて現実的ではなくなります。過去の確定した期間はそのまま保持し、直近の変更が起きやすい期間だけを再取得したい——この要望に応えるのが<b>増分更新(Incremental Refresh)</b>です。増分更新を設定するには、まず<b>RangeStart</b>と<b>RangeEnd</b>という名前の2つのパラメータを用意し、フィルターのステップでこの2つを使って対象期間を絞り込みます。</p>

<p>同じPower Queryのロジックでも、ステップの組み方1つで更新時間が大きく変わることがあります。データ量が数百行の演習環境ではほとんど気にならない差でも、実務で数百万行のテーブルを毎晩更新するとなると、その差が数分・数十分の違いになって現れます。ここでは、大規模データでも実用的な速度を保つための代表的な戦略を整理します。</p>
<p>最も基本的で効果が大きいのが<b>早期の列削減</b>です。使わない列は、できるだけ最初のステップに近いところでTable.SelectColumnsによって落としてしまいます。フォールディングが効くデータソースであれば、ソース側のSELECT文自体が必要な列だけを取得するように変換されるため、以降のすべてのステップが扱うデータ量そのものが減り、転送量・メモリ使用量の両方が軽くなります。</p>
<pre>// 使わない列は早い段階で落とす。フォールディングが効けば
// ソース側のSELECT文自体が必要な列だけを取得するようになる
Table.SelectColumns(Source, {"商品ID", "数量", "金額"})

商品_buffer = Table.Buffer(商品)</pre>
<p><b>Table.Buffer</b>は、その時点のテーブルを強制的にメモリ上に固定する関数です。同じテーブルを複数の場所から繰り返し参照するときに、参照のたびに元のステップが再評価されるのを防げる場合があり、うまく使えば体感速度が改善します。ただしTable.Bufferを使った時点でそれ以降のステップはソース側へのフォールディングが効かなくなり、テーブルが大きい場合はメモリを大量に消費してかえって遅くなることもあります。小さなマスタテーブルには効果的でも、巨大なファクトテーブルに安易に使うのは危険な、まさに諸刃の剣です。</p>

)

)</pre>

<p>まず頼りになるのが<b>DAX Formatter</b>です。これは数式のインデントや改行を自動で整えてくれる整形ツールで、計算のロジックや結果には一切手を加えません。Tabular Editorやdax.doのようなWebツール、最近ではPower BI Desktop自体の数式バーにも整形機能が組み込まれており、ワンクリックで「読める形」に変換できます。整形だけでなく、命名の慣例にも意味があります。メジャーを参照するときは表名を付けずに<code>[メジャー名]</code>、列を参照するときは表名を付けて<code>表名[列名]</code>と書き分けるのが基本の慣例で、日付テーブルだけは<code>'日付'[Date]</code>のようにシングルクォートで囲みます。この書き分けがあるだけで、式を一目見て「これは動的に変わる値(メジャー)か、固定の生データ(列)か」を判断できるようになります。</p>

<p>前任者から引き継いだPower BIファイルには、60個近いクエリが並んでいました。名前は「クエリ1」「クエリ2」のまま、各クエリの中のステップ名も「変更された型1」「フィルターされた行2」ばかりで、どのクエリが最終的にモデルへ読み込まれ、どれが単なる作業途中の産物なのか、開いてみないと分かりません。Power Queryは「動くコード」を書く場所であると同時に、後から見返す・引き継ぐことを前提に整理しておくべき場所でもあります。</p>
<p>最初に効果が大きいのが<b>ステップ名の変更</b>です。各ステップは右クリックから「名前の変更」を選ぶか、詳細エディターで直接変数名を書き換えられます。デフォルトの「変更された型1」を「日付列を日付型に変換」のような具体的な名前にするだけで、Applied Stepsペインを見るだけで処理の流れが追えるようになります。次に区別しておきたいのが<b>参照(Reference)</b>と<b>複製(Duplicate)</b>の違いです。参照で新しいクエリを作ると、そのクエリのソースは元クエリの出力そのものになり、元クエリのステップを直せば参照先にも自動的に反映される依存関係が生まれます。一方、複製は元クエリの全ステップをそのままコピーした独立クエリで、以後は互いに影響し合いません。「共通の下処理を1か所にまとめ、そこから複数の出力を作りたい」ときは参照、「似ているが今後別々に育てたい」ときは複製が向いています。</p>

  function unitAll3(s) {

  /* ================= ユニットデータ(no順ソート+トラック分類) ================= */

  /* ================= 状態 ================= */

    s.lastStudyDate = sanitizeDate(s.lastStudyDate);

  // 旧index基準キー("0:2"等)→ unit.id基準("unit01:2")へ移行
  function migrateStarKeys(s) {
    Object.keys(s.stars).forEach(function (k) {
      var m = /^(\d+):(\d+)$/.exec(k);
      if (!m) return;
      var u = UNITS[+m[1]];
      if (u && u.id) {

  function assign(base, over) {

  /* ---- デイリー(クエスト・配送便・カウンター) ---- */
  function ensureDaily() {
    var t = dstr();
    if (!state.daily || state.daily.date !== t) {
      state.daily = {
        date: t,
        quests: pickQuests(t),
        claimed: {},
        allBonus: false,
        deliveryDone: false,

      };
    }
    // 欠けたカウンターキーを0で補完(NaN進行を防ぐ)

    Object.keys(cdef).forEach(function (k) {

  function pickQuests(t) {

      return q.id !== "review1" || reviewCount() > 0;

    var out = [];
    for (var i = 0; i < 3 && ids.length; i++) {

  /* ---- XP・ストリーク・帯 ---- */

  }
  function touchStreak(t) {
    var note = null;

    } else if (!state.lastStudyDate) {

  /* ---- 弱点キュー + SRS ---- */

  function srsPass(qid) {

  function dueQids() {

  }
  // 復習対象の総数(期日到来 + srs未登録の旧weak)
  function reviewCount() {

  function resolveQid(qid) {
    var p = String(qid).split(":");

  /* ---- 解放ロジック(v5: トラック独立) ---- */
  function starOf(u, l) { return state.stars[UNITS[u].id + ":" + l] || 0; }

    var unit = UNITS[u];
