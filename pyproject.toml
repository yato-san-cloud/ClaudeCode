[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toki"
version = "0.1.0"
description = "A tiny, offline heuristic LLM token estimator for text and files."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "tokens", "tokenizer", "estimate", "cli"]

[project.scripts]
toki = "toki.cli:main"

[tool.setuptools]
packages = ["toki"]
