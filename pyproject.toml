[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whsim"
version = "0.1.0"
description = "営業がゆるく組めて、裏で重厚なシミュレーションが走る倉庫シミュレータ (warehouse simulator)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "simpy>=4.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "typer>=0.9",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "duckdb>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1", "httpx>=0.24", "pytest-cov>=4.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
docs = ["ezdxf>=1.1", "python-pptx>=0.6", "reportlab>=4.0"]

[project.scripts]
whsim = "whsim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whsim = ["../../templates/**/*.json", "web/static/**/*", "data/**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: coverage flags are intentionally NOT in addopts so a plain `pytest`
# still works when pytest-cov is not installed. To measure coverage, run:
#   pytest --cov=whsim --cov-report=term-missing
# The [tool.coverage.*] config below applies whenever --cov is used.

[tool.coverage.run]
source = ["whsim"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
