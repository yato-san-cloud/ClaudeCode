name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [claude/power-bi-m-dax-app-65v1va]
    paths: ["powerbi-dojo/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build app (single HTML + PWA)
        run: node powerbi-dojo/build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: powerbi-dojo/pwa
      - id: deployment
        uses: actions/deploy-pages@v4
