# Name: Claude Code依頼文テンプレート
# Copilot Studio ではコード実行ができないため、出口を「実装依頼文の受け渡し」に固定する。
# 依頼文の項目が欠けたまま渡されるのを防ぐため、雛形の提示は決定的レイヤー（トピック）で行う。
kind: AdaptiveDialog
modelDescription: 判定した問題タイプをClaude Codeで実装するための依頼文テンプレートを提示する。ユーザーが依頼文、プロンプト、実装をAIに投げたい、と述べた時に使う。
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Claude Code依頼文テンプレート
    triggerQueries:
      - 依頼文テンプレートをください
      - Claude Codeへの依頼文を作って
      - 実装をAIに投げたい
      - プロンプトの雛形がほしい
      - このまま実装に進みたい

  actions:
    - kind: SendActivity
      id: sendMessage_hd9b01
      activity: |-
        このエージェントはコードを実行できないため、実装はClaude Code側で行います。以下の雛形をコピーして、Claude Codeに貼ってください。
        <br /><br />
        未確定の項目は空欄にせず「（要確認）」のまま残すのが要点です。Claude Code側でそこから確認が始まります。

    - kind: SendActivity
      id: sendMessage_hd9b02
      activity: |-
        --- ここから ---
        <br />
        warehouse-planner スキルを使ってください。
        <br /><br />
        ■ 問題タイプ: （Excel領域 / 数理最適化領域 / シミュレーション領域 / シミュレーション最適化領域 のどれか）
        <br />
        ■ 目的: （何を決めたいのか、何を評価したいのか。1〜2文）
        <br />
        ■ 対象: （拠点・設備・工程。例: 〇〇センターのオムニソーター、DDC便のダイヤ）
        <br />
        ■ 規模感: （拠点数 / SKU数 / 行数 / 便数 / 人数 / 対象時間帯）
        <br />
        ■ 入力データ: （項目名と粒度。例: 出荷明細（伝票番号・SKU・数量・締め時刻）、日別×時間帯別の入荷量）
        <br />
        ■ 制約: （時間枠、能力上限、人員、レイアウト、車両など。守れないと成立しない条件）
        <br />
        ■ 評価指標: （処理能力、待ち時間、滞留、稼働率、コストなど。何が良くなれば成功か）
        <br />
        ■ ばらつきの扱い: （無視する / 分布を仮定する / 実績データから生成する）
        <br />
        ■ 出力形式: （結果テーブルまで / HTML・StreamlitのUIまで）
        <br />
        ■ 推奨ツール: （OR-Tools、PuLP、SimPy、Optuna など）
        <br /><br />
        まず実装方針を提示してください。合意できたらコードを書いてください。
        <br />
        --- ここまで ---

    - kind: SendActivity
      id: sendMessage_hd9b03
      activity: |-
        シミュレーション系（シミュレーション領域・シミュレーション最適化領域）の場合は、依頼文の末尾に次の1行を足すと、意思決定者が触れる形まで一気に組めます。
        <br /><br />
        「3層構造で組んでください。1. Pythonでシミュレーション本体、2. パラメータを振った結果をテーブル化、3. HTML/Streamlitでスライダー操作のUI。重い計算はオフライン、表示はオンラインでお願いします。」
        <br /><br />
        これまでの会話の内容で埋められる項目は私が埋めます。「埋めてください」とお伝えください。
