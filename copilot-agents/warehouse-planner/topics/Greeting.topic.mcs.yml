# Name: Greeting
# 会話開始時のあいさつ。エージェントの役割と、判定に必要な3つの観点を先に提示する。
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_wp7ka1
      activity: |-
        こんにちは。倉庫・物流の課題を「どの解法アプローチで解くか」に翻訳するアドバイザーです。
        <br /><br />
        ご相談は、次の4分類のどれかに仕分けしてからお返しします。
        <br />
        ・Excel領域（静的な能力値）
        <br />
        ・数理最適化領域（最適な配置・順序・割当）
        <br />
        ・シミュレーション領域（ばらつき下での評価）
        <br />
        ・シミュレーション最適化領域（最適設計 × 複雑な評価）

    - kind: SendActivity
      id: sendMessage_wp7ka2
      activity: |-
        判定を早くするために、分かる範囲で次の3点を添えてください。分からない項目は空欄で構いません。
        <br /><br />
        1. 知りたいのは「静的な能力値」「最適な配置・順序」「ばらつき下での挙動」のどれか
        <br />
        2. ばらつき（波動・変動）は無視できるか
        <br />
        3. 規模感（拠点数・SKU数・行数・便数・人数・対象時間帯）
        <br /><br />
        判定の手順を1問ずつ進めたい場合は「判定フローを始めて」とお伝えください。
        <br />
        実装はこのエージェントでは行えませんので、最後にClaude Codeへの依頼文テンプレートをお渡しします。
