# Name: 貼り付けテンプレート案内
# スピーダ検索結果の貼り戻し書式と、長文を分割して貼るときのプロトコル（連番＋終了合図）を
# 決まった文面のまま返す決定的トピック。生成に任せると文面が揺れて分割合図が崩れるため、
# この案内だけはトピック（決定的レイヤー）で固定する。
kind: AdaptiveDialog
modelDescription: エージェントの使い方(3ステップ)と、スピーダの検索結果をチャットに貼り戻すためのテンプレート、長文を分割して貼るときの連番・終了合図のルールを案内する。ユーザーが使い方・貼り付けの書式・分割の仕方を尋ねたときに使う。訪問予定やスピーダ結果そのものが貼り付けられた場合には使わない。
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: 貼り付けテンプレート案内
    triggerQueries:
      - 貼り付けテンプレートを教えて
      - スピーダの結果はどう貼ればいいですか
      - 貼り戻しの書式を見せて
      - 長い検索結果を分割して貼りたい
      - 分割貼り付けのルールを教えて
      - 使い方を教えて

  actions:
    - kind: SendActivity
      id: sendActivity_pt4Xw9
      activity: |-
        このエージェントは「①workIQの訪問予定を貼る → ②スピーダ検索キットを受け取る → ③スピーダで調べた結果を貼り戻して訪問前ブリーフを受け取る」の3ステップでお手伝いします。
        <br /><br />
        スピーダで調べた結果は、次の形でこのチャットに貼り戻してください。
        <br /><br />
        【企業名】／【調べた日】／【メモ: ニュース・決算・業界・M&Aごとに、出典と日付を添えて】
        <br /><br />
        メモが長くなる場合は分割して貼れます。
        <br />
        ・各ブロックの冒頭に「続きあり(1/2)」のように連番を付けてください。
        <br />
        ・最後のブロックの末尾に【以上】と書いてください。
        <br />
        ・【以上】が来るまではブリーフを作らず「続きをどうぞ」とだけお返しします。連番を付けずに途中のブロックを貼ると、そのブロックだけで処理を始めてしまうのでご注意ください。
        <br /><br />
        貼り付ける前に、電話番号・メールアドレスなど業務に不要な個人情報は削っておいてください。
