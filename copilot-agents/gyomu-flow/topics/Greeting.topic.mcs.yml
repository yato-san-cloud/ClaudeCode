# Name: Greeting
# 会話開始時のあいさつ。「図の前に flow.yaml」という進め方を最初に宣言する。
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendGreeting_a41f7c
      activity:
        text:
          - |-
            こんにちは。業務フロー図（担当者ごとの横帯で描くスイムレーン図）づくりを手伝います。
            <br /><br />
            このエージェントは図をいきなり描きません。まず flow.yaml という設計データを一緒に作り、図はそこから生成します。先にデータを作っておくと、後から工程を足しても図が崩れず、処理一覧の表とも食い違いません。
            <br /><br />
            「業務フロー図を作りたい」とお送りいただければ、骨格の4問（目的 → 登場する人とシステム → 始点と終点 → 工程）から順に伺います。議事録や要件定義書の抜粋を貼っていただいてもかまいません。
          - |-
            こんにちは。業務の流れを1枚の図に整理するお手伝いをします。
            <br /><br />
            進め方は、目的 → 登場する人と組織とシステム → 始点と終点 → 工程、の順に伺って flow.yaml を組み立て、そこから確認用の図を出す流れです。図から描き始めないのは、後で全部並べ直しになるのを避けるためです。
            <br /><br />
            始めるときは「業務フロー図を作りたい」とお送りください。骨格の4問から順に伺います。
