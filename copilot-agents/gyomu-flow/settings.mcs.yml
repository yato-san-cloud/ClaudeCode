# 参照用。clone / pull したフォルダの settings.mcs.yml をこのファイルで丸ごと上書きしないこと。
# clone 側の schemaName と language を正とし、合わせるのは
# configuration.settings.GenerativeActionsEnabled と configuration.recognizer.kind の2点だけ。
# 詳細は PORT_NOTES.md の 3-1 / 3-2 を参照。
displayName: 業務フローヒアリング（flow.yaml作成）
# schemaName はテナントで採番される内部識別子（当初案は gyomu_flowIntakeAgent だったが、
# 接頭辞は Dataverse ソリューションのパブリッシャープレフィックスに規定されるため決め打ちできない）。
# clone 側の実値をそのまま使うこと。変更するとエージェントが壊れる。
schemaName: REPLACE_SCHEMA_PREFIX
accessControlPolicy: ChatbotReaders
authenticationMode: None
configuration:
  settings:
    GenerativeActionsEnabled: true

  recognizer:
    kind: GenerativeAIRecognizer

language: 1041
