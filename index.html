<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>現場マニュアル作成ツール</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --sub:#64748b;
    --line:#e2e8f0; --brand:#0f766e; --brand-d:#0d5f57;
    --danger:#dc2626; --accent:#f59e0b; --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6;
    padding-bottom:96px;
  }
  header.app{
    position:sticky; top:0; z-index:20;
    background:var(--brand); color:#fff;
    padding:12px 16px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:10px;
  }
  header.app .logo{font-size:22px}
  header.app h1{font-size:17px; margin:0; font-weight:700; flex:1; letter-spacing:.02em}
  header.app .count{font-size:12px; background:rgba(255,255,255,.2); padding:3px 9px; border-radius:999px; font-weight:600; white-space:nowrap}
  .hback{border:none; background:rgba(255,255,255,.18); color:#fff; font-size:20px; width:36px; height:36px; border-radius:9px; cursor:pointer; flex:none; line-height:1}
  .wrap{max-width:760px; margin:0 auto; padding:16px}

  /* ---- home ---- */
  .home-actions{display:flex; gap:10px; margin-bottom:16px}
  .home-actions button{flex:1; padding:14px; border-radius:12px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; border:none}
  #btn-new{background:var(--brand); color:#fff}
  #btn-new:hover{background:var(--brand-d)}
  #btn-import{background:var(--card); color:var(--brand); border:2px dashed var(--brand)}
  #btn-import:hover{background:#f0fdfa}
  .mcard{display:flex; gap:12px; background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:12px; margin-bottom:12px; cursor:pointer; align-items:center}
  .mcard:hover{outline:2px solid #99f6e4}
  .thumb{width:76px; height:57px; border-radius:8px; overflow:hidden; background:#e2e8f0; flex:none; display:flex; align-items:center; justify-content:center; font-size:26px}
  .thumb img{width:100%; height:100%; object-fit:cover}
  .minfo{flex:1; min-width:0}
  .mtitle{font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .msub{font-size:12px; color:var(--sub)}
  .chip{font-size:11px; padding:2px 9px; border-radius:999px; font-weight:700; display:inline-block; margin-right:4px; margin-top:3px}
  .st-draft{background:#f1f5f9; color:#475569}
  .st-wait{background:#fef3c7; color:#b45309}
  .st-active{background:#dcfce7; color:#166534}
  .st-retired{background:#e2e8f0; color:#334155; text-decoration:line-through}
  .st-over{background:#fee2e2; color:#b91c1c}
  .st-dirty{background:#e0e7ff; color:#3730a3}
  .st-qa{background:#ccfbf1; color:#0f766e}
  .st-qb{background:#dbeafe; color:#1e40af}
  .st-qc{background:#fef3c7; color:#b45309}
  .st-qd{background:#fee2e2; color:#b91c1c}
  .macts{display:flex; flex-direction:column; gap:2px}
  .linkbtn{border:none; background:none; color:var(--sub); text-decoration:underline; font-size:12px; cursor:pointer; font-family:inherit}
  .searchbox{width:100%; padding:11px 14px; border-radius:11px; border:1.5px solid var(--line); font-family:inherit; font-size:14px; margin-bottom:12px; background:var(--card); color:var(--ink)}
  .searchbox:focus{outline:none; border-color:var(--brand)}

  /* ---- meta card ---- */
  .meta{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:16px}
  .meta input,.meta select{
    width:100%; border:none; border-bottom:2px solid var(--line);
    padding:8px 2px; font-size:15px; font-family:inherit; color:var(--ink);
    background:transparent; transition:border-color .15s; border-radius:0;
  }
  .meta input:focus,.meta select:focus{outline:none; border-color:var(--brand)}
  .meta .title-in{font-size:20px; font-weight:700; margin-bottom:10px}
  .meta .row{display:flex; gap:12px}
  .meta .row>div{flex:1}
  .meta label{display:block; font-size:11px; color:var(--sub); margin-bottom:-2px; font-weight:600}
  .meta textarea{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:8px; font-family:inherit; font-size:14px; resize:vertical; margin-top:4px; color:var(--ink)}
  .meta textarea:focus{outline:none; border-color:var(--brand)}
  details.mgmt{margin-top:14px; border-top:1px dashed var(--line); padding-top:10px}
  details.mgmt summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--sub)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px}

  /* ---- quality / approval / effect panel ---- */
  .q-head{display:flex; align-items:baseline; gap:10px; margin:10px 0 6px; flex-wrap:wrap}
  .q-score{font-size:22px; font-weight:800; color:var(--danger)}
  .q-score.good{color:#166534}
  .q-blockers{font-size:11px; color:var(--sub); flex:1; min-width:180px}
  .q-checks{display:grid; gap:6px; margin:6px 0 12px}
  .q-checks label{display:flex; align-items:flex-start; gap:8px; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:0}
  .q-checks input{width:18px; height:18px; accent-color:var(--brand); flex:none; margin-top:2px}
  .q-actions{display:flex; gap:8px; margin-top:12px}
  .q-actions button{flex:1; border:none; background:var(--brand); color:#fff; border-radius:9px; padding:10px 8px; font-weight:700; font-family:inherit; font-size:13px; cursor:pointer}
  .q-actions button.ghost{background:var(--bg); color:var(--ink)}

  /* ---- per-step education fields ---- */
  details.edu{margin-top:10px; border-top:1px dashed var(--line); padding-top:8px}
  details.edu summary{font-size:12px; font-weight:700; color:var(--sub); cursor:pointer}
  details.edu input,details.edu textarea{width:100%; border:1.5px solid var(--line); border-radius:8px; padding:7px; font-family:inherit; font-size:13px; margin:6px 0 0; color:var(--ink); resize:vertical}
  details.edu textarea{min-height:38px}
  details.edu input:focus,details.edu textarea:focus{outline:none; border-color:var(--brand)}

  /* ---- steps ---- */
  #steps{display:flex; flex-direction:column; gap:14px}
  .step{background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; position:relative}
  .step-head{display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); background:#f8fafc}
  .step-num{width:28px; height:28px; flex:none; border-radius:50%; background:var(--brand); color:#fff; font-weight:700; font-size:14px; display:flex; align-items:center; justify-content:center}
  .step-num.n-warn{background:var(--accent)}
  .step-num.n-check{background:#fff; color:var(--brand); border:2px solid var(--brand)}
  .step-head .sp{flex:1}
  .icon-btn{border:none; background:transparent; font-size:18px; cursor:pointer; width:34px; height:34px; border-radius:8px; color:var(--sub); display:flex; align-items:center; justify-content:center}
  .icon-btn:hover{background:var(--line)}
  .icon-btn.del:hover{background:#fee2e2; color:var(--danger)}
  .icon-btn:disabled{opacity:.25; cursor:default}
  .step-body{padding:14px}
  .seg{display:flex; gap:6px; margin-bottom:10px}
  .seg button{flex:1; padding:7px; border-radius:8px; border:1.5px solid var(--line); background:#fff; font-family:inherit; font-size:13px; font-weight:700; color:var(--sub); cursor:pointer}
  .seg button.on{border-color:var(--brand); color:var(--brand); background:#f0fdfa}
  .seg button.on[data-t="warn"]{border-color:var(--accent); color:#b45309; background:#fffbeb}
  .photo-slot{
    position:relative; width:100%; aspect-ratio:4/3; border-radius:10px;
    background:#f1f5f9; border:2px dashed var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:6px; color:var(--sub); cursor:pointer; overflow:hidden; margin-bottom:12px;
    transition:border-color .15s,background .15s;
  }
  .photo-slot:hover{border-color:var(--brand); background:#f0fdfa}
  .photo-slot .cam{font-size:38px}
  .photo-slot .hint{font-size:13px; font-weight:600}
  .photo-slot img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .p-chip{position:absolute; background:rgba(15,23,42,.72); color:#fff; font-size:12px; padding:5px 10px; border-radius:999px; font-weight:600; display:flex; gap:4px; align-items:center; border:none; font-family:inherit; cursor:pointer}
  .p-edit{left:8px; bottom:8px}
  .retake{right:8px; bottom:8px}
  .alb2{right:8px; top:8px}
  .src-row{display:flex; gap:8px}
  .src-btn{border:none; background:var(--brand); color:#fff; font-family:inherit; font-weight:700; font-size:13px; padding:9px 16px; border-radius:999px; cursor:pointer}
  .src-btn.alb{background:#fff; color:var(--brand); border:1.5px solid var(--brand)}
  .step-body input.s-title{width:100%; border:none; font-size:16px; font-weight:700; font-family:inherit; padding:4px 2px; margin-bottom:6px; color:var(--ink); border-bottom:2px solid transparent}
  .step-body input.s-title:focus{outline:none; border-bottom-color:var(--brand)}
  .step-body textarea{width:100%; border:none; resize:vertical; min-height:52px; font-size:14px; font-family:inherit; color:var(--ink); padding:4px 2px; line-height:1.6}
  .step-body textarea:focus{outline:none}
  .step-body .field-lbl{font-size:11px; color:var(--sub); font-weight:600; margin-top:8px}
  .empty{text-align:center; color:var(--sub); padding:40px 20px; font-size:14px}
  .empty .big{font-size:40px; margin-bottom:8px}
  .add-step{width:100%; margin-top:14px; padding:16px; border-radius:14px; border:2px dashed var(--brand); background:#f0fdfa; color:var(--brand); font-size:16px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px}
  .add-step:hover{background:#ccfbf1}

  /* ---- footer bar ---- */
  .bar{position:fixed; bottom:0; left:0; right:0; z-index:20; background:var(--card); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; max-width:760px; margin:0 auto}
  .bar button{flex:1; padding:13px; border-radius:11px; border:none; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px}
  .btn-ghost{background:var(--bg); color:var(--ink)}
  .btn-ghost:hover{background:var(--line)}
  .btn-primary{background:var(--brand); color:#fff}
  .btn-primary:hover{background:var(--brand-d)}

  /* ---- annotation modal ---- */
  .modal{position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:50; display:flex; align-items:center; justify-content:center; padding:12px}
  .an-box{background:#fff; border-radius:14px; max-width:720px; width:100%; padding:12px}
  .an-box h3{margin:2px 4px 10px; font-size:15px}
  .an-tools{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; align-items:center}
  .an-tools .tl{width:42px; height:42px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:17px; cursor:pointer}
  .an-tools .tl.on{border-color:var(--brand); background:#f0fdfa}
  .dot{width:28px; height:28px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1.5px var(--line); cursor:pointer; flex:none; padding:0}
  .dot.on{box-shadow:0 0 0 3px var(--ink)}
  #an-cv{max-width:100%; max-height:60vh; display:block; margin:0 auto; touch-action:none; border-radius:8px; background:#f1f5f9}
  .an-actions{display:flex; gap:8px; margin-top:12px}
  .an-actions button{flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer}

  .toast{position:fixed; left:50%; bottom:88px; transform:translateX(-50%) translateY(20px); background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:var(--shadow); opacity:0; transition:opacity .25s,transform .25s; pointer-events:none; z-index:60; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .save-note{text-align:center; font-size:11px; color:var(--sub); margin-top:18px}
  [hidden]{display:none!important}
  @media (max-width:480px){ .wrap{padding:12px} }
</style>
</head>
<body>

<!-- ============ ホーム（一覧） ============ -->
<div id="v-home">
  <header class="app">
    <span class="logo">📋</span>
    <h1>現場マニュアル作成</h1>
    <span class="count" id="hcount">0 件</span>
  </header>
  <div class="wrap">
    <div class="home-actions">
      <button id="btn-new">＋ 新規作成</button>
      <button id="btn-import">📥 取り込み</button>
    </div>
    <input class="searchbox" id="search" placeholder="🔍 タイトル・設備名で検索" autocomplete="off">
    <div id="mlist"></div>
    <div id="no-hit" class="empty" hidden>検索に一致するマニュアルがありません</div>
    <div id="home-empty" class="empty">
      <div class="big">📸</div>
      「新規作成」から、写真を撮るだけでマニュアルが作れます。<br>
      書き出したHTMLやバックアップは「取り込み」で戻せます。
    </div>
    <p class="save-note"><button class="linkbtn" id="btn-backup">全データをバックアップ（.json）</button></p>
    <p class="save-note" id="quota"></p>
  </div>
</div>

<!-- ============ 編集画面 ============ -->
<div id="v-edit" hidden>
  <header class="app">
    <button class="hback" id="btn-back">‹</button>
    <h1>マニュアル編集</h1>
    <span class="count" id="ecount">0 手順</span>
  </header>
  <div class="wrap">
    <div class="meta">
      <input class="title-in" id="m-title" placeholder="マニュアルのタイトル（例：〇〇装置 始業点検）" autocomplete="off">
      <div class="row">
        <div><label for="m-place">現場・設備</label><input id="m-place" placeholder="例：第2工場 A棟" autocomplete="off"></div>
        <div><label for="m-author">作成者</label><input id="m-author" placeholder="例：山田" autocomplete="off"></div>
      </div>
      <label for="m-tools" style="margin-top:12px">準備するもの（1行に1つ・任意）</label>
      <textarea id="m-tools" rows="2" placeholder="軍手&#10;トルクレンチ"></textarea>
      <details class="mgmt">
        <summary>🗂 管理情報（版数・承認・見直し日）</summary>
        <div class="grid2">
          <div><label for="m-version">版数</label><input id="m-version" placeholder="1.0"></div>
          <div><label for="m-status">状態</label>
            <select id="m-status">
              <option value="draft">下書き</option>
              <option value="wait">承認待ち</option>
              <option value="active">運用中</option>
              <option value="retired">廃止</option>
            </select></div>
          <div><label for="m-approver">承認者</label><input id="m-approver" placeholder="例：佐藤 班長"></div>
          <div><label for="m-review">次回見直し日</label><input type="date" id="m-review"></div>
        </div>
        <div style="margin-top:10px"><label for="m-note">改訂メモ（今回の変更点）</label><input id="m-note" placeholder="例：バルブ電動化に伴い手順3を変更"></div>
      </details>
      <details class="mgmt" id="d-quality">
        <summary>✅ 提出前チェック（品質スコア・承認・改善効果）</summary>
        <div class="q-head"><span class="q-score" id="q-score">--</span><span class="q-blockers" id="q-blockers"></span></div>
        <div class="q-checks">
          <label><input type="checkbox" data-ap="photoSecurity"> 写真に顔・個人名・顧客名・秘匿情報が写っていない</label>
          <label><input type="checkbox" data-ap="orderChecked"> 実作業の順序と手順の並びが一致している</label>
          <label><input type="checkbox" data-ap="dangerChecked"> 危険・品質影響箇所が「⚠注意」になっている</label>
          <label><input type="checkbox" data-ap="checkDefined"> 記録が必要な箇所が「☑点検」になっている</label>
          <label><input type="checkbox" data-ap="reviewSet"> 次回見直し日を設定した</label>
          <label><input type="checkbox" data-ap="changeMemo"> 改訂メモを書いた</label>
          <label><input type="checkbox" data-ap="oldVersionHandled"> 旧版の退避先を確認した</label>
        </div>
        <div class="grid2">
          <div><label for="ef-before">従来の時間（分/回）</label><input id="ef-before" type="number" min="0" inputmode="numeric"></div>
          <div><label for="ef-after">ツール利用後（分/回）</label><input id="ef-after" type="number" min="0" inputmode="numeric"></div>
          <div><label for="ef-count">月間回数</label><input id="ef-count" type="number" min="0" inputmode="numeric"></div>
          <div><label>月間削減見込み</label><input id="ef-saved" readonly tabindex="-1"></div>
        </div>
        <div style="margin-top:10px"><label for="ef-memo">改善効果メモ</label><input id="ef-memo" placeholder="例：新人教育の説明時間を短縮、点検記録の標準化"></div>
        <div class="q-actions">
          <button type="button" id="btn-ledger-json">台帳JSON</button>
          <button type="button" id="btn-ledger-csv">台帳CSV</button>
          <button type="button" id="btn-effect-copy" class="ghost">📋 効果メモ</button>
        </div>
      </details>
    </div>

    <div id="steps"></div>
    <div id="e-empty" class="empty">
      <div class="big">📷</div>
      「手順を追加」を押すとカメラが起動します。<br>
      撮った写真をタップすると赤丸・矢印を書き込めます。
    </div>
    <button class="add-step" id="add"><span>＋</span> 手順を追加</button>
    <p class="save-note" id="savenote">— 未保存 —</p>
  </div>
  <div class="bar">
    <button class="btn-ghost" id="btn-preview">👁 プレビュー</button>
    <button class="btn-primary" id="btn-export">⬇ HTML書き出し</button>
  </div>
</div>

<!-- ============ 写真書き込みモーダル ============ -->
<div class="modal" id="annot" hidden>
  <div class="an-box">
    <h3>✏ 写真に書き込み</h3>
    <div class="an-tools">
      <button class="tl on" data-tool="circle" title="丸">⭕</button>
      <button class="tl" data-tool="arrow" title="矢印">↗</button>
      <button class="tl" data-tool="rect" title="四角">▢</button>
      <button class="tl" data-tool="pen" title="ペン">✏</button>
      <button class="tl" data-tool="num" title="番号スタンプ">①</button>
      <button class="tl" data-tool="text" title="文字入れ">あ</button>
      <button class="dot on" data-c="#dc2626" style="background:#dc2626" title="赤"></button>
      <button class="dot" data-c="#facc15" style="background:#facc15" title="黄"></button>
      <button class="dot" data-c="#2563eb" style="background:#2563eb" title="青"></button>
      <span style="flex:1"></span>
      <button class="tl" id="an-undo" title="元に戻す">↩</button>
      <button class="tl" id="an-clear" title="全消し">🗑</button>
    </div>
    <canvas id="an-cv"></canvas>
    <div class="an-actions">
      <button class="btn-ghost" id="an-cancel">キャンセル</button>
      <button class="btn-primary" id="an-save">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="filepick" accept="image/*" capture="environment" style="display:none">
<input type="file" id="filepick2" accept="image/*" style="display:none">
<input type="file" id="importpick" accept=".html,.json,.md,.txt,text/html,application/json,text/plain,text/markdown" style="display:none">

<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,10);
const MAXW = 1280, JPEG_Q = 0.82;
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtDate(ts){ if(!ts) return "-"; const d=new Date(ts); return d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate(); }
function isOverdue(m){
  if(!m.reviewDate) return false;
  const due = new Date(m.reviewDate+"T23:59:59");
  return !isNaN(due.getTime()) && Date.now() > due.getTime();
}
let toastTimer=null;
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function showView(id){ ["v-home","v-edit"].forEach(v=>{ $("#"+v).hidden = v!==id; }); window.scrollTo(0,0); }

/* ================= storage (IndexedDB / localStorage fallback) ================= */
const LSKEY="genba_manuals_ls";
let manuals=[], cur=null, useLS=false, _db=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    if(!window.indexedDB) return rej(new Error("no idb"));
    const r=indexedDB.open("genba_tool",1);
    r.onupgradeneeded=()=>{ r.result.createObjectStore("manuals",{keyPath:"id"}); };
    r.onsuccess=()=>{ _db=r.result; res(_db); };
    r.onerror=()=>rej(r.error);
    r.onblocked=()=>rej(new Error("blocked"));
  });
}
function lsRead(){ try{ return JSON.parse(localStorage.getItem(LSKEY)||"[]"); }catch(e){ return []; } }
function lsWrite(){ try{ localStorage.setItem(LSKEY, JSON.stringify(manuals)); }catch(e){ toast("⚠ 保存できません（容量不足）"); } }
async function dbAll(){
  if(useLS) return lsRead();
  try{
    const d=await idbOpen();
    return await new Promise((res,rej)=>{
      const q=d.transaction("manuals","readonly").objectStore("manuals").getAll();
      q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error);
    });
  }catch(e){ useLS=true; return lsRead(); }
}
async function dbPut(m){
  const i=manuals.findIndex(x=>x.id===m.id);
  if(i>=0) manuals[i]=m; else manuals.push(m);
  if(useLS) return lsWrite();
  try{
    const d=await idbOpen();
    await new Promise((res,rej)=>{
      const tx=d.transaction("manuals","readwrite");
      tx.objectStore("manuals").put(m);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){ useLS=true; lsWrite(); }
}
async function dbDel(id){
  manuals=manuals.filter(x=>x.id!==id);
  if(useLS) return lsWrite();
  try{
    const d=await idbOpen();
    await new Promise((res,rej)=>{
      const tx=d.transaction("manuals","readwrite");
      tx.objectStore("manuals").delete(id);
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){ useLS=true; lsWrite(); }
}

async function flushSave(){

function stampSaved(){

/* ================= quality / approval / effect ================= */
const AP_KEYS=["photoSecurity","orderChecked","dangerChecked","checkDefined","reviewSet","changeMemo","oldVersionHandled"];
function extOf(m){
  if(!m.ext) m.ext={};
  if(!m.ext.effect) m.ext.effect={};
  if(!m.ext.approval) m.ext.approval={};
  return m.ext;
}
function calcQuality(m){
  const steps=m.steps||[], blockers=[];
  let s=0;
  const add=(cond,pt,msg)=>{ if(cond) s+=pt; else if(msg) blockers.push(msg); };
  add((m.title||"").trim(),8,"タイトル未入力");
  add((m.place||"").trim(),8,"現場・設備未入力");
  add((m.author||"").trim(),7,"作成者未入力");
  add((m.approver||"").trim(),7,"承認者未入力");
  add((m.reviewDate||"").trim(),10,"次回見直し日未設定");
  add((m.version||"").trim(),5,null);
  add(steps.length>0,10,"手順なし");
  const photo=steps.filter(x=>x.photo).length;
  const warn=steps.filter(x=>x.type==="warn").length;
  const check=steps.filter(x=>x.type==="check").length;
  const descOk=steps.filter(x=>(x.desc||"").trim().length>=8).length;
  add(steps.length&&photo/steps.length>=0.8,10,steps.length?"写真付き手順が8割未満":null);
  add(steps.length&&descOk/steps.length>=0.8,10,steps.length?"説明が薄い手順あり":null);
  add(warn>0,6,"⚠注意の手順が未設定");
  add(check>0,6,null);
  add((m.note||"").trim(),5,null);
  add((m.tools||"").trim(),4,null);
  const ap=extOf(m).approval;
  s+=Math.round(4*AP_KEYS.filter(k=>ap[k]).length/AP_KEYS.length);
  if(s>100)s=100;
  const grade=s>=90?"A":s>=80?"B":s>=70?"C":"D";
  return {score:s, grade, blockers, stats:{steps:steps.length, photo, warn, check}};
}
function savedHours(ef){
  const b=parseFloat(ef.beforeMinutes)||0, a=parseFloat(ef.afterMinutes)||0, c=parseFloat(ef.monthlyCount)||0;
  const h=(b-a)*c/60;
  return (isFinite(h)&&h>0)?Math.round(h*10)/10:0;
}
function ledgerObject(m){
  const q=calcQuality(m), ef=extOf(m).effect;
  return {
    manual_id:m.id||"", title:m.title||"", place:m.place||"", version:m.version||"1.0",
    status:m.status||"draft", author:m.author||"", approver:m.approver||"",
    reviewDate:m.reviewDate||"", updatedAt:fmtDate(m.updatedAt), exportedAt:m.exportedAt?fmtDate(m.exportedAt):"",
    stepCount:q.stats.steps, photoStepCount:q.stats.photo, warnStepCount:q.stats.warn, checkStepCount:q.stats.check,
    qualityScore:q.score, qualityGrade:q.grade, qualityBlockers:q.blockers.join(" / "),
    beforeMinutes:ef.beforeMinutes||"", afterMinutes:ef.afterMinutes||"", monthlyCount:ef.monthlyCount||"",
    monthlySavedHours:savedHours(ef), effectMemo:ef.memo||""
  };
}
function ledgerCsv(m){
  const o=ledgerObject(m), cols=Object.keys(o);
  const cell=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  // 先頭のBOMはExcel/kintoneでの文字化け防止
  return "\uFEFF"+cols.join(",")+"\n"+cols.map(k=>cell(o[k])).join(",")+"\n";
}
function exportLedger(kind){
  if(!cur) return;
  const safe=(cur.title||"manual").replace(/[\\/:*?"<>|]/g,"_").slice(0,40);
  if(kind==="json") downloadFile(JSON.stringify(ledgerObject(cur),null,2), `${safe}_v${cur.version||"1.0"}_台帳.json`, "application/json");
  else downloadFile(ledgerCsv(cur), `${safe}_v${cur.version||"1.0"}_台帳.csv`, "text/csv");
  toast("⬇ 台帳データを書き出しました");
}
function copyEffectMemo(){
  if(!cur) return;
  const o=ledgerObject(cur);
  const lines=["【現場マニュアル改善効果】"+o.title+"（v"+o.version+"）",
    "現場・設備："+o.place,
    "品質スコア："+o.qualityScore+"点（"+o.qualityGrade+"）",
    "月間削減見込み："+o.monthlySavedHours+" h/月（"+(o.beforeMinutes||"?")+"分 → "+(o.afterMinutes||"?")+"分 × 月"+(o.monthlyCount||"?")+"回）",
    "手順数："+o.stepCount+"（写真"+o.photoStepCount+"・注意"+o.warnStepCount+"・点検"+o.checkStepCount+"）"];
  if(o.effectMemo) lines.push("補足："+o.effectMemo);
  const txt=lines.join("\n");
  const ok=()=>toast("📋 効果メモをコピーしました");
  const fallback=()=>{
    const ta=document.createElement("textarea"); ta.value=txt;
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ alert(txt); }
    ta.remove();
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok,fallback);
  else fallback();
}
function refreshQuality(){
  if(!cur||$("#v-edit").hidden) return;
  const ex=extOf(cur), q=calcQuality(cur);
  const sc=$("#q-score");
  sc.textContent=q.score+" / 100（"+q.grade+"）";
  sc.classList.toggle("good",q.score>=90);
  $("#q-blockers").textContent=q.blockers.length?("あと少し："+q.blockers.join("・")):"提出品質OK。承認に回せます。";
  document.querySelectorAll("#d-quality input[data-ap]").forEach(c=>{ c.checked=!!ex.approval[c.dataset.ap]; });
  const setV=(id,v)=>{ const el=$("#"+id); if(el.value!==String(v)) el.value=v; };
  setV("ef-before",ex.effect.beforeMinutes||"");
  setV("ef-after",ex.effect.afterMinutes||"");
  setV("ef-count",ex.effect.monthlyCount||"");
  setV("ef-memo",ex.effect.memo||"");
  $("#ef-saved").value=savedHours(ex.effect)+" h/月";
}

function statusChips(m){
  const map={draft:["下書き","st-draft"],wait:["承認待ち","st-wait"],active:["運用中","st-active"],retired:["廃止","st-retired"]};
  const [tx,cls]=map[m.status]||map.draft;
  const out=[{tx,cls}];
  if(m.status==="active" && isOverdue(m)) out.push({tx:"⚠ 要見直し",cls:"st-over"});
  if(m.exportedAt && (m.updatedAt||0)>m.exportedAt) out.push({tx:"✎ 未提出の変更",cls:"st-dirty"});

}

/* ================= photo capture & downscale ================= */
function processImage(file, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>MAXW){ h=Math.round(h*MAXW/w); w=MAXW; }
      const cv=document.createElement("canvas");
      cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",JPEG_Q));
    };
    img.onerror=()=>cb(null);
    img.src=e.target.result;
  };
  reader.onerror=()=>cb(null);
  reader.readAsDataURL(file);
}

/* ================= photo annotation ================= */
const anCv=document.getElementById("an-cv");
const anCtx=anCv.getContext("2d");
let anStep=null, anImg=null, anMarks=[], anTool="circle", anColor="#dc2626", anDrag=null;
function openAnnot(st){
  anStep=st;
  anMarks=(st.marks||[]).map(m=>JSON.parse(JSON.stringify(m)));
  anImg=new Image();
  anImg.onload=()=>{
    anCv.width=anImg.naturalWidth; anCv.height=anImg.naturalHeight;
    anDrawAll(); $("#annot").hidden=false;
  };
  anImg.src=st.photoOrig||st.photo;
}
function closeAnnot(){ $("#annot").hidden=true; anStep=null; anImg=null; anDrag=null; }
function anLw(){ return Math.max(4, anCv.width*0.008); }
function anDrawAll(preview){
  if(!anImg) return;
  anCtx.clearRect(0,0,anCv.width,anCv.height);
  anCtx.drawImage(anImg,0,0);
  anMarks.forEach(m=>drawMark(anCtx,m));
  if(preview) drawMark(anCtx,preview);
}
function drawMark(ctx,m){
  ctx.strokeStyle=m.c; ctx.fillStyle=m.c;
  ctx.lineWidth=anLw(); ctx.lineCap="round"; ctx.lineJoin="round";
  if(m.t==="circle"){
    ctx.beginPath();
    ctx.ellipse((m.x1+m.x2)/2,(m.y1+m.y2)/2,Math.max(Math.abs(m.x2-m.x1)/2,1),Math.max(Math.abs(m.y2-m.y1)/2,1),0,0,Math.PI*2);
    ctx.stroke();
  } else if(m.t==="rect"){
    ctx.strokeRect(Math.min(m.x1,m.x2),Math.min(m.y1,m.y2),Math.abs(m.x2-m.x1),Math.abs(m.y2-m.y1));
  } else if(m.t==="arrow"){
    const ang=Math.atan2(m.y2-m.y1,m.x2-m.x1), hl=anLw()*3.5;
    ctx.beginPath(); ctx.moveTo(m.x1,m.y1); ctx.lineTo(m.x2,m.y2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(m.x2,m.y2);
    ctx.lineTo(m.x2-hl*Math.cos(ang-0.45), m.y2-hl*Math.sin(ang-0.45));
    ctx.lineTo(m.x2-hl*Math.cos(ang+0.45), m.y2-hl*Math.sin(ang+0.45));
    ctx.closePath(); ctx.fill();
  } else if(m.t==="pen"){
    ctx.beginPath();
    (m.pts||[]).forEach((p,i)=>{ if(i) ctx.lineTo(p[0],p[1]); else ctx.moveTo(p[0],p[1]); });
    ctx.stroke();
  } else if(m.t==="num"){
    const r=Math.max(16, anCv.width*0.028);
    ctx.beginPath(); ctx.arc(m.x1,m.y1,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff";
    ctx.font="bold "+Math.round(r*1.2)+"px sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(String(m.n),m.x1,m.y1+r*0.06);
  } else if(m.t==="text"){
    const fs=Math.max(22, anCv.width*0.04);
    ctx.font="bold "+Math.round(fs)+"px sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.lineWidth=Math.max(3, fs*0.18); ctx.strokeStyle="#fff";
    ctx.strokeText(m.s,m.x1,m.y1);
    ctx.fillText(m.s,m.x1,m.y1);
  }
}
function anPos(e){
  const r=anCv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*anCv.width/r.width, y:(e.clientY-r.top)*anCv.height/r.height };
}
anCv.addEventListener("pointerdown",e=>{
  if(!anImg) return;
  e.preventDefault();
  anCv.setPointerCapture(e.pointerId);
  const p=anPos(e);
  if(anTool==="num"){
    const n=anMarks.filter(m=>m.t==="num").length+1;
    anMarks.push({t:"num",x1:p.x,y1:p.y,c:anColor,n});
    anDrawAll(); return;
  }
  if(anTool==="text"){
    const s=prompt("写真に入れる文字（例：ここを確認）");
    if(s && s.trim()){ anMarks.push({t:"text",x1:p.x,y1:p.y,c:anColor,s:s.trim()}); }
    anDrawAll(); return;
  }
  anDrag={t:anTool,c:anColor,x1:p.x,y1:p.y,x2:p.x,y2:p.y,pts:[[p.x,p.y]]};
});
anCv.addEventListener("pointermove",e=>{
  if(!anDrag) return;
  e.preventDefault();
  const p=anPos(e);
  anDrag.x2=p.x; anDrag.y2=p.y;
  if(anDrag.t==="pen") anDrag.pts.push([p.x,p.y]);
  anDrawAll(anDrag);
});
function anUp(e){
  if(!anDrag) return;
  const moved=Math.hypot(anDrag.x2-anDrag.x1,anDrag.y2-anDrag.y1)>3 || anDrag.pts.length>3;
  if(moved) anMarks.push(anDrag);
  anDrag=null; anDrawAll();
}
anCv.addEventListener("pointerup",anUp);
anCv.addEventListener("pointercancel",anUp);
document.querySelectorAll(".an-tools .tl[data-tool]").forEach(b=>{
  b.onclick=()=>{
    anTool=b.dataset.tool;
    document.querySelectorAll(".an-tools .tl[data-tool]").forEach(x=>x.classList.toggle("on",x===b));
  };
});
document.querySelectorAll(".an-tools .dot").forEach(b=>{
  b.onclick=()=>{
    anColor=b.dataset.c;
    document.querySelectorAll(".an-tools .dot").forEach(x=>x.classList.toggle("on",x===b));
  };
});
$("#an-undo").onclick=()=>{ anMarks.pop(); anDrawAll(); };
$("#an-clear").onclick=()=>{ if(anMarks.length&&confirm("書き込みを全部消しますか？")){ anMarks=[]; anDrawAll(); } };
$("#an-cancel").onclick=closeAnnot;
$("#an-save").onclick=()=>{
  if(!anStep) return;
  if(!anStep.photoOrig) anStep.photoOrig=anStep.photo;
  anStep.marks=anMarks;
  anDrawAll();
  anStep.photo=anCv.toDataURL("image/jpeg",0.85);
  closeAnnot(); save(); renderSteps();
  toast("✓ 書き込みを保存しました");
};

/* ================= build standalone manual (viewer) ================= */
function buildDoc(m){
  const t=esc(m.title)||"現場マニュアル";
  const steps=m.steps||[];
  const hasCk=steps.some(s=>s.type==="check");
  const d=new Date();
  const chips=[];
  if(m.place) chips.push("現場・設備："+esc(m.place));
  chips.push("版数：v"+esc(m.version||"1.0"));
  chips.push("発行日："+d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日");
  if(m.reviewDate) chips.push("次回見直し："+esc(m.reviewDate));

  const toolLines=(m.tools||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const toolsHtml = toolLines.length
    ? `<div class="sec-h">準備するもの</div><ul class="tools">${toolLines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>` : "";

  const tocHtml = steps.length
    ? `<div class="sec-h">目次</div><ol class="toc">${steps.map((s,i)=>{
        const ic = s.type==="warn"?"⚠ ":(s.type==="check"?"☑ ":"");
        return `<li><a href="#s-${i}">${ic}${esc(s.title)||"（無題）"}</a></li>`;
      }).join("")}</ol>` : "";

  const recordHtml = hasCk
    ? `<div class="record"><strong>点検記録</strong>
        <label>実施者 <input id="ck-name"></label>
        <label>日付 <input id="ck-date" placeholder="${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}"></label>
        <span class="vchip" id="ck-prog"></span>
        <button id="ck-copy" class="ckbtn no-print">📋 記録をコピー</button>
        <button id="ck-reset" class="rst no-print">リセット</button></div>` : "";

  const stepsHtml = steps.map((s,i)=>{
    const isW=s.type==="warn", isC=s.type==="check";
    const e=s.edu||{};
    const eduHtml=(e.time||e.done||e.mistake||e.escalate)
      ? `<div class="edu-v">
          ${e.time?`<span class="edu-chip">⏱ 目安 ${esc(e.time)}</span>`:""}
          ${e.done?`<div class="edu-row ok">✅ 完了条件：${esc(e.done)}</div>`:""}
          ${e.mistake?`<div class="edu-row ng">⚠ よくあるミス：${esc(e.mistake)}</div>`:""}
          ${e.escalate?`<div class="edu-row esc">📞 詰まったら：${esc(e.escalate)}</div>`:""}
        </div>` : "";
    return `<section class="s" id="s-${i}">
      <div class="s-h">
        <span class="s-n${isW?" warn":""}">${i+1}</span>
        ${isC?`<label class="ckl"><input type="checkbox" data-ck="${i}"></label>`:""}
        <h2>${esc(s.title)||"（無題）"}</h2>
        ${isW?'<span class="wchip">⚠ 注意</span>':""}
      </div>
      ${s.photo?`<img data-p="${i}" alt="手順${i+1}の写真">`:""}
      ${s.desc?`<p>${esc(s.desc).replace(/\n/g,"<br>")}</p>`:""}
      ${eduHtml}
    </section>`;
  }).join("");

  const fbOptions = `<option value="-1">全体について</option>`+
    steps.map((s,i)=>`<option value="${i}">手順${i+1}：${esc(s.title)||"（無題）"}</option>`).join("");

  const q=calcQuality(m), ef=extOf(m).effect, sh=savedHours(ef);
  const qualHtml=`<section class="s q-sec"><div class="s-h"><span class="s-n">★</span><h2>品質・改善効果</h2></div>
    <p>品質スコア：<b>${q.score} / 100（${q.grade}）</b>${sh>0?`<br>月間削減見込み：<b>${sh} h/月</b>`:""}${ef.memo?`<br>改善効果メモ：${esc(ef.memo)}`:""}</p></section>`;

  const embed={ id:m.id, title:m.title, place:m.place, author:m.author, approver:m.approver,
    version:m.version, note:m.note, reviewDate:m.reviewDate, tools:m.tools, status:m.status,
    createdAt:m.createdAt,
    ext:{approval:extOf(m).approval, effect:extOf(m).effect},
    steps:steps.map(s=>{
      const e=s.edu||{};
      return { id:s.id, type:s.type||"step", title:s.title, desc:s.desc, photo:s.photo,
        edu:(e.time||e.done||e.mistake||e.escalate)?e:undefined };
    }) };
  const json=JSON.stringify(embed).replace(/<\//g,"<\\/");

  return `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${t}</title>
<style>${VIEWER_CSS}</style></head><body>
<div class="vwrap">
  <div id="ov-banner" class="banner" hidden>⚠ この手順書は見直し期限（${esc(m.reviewDate||"")}）を過ぎています。内容が現状と合っているか確認し、管理者へ連絡してください。</div>
  <header class="vh">
    <div class="vh-l">
      <h1>${t}</h1>
      <div class="vmeta">${chips.map(c=>`<span>${c}</span>`).join("")}</div>
      ${m.note?`<div class="note">改訂メモ：${esc(m.note)}</div>`:""}
    </div>
    <table class="stamps">
      <tr><th>作成</th><th>確認</th><th>承認</th></tr>
      <tr><td>${esc(m.author||"")}</td><td></td><td>${esc(m.approver||"")}</td></tr>
    </table>
  </header>
  ${toolsHtml}
  ${tocHtml}
  ${recordHtml}
  ${stepsHtml}
  ${qualHtml}
  <footer>全 ${steps.length} 手順 ・ v${esc(m.version||"1.0")} ・ このファイルは「現場マニュアル作成ツール」に再取り込みして改訂できます</footer>
</div>
<div class="vtb no-print">
  <button class="pri" id="v-genba">▶ 現場モード</button>
  <button id="v-fb">📢 フィードバック</button>
  <button id="v-print">🖨 印刷 / PDF</button>
</div>
<div id="lb" hidden><img id="lb-img" alt=""></div>
<div id="genba" hidden>
  <div class="g-top"><span id="g-num"></span><button id="g-close">✕</button></div>
  <div id="g-body">
    <span id="g-warn">⚠ 注意</span>
    <h2 id="g-title"></h2>
    <img id="g-img" alt="">
    <p id="g-desc"></p>
    <p class="g-edu ok" id="g-done"></p>
    <p class="g-edu ng" id="g-mist"></p>
    <p class="g-edu esc" id="g-esc"></p>
    <label id="g-check"><input type="checkbox" id="g-ckbox"> 実施した</label>
  </div>
  <div class="g-nav"><button id="g-prev">◀ 前へ</button><button id="g-next">次へ ▶</button></div>
</div>
<div id="fbm" hidden>
  <div class="fb-box">
    <h3>📢 フィードバック（現場からの指摘）</h3>
    <p class="fb-note">内容が実際と違う点・改善したい点を記録し、「まとめてコピー」して Teams / Kintone に貼り付けてください。</p>
    <select id="fb-step">${fbOptions}</select>
    <textarea id="fb-text" placeholder="例：手順3のバルブは電動化されており操作が異なる"></textarea>
    <div class="fb-row"><button id="fb-add">追加</button><button id="fb-copy">📋 まとめてコピー</button></div>
    <ul id="fb-list"></ul>
    <div class="fb-row"><button id="fb-clear">一覧を消去</button><button id="fb-close">閉じる</button></div>
  </div>
</div>
<script type="application/json" id="__manualdata">${json}<\/script>
<script>${VIEWER_JS}<\/script>
</body></html>`;
}

/* ================= export / preview / import ================= */
function exportHTML(m){
  if(!(m.steps||[]).length){ toast("先に手順を追加してください"); return; }
  const safe=(m.title||"現場マニュアル").replace(/[\\/:*?"<>|]/g,"_").slice(0,40);
  downloadFile(buildDoc(m), `${safe}_v${(m.version||"1.0")}.html`, "text/html");
  m.exportedAt=Date.now();          // 提出済みマーク（以後の編集で「未提出の変更」表示）
  dbPut(m);
  toast("⬇ HTMLを書き出しました");
}
function previewDoc(m){
  if(!(m.steps||[]).length){ toast("先に手順を追加してください"); return; }
  const w=window.open("about:blank");
  if(!w){ toast("⚠ ポップアップがブロックされました"); return; }
  w.document.write(buildDoc(m));
  w.document.close();
}
function normalizeManual(x){
  const now=Date.now();
  return {
    id:x.id||uid(), title:x.title||"", place:x.place||"", author:x.author||"",
    approver:x.approver||"", version:x.version||"1.0", status:x.status||"draft",
    reviewDate:x.reviewDate||"", note:x.note||"", tools:x.tools||"",
    ext:(x.ext&&typeof x.ext==="object")
      ? {effect:x.ext.effect||{}, approval:x.ext.approval||{}}
      : {effect:{}, approval:{}},
    createdAt:x.createdAt||now, updatedAt:now, exportedAt:x.exportedAt||now,
    steps:(x.steps||[]).map(s=>({
      id:s.id||uid(), type:s.type||"step", title:s.title||"", desc:s.desc||"",
      photo:s.photo||null, photoOrig:s.photoOrig||null, marks:s.marks||null,
      edu:(s.edu&&typeof s.edu==="object")?s.edu:null
    }))
  };
}
/* ---- 作業指示書ジェネレーター連携：【撮影】ブロック取込 ----
   形式: 【撮影】No.03 ／ 対象：棚Aのラベル貼付位置 ／ ファイル名：03_ラベル位置.jpg
   　　　　合格条件：ラベルの文字が読めること
   対象→手順タイトル / 合格条件→完了条件(edu.done) / ファイル名→説明欄に記載 */
const zen2han=s=>String(s).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
function parseShotBlocks(text){
  if(!text.includes("【撮影】")) return null;
  const blocks=[];
  let b=null;
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();
    if(line.includes("【撮影】")){
      if(b) blocks.push(b);
      b={no:null, target:"", file:"", pass:"", _i:blocks.length};
      const mNo=line.match(/No[.．]?\s*([0-9０-９]+)/i);
      if(mNo) b.no=parseInt(zen2han(mNo[1]),10);
      const mT=line.match(/対象[：:]\s*(.+?)(?:\s*[／\/]|$)/);
      if(mT) b.target=mT[1].trim();
      const mF=line.match(/ファイル名[：:]\s*([^\s／\/]+)/);
      if(mF) b.file=mF[1].trim();
    }
    if(b){
      const mP=line.match(/合格条件[：:]\s*(.+)/);
      if(mP) b.pass=mP[1].trim();
    }
  }
  if(b) blocks.push(b);
  if(!blocks.length) return null;
  blocks.sort((a,c)=>((a.no!=null?a.no:1e6+a._i)-(c.no!=null?c.no:1e6+c._i)));
  return blocks;
}
function manualFromShotList(text, fname){
  const blocks=parseShotBlocks(text);
  if(!blocks) return null;
  const m=blankManual();
  const mToday=text.match(/今日やること[：:]?\s*(.+)/);
  const mHead=text.match(/^#\s*(.+)$/m);
  m.title=(mToday?mToday[1]:mHead?mHead[1]:String(fname||"").replace(/\.(md|txt)$/i,"")||"作業指示書から作成").trim().slice(0,60);
  m.note="作業指示書の撮影ブロックから自動生成";
  m.steps=blocks.map(bl=>({
    id:uid(), type:"step",
    title:bl.target||(bl.no!=null?"撮影 No."+bl.no:"撮影対象"),
    desc:bl.file?("指定ファイル名："+bl.file):"",
    photo:null, photoOrig:null, marks:null,
    edu: bl.pass?{time:"",done:bl.pass,mistake:"",escalate:""}:null
  }));
  return m;
}
function parseImport(text, fname){
  text=String(text||"").trim();
  let data=null;
  if(text.startsWith("{")||text.startsWith("[")){
    try{ data=JSON.parse(text); }catch(e){ return []; }
  } else {
    const mm=text.match(/<script type="application\/json" id="__manualdata">([\s\S]*?)<\/script>/);
    if(mm){ try{ data=JSON.parse(mm[1]); }catch(e){ return []; } }
  }
  if(!data){
    const shot=manualFromShotList(text, fname);   // 作業指示書（.md/.txt）→骨格マニュアル
    return shot?[shot]:[];
  }
  const arr=Array.isArray(data)?data:(Array.isArray(data.manuals)?data.manuals:[data]);
  return arr.filter(x=>x&&Array.isArray(x.steps)).map(normalizeManual);
}
async function importFile(file){
  const text=await file.text();
  const arr=parseImport(text, file.name);
  if(!arr.length){ toast("⚠ 取り込めるデータが見つかりません"); return; }
  for(const m of arr){
    const exists=manuals.find(x=>x.id===m.id);
    if(exists){
      const ok=confirm(`「${m.title||"無題"}」は既に存在します。\nOK：上書き（改訂として取り込み）\nキャンセル：複製として追加`);
      if(!ok){ m.id=uid(); m.title=(m.title||"無題")+"（取込）"; }
    }
    await dbPut(m);
  }
  renderHome();
  toast(`✓ ${arr.length}件 取り込みました`);
}

$("#btn-back").onclick=goHome;
$("#add").onclick=addStep;
$("#btn-preview").onclick=()=>previewDoc(cur);
$("#btn-export").onclick=()=>exportHTML(cur);
function bindMeta(id,key){
  $("#"+id).oninput=e=>{ if(!cur) return; cur[key]=e.target.value; save(); };
}
bindMeta("m-title","title"); bindMeta("m-place","place"); bindMeta("m-author","author");
bindMeta("m-tools","tools"); bindMeta("m-version","version"); bindMeta("m-approver","approver");
bindMeta("m-review","reviewDate"); bindMeta("m-note","note");
$("#m-status").onchange=e=>{ if(cur){ cur.status=e.target.value; save(); } };
$("#search").oninput=()=>renderHome();
document.querySelectorAll("#d-quality input[data-ap]").forEach(c=>{
  c.onchange=()=>{ if(!cur) return; extOf(cur).approval[c.dataset.ap]=c.checked; save(); };
});
function bindEffect(id,key){
  $("#"+id).oninput=e=>{ if(!cur) return; extOf(cur).effect[key]=e.target.value; save(); };
}
bindEffect("ef-before","beforeMinutes"); bindEffect("ef-after","afterMinutes");
bindEffect("ef-count","monthlyCount"); bindEffect("ef-memo","memo");
$("#btn-ledger-json").onclick=()=>exportLedger("json");
$("#btn-ledger-csv").onclick=()=>exportLedger("csv");
$("#btn-effect-copy").onclick=copyEffectMemo;
function handlePick(e){
  const file=e.target.files[0];
  if(!file||!pendingStepId||!cur) return;
  toast("画像を処理中…");
  processImage(file,dataUrl=>{
    const st=cur&&cur.steps.find(s=>s.id===pendingStepId);
    if(st&&dataUrl){
      st.photo=dataUrl; st.photoOrig=null; st.marks=null;
      save(); renderSteps(); toast("✓ 写真を追加しました");
    } else {
      toast("⚠ 画像を読み込めませんでした");
    }
    pendingStepId=null;
  });
}
$("#filepick").onchange=handlePick;
$("#filepick2").onchange=handlePick;

/* ================= v1 migration & init ================= */
async function migrateV1(){
  const FLAG="genba_manual_v1_migrated";
  try{
    const raw=localStorage.getItem("genba_manual_v1");
    if(!raw||localStorage.getItem(FLAG)) return;
    const old=JSON.parse(raw);
    if(old&&(old.title||(old.steps||[]).length)){
      const m=blankManual();
      m.title=old.title||""; m.place=old.place||""; m.author=old.author||"";
      m.steps=(old.steps||[]).map(s=>({ id:s.id||uid(), type:"step", title:s.title||"", desc:s.desc||"", photo:s.photo||null, photoOrig:null, marks:null }));
      await dbPut(m);
    }
    localStorage.setItem(FLAG,"1");
    localStorage.removeItem("genba_manual_v1");
  }catch(e){ /* 旧データが壊れていても起動は続行 */ }
}
(async function init(){
  manuals=await dbAll();
  await migrateV1();
  renderHome();
  showView("v-home");
})();
