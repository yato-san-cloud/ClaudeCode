  // 7) ドアハンドル（リアドア中程・belt直下の凹バー）
  const hi=Math.max(0,(n*0.34)|0), hj=Math.min(n-1,hi+2);
  const hx0=BELT[hi].x, hy0=BELT[hi].y+(SILL[hi].y-BELT[hi].y)*0.3;
  const hx1=BELT[hj].x, hy1=BELT[hj].y+(SILL[hj].y-BELT[hj].y)*0.3;
  mBar(g,hx0,hy0,hx1,hy1,Math.max(2.5,5*(BELT[hi].D||1)),'rgba(30,12,10,.8)');
  mBar(g,hx0,hy0-1,hx1,hy1-1,Math.max(1,2*(BELT[hi].D||1)),'rgba(255,210,205,.7)');
  // 8) 後輪（3D・エッジオン）。フェンダーアーチは正面リングにせず、タイヤの実投影
  //    上弧に沿わせたボディ色リップとして mWheelSolid 内で描く（透視整合）
  mWheelSolid(proj,g,rw.x,rw.y,side,true);
  // 9) 手前シルエット・エッジ（カメラ最寄り＝最も明るい稜線）
  g.strokeStyle='rgba(255,220,215,.6)'; g.lineWidth=1.4; g.beginPath();
  g.moveTo(G[0].x,G[0].y); g.lineTo(SILL[0].x,SILL[0].y); g.lineTo(BELT[0].x,BELT[0].y);
  if(st[0].roof) g.lineTo(st[0].roof.x,st[0].roof.y);
  g.stroke();
}
/* 教習の要：後退中に「後輪の接地点」と「縁石／柵の足元」の隙間を読ませる補助表示。
   examMode／showGuide OFF では非表示。実寸(cm)を推定し、35cm未満は赤で警告。 */
function mGapRead(proj,g,side){
  if(examMode || !showGuide || gear!=='R' || result) return;
  const rw=side==='L'?wheelPositions(car).RL:wheelPositions(car).RR;
  let target=null, gapW=null;
  if(M.successKind==='parallel' && M.curbY!=null){
    target={x:rw.x,y:M.curbY}; gapW=Math.abs(rw.y-M.curbY);
  } else if(M.bay){
    const nearX=Math.abs(rw.x-M.bay.x0)<Math.abs(rw.x-M.bay.x1)?M.bay.x0:M.bay.x1;
    target={x:nearX,y:rw.y}; gapW=Math.abs(rw.x-nearX);
  }
  if(!target) return;
  const cp=proj(rw.x,rw.y,0), cc=proj(target.x,target.y,0.12);
  if(!cp||!cc||cp.depth<0.4) return;
  const near=gapW<0.35, col=near?'rgba(255,120,110,':'rgba(90,220,235,';
  g.save(); g.setLineDash([5,4]); g.lineWidth=2; g.strokeStyle=col+'0.9)';
  g.beginPath(); g.moveTo(cp.x,cp.y); g.lineTo(cc.x,cc.y); g.stroke(); g.setLineDash([]);
  for(const p of [cp,cc]){ g.beginPath(); g.arc(p.x,p.y,3,0,7); g.fillStyle=col+'0.95)'; g.fill(); }
  const mx=(cp.x+cc.x)/2, my=(cp.y+cc.y)/2;
  g.font='bold 11px system-ui'; g.textAlign='center';
  g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(mx-20,my-16,40,14);
  g.fillStyle=col+'1)'; g.fillText(`約${Math.round(gapW*100)}cm`,mx,my-5);
  g.textAlign='left'; g.restore();
}
// ハウジング（暗い樹脂ベゼル）＋ビネット＋鏡面シーン＋エッチング警告（生画面空間）
function mMirHousing(g,w,h,inset,r){
  const cx=w*0.5, cy=h*0.5, R=Math.hypot(w,h)*0.5;
  const vg=g.createRadialGradient(cx,cy,R*0.6,cx,cy,R);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.24)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  const sh=g.createLinearGradient(0,0,w*0.9,h*0.9);
  sh.addColorStop(0,'rgba(255,255,255,.16)'); sh.addColorStop(0.35,'rgba(255,255,255,.04)'); sh.addColorStop(0.6,'rgba(255,255,255,0)');
  g.fillStyle=sh; g.fillRect(0,0,w,h);
  g.save(); g.beginPath(); g.rect(0,0,w,h); roundRectSub(g,inset,inset,w-2*inset,h-2*inset,r);
  const bez=g.createLinearGradient(0,0,0,h); bez.addColorStop(0,'#2a3138'); bez.addColorStop(0.5,'#1a1e24'); bez.addColorStop(1,'#0f1216');
  g.fillStyle=bez; g.fill('evenodd'); g.restore();
  g.save(); roundRectG(g,inset,inset,w-2*inset,h-2*inset,r); g.clip();
  g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=1.4;
  roundRectG(g,inset+0.7,inset+0.7,w-2*inset-1.4,h-2*inset-1.4,r); g.stroke();
  g.restore();
  g.fillStyle='rgba(240,244,250,.5)'; g.font='9px system-ui'; g.textAlign='center';
  g.fillText('OBJECTS ARE CLOSER THAN THEY APPEAR', w/2, h-inset-4); g.textAlign='left';
}
function renderDoorMirror(side){
  const el=document.getElementById(side==='L'?'mirL':'mirR'); if(!el) return; const g=el.getContext('2d');
  const rc=el.getBoundingClientRect(), w=rc.width, h=rc.height; if(!M||w<2) return;
  g.clearRect(0,0,w,h);
  // Rギアで下向きへ自動チルト（駐車ミラー挙動）。ユーザーの pitch は加算で尊重。
  const tgt=(gear==='R')?1:0; _mirAutoTilt[side]+=(tgt-_mirAutoTilt[side])*0.10;
  const autoPitch=0.18*_mirAutoTilt[side];
  const sgn=side==='R'?1:-1, S=side==='L'?1:-1;
  // ミラーは実車どおり車体側面より外側に張り出し、やや外向き＝自車フランクが痩せた縦帯で正しく映る
  const cam=toWorld(car, C.wheelbase*0.55, S*(C.width/2+0.30)), camH=1.02+zAt(car.x,car.y);
  const look=car.th+Math.PI + sgn*0.36 + mirrorPan[side];
  const effPitch=clamp(mirrorPitch[side]+autoPitch,-0.4,0.55);
  const focal=w*0.48, horizon=clamp(h*0.46 - effPitch*h, -0.30*h, h-8);
  // 凸面バレル歪みは前進時にシーン（柵・レール）が破綻して波打つため不採用。広角感は
  // 「側面より外側＋やや外向き」のカメラ配置で表現し、投影は素直な鏡像ピンホールで安定描画。
  const proj=mkProj(cam.x,cam.y,camH,look,focal,horizon,w);   // sgn 既定=-1（鏡像）
  const inset=Math.max(3,Math.min(w,h)*0.05), r=Math.min(w,h)*0.10;
  g.save(); roundRectG(g,inset,inset,w-2*inset,h-2*inset,r); g.clip();
  POST_LW_CAP=Math.min(w,h)*0.05;                   // 小さいドアミラーだけ柵支柱の太さを制限
  mMirGround(g,w,h,horizon);                        // 1) 空／路面（フラット地平線＋質感）
  if(showGuide&&!examMode) drawMirrorGrid(g,proj,cam.x,cam.y,look);  // 2) 奥行きグリッド（練習補助・検定では消す）
  mWorld(proj,g);                                   // 3) コース（縁石・白線・柵・駐車車両）
  POST_LW_CAP=Infinity;
  // 4) 柵の角 検知（poleInMirror は常時更新）＋コーチングリング（検定では非表示）
  if(M.successKind==='perp' && cuePoleRef && side===(M.lockLabel==='右'?'R':'L') && !result){
    const pr=proj(cuePoleRef.x,cuePoleRef.y,0.5);
    const vis=!!pr && pr.x>w*0.10 && pr.x<w*0.96 && pr.depth>0.8;
    poleInMirror=vis;
    if(vis && gear!=='R' && !examMode){
      const rr=clamp(64/pr.depth,10,Math.min(w,h)*0.22), al=0.45+0.4*Math.abs(Math.sin(tick*0.15));
      g.strokeStyle=`rgba(55,214,122,${al})`; g.lineWidth=3;
      g.beginPath(); g.ellipse(pr.x,pr.y,rr,rr*1.6,0,0,7); g.stroke();
      g.fillStyle='#37d67a'; g.font='bold 12px system-ui'; g.textAlign='center';
      g.fillText('柵の角',pr.x,Math.max(14,pr.y-rr*1.9)); g.textAlign='left';
    }
  }
  mEgoPano(proj,g,side,w,h);                         // 5) 自車フランク（フルパネル＋後輪）
  mGapRead(proj,g,side);                             // 6) 教習の隙間読み（後退中のみ）
  g.restore();
  mMirHousing(g,w,h,inset,r);                       // 7) ハウジング（生画面空間）
}
function renderMirror(side){ renderDoorMirror(side); }

/* フロントガラス視界：前方の目標（柵・枠・目安ライン）が実際どう見えるか */
function renderFront(){
  const el=document.getElementById('frontCv'); if(!el)return; const g=el.getContext('2d');
  const w=el.getBoundingClientRect().width, h=el.getBoundingClientRect().height; if(!M||w<2)return;
  g.clearRect(0,0,w,h);
  if(rearGlance){ renderRearGlance(g,w,h); return; }
  const cam=toWorld(car,1.5,-(C.width/2-0.55)), camH=1.22+zAt(car.x,car.y);   // 右ハンドル運転席の目線（路面高さに追従）
  const look=car.th, focal=w*0.46, horizon=h*0.50;
  mSky(g,w,h,horizon);
  const proj=mkProj(cam.x,cam.y,camH,look,focal,horizon,w,+1);    // 前方＝鏡像なし
  // 地面の奥行きグリッド（速度感・距離感）
  g.strokeStyle='rgba(60,70,84,.30)'; g.lineWidth=1;
  const cs0=Math.cos(look), sn0=Math.sin(look);
  for(let d=2;d<=16;d+=2){ let prev=null; for(let o=-8;o<=8;o+=2){ const p=proj(cam.x+cs0*d-sn0*o, cam.y+sn0*d+cs0*o, 0);
    if(p&&prev){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke();} prev=p; } }
  mWorld(proj,g);
  // 切り始めの目安ライン（地面の青ライン）が前方に見える
  if(showGuide&&!examMode&&(M.successKind==='perp'||M.successKind==='parallel')){ let prev=null; g.strokeStyle='rgba(77,163,255,.85)'; g.lineWidth=3;
    for(let y=bounds.minY;y<=bounds.maxY;y+=0.4){ const p=proj(M.turnRefX,y,0.02); if(p&&prev){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke();} prev=p; } }
  // 信号インジケータ：接近すると実際の灯器は視界の上に外れるため、隅に現在の表示を出す
  if(M.signals&&M.signals.length){
    const sg=M.signals[0], d=sg.x-car.x;
    if(d>-6&&d<70){
      const bw=Math.min(96,w*0.13), bh=Math.max(20,bw*0.30), bx=w-bw-8, by=6;
      g.fillStyle='rgba(8,12,18,.78)'; g.beginPath();
      g.moveTo(bx+4,by); g.lineTo(bx+bw-4,by); g.quadraticCurveTo(bx+bw,by,bx+bw,by+4);
      g.lineTo(bx+bw,by+bh-4); g.quadraticCurveTo(bx+bw,by+bh,bx+bw-4,by+bh);
      g.lineTo(bx+4,by+bh); g.quadraticCurveTo(bx,by+bh,bx,by+bh-4);
      g.lineTo(bx,by+4); g.quadraticCurveTo(bx,by,bx+4,by); g.closePath(); g.fill();
      const cols=['#ff5a4d','#ffcf3f','#3ad07a'], on=sg.state==='red'?0:sg.state==='yellow'?1:2;
      const r=bh*0.30;
      for(let i=0;i<3;i++){ const cx=bx+bw*(0.22+i*0.28), cy=by+bh*0.5;
        g.fillStyle = i===on? cols[i] : 'rgba(52,58,66,.9)';
        g.beginPath(); g.arc(cx,cy,r,0,7); g.fill(); }
      g.fillStyle='#dfe6ef'; g.font='bold 10px system-ui'; g.textAlign='right';
      g.fillText(Math.ceil(sg.remain||0)+'s', bx+bw-4, by+bh-3); g.textAlign='left';
    }
  }
  // 自車のボンネット（RHDで少し右寄りに見える）
  const cs2=carCorners(car), pl=proj(cs2[0].x,cs2[0].y,0.98), pr=proj(cs2[1].x,cs2[1].y,0.98);
  if(pl&&pr){ const topY=Math.min(pl.y,pr.y); const grd=g.createLinearGradient(0,topY,0,h);
    grd.addColorStop(0,'#e6635a'); grd.addColorStop(0.45,CARCOL); grd.addColorStop(1,'#5f1b17');
    g.beginPath(); g.moveTo(-8,h+8); g.lineTo(pl.x,pl.y); g.lineTo(pr.x,pr.y); g.lineTo(w+8,h+8); g.closePath();
    g.fillStyle=grd; g.fill();
    g.strokeStyle='#521512'; g.lineWidth=2; g.beginPath(); g.moveTo(pl.x,pl.y); g.lineTo(pr.x,pr.y); g.stroke();
    const shine=g.createLinearGradient(0,topY,0,topY+18);
    shine.addColorStop(0,'rgba(255,255,255,.28)'); shine.addColorStop(1,'rgba(255,255,255,0)');
    g.beginPath(); g.moveTo(pl.x,pl.y); g.lineTo(pr.x,pr.y); g.lineTo(pr.x,pr.y+16); g.lineTo(pl.x,pl.y+16); g.closePath(); g.fillStyle=shine; g.fill(); }
  // Aピラー（窓のフレーム感）
  const pw=Math.max(10,w*0.02);
  for(const [x0,x1] of [[0,pw],[w-pw,w]]){ const pg=g.createLinearGradient(x0,0,x1,0);
    pg.addColorStop(x0===0?0:1,'#05070b'); pg.addColorStop(x0===0?1:0,'rgba(5,7,11,.25)');
    g.fillStyle=pg; g.beginPath();
    if(x0===0){ g.moveTo(0,0); g.lineTo(pw*2.2,0); g.lineTo(pw,h); g.lineTo(0,h); }
    else { g.moveTo(w,0); g.lineTo(w-pw*2.2,0); g.lineTo(w-pw,h); g.lineTo(w,h); }
    g.closePath(); g.fill(); }
  g.strokeStyle='#05070b'; g.lineWidth=2; g.strokeRect(1,1,w-2,h-2);
}
/* 後方目視（振り返り視界）：後ろを振り向いてリヤウインド越しに柵の角を見る。
   角がCピラーの際に来た瞬間＝切り始めの位置、という体感を作る（鏡像ではなく実像） */
const PILLAR_INNER=0.28;                                    // Cピラー内側の画面比（幾何校正済み）
const GLANCE_BIAS=0.30;                                     // 振り返りをロック側へ向ける角度（肩越し）
function renderRearGlance(g,w,h){
  const lockSign=M.lockLabel==='右'?1:-1;
  const cam=toWorld(car,0.62,-0.12), camH=1.24;            // 運転席で振り返った頭の位置
  const look=car.th+Math.PI+lockSign*GLANCE_BIAS, focal=w*0.50, horizon=h*0.38;  // 肩越しにロック側後方を見る
  mSky(g,w,h,horizon);
  const proj=mkProj(cam.x,cam.y,camH,look,focal,horizon,w,+1);  // 振り返り＝鏡像なし(sgn=+1)
  const cs=Math.cos(look), sn=Math.sin(look);
  g.strokeStyle='rgba(60,70,84,.24)'; g.lineWidth=1;
  for(let d=1;d<=14;d+=1.5){ let prev=null; for(let o=-7;o<=7;o+=1.75){ const p=proj(cam.x+cs*d-sn*o,cam.y+sn*d+cs*o,0);
    if(p&&prev){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke();} prev=p; } }
  mWorld(proj,g);
  // 切り始めの目安ライン（地面の青ライン）
  if(showGuide&&!examMode){ let prev=null; g.strokeStyle='rgba(77,163,255,.85)'; g.lineWidth=3;
    for(let y=bounds.minY;y<=bounds.maxY;y+=0.35){ const p=proj(M.turnRefX,y,0.02); if(p&&prev){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke();} prev=p; } }
  // 角支柱がCピラー際に来たら「切り始め！」（校正済みの位置に来た瞬間に光る）
  let cueHit=false, cueX=null;
  if(M.successKind==='perp' && cuePoleRef){
    const pr=proj(cuePoleRef.x,cuePoleRef.y,0.45);
    if(pr && pr.x>2 && pr.x<w-2 && pr.depth>0.6){ cueX=pr.x;
      const edge=Math.abs(pr.x-w*PILLAR_INNER)<Math.abs(pr.x-w*(1-PILLAR_INNER))?w*PILLAR_INNER:w*(1-PILLAR_INNER);
      cueHit=Math.abs(pr.x-edge)<w*0.055 && !examMode;
      const rr=clamp(52/pr.depth,9,Math.min(w,h)*0.24), al=0.5+0.4*Math.abs(Math.sin(tick*0.15));
      g.strokeStyle=cueHit?`rgba(255,207,63,${0.55+0.4*Math.abs(Math.sin(tick*0.2))})`:`rgba(55,214,122,${al})`;
      g.lineWidth=3; g.beginPath(); g.ellipse(pr.x,pr.y,rr,rr*1.6,0,0,7); g.stroke();
      g.fillStyle=cueHit?'#ffcf3f':'#37d67a'; g.font='bold 12px system-ui'; g.textAlign='center';
      g.fillText(cueHit?'🎯 切り始め！':'柵の角',pr.x,Math.max(14,pr.y-rr*1.7)); g.textAlign='left'; }
  }
  drawRearCabin(g,w,h);
  // ヘッダー表示
  g.fillStyle='rgba(0,0,0,.55)'; g.fillRect(0,0,w,20);
  g.fillStyle='#dfe6ef'; g.font='bold 11px system-ui'; g.textAlign='left';
  g.fillText('👀 後方（振り返り）',6,14);
  const hy=h*0.66;
  if(cueHit){ g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(w*0.14,hy-13,w*0.72,18);
    g.fillStyle='#ffcf3f'; g.textAlign='center'; g.font='bold 12.5px system-ui';
    g.fillText('角がピラー際＝ここで止めて切り始め',w/2,hy); g.textAlign='left'; }
  else if(!examMode){ g.fillStyle='rgba(0,0,0,.4)'; g.fillRect(w*0.18,hy-12,w*0.64,17);
    g.fillStyle='rgba(230,236,244,.9)'; g.textAlign='center'; g.font='11px system-ui';
    g.fillText('柵の角がCピラーの際に来る位置まで',w/2,hy); g.textAlign='left'; }
}
function rrect(g,x,y,ww,hh,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+ww,y,x+ww,y+hh,r); g.arcTo(x+ww,y+hh,x,y+hh,r); g.arcTo(x,y+hh,x,y,r); g.arcTo(x,y,x+ww,y,r); g.closePath(); }
function drawRearCabin(g,w,h){
  const pin=PILLAR_INNER, deckY=h*0.82, topIn=0.11;
  // リヤデッキ（下の棚）＋ヘッドレスト
  const shelf=g.createLinearGradient(0,deckY,0,h); shelf.addColorStop(0,'#2b2f38'); shelf.addColorStop(1,'#111318');
  g.fillStyle=shelf; g.fillRect(0,deckY,w,h-deckY);
  g.strokeStyle='#3a3f4b'; g.lineWidth=1.5; g.beginPath(); g.moveTo(0,deckY); g.lineTo(w,deckY); g.stroke();
  for(const cx of [w*0.41,w*0.59]){ g.fillStyle='#15171c'; rrect(g,cx-w*0.05,deckY-h*0.09,w*0.10,h*0.11,5); g.fill();
    g.strokeStyle='#242832'; g.lineWidth=1.3; g.stroke(); }
  // Cピラー（左右）＝上外側から下内側へ。窓は上広がりの台形
  g.fillStyle='#0a0c10';
  g.beginPath(); g.moveTo(0,0); g.lineTo(w*topIn,0); g.lineTo(w*pin,deckY); g.lineTo(0,deckY); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(w,0); g.lineTo(w*(1-topIn),0); g.lineTo(w*(1-pin),deckY); g.lineTo(w,deckY); g.closePath(); g.fill();
  // ルーフヘッダ
  const hdr=g.createLinearGradient(0,0,0,h*0.09); hdr.addColorStop(0,'#05070b'); hdr.addColorStop(1,'#12151b');
  g.fillStyle=hdr; g.fillRect(0,0,w,h*0.07);
  // リヤウインドの熱線
  g.strokeStyle='rgba(150,120,60,.10)'; g.lineWidth=1;
  for(let i=1;i<6;i++){ const yy=h*0.09+i*(deckY-h*0.09)/6; g.beginPath(); g.moveTo(w*(pin*0.92),yy); g.lineTo(w*(1-pin*0.92),yy); g.stroke(); }
  g.strokeStyle='#05070b'; g.lineWidth=2; g.strokeRect(1,1,w-2,h-2);
}
function renderRearview(){
  const el=document.getElementById('mirC'); if(!el)return; const g=el.getContext('2d');
  const w=el.getBoundingClientRect().width, h=el.getBoundingClientRect().height; if(!M||w<2)return;
  g.clearRect(0,0,w,h);
  const cam=toWorld(car,-0.2,0), camH=1.18;
  const look=car.th+Math.PI + mirrorPan.C;
  const focal=w*0.44, horizon=clamp(h*0.50 - mirrorPitch.C*h, 8, h-8);
  mSky(g,w,h,horizon); const proj=mkProj(cam.x,cam.y,camH,look,focal,horizon,w);
  drawMirrorGrid(g,proj,cam.x,cam.y,look);
  mWorld(proj,g);
  const rl=toWorld(car,-C.rearOverhang,C.width/2), rr=toWorld(car,-C.rearOverhang,-C.width/2);
  const a=proj(rl.x,rl.y,0.6), b=proj(rr.x,rr.y,0.6), a0=proj(rl.x,rl.y,0), b0=proj(rr.x,rr.y,0);
  if(a&&b&&a0&&b0){ const grd=g.createLinearGradient(0,Math.min(a.y,b.y),0,Math.max(a0.y,b0.y));
    grd.addColorStop(0,'#7a221d'); grd.addColorStop(1,'#3c0f0d'); g.fillStyle=grd;
    g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.lineTo(b0.x,b0.y); g.lineTo(a0.x,a0.y); g.closePath(); g.fill(); }
  mHousing(g,w,h);
}

/* ==================== ゲージ更新（DOM） ==================== */
function updateGauges(){ document.getElementById('kmh').textContent=Math.round(Math.abs(car.v)*3.6); }

/* ==================== メニューのアイコン ==================== */
function drawIcons(){ document.querySelectorAll('canvas[data-ico]').forEach(cv=>{ cv.width=46;cv.height=46; const g=cv.getContext('2d'), m=MODELS[cv.dataset.ico];
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9; for(const r of [...m.rects,m.bay]){ minX=Math.min(minX,r.x0);maxX=Math.max(maxX,r.x1);minY=Math.min(minY,r.y0);maxY=Math.max(maxY,r.y1);}
  const s=Math.min(42/(maxX-minX),42/(maxY-minY)), px=x=>2+(x-minX)*s, py=y=>44-(y-minY)*s;
  g.fillStyle='#2a3346'; for(const r of m.rects) g.fillRect(px(r.x0),py(r.y1),(r.x1-r.x0)*s,(r.y1-r.y0)*s);
  g.fillStyle='#17253c'; g.fillRect(px(m.bay.x0),py(m.bay.y1),(m.bay.x1-m.bay.x0)*s,(m.bay.y1-m.bay.y0)*s);
  g.fillStyle='#5a6a8c'; for(const o of m.parkedCars) g.fillRect(px(o.x0),py(o.y1),(o.x1-o.x0)*s,(o.y1-o.y0)*s);
  g.strokeStyle='#4da3ff'; g.lineWidth=1.6; g.setLineDash([3,2]); g.beginPath(); m.ideal.path.forEach((p,i)=>{const X=px(p.x),Y=py(p.y);i?g.lineTo(X,Y):g.moveTo(X,Y);}); g.stroke(); g.setLineDash([]); }); }

/* 起動 */
drawIcons(); loadScenario('perpR'); setGearUI(); requestAnimationFrame(step);
</script>
