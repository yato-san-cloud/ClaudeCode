  // =====================================================================
  //  particle / shake integration
  // =====================================================================
  function updateShake(dt) {
    if (_shake.mag <= 0) { _shake.x = 0; _shake.y = 0; return; }
    _shake.t += dt;
    var p = U.clamp(_shake.t / _shake.dur, 0, 1);
    var amp = _shake.mag * (1 - U.ease.out(p));
    if (amp <= 0.02) { _shake.mag = 0; _shake.x = 0; _shake.y = 0; return; }
    var a = crand() * 6.283;
    _shake.x = Math.cos(a) * amp;
    _shake.y = Math.sin(a) * amp;
  }
  function updateParticles(dt) {
    var ds = dt / 1000;
    for (var i = _particles.length - 1; i >= 0; i--) {
      var p = _particles[i];
      if (p.delay > 0) { p.delay -= dt; continue; }
      p.life -= dt;
      if (p.life <= 0) { _particles.splice(i, 1); continue; }
      p.vy += p.g * ds;
      p.x += p.vx * ds;
      p.y += p.vy * ds;
      p.rot += p.vrot * ds;
    }
  }

  // =====================================================================
  //  WEATHER buffers + update
  // =====================================================================
  function buildWeatherBuffers() {
    var area = cssW * cssH;
    var cap = U.clamp((area / 9000) | 0, 40, 170);
    _rain = mkField(cap, function () { return { x: crange(-40, cssW + 40), y: crange(-cssH, cssH), v: crange(680, 900), len: crange(10, 18) }; });
    _snow = mkField((cap * 0.7) | 0, function () { return { x: crange(0, cssW), y: crange(-cssH, cssH), v: crange(40, 90), r: crange(1.5, 3.4), ph: crange(0, 6.28) }; });
    _clouds = mkField(5, function () { return { x: crange(-120, cssW), y: crange(0, cssH * 0.4), v: crange(6, 16), s: crange(90, 190) }; });
    _motes = mkField((cap * 0.45) | 0, function () { return { x: crange(0, cssW), y: crange(0, cssH), v: crange(6, 16), r: crange(1, 2.6), ph: crange(0, 6.28), drift: crange(-8, 8) }; });
  }
  function mkField(n, f) { var a = []; for (var i = 0; i < n; i++) a.push(f()); return a; }
  function weatherId() { var s = Game.state; return (s && s.weather) || 'sunny'; }

  function updateWeather(dt) {
    if (!particlesOn()) return;
    var ds = dt / 1000, w = weatherId();
    if (w === 'rainy' && _rain) {
      for (var i = 0; i < _rain.length; i++) {
        var d = _rain[i]; d.y += d.v * ds; d.x -= d.v * 0.28 * ds;
        if (d.y > cssH + 10) { d.y = crange(-30, -4); d.x = crange(-40, cssW + 40); }
      }
    } else if (w === 'snowy' && _snow) {
      for (var j = 0; j < _snow.length; j++) {
        var f = _snow[j]; f.ph += ds * 1.4; f.y += f.v * ds;
        f.x += Math.sin(f.ph) * 10 * ds;
        if (f.y > cssH + 6) { f.y = crange(-20, -2); f.x = crange(0, cssW); }
      }
    }
    if (_clouds && (w === 'cloudy' || w === 'rainy')) {
      for (var c = 0; c < _clouds.length; c++) {
        var cl = _clouds[c]; cl.x += cl.v * ds;
        if (cl.x > cssW + 200) cl.x = -cl.s - crange(20, 160);
      }
    }
    // ambient motes only on clear days
    if (_motes && w === 'sunny') {
      for (var m = 0; m < _motes.length; m++) {
        var mo = _motes[m]; mo.ph += ds; mo.y -= mo.v * ds; mo.x += Math.sin(mo.ph) * mo.drift * ds;
        if (mo.y < -6) { mo.y = cssH + crange(0, 40); mo.x = crange(0, cssW); }
      }
    }
  }

  // =====================================================================
  //  SPRITE dispatch (call peer Sprites.* if present, else cute fallback)
  // =====================================================================
  function SP() { return Game.Sprites; }

  function drawShadow(wx, wy, r) {
    ctx.save();
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = PAL.ui.shadow;
    ctx.beginPath();
    ctx.ellipse(wx, wy, r, r * 0.42, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  function drawTileSprite(terrain, wx, wy, variant) {
    var s = SP();
    if (s && typeof s.tile === 'function') { try { s.tile(ctx, terrain, wx, wy, TILE, variant); return; } catch (e) { Game._recordError('Sprites.tile', e); } }
    // fallback tile
    var base = PAL.grass.base, edge = PAL.grass.mid;
    if (terrain === 'water') { base = PAL.water.base; edge = PAL.water.dark; }
    else if (terrain === 'dirt') { base = PAL.soil.base; edge = PAL.soil.dark; }
    else if (terrain === 'path') { base = PAL.path.base; edge = PAL.path.dark; }
    var shade = (variant & 1) ? 0.05 : 0;
    ctx.fillStyle = shade ? mix(base, edge, 0.18) : base;
    ctx.fillRect(wx, wy, TILE + 1, TILE + 1);
    if (terrain === 'grass') {
      ctx.strokeStyle = rgba(hx(PAL.grass.blade), 0.5);
      ctx.lineWidth = 1.5;
      var bx = wx + (variant * 11 + 6) % (TILE - 8) + 4, by = wy + TILE - 4;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - 2, by - 7); ctx.moveTo(bx + 3, by); ctx.lineTo(bx + 4, by - 6); ctx.stroke();
    } else if (terrain === 'water') {

  }

  function drawBuildingSprite(b, lit, scale) {
    var wx = (b.tx + b.w / 2) * TILE, wy = (b.ty + b.h) * TILE; // feet center

  function drawAnimalSprite(a) {

    ctx.beginPath(); ctx.arc(r * 0.28, -r * 0.42, r * 0.1, 0, 6.2832); ctx.arc(r * 0.9, -r * 0.42, r * 0.1, 0, 6.2832); ctx.fill();

  function drawCropSprite(c) {

    if (s && typeof s.crop === 'function') {

      catch (e) { Game._recordError('Sprites.crop', e); }

    var D = Game.DATA, cd = D.crops[c.cropId] || {};
    var top = cd.isDecor ? PAL.accent.pink : (c.dead ? '#9A8C6B' : PAL.grass.mid);
    var h = [6, 12, 20, 28][stage] || 10;

  // little cosmetic ground flowers (deterministic, culled) — free charm
  function drawGroundFlower(wx, wy, seed, season) {
    var col = PAL.foliage[season] || PAL.accent.pink;
    ctx.save();
    ctx.translate(wx, wy);
    ctx.fillStyle = col;
    for (var i = 0; i < 5; i++) {
      var a = (i / 5) * 6.283;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 2.6, Math.sin(a) * 2.6, 1.7, 0, 6.2832); ctx.fill();

  // =====================================================================
  //  LAYER DRAWS
  // =====================================================================
  function skyAt(t) {
    t = ((t % 1) + 1) % 1;
    for (var i = 0; i < SKY_KEYS.length - 1; i++) {
      if (t >= SKY_KEYS[i][0] && t <= SKY_KEYS[i + 1][0]) {
        var f = U.invLerp(SKY_KEYS[i][0], SKY_KEYS[i + 1][0], t);
        var a = SKY_KEYS[i][1], b = SKY_KEYS[i + 1][1];
        return { top: mix(a.top, b.top, f), mid: mix(a.mid, b.mid, f), low: mix(a.low, b.low, f) };
      }
    }
    return SKY_KEYS[0][1];
  }

  function drawSky() {
    var s = Game.state;
    var t = ((s.minuteOfDay % 1440) / 1440);
    var sky = skyAt(t);
    var g = ctx.createLinearGradient(0, 0, 0, cssH);
    g.addColorStop(0, sky.top);
    g.addColorStop(0.55, sky.mid);
    g.addColorStop(1, sky.low);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);

    // sun / moon arc across the sky
    var Time = Game.Time;
    var light = Time && Time.lightLevel ? Time.lightLevel() : 1;
    var isNight = Time && Time.isNight ? Time.isNight() : (t > 0.83 || t < 0.16);
    // day arc: t 0.15..0.85 -> sun ; else moon
    var arcT, celest, glow, cr;
    if (!isNight) {
      arcT = U.clamp(U.invLerp(0.15, 0.85, t), 0, 1);
      celest = PAL.light.sun; glow = PAL.light.sun; cr = 20;
    } else {
      var nt = t < 0.16 ? t + 1 : t;
      arcT = U.clamp(U.invLerp(0.83, 1.16, nt), 0, 1);
      celest = PAL.light.moon; glow = PAL.light.moon; cr = 15;
    }
    var cxp = cssW * (0.1 + arcT * 0.8);
    var cyp = cssH * (0.62 - Math.sin(arcT * Math.PI) * 0.5);
    var gg = ctx.createRadialGradient(cxp, cyp, 2, cxp, cyp, cr * 3.2);
    gg.addColorStop(0, rgba(hx(glow), 0.6)); gg.addColorStop(1, rgba(hx(glow), 0));
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cxp, cyp, cr * 3.2, 0, 6.2832); ctx.fill();
    ctx.fillStyle = celest; ctx.beginPath(); ctx.arc(cxp, cyp, cr, 0, 6.2832); ctx.fill();
    if (isNight) { // crescent bite
      ctx.fillStyle = sky.top; ctx.beginPath(); ctx.arc(cxp + cr * 0.5, cyp - cr * 0.35, cr * 0.9, 0, 6.2832); ctx.fill();
    }
    // stars at night
    if (isNight) {
      var starA = U.clamp((1 - light) * 1.4, 0, 1);
      ctx.fillStyle = rgba(hx(PAL.light.star), starA * 0.9);
      for (var i = 0; i < 40; i++) {
        var sx = (U.hash01(i, 3) * cssW), sy = U.hash01(i, 7) * cssH * 0.6;
        var tw = 0.6 + 0.4 * Math.sin(_present * 0.002 + i);
        ctx.globalAlpha = starA * tw; ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;
    }
    // hazy clouds in cloudy/rainy weather (soft, drawn in sky band)
    var w = weatherId();
    if ((w === 'cloudy' || w === 'rainy') && _clouds && particlesOn()) {
      for (var c = 0; c < _clouds.length; c++) {
        var cl = _clouds[c];
        ctx.fillStyle = rgba(hx(PAL.wx.cloud), w === 'rainy' ? 0.55 : 0.7);
        puff(cl.x, cl.y + 12, cl.s);
      }
    }
  }
  function puff(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, s * 0.28, 0, 6.2832);
    ctx.arc(x + s * 0.32, y - s * 0.1, s * 0.34, 0, 6.2832);
    ctx.arc(x + s * 0.66, y, s * 0.28, 0, 6.2832);
    ctx.arc(x + s * 0.34, y + s * 0.12, s * 0.3, 0, 6.2832);
    ctx.fill();
  }

  function viewRect() {
    var c = cam();
    return { x: c.x, y: c.y, w: cssW / c.zoom, h: cssH / c.zoom };
  }

  function drawTerrain() {
    var s = Game.state, g = s.grid; if (!g) return;
    var vr = viewRect();
    var x0 = Math.max(0, Math.floor(vr.x / TILE) - 1), y0 = Math.max(0, Math.floor(vr.y / TILE) - 1);
    var x1 = Math.min(g.w - 1, Math.ceil((vr.x + vr.w) / TILE) + 1), y1 = Math.min(g.h - 1, Math.ceil((vr.y + vr.h) / TILE) + 1);
    var season = s.season || 'spring';
    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        var t = g.tiles[y * g.w + x]; if (!t) continue;
        drawTileSprite(t.terrain, x * TILE, y * TILE, t.variant || 0);
        // cosmetic flowers on some grass tiles
        if (t.terrain === 'grass' && !t.cropId && !t.buildingId && U.hash01(x * 131 + y * 57, 21) > 0.9) {
          drawGroundFlower(x * TILE + 12 + U.hash01(x, 2) * 20, y * TILE + 16 + U.hash01(y, 4) * 18, x + y, season);
        }
      }
    }
    // season atmosphere: recolor the whole visible world so each season reads at a glance
    var fx = SEASON_FX[season];
    if (fx) {
      ctx.save();
      ctx.globalCompositeOperation = fx.mode;
      ctx.globalAlpha = fx.alpha;
      ctx.fillStyle = fx.color;
      ctx.fillRect(vr.x - TILE, vr.y - TILE, vr.w + TILE * 2, vr.h + TILE * 2);
      if (fx.mode2) {
        ctx.globalCompositeOperation = fx.mode2;
        ctx.globalAlpha = fx.alpha2;
        ctx.fillStyle = fx.color2;
        ctx.fillRect(vr.x - TILE, vr.y - TILE, vr.w + TILE * 2, vr.h + TILE * 2);
      }
      ctx.restore();
    }
  }

  function drawEntities() {
    var s = Game.state;
    var vr = viewRect();
    var pad = TILE * 3;
    var list = [];
    var i, arr;
    arr = s.crops || [];
    for (i = 0; i < arr.length; i++) {
      var c = arr[i]; var cwx = (c.tx + 0.5) * TILE, cwy = (c.ty + 1) * TILE;
      if (cwx < vr.x - pad || cwx > vr.x + vr.w + pad || cwy < vr.y - pad || cwy > vr.y + vr.h + pad) continue;
      list.push({ y: cwy, kind: 'crop', ref: c });
    }
    arr = s.buildings || [];
    for (i = 0; i < arr.length; i++) {
      var b = arr[i]; var bwx = (b.tx + b.w / 2) * TILE, bwy = (b.ty + b.h) * TILE;
      if (bwx < vr.x - pad - b.w * TILE || bwx > vr.x + vr.w + pad || bwy < vr.y - pad || bwy > vr.y + vr.h + pad + b.h * TILE) continue;
      list.push({ y: bwy, kind: 'building', ref: b });
    }
    arr = s.animals || [];
    for (i = 0; i < arr.length; i++) {
      var a = arr[i];

    [5, 9, 12, 17]   // IV
  ];
  var MAJOR = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16]; // scale degrees for the melody

  // Per-season key root (Hz, ~octave 3) + tempo (seconds per chord).
  var SEASON_MUSIC = {
    spring: { root: 261.63, chordDur: 3.6 }, // C
    summer: { root: 293.66, chordDur: 3.2 }, // D  (a touch brighter/faster)
    autumn: { root: 246.94, chordDur: 4.0 }, // B  (mellow)
    winter: { root: 220.00, chordDur: 4.4 }  // A  (calm, slow)
  };

  // ---------------------------------------------------------------- helpers
  function now() { return ac ? ac.currentTime : 0; }
  function semis(root, n) { return root * Math.pow(2, n / 12); }

  function settings() {
    var s = Game.state;
    return (s && s.settings) || { master: 0.8, sfx: 0.9, music: 0.5, muted: false, reduceMotion: false };
  }

  function hidden() {
    try { return typeof document !== 'undefined' && document.hidden === true; }
    catch (e) { return false; }
  }

  // Create the AudioContext + gain graph on demand. Returns true if usable.
  function ensureContext() {
    if (ac) return true;
    if (unavailable) return false;
    try {
      var AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
      if (!AC) { unavailable = true; return false; }
      ac = new AC();
      master = ac.createGain();
      sfxBus = ac.createGain();
      musicBus = ac.createGain();
      sfxBus.connect(master);
      musicBus.connect(master);
      master.connect(ac.destination);
      applyVolumes();
      return true;
    } catch (e) {
      unavailable = true; ac = null;
      // Never let audio break the game.
      if (Game._recordError) Game._recordError('Audio.ensureContext', e);
      return false;
    }
  }

  function whiteNoise() {
    if (!ac) return null;
    if (noiseBuf) return noiseBuf;
    try {
      var len = Math.floor(ac.sampleRate * 0.4);
      noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      // fill with a private RNG so we never touch the sim RNG stream
      for (var j = 0; j < len; j++) d[j] = whiteRng() * 2 - 1;
      return noiseBuf;
    } catch (e) { return null; }
  }
  // private RNG for noise/melody (does NOT advance Game.state.rngState)
  var whiteRng = U.makeRng ? U.makeRng(0x9E3779B1) : function () { return 0.5; };

  // Smoothly set a gain param, avoiding clicks & zero-value exponential errors.
  function ramp(param, target, t0, dur) {
    try {
      var v = Math.max(0.0001, param.value);
      param.cancelScheduledValues(t0);
      param.setValueAtTime(v, t0);
      if (target <= 0.0001) param.exponentialRampToValueAtTime(0.0001, t0 + dur);
      else param.exponentialRampToValueAtTime(target, t0 + dur);
    } catch (e) { try { param.setValueAtTime(target, t0); } catch (e2) {} }
  }

  // One short oscillator voice with an attack/decay envelope. Soft-capped.
  function voice(opts) {
    if (!ac || !sfxBus) return;
    if (activeVoices >= MAX_VOICES) return;
    try {
      var t0 = (opts.at != null ? opts.at : now());
      var type = opts.type || 'sine';
      var g = ac.createGain();
      var osc = ac.createOscillator();
      osc.type = type;

      var f0 = opts.f0 || 440;
      osc.frequency.setValueAtTime(f0, t0);
      if (opts.f1 != null) {
        // pitch glide (linear in log space feels natural but linear is fine here)
        osc.frequency.setValueAtTime(f0, t0);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, opts.f1), t0 + (opts.glide || (opts.dur || 0.15)));
      }
      if (opts.detune) osc.detune.setValueAtTime(opts.detune, t0);

      var peak = (opts.gain != null ? opts.gain : 0.3);
      var atk = opts.atk != null ? opts.atk : 0.006;
      var dur = opts.dur != null ? opts.dur : 0.14;

      var out = g;
      // optional lowpass shaping
      if (opts.lp) {
        var f = ac.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.setValueAtTime(opts.lp, t0);
        if (opts.lp1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(60, opts.lp1), t0 + dur);
        osc.connect(f); f.connect(g);
      } else {
        osc.connect(g);
      }

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      out.connect(opts.bus || sfxBus);

      activeVoices++;
      osc.onended = function () { activeVoices--; try { g.disconnect(); } catch (e) {} };
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) {
      if (Game._recordError) Game._recordError('Audio.voice', e);
    }
  }

  // Filtered-noise burst (for thunks / build sfx).
  function noiseBurst(opts) {
    if (!ac || !sfxBus) return;
    if (activeVoices >= MAX_VOICES) return;
    var buf = whiteNoise();
    if (!buf) return;
    try {
      var t0 = (opts.at != null ? opts.at : now());
      var src = ac.createBufferSource();
      src.buffer = buf;
      var f = ac.createBiquadFilter();
      f.type = opts.filter || 'lowpass';
      f.frequency.setValueAtTime(opts.cut || 900, t0);
      if (opts.cut1 != null) f.frequency.exponentialRampToValueAtTime(Math.max(80, opts.cut1), t0 + (opts.dur || 0.18));
      if (opts.q != null) f.Q.setValueAtTime(opts.q, t0);
      var g = ac.createGain();
      var peak = opts.gain != null ? opts.gain : 0.3;
      var dur = opts.dur != null ? opts.dur : 0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(opts.bus || sfxBus);
      activeVoices++;
      src.onended = function () { activeVoices--; try { g.disconnect(); } catch (e) {} };
      src.start(t0);
      src.stop(t0 + dur + 0.02);
    } catch (e) {
      if (Game._recordError) Game._recordError('Audio.noiseBurst', e);
    }
  }

  // ---------------------------------------------------------------- SFX bank
  function playSfx(id, opts) {
    if (unavailable) return;
    if (!ensureContext()) return;
    // Try to resume if a gesture already unlocked us; otherwise the sound is
    // simply inaudible (no throw) until the first gesture.
    try { if (ac.state === 'suspended' && started) ac.resume(); } catch (e) {}
    if (!master) return;
    opts = opts || {};
    var t = now() + 0.001;
    var v = (opts.vol != null ? opts.vol : 1);

    switch (id) {
      case 'coin': {
        // quick rising major arpeggio, triangle — bright & satisfying
        var base = 660;
        var seq = [0, 4, 7, 12];
        for (var i = 0; i < seq.length; i++) {
          voice({ type: 'triangle', f0: semis(base, seq[i]), at: t + i * 0.045, dur: 0.12, gain: 0.22 * v, atk: 0.004 });
        }
        break;
      }
      case 'pop': {
        // little upward pop with a quick pitch drop tail
        voice({ type: 'sine', f0: 520, f1: 880, glide: 0.05, at: t, dur: 0.09, gain: 0.26 * v, atk: 0.003 });
        break;
      }
      case 'moo': {
        // low detuned sine gliding down — cozy cow
        voice({ type: 'sine', f0: 196, f1: 130, glide: 0.42, at: t, dur: 0.5, gain: 0.3 * v, atk: 0.03, lp: 700, detune: -6 });
        voice({ type: 'sine', f0: 200, f1: 132, glide: 0.42, at: t, dur: 0.5, gain: 0.22 * v, atk: 0.03, detune: +8 });
        break;
      }
      case 'chick': {
        // two high square chirps
        voice({ type: 'square', f0: 1560, f1: 1980, glide: 0.03, at: t, dur: 0.05, gain: 0.12 * v, atk: 0.002, lp: 4200 });
        voice({ type: 'square', f0: 1720, f1: 2100, glide: 0.03, at: t + 0.08, dur: 0.05, gain: 0.11 * v, atk: 0.002, lp: 4200 });
        break;
      }
      case 'build': {
        // filtered-noise thunk + a soft low thump
        noiseBurst({ filter: 'lowpass', cut: 1400, cut1: 260, dur: 0.16, gain: 0.32 * v, q: 1.2 });
        voice({ type: 'sine', f0: 150, f1: 70, glide: 0.14, at: t, dur: 0.2, gain: 0.34 * v, atk: 0.004 });
        break;
      }
      case 'click': {
        // tiny sine tick
        voice({ type: 'sine', f0: 880, at: t, dur: 0.045, gain: 0.14 * v, atk: 0.002 });
        break;
      }
      case 'error': {
        // soft descending two-note — gentle, never harsh
        voice({ type: 'triangle', f0: 440, at: t, dur: 0.13, gain: 0.2 * v, atk: 0.004, lp: 2200 });
        voice({ type: 'triangle', f0: 349.23, at: t + 0.11, dur: 0.18, gain: 0.2 * v, atk: 0.004, lp: 2000 });
        break;
      }
      case 'levelup': {
        // rising arpeggio + sparkle shimmer on top
        var lu = [0, 4, 7, 12, 16];
        for (var k = 0; k < lu.length; k++) {
          voice({ type: 'triangle', f0: semis(523.25, lu[k]), at: t + k * 0.07, dur: 0.2, gain: 0.22 * v, atk: 0.004 });
        }
        for (var s2 = 0; s2 < 5; s2++) {
          var sp = 1800 + s2 * 260;
          voice({ type: 'sine', f0: sp, at: t + 0.34 + s2 * 0.05, dur: 0.14, gain: 0.06 * v, atk: 0.003 });
        }
        break;
      }
      case 'heart': {
        // bright, gentle ping (two-osc bell-ish)
        voice({ type: 'sine', f0: 1180, f1: 1320, glide: 0.06, at: t, dur: 0.22, gain: 0.16 * v, atk: 0.003 });
        voice({ type: 'triangle', f0: 1770, at: t + 0.02, dur: 0.16, gain: 0.06 * v, atk: 0.003 });
        break;
      }
      case 'plant': {
        // short soft earthy blip
        voice({ type: 'triangle', f0: 330, f1: 392, glide: 0.05, at: t, dur: 0.1, gain: 0.2 * v, atk: 0.004, lp: 1600 });
        break;
      }
      case 'harvest': {
        // cheerful two-note pluck up
        voice({ type: 'triangle', f0: 587.33, at: t, dur: 0.1, gain: 0.2 * v, atk: 0.003 });
        voice({ type: 'triangle', f0: 783.99, at: t + 0.07, dur: 0.13, gain: 0.2 * v, atk: 0.003 });
        break;
      }
      default: {
        // unknown id -> tiny neutral click, never throw
        voice({ type: 'sine', f0: 660, at: t, dur: 0.05, gain: 0.12 * v, atk: 0.002 });
      }
    }
  }

  // ---------------------------------------------------------------- MUSIC
  function seasonKey() {
    var s = Game.state;
    var season = (s && s.season) || 'spring';
    return SEASON_MUSIC[season] || SEASON_MUSIC.spring;
  }

  function buildMusic(id) {
    if (!ac || !musicBus) return null;
    try {
      var key = seasonKey();
      var padGain = ac.createGain();
      padGain.gain.value = 0.0001;
      var filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 900;
      filter.Q.value = 0.4;

      // gentle filter wobble for a living pad
      var lfo = ac.createOscillator();
      var lfoGain = ac.createGain();
      lfo.frequency.value = 0.06;
      lfoGain.gain.value = 220;
      lfo.connect(lfoGain); lfoGain.connect(filter.frequency);

      var padOsc = [];
      var types = ['sine', 'triangle', 'sine', 'sine'];
      for (var i = 0; i < PROG[0].length; i++) {
        var o = ac.createOscillator();
        o.type = types[i % types.length];
        o.frequency.value = semis(key.root, PROG[0][i] - 12); // an octave down for warmth
        if (i > 0) o.detune.value = (i % 2 === 0 ? 4 : -4);
        o.connect(filter);
        padOsc.push(o);
      }
      filter.connect(padGain);
      padGain.connect(musicBus);

      var melodyGain = ac.createGain();
      melodyGain.gain.value = 1;
      melodyGain.connect(musicBus);

      var t = now();
      padOsc.forEach(function (o) { try { o.start(t); } catch (e) {} });
      try { lfo.start(t); } catch (e) {}
      // fade pad in
      ramp(padGain.gain, 0.09, t, 2.0);

      return {
        id: id,
        padOsc: padOsc, padGain: padGain, filter: filter,
        lfo: lfo, lfoGain: lfoGain, melodyGain: melodyGain,
        chordIndex: 0,
        nextChordTime: t + key.chordDur,
        nextNoteTime: t + 0.5,
        rng: U.makeRng ? U.makeRng((Game.state && Game.state.seed) ? (Game.state.seed ^ 0x1234) : 12345) : function () { return whiteRng(); },
        root: key.root,
        chordDur: key.chordDur,
        beat: key.chordDur / 4
      };
    } catch (e) {
      if (Game._recordError) Game._recordError('Audio.buildMusic', e);
      return null;
    }
  }

  function retuneChord(m, chordIdx, atTime) {
    var key = seasonKey();
    m.root = key.root; m.chordDur = key.chordDur; m.beat = key.chordDur / 4;
    var chord = PROG[chordIdx % PROG.length];
    for (var i = 0; i < m.padOsc.length; i++) {
      var target = semis(m.root, chord[i % chord.length] - 12);
      try {
        m.padOsc[i].frequency.cancelScheduledValues(atTime);
        m.padOsc[i].frequency.setValueAtTime(m.padOsc[i].frequency.value, atTime);
        m.padOsc[i].frequency.linearRampToValueAtTime(target, atTime + 0.8);
      } catch (e) {}
    }
  }

  // Sparse music-box melody note (bright triangle + short decay).
  function melodyNote(m, atTime) {
    if (!ac) return;
    var key = seasonKey();
    var chord = PROG[m.chordIndex % PROG.length];
    // ~55% chance of a note per beat -> sparse & pretty
    if (m.rng() > 0.55) return;
    // pick a scale degree, biased toward chord tones
    var pickChordTone = m.rng() < 0.6;
    var deg;
    if (pickChordTone) deg = chord[(m.rng() * chord.length) | 0];
    else deg = MAJOR[(m.rng() * MAJOR.length) | 0];
    var octave = m.rng() < 0.35 ? 12 : 0;
    var f = semis(m.root, deg + octave);
    voice({
      type: 'triangle', f0: f, at: atTime, dur: 0.5, gain: 0.07, atk: 0.005,
      lp: 3200, bus: m.melodyGain
    });
    // faint octave sparkle
    if (m.rng() < 0.25) {
      voice({ type: 'sine', f0: f * 2, at: atTime + 0.01, dur: 0.3, gain: 0.025, atk: 0.004, bus: m.melodyGain });
    }
  }

  function advanceMusic() {
    if (!music || !ac) return;
    var lookahead = 0.25; // seconds
    var t = now();
    var horizon = t + lookahead;
    var guard = 0;

    // chord changes
    while (music.nextChordTime < horizon && guard++ < 32) {
      music.chordIndex = (music.chordIndex + 1) % PROG.length;
      retuneChord(music, music.chordIndex, music.nextChordTime);
      music.nextChordTime += music.chordDur;
    }
    // melody beats
    guard = 0;
    while (music.nextNoteTime < horizon && guard++ < 64) {
      melodyNote(music, music.nextNoteTime);
      music.nextNoteTime += music.beat;
    }
  }

  function stopMusicNow() {
    if (!music) { wantMusic = null; return; }
    var m = music; music = null;
    var t = now();
    try { ramp(m.padGain.gain, 0.0001, t, 0.6); } catch (e) {}
    var stopAt = t + 0.8;
    try { m.padOsc.forEach(function (o) { try { o.stop(stopAt); } catch (e) {} }); } catch (e) {}
    try { m.lfo.stop(stopAt); } catch (e) {}
    // disconnect a little after the fade completes
    setTimeoutSafe(function () {
      try { m.padGain.disconnect(); } catch (e) {}
      try { m.filter.disconnect(); } catch (e) {}
      try { m.melodyGain.disconnect(); } catch (e) {}
      try { m.lfoGain.disconnect(); } catch (e) {}
    }, 900);
  }

  function setTimeoutSafe(fn, ms) {
    try { if (typeof setTimeout !== 'undefined') setTimeout(fn, ms); } catch (e) {}
  }

  // ---------------------------------------------------------------- MIXER
  function applyVolumes() {
    if (!master) return;
    var st = settings();
    var t = now();
    var muted = !!st.muted || hidden();
    var mv = muted ? 0.0001 : Math.max(0.0001, (st.master != null ? st.master : 0.8));
    var sv = Math.max(0.0001, (st.sfx != null ? st.sfx : 0.9));
    // duck the music channel when requested
    var duck = (duckUntil > t) ? duckAmt : 1;
    var muv = Math.max(0.0001, (st.music != null ? st.music : 0.5) * duck);
    try {
      ramp(master.gain, mv, t, 0.08);
      ramp(sfxBus.gain, sv, t, 0.05);
      ramp(musicBus.gain, muv, t, 0.12);
    } catch (e) {}
  }

  // ---------------------------------------------------------------- gestures / wiring
  function onFirstGesture() {
    if (started) return;
    if (!ensureContext()) return;
    started = true;
    try { if (ac.state === 'suspended') ac.resume(); } catch (e) {}
    applyVolumes();
    // start pastoral music once we're allowed to make sound
    var st = settings();
    if (wantMusic == null && !st.muted) wantMusic = 'ranch';
    if (wantMusic != null && !music) {
      music = buildMusic(wantMusic);
      wantMusic = null;
    }
  }

  function attachGestureListeners() {
    if (typeof window === 'undefined' || !window.addEventListener) return;
    var handler = function () {
      onFirstGesture();
      try {
        window.removeEventListener('pointerdown', handler, true);
        window.removeEventListener('keydown', handler, true);
        window.removeEventListener('touchstart', handler, true);
      } catch (e) {}
    };
    try {
      window.addEventListener('pointerdown', handler, true);
      window.addEventListener('keydown', handler, true);
      window.addEventListener('touchstart', handler, true);
    } catch (e) {}
  }

  function attachVisibility() {
    if (typeof document === 'undefined' || !document.addEventListener) return;
    try {
      document.addEventListener('visibilitychange', function () {
        applyVolumes();
        // pause/resume the context to save CPU when tab is hidden
        try {
          if (!ac) return;
          if (hidden()) { if (ac.state === 'running') ac.suspend(); }
          else if (started && ac.state === 'suspended') ac.resume();
        } catch (e) {}
      });
    } catch (e) {}
  }

  function wireBus() {
    if (wired) return; wired = true;
    function on(ev, fn) { try { bus.on(ev, fn); } catch (e) {} }

    on('sale', function () { playSfx('coin'); });
    on('purchase', function () { playSfx('pop'); });
    on('build', function () { playSfx('build'); });
    on('animal:born', function () { playSfx('heart'); });
    on('levelup', function () { playSfx('levelup'); });
    on('crop:plant', function () { playSfx('plant'); });
    on('crop:harvest', function () { playSfx('harvest'); });
    on('fx:heart', function () { playSfx('heart'); });
    on('notify', function (p) { if (p && p.kind === 'bad') playSfx('error'); });

    // keep mixer in sync when settings change elsewhere
    on('speed:change', function () { /* no-op; hook point */ });
    on('season:change', function () {
      // gently re-key the running pad to the new season on its next chord
      if (music) { var key = seasonKey(); music.chordDur = key.chordDur; music.beat = key.chordDur / 4; }
    });
    on('game:pause', function () { duckUntil = now() + 0.4; applyVolumes(); });
    on('game:resume', function () { applyVolumes(); });
    on('state:replaced', function () {
      // new game / load: reseed melody & refresh mixer
      if (music && U.makeRng) music.rng = U.makeRng((Game.state && Game.state.seed) ? (Game.state.seed ^ 0x1234) : 12345);
      applyVolumes();
    });
  }

  // ---------------------------------------------------------------- public API
  function init(ctx) {
    try {
      wireBus();
      attachGestureListeners();
      attachVisibility();
      // Build the graph now if the environment allows it (so mixer reflects
      // settings immediately). It stays suspended until the first user gesture.
      ensureContext();
      applyVolumes();
    } catch (e) {
      if (Game._recordError) Game._recordError('Audio.init', e);
    }
  }

  function update() {
    if (unavailable || !ac || !started) return;
    try {
      // re-apply duck decay each frame (cheap) and advance the scheduler
      applyVolumes();
      if (music) advanceMusic();
    } catch (e) {
      if (Game._recordError) Game._recordError('Audio.update', e);
    }
  }

  function sfx(id, opts) {
    try { playSfx(id, opts); }
    catch (e) { if (Game._recordError) Game._recordError('Audio.sfx:' + id, e); }
  }

  function playMusic(id) {
    id = id || 'ranch';
    try {
      if (!ensureContext()) { wantMusic = id; return; }
      if (!started) { wantMusic = id; return; } // wait for gesture unlock
      if (music && music.id === id) return;
      if (music) stopMusicNow();
      music = buildMusic(id);
    } catch (e) {
      if (Game._recordError) Game._recordError('Audio.playMusic', e);
    }
  }

  function stopMusic() {
    try { wantMusic = null; stopMusicNow(); }
    catch (e) { if (Game._recordError) Game._recordError('Audio.stopMusic', e); }
  }

  function duckFor(ms) {
    if (!ac) return;
    try {
      duckUntil = now() + (Math.max(0, ms || 300) / 1000);
      applyVolumes();
    } catch (e) {}
  }

  function setVolumes(v) {
    // Persist into live settings (UI owns settings, but Audio may be asked to
    // apply directly). Only touch provided keys; never cache the state object.
    try {
      var st = Game.state && Game.state.settings;
      if (st && v) {
        if (v.master != null) st.master = U.clamp(v.master, 0, 1);
        if (v.sfx != null) st.sfx = U.clamp(v.sfx, 0, 1);
        if (v.music != null) st.music = U.clamp(v.music, 0, 1);
      }
      applyVolumes();
    } catch (e) { if (Game._recordError) Game._recordError('Audio.setVolumes', e); }
  }

  function setMuted(b) {
    try {
      var st = Game.state && Game.state.settings;
      if (st) st.muted = !!b;
      applyVolumes();
    } catch (e) { if (Game._recordError) Game._recordError('Audio.setMuted', e); }
  }

  return {
    init: init,
    update: update,
    sfx: sfx,
    playMusic: playMusic,
    stopMusic: stopMusic,
    duckFor: duckFor,
    setVolumes: setVolumes,
    setMuted: setMuted
  };
})();

})();

/* ======================= module: input ======================= */
(function(){
/*
 * input.js — Game.Input: pointer + touch + keyboard on the world canvas.
 *
 * Responsibilities
 *  - Drag to pan (Render.panBy), wheel & pinch to zoom (Render.zoomAt anchored at
 *    cursor / pinch midpoint), two-finger pan.
 *  - Tap-vs-drag disambiguation via a movement threshold; press-hold detection.
 *  - Placement TOOLS (build / plant / buyAnimal / decorate): register/set/clear,

  function upgradeCostOf(b) {

    var def = D.buildings[b.type]; if (!def) return null;
    var maxLvl = 4;
    if ((b.level || 1) >= maxLvl) return null;
    return Math.round((def.buildCost || 200) * (0.75 + 0.55 * (b.level || 1)));
  }

  function doFeed(an) {
    var a = ANI(); if (!a || !a.feed) return;
    var feedId = pickFeedItem();
    if (!feedId) { notify({ text: 'エサが ないよ〜。さくもつを しゅうかくしよう', icon: '🌾', kind: 'warn' }); sfx('error'); return; }
    if (a.feed(an.id, feedId)) { sfx('pop'); queuePanelRefresh(); }

  // pick the best available feed item present in inventory (data-driven).
  // Prefer higher feedQuality/hunger from balance.feed.feedItems.
  function pickFeedItem() {
    var s = S(); var inv = s.inventory || {};
    var items = (D.feed && D.feed.feedItems) || null;
    if (items) {
      var keys = Object.keys(items).filter(function (k) { return (inv[k] || 0) > 0; });
      keys.sort(function (x, y) {
        var fx = items[x] || {}, fy = items[y] || {};
        return ((fy.feedQuality || 0) * 100 + (fy.hunger || 0)) - ((fx.feedQuality || 0) * 100 + (fx.hunger || 0));
      });
      if (keys.length) return keys[0];
    }
    var order = ['alfalfa', 'corn', 'wheat', 'hay', 'clover', 'grass', 'carrot', 'turnip', 'pumpkin'];
    for (var i = 0; i < order.length; i++) if ((inv[order[i]] || 0) > 0) return order[i];
    for (var k in inv) { if (inv[k] > 0 && D.crops[k]) return k; }
    return null;
  }

    var prev = h[h.length - 2] || price;
    var diff = price - prev;
    if (diff > 0.5) return { txt: '📈 ' + gramt(D.basePrice(id)) + ' → じょうしょう', dir: 1 };

  function sparkline(s, id) {
    var days = (D.market && D.market.trendSparklineDays) || 7;
    var h = (s.market.history && s.market.history[id]) || [];
    h = h.slice(-days);
    var w = 62, ht = 26, pad = 3;
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'spark'); svg.setAttribute('viewBox', '0 0 ' + w + ' ' + ht);
    if (h.length < 2) { return svg; }
    var min = Math.min.apply(null, h), max = Math.max.apply(null, h);
    var rng = (max - min) || 1;
    var pts = h.map(function (v, i) {
      var x = pad + (i / (h.length - 1)) * (w - pad * 2);
      var y = ht - pad - ((v - min) / rng) * (ht - pad * 2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    var pl = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    pl.setAttribute('points', pts);
    var up = h[h.length - 1] >= h[0];
    pl.setAttribute('stroke', up ? 'var(--good)' : 'var(--alert)');
    svg.appendChild(pl);
    return svg;
  }

        opts = opts || {};

        modalLayer.appendChild(layer);

/* ======================= module: game ======================= */
(function(){
/*
 * game.js — bootstrap + main loop + orchestration + test hooks.
 * Wires init order, owns the RAF loop with a fixed-timestep sim decoupled from
 * render, and exposes Game.test.* for the headless QA harness.
 *
 * Robustness: every per-frame module call is crash-isolated — a throw is
 * recorded to Game._errors and the loop keeps running, so a single subsystem
 * bug never freezes the whole game (critical for iterative QA).
 */
(function () {
  'use strict';
  var K = Game.DATA.const;

  // ---------- global error capture ----------
  Game._errors = [];
  Game._recordError = function (where, err) {
    var msg = (err && err.stack) ? err.stack : String(err);
    Game._errors.push({ where: where, msg: msg });
    if (Game._errors.length > 200) Game._errors.shift();
    if (typeof console !== 'undefined') console.error('[' + where + ']', err);
  };
  try {
    window.addEventListener('error', function (e) { Game._recordError('window.onerror', e.error || e.message); });
    window.addEventListener('unhandledrejection', function (e) { Game._recordError('unhandledrejection', e.reason); });
  } catch (e) { }

  var MODULE_INIT_ORDER = ['Time', 'Economy', 'World', 'Crops', 'Animals', 'Sprites', 'Render', 'Audio', 'Input', 'UI', 'Tutorial'];

  function callInit(ns, ctx) {
    var m = Game[ns];
    if (m && typeof m.init === 'function') {
      try { m.init(ctx); }
      catch (e) { Game._recordError('init:' + ns, e); }
    }
  }
  function callSafe(ns, method, arg) {
    var m = Game[ns];
    if (m && typeof m[method] === 'function') {
      try { return m[method](arg); }
      catch (e) { Game._recordError(ns + '.' + method, e); }
    }
    return undefined;
  }

  function buildCtx() {
    var byId = function (id) { try { return document.getElementById(id); } catch (e) { return null; } };
    return {
      canvas: byId('world'),
      root: byId('app'),
      hud: byId('hud'),
      dock: byId('dock'),
      panels: byId('panels'),
      toast: byId('toast'),
      overlay: byId('overlay'),
      get state() { return Game.state; }
    };
  }

  var _ctx = null;

  // ---------- boot ----------
  Game.boot = function () {
    // apply persisted settings early (volume/reduceMotion) if any
    var savedSettings = Game.Save && Game.Save.loadSettings ? Game.Save.loadSettings() : null;

    // decide: continue existing save, else fresh new game
    var loaded = false;
    if (Game.Save && Game.Save.hasSave && Game.Save.hasSave(0)) {
      loaded = Game.Save.load(0);
    }
    if (!loaded) {
      Game.State.set(Game.State.newGame());
    }
    if (savedSettings && Game.state && Game.state.settings) {
      Game.Util.deepMerge(Game.state.settings, savedSettings);
    }

    _ctx = buildCtx();

    // init all modules in canonical order (guarded)
    MODULE_INIT_ORDER.forEach(function (ns) { callInit(ns, _ctx); });

    if (Game.Save && Game.Save.enableAutosave) Game.Save.enableAutosave(1);

    callSafe('Render', 'resize');
    callSafe('Render', 'centerOnStart');

    Game._ready = true;
    Game.bus.emit('game:ready', {});

    // start tutorial only for a brand-new game
    if (!loaded && Game.state.tutorial && Game.state.tutorial.active) {
      callSafe('Tutorial', 'start');
    }

    Game.start();
  };

  // ---------- main loop ----------
  var SIM_DT = 1000 / K.SIM_HZ;
  var MIN_PER_STEP = K.MINUTES_PER_DAY / (K.REAL_SECONDS_PER_DAY * K.SIM_HZ); // 1.5 min/step @1x
  var _raf = 0, _last = 0, _acc = 0, _running = false;
  var _presentation = 0;

  function simStep() {
    var speed = (Game.state.settings && Game.state.settings.speed) || 1;
    var minutes = MIN_PER_STEP * speed;
    callSafe('Time', 'step', minutes);
    callSafe('Crops', 'update', 1);
    callSafe('Animals', 'update', 1);
    callSafe('Economy', 'update', 1);
    callSafe('World', 'update', 1);
  }

  function frame(now) {
    if (!_running) return;
    var dt = now - _last; _last = now;
    if (dt < 0) dt = 0; if (dt > 250) dt = 250; // spike guard
    _presentation += dt;
    if (Game.state) Game.state.playtimeMs += dt;

    if (Game.state && !Game.state.paused) {
      _acc += dt;
      var steps = 0;
      while (_acc >= SIM_DT && steps < 6) { simStep(); _acc -= SIM_DT; steps++; }
      if (_acc > SIM_DT * 8) _acc = 0; // hard clamp after long stalls
    }

    callSafe('Render', 'frame', now);
    callSafe('Audio', 'update', now);
    callSafe('UI', 'tick', now);

    _raf = requestAnimationFrame(frame);
  }

  Game.start = function () {
    if (_running) return;
    _running = true; _last = (typeof performance !== 'undefined' ? performance.now() : Date.now()); _acc = 0;
    _raf = requestAnimationFrame(frame);
  };
  Game.stop = function () { _running = false; if (_raf) cancelAnimationFrame(_raf); _raf = 0; };

  Game.pause = function () { if (Game.state) { Game.state.paused = true; Game.bus.emit('game:pause', {}); } };
  Game.resume = function () { if (Game.state) { Game.state.paused = false; Game.bus.emit('game:resume', {}); } };
  Game.togglePause = function () { if (Game.state.paused) Game.resume(); else Game.pause(); };
  Game.isPaused = function () { return !!(Game.state && Game.state.paused); };
  Game.setSpeed = function (s) {
    if (!Game.state) return;
    var speeds = K.SPEEDS;
    if (speeds.indexOf(s) < 0) s = 1;

    Game.state.paused = false;

  };

  // ---------- new / continue / reset ----------
  function freshState(skipTutorial) {
    Game.State.set(Game.State.newGame());
    if (skipTutorial && Game.state.tutorial) Game.state.tutorial.active = false;
    Game.bus.emit('state:replaced', { reason: 'newgame' });

    callSafe('UI', 'refreshHUD');

  Game.continueGame = function () { if (Game.Save.hasSave(0)) { Game.Save.load(0); Game.bus.emit('state:replaced', { reason: 'continue' }); callSafe('Render', 'centerOnStart'); callSafe('UI', 'refreshHUD'); } };

  // ---------- test hooks (headless QA harness) ----------
  function firstBuildingWithCapacity(kinds) {
    var s = Game.state;
    for (var i = 0; i < s.buildings.length; i++) {
      var b = s.buildings[i];
      if (kinds.indexOf(b.type) >= 0 && b.inhabitants.length < (b.capacity || 0)) return b;
    }
    return null;
  }
  Game.test = {
    ready: function () { return !!(Game.state && Game._ready); },
    newGame: function () { freshState(true); return { ok: true }; },
    snapshot: function () {
      var s = Game.state; if (!s) return { err: 'no state' };
      var cows = 0, babies = 0; s.animals.forEach(function (a) { if (a.species === 'cow') cows++; if (!a.adult) babies++; });
      return {
        money: Math.round(s.money), day: s.day, season: s.season, year: s.year,
        rank: s.rank, weather: s.weather, minuteOfDay: Math.round(s.minuteOfDay),
        animals: s.animals.length, cows: cows, babies: babies,
        buildings: s.buildings.length, crops: s.crops.length,
        inventoryKinds: Object.keys(s.inventory).length,
        inventoryUnits: Object.keys(s.inventory).reduce(function (n, k) { return n + s.inventory[k]; }, 0),
        errors: Game._errors.length
      };
    },
    advanceDays: function (n) { n = n || 1; for (var i = 0; i < n; i++) callSafe('Time', 'step', 1440); return { ok: true, day: Game.state.day }; },
    advanceMinutes: function (m) { callSafe('Time', 'step', m || 60); return { ok: true }; },
    buyAnimal: function (breedId) {
      breedId = breedId || 'chicken';
      var isCow = Game.DATA.isCow(breedId);
      var b = firstBuildingWithCapacity(isCow ? ['barn', 'barn_big'] : ['coop', 'barn', 'barn_big', 'pasture']);
      if (Game.Animals && Game.Animals.buy) { var r = Game.Animals.buy(breedId, b ? b.id : null); return r || { ok: true }; }
      return { ok: false, err: 'Animals.buy missing' };
    },
    build: function (type, tx, ty) {
      if (Game.World && Game.World.place) { var id = Game.World.place(type, tx, ty); return { ok: id > 0, id: id }; }
      return { ok: false, err: 'World.place missing' };
    },
    plant: function (cropId, tx, ty) {
      if (Game.Crops && Game.Crops.plant) { var id = Game.Crops.plant(cropId, tx, ty); return { ok: id > 0, id: id }; }
      return { ok: false, err: 'Crops.plant missing' };
    },
    harvestAll: function () {
      var s = Game.state, got = 0;
      if (Game.Crops && Game.Crops.harvest) {
        s.crops.slice().forEach(function (c) { if (Game.Crops.isReady && Game.Crops.isReady(c.id)) { var r = Game.Crops.harvest(c.tx, c.ty); if (r && r.ok) got++; } });
      }
      return { ok: true, harvested: got };
    },
    sellAll: function () {
      var s = Game.state, sold = 0;
      if (Game.Economy && Game.Economy.sell) {
        Object.keys(s.inventory).forEach(function (id) {
          var q = s.inventory[id]; var prod = Game.DATA.products[id];
          if (q > 0 && prod) { var r = Game.Economy.sell(id, q); if (r && r.ok) sold += q; }
        });
      }
      return { ok: true, sold: sold };
    },
    petRandom: function () {
      var s = Game.state; if (!s.animals.length) return { ok: true };
      var a = s.animals[(Game.Util.rng() * s.animals.length) | 0];
      if (Game.Animals && Game.Animals.pet) Game.Animals.pet(a.id);
      return { ok: true, id: a.id };
    },
    save: function () { return { ok: Game.Save.save(0) }; },
    load: function () { return { ok: Game.Save.load(0) }; },
    setSpeed: function (s) { Game.setSpeed(s); return { ok: true }; },
    errors: function () { return Game._errors.slice(); },
    state: function () { return Game.state; }
  };
})();

})();

(function(){
  function boot(){ try { if (Game.boot) Game.boot(); else console.error('Game.boot missing'); } catch(e){ console.error('BOOT ERROR', e); var el=document.getElementById('boot-error'); if(el){el.style.display='block'; el.textContent='起動エラー: '+(e && e.message);} } }
