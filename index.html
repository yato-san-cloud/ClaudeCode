<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>教習所トレーナー（運転席モード）</title>
<style>
  :root{ --bg:#0d1118; --panel:#161c28; --panel2:#1d2534; --ink:#e8edf6; --sub:#93a1b8;
    --ok:#37d67a; --warn:#ffb020; --bad:#ff5c5c; --accent:#4da3ff; --accent2:#7c5cff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;}
  #app{position:relative; width:100%; height:100%; overflow:hidden; background:#0a1220;}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block;}
  /* 上部バー */
  #topbar{position:absolute; top:0; left:0; right:0; height:28px; display:flex; align-items:center; gap:5px; padding:3px 8px; z-index:8; pointer-events:none;}
  #topbar .t{font-size:11px; font-weight:700; background:rgba(12,18,28,.6); padding:2px 6px; border-radius:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:30%;}
  #topbar button{pointer-events:auto; background:#26304a; color:var(--ink); border:0; border-radius:6px; padding:4px 7px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  #topbar button.on{background:var(--accent); color:#04101f;} #topbar button.menu{background:var(--accent2); color:#fff;} #topbar .sp{flex:1;}
  #btnExam.on{background:#ff8b3d; color:#241000;}
  .mir.checked{border-color:var(--ok); box-shadow:0 0 8px rgba(55,214,122,.7);}
  /* 結果パネル */
  #resultPanel{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:40; background:rgba(5,8,14,.6);}
  #resultPanel.show{display:flex;}
  #resultPanel .box{width:min(92%,410px); max-height:92%; overflow:auto; background:#141a26; border:1px solid #2b364d; border-radius:14px; padding:13px 16px;}
  #resultPanel h3{margin:0 0 2px; font-size:18px;}
  #resultPanel h3.pass{color:var(--ok);} #resultPanel h3.fail{color:var(--bad);}
  #resultPanel .score{font-size:12.5px; color:var(--sub); margin-bottom:6px;}
  #resultPanel ul{margin:5px 0; padding-left:18px; font-size:12px; line-height:1.55;}
  #resultPanel .sec-t{font-size:11px; color:var(--sub); font-weight:700; margin-top:7px;}
  #resultPanel .adv{font-size:12px; color:var(--warn); margin:6px 0 0;}
  #resultPanel .btns{display:flex; gap:8px; margin-top:11px;}
  #resultPanel .btns button{flex:1; border:0; border-radius:9px; padding:10px 0; font-weight:800; background:var(--accent); color:#04101f;}
  #resultPanel .btns button.sec{background:#26304a; color:var(--ink);}
  /* フロントガラス視界（上帯）。ミラーは実車と同じくこの中に重ねる */
  #frontBox{position:absolute; top:28px; left:0; right:0; height:40%; z-index:5; overflow:hidden; background:#000; border-bottom:2px solid #05070b;}
  #frontBox canvas{display:block; width:100%; height:100%;}
  #frontBox .flab{position:absolute; left:6px; bottom:3px; font-size:9px; color:#9fb0c8; background:rgba(0,0,0,.45); padding:0 3px; border-radius:3px;}
  /* ミラー（フロント視界内：左右下隅＋上中央） */
  .mir{position:absolute; width:148px; height:66px; background:#000; border:1px solid #2b364d; border-radius:8px; overflow:hidden; z-index:6; touch-action:none;}
  #mirLbox{left:6px; top:calc(28px + 40% - 72px);} #mirRbox{right:6px; top:calc(28px + 40% - 72px);}
  #mirCbox{left:50%; transform:translateX(-50%); width:198px; height:58px; top:32px;}
  .mir .lab{font-size:10px;}
  .mir canvas{display:block; width:100%; height:100%;}
  .mir .lab{position:absolute; left:4px; top:2px; font-size:9px; color:#9fb0c8; background:rgba(0,0,0,.45); padding:0 3px; border-radius:3px;}
  .mir .adj{position:absolute; right:4px; bottom:2px; font-size:8px; color:#8fa0b8;}
  /* 速度・ギア（フロント視界の下端中央＝ダッシュ計器） */
  #spd{position:absolute; top:calc(28px + 37% - 32px); left:50%; transform:translateX(-50%); z-index:6; background:rgba(18,22,30,.88); border:1px solid #2b364d; border-radius:9px; padding:2px 11px; display:flex; align-items:baseline; gap:9px;}
  #spd .kmh{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
  #spd .u{font-size:9px; color:var(--sub);}
  #spd .gear b{font-size:13px; font-weight:800; color:#3b4560; margin:0 1px;} #spd .gear b.act{color:var(--accent);}
  /* コーチ（下中央） */
  #coach{position:absolute; left:50%; transform:translateX(-50%); bottom:6px; max-width:44%; text-align:center; z-index:6; pointer-events:none;}
  #coach .msg{display:inline-block; font-size:12.5px; font-weight:700; background:rgba(12,18,28,.86); border:1px solid #2b364d; border-radius:9px; padding:5px 10px;}
  .msg.ok{color:var(--ok);border-color:var(--ok);} .msg.warn{color:var(--warn);border-color:var(--warn);} .msg.bad{color:var(--bad);border-color:var(--bad);}
  /* 左親指：サイド/目視＋ペダル */
  #leftCluster{position:absolute; left:8px; bottom:8px; width:172px; z-index:9;}
  #prep{display:flex; gap:6px; margin-bottom:6px;}
  #prep button{flex:1; height:32px; border:0; border-radius:8px; background:var(--panel2); color:var(--ink); font-weight:800; font-size:11.5px;}
  #handbrake.on{background:#c2333f; color:#fff;}
  #lookback:active{background:var(--accent); color:#04101f;}
  #pedals{display:flex; gap:6px;}
  .pedal{flex:1; height:96px; border:0; border-radius:12px; font-weight:800; font-size:14px; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .pedal.brake{background:#7a2530;} .pedal.brake.held{background:var(--bad); transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  .pedal.accel{background:#1f5a37;} .pedal.accel.held{background:var(--ok); color:#04101f; transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  /* 右親指：シフト＋ハンドル */
  #rightCluster{position:absolute; right:8px; bottom:8px; display:flex; flex-direction:row; align-items:flex-end; gap:8px; z-index:9;}
  #shifter{display:flex; flex-direction:column; gap:5px; width:50px;}
  #shifter button{height:40px; border:0; border-radius:8px; background:var(--panel2); color:var(--sub); font-weight:800; font-size:15px;}
  #shifter button.act{background:var(--accent); color:#04101f;}
  #wheelBox{display:flex; flex-direction:column; align-items:center; gap:4px;}
  #recenter{background:#26304a; color:var(--ink); border:0; border-radius:8px; padding:5px 11px; font-size:11px; font-weight:700;}
  #wheel{touch-action:none; display:block;}
  /* メニュー */
  #menu{position:fixed; inset:0; background:#0b0f17; display:none; flex-direction:column; gap:10px; padding:14px 16px; overflow:auto; z-index:30;}
  #menu.show{display:flex;} #menu h2{margin:2px 0 0; font-size:16px;}
  #menu p.lead{margin:0; color:var(--sub); font-size:11.5px;}
  .cards{display:flex; gap:10px; flex-wrap:wrap;}
  .card{flex:1 1 200px; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid #2b364d; border-radius:12px; padding:10px; text-align:left;}
  .card:active{border-color:var(--accent);}
  .card canvas{width:46px;height:46px;flex:0 0 46px;} .card .t{font-size:14px;font-weight:800;} .card .d{font-size:11px;color:var(--sub);margin-top:2px;}
  #menu .close{align-self:center; background:#26304a; color:var(--ink); border:0; border-radius:9px; padding:9px 20px; font-weight:700;}
  /* チュートリアル解説ポップアップ（要所で自動停止して「ぴゅっ」と出る） */
  #tutorPop{position:fixed; left:50%; bottom:60px; transform:translateX(-50%); z-index:38; display:none; width:min(88vw,500px);}
  #tutorPop.show{display:block; animation:pyu .22s cubic-bezier(.2,1.7,.45,1);}
  #tutorPop .tp-box{background:#0f2038; border:2px solid #4da3ff; border-radius:13px; padding:11px 14px; box-shadow:0 10px 30px rgba(0,0,0,.55);}
  #tutorPop .tp-tag{font-size:10.5px; font-weight:800; color:#4da3ff; letter-spacing:.06em; margin-bottom:3px;}
  #tutorPop .tp-txt{font-size:13px; line-height:1.7; white-space:pre-line;}
  #tutorPop button{margin-top:9px; width:100%; border:0; border-radius:9px; padding:9px 0; font-weight:800; background:var(--accent); color:#04101f; font-size:13.5px;}
  @keyframes pyu{from{transform:translateX(-50%) scale(.45); opacity:0;} to{transform:translateX(-50%) scale(1); opacity:1;}}
  #rotate{position:fixed; inset:0; background:#0d1118; color:var(--ink); display:none; align-items:center; justify-content:center; text-align:center; z-index:50; font-size:15px; padding:24px;}
  @media (orientation:portrait){ #rotate{display:flex;} }
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="topbar">
    <button class="menu" id="btnMenu">≡課題</button>
    <span class="t" id="title">方向転換（右バック）</span>
    <span class="sp"></span>
    <button id="btnSound" class="on">🔊音</button>
    <button id="btnDemo">▶実演</button>
    <button id="btnTutor">🎓解説付き</button>
    <button id="btnExam">検定</button>
    <button id="btnGuide" class="on">お手本</button>
    <button id="btnLines" class="on">タイヤ線</button>
    <button id="creep" class="on">クリープON</button>
    <button id="reset">やり直し</button>
  </div>
  <div id="frontBox"><canvas id="frontCv"></canvas><span class="flab" id="frontLab">フロント</span></div>
  <div class="mir" id="mirLbox"><canvas id="mirL"></canvas><span class="lab">左ミラー</span><span class="adj">調整:ドラッグ</span></div>
  <div class="mir" id="mirRbox"><canvas id="mirR"></canvas><span class="lab">右ミラー</span><span class="adj">調整:ドラッグ</span></div>
  <div class="mir" id="mirCbox"><canvas id="mirC"></canvas><span class="lab">ルームミラー</span></div>
  <div id="spd"><span><span class="kmh" id="kmh">0</span> <span class="u">km/h</span></span><span class="gear"><b data-g="P">P</b><b data-g="R">R</b><b data-g="N">N</b><b data-g="D">D</b></span></div>
  <div id="coach"><span class="msg" id="coachMsg">課題を選んでスタート</span></div>

  <!-- 左親指：サイド/目視＋ペダル -->
  <div id="leftCluster">
    <div id="prep"><button id="handbrake" class="on">🅿 サイド</button><button id="lookback">👀 後方目視</button></div>
    <div id="pedals"><button class="pedal brake" id="brake">ブレーキ</button><button class="pedal accel" id="accel">アクセル</button></div>
  </div>
  <!-- 右親指：シフト＋ハンドル -->
  <div id="rightCluster">
    <div id="shifter"><button data-g="P" class="act">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button></div>
    <div id="wheelBox"><button id="recenter">まっすぐ</button><canvas id="wheel"></canvas></div>
  </div>

  <div id="tutorPop"><div class="tp-box"><div class="tp-tag">🎓 ここがポイント</div><div class="tp-txt" id="tutorTxt"></div><button id="tutorNext">つづける ▶</button></div></div>

  <div id="resultPanel"><div class="box">
    <h3 id="resTitle">結果</h3><div class="score" id="resScore"></div>
    <div id="resBody"></div>
    <div class="btns"><button id="resRetry">もう一度</button><button id="resMenu" class="sec">課題をえらぶ</button></div>
  </div></div>

  <div id="menu">
    <h2>課題をえらぶ</h2>
    <p class="lead">卒検で崩れやすい3課題。横向き推奨・右手の親指で操作できます。</p>
    <div class="cards">
      <button class="card" data-id="perpR"><canvas data-ico="perpR"></canvas><div><div class="t">方向転換（右バック）</div><div class="d">右のポケットへ後退</div></div></button>
      <button class="card" data-id="perpL"><canvas data-ico="perpL"></canvas><div><div class="t">方向転換（左バック）</div><div class="d">左のポケットへ後退</div></div></button>
      <button class="card" data-id="parallel"><canvas data-ico="parallel"></canvas><div><div class="t">縦列駐車</div><div class="d">S字で切り返し</div></div></button>
      <button class="card" data-id="hill"><canvas data-ico="hill"></canvas><div><div class="t">坂道発進</div><div class="d">10%の坂で逆行させず発進</div></div></button>
      <button class="card" data-id="scurve"><canvas data-ico="scurve"></canvas><div><div class="t">S字カーブ</div><div class="d">幅3.5mの曲線路</div></div></button>
      <button class="card" data-id="crank"><canvas data-ico="crank"></canvas><div><div class="t">クランク</div><div class="d">直角に折れる狭路</div></div></button>
      <button class="card" data-id="railway"><canvas data-ico="railway"></canvas><div><div class="t">踏切</div><div class="d">一時停止と安全確認</div></div></button>
      <button class="card" data-id="signal"><canvas data-ico="signal"></canvas><div><div class="t">信号交差点</div><div class="d">赤・黄の判断</div></div></button>
    </div>
    <p class="lead">※ コース寸法は仮の標準値。教習車＝マツダ アクセラ セダン想定。実寸で本人仕様に。</p>
    <button class="close" id="menuClose">閉じる</button>
  </div>
</div>
<div id="rotate">📱 横向き（ランドスケープ）にしてください</div>

<script>
"use strict";
const DEG=Math.PI/180;

/* ==================== CONFIG（実寸に差し替え可） ==================== */
const CONFIG={
  car:{ length:4.58, width:1.795, wheelbase:2.70, frontOverhang:0.92, track:1.54,
        maxSteerDeg:36, steerPlayDeg:8, creep:0.55, maxSpeed:1.9 },
  perp:{ bayWidth:3.0, bayDepth:5.5, turninX:6.0, roadWidth:3.5, approachGap:0.40 },
  parallel:{ approachY:3.2, turninX:8.0, theta1Deg:42, slotDepth:2.5, parkedLen:4.5,
             parkedW:1.75, curbGap:0.25, frontClear:2.0, rearClear:0.5, bayPad:0.4 }
};
const C=CONFIG.car; C.rearOverhang=C.length-C.wheelbase-C.frontOverhang;
const MAXSTEER=C.maxSteerDeg*DEG;
const WHEEL_LOCK=1.375*2*Math.PI;  // ロック・トゥ・ロック2.75回転（アクセラ実車相当。片側約1.4回転）
const WHEEL_PLAY=(C.steerPlayDeg||0)*DEG; // ハンドルの遊び（実車の感覚）

/* ==================== 物理・車体 ==================== */
function bicycle(s,dt){ s.x+=s.v*Math.cos(s.th)*dt; s.y+=s.v*Math.sin(s.th)*dt; s.th+=(s.v/C.wheelbase)*Math.tan(s.steer)*dt; }
function carCorners(s){ const c=Math.cos(s.th),sn=Math.sin(s.th),fx=C.wheelbase+C.frontOverhang,rx=-C.rearOverhang,hw=C.width/2;
  return [[fx,hw],[fx,-hw],[rx,-hw],[rx,hw]].map(([lx,ly])=>({x:s.x+lx*c-ly*sn,y:s.y+lx*sn+ly*c})); }
function toWorld(s,lx,ly){ const c=Math.cos(s.th),sn=Math.sin(s.th); return {x:s.x+lx*c-ly*sn,y:s.y+lx*sn+ly*c}; }
function wheelPositions(s){ const t=C.track/2; return {
  FL:toWorld(s,C.wheelbase,+t), FR:toWorld(s,C.wheelbase,-t), RL:toWorld(s,0,+t), RR:toWorld(s,0,-t) }; }
const POLE_R=0.06;
function carPerimeter(s,step=0.25){ const cs=carCorners(s), pts=[];
  for(let i=0;i<4;i++){ const a=cs[i], b=cs[(i+1)%4], d=Math.hypot(b.x-a.x,b.y-a.y), n=Math.max(1,Math.ceil(d/step));
    for(let k=0;k<n;k++) pts.push({x:a.x+(b.x-a.x)*k/n, y:a.y+(b.y-a.y)*k/n}); }
  return pts; }
function poleHit(s){ const c=Math.cos(s.th),sn=Math.sin(s.th);
  for(const p of M.poles){ const dx=p.x-s.x,dy=p.y-s.y, u=dx*c+dy*sn, v=-dx*sn+dy*c;
    const cu=clamp(u,-C.rearOverhang,C.wheelbase+C.frontOverhang), cv=clamp(v,-C.width/2,C.width/2);
    if(Math.hypot(u-cu,v-cv)<POLE_R) return true; } return false; }
function driverMirror(s,side){ return toWorld(s, C.wheelbase*0.55, (side==='L'?+1:-1)*(C.width/2+0.12)); }
function normAng(a){ a=(a+Math.PI)%(2*Math.PI); if(a<0)a+=2*Math.PI; return a-Math.PI; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function alignedV(th){ return Math.min(Math.abs(normAng(th-Math.PI/2)),Math.abs(normAng(th+Math.PI/2)))<10*DEG; }
function alignedH(th){ return Math.abs(normAng(th))<10*DEG; }
function rect(x0,y0,x1,y1){ return {x0:Math.min(x0,x1),y0:Math.min(y0,y1),x1:Math.max(x0,x1),y1:Math.max(y0,y1)}; }
function inRect(r,x,y){ return x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1; }

/* ==================== 課題ビルダー（検証済み） ==================== */
function buildPerpR(){
  const P=CONFIG.perp, APP_Y=C.width/2+P.approachGap, TX=P.turninX; // 縁石ラインから40cm寄せて進入（3m道路では寄せないと前外輪が反対縁石を越える）
  const s={x:TX,y:APP_Y,th:0,steer:-MAXSTEER,v:-C.creep}; const path=[{x:s.x,y:s.y,th:s.th}]; let n=0;
  while(n++<8000){ bicycle(s,0.01); path.push({x:s.x,y:s.y,th:s.th}); if(s.th>=Math.PI/2)break; }
  const end={...s};
  // 車体外周のスイープ包絡線からポケット寸法を決める（余裕0.3m＝実コース同様、擦らず入る設計）
  let sMaxY=-1e9,sMaxX=-1e9,sMinX=1e9, mouthMaxX=-1e9, pMinX=1e9, pMinY=1e9;
  for(const p of path)for(const c of carPerimeter(p,0.2)){
    if(c.y>sMaxY)sMaxY=c.y; if(c.x>sMaxX)sMaxX=c.x; if(c.x<sMinX)sMinX=c.x;
    if(c.y<0){ pMinX=Math.min(pMinX,c.x); pMinY=Math.min(pMinY,c.y); }
    if(c.y<0.30&&c.y>-0.35){ const yy=Math.min(0.09,c.y*c.y); mouthMaxX=Math.max(mouthMaxX,c.x+Math.sqrt(0.09-yy)); } }
  const bayX1=mouthMaxX, bayX0=Math.min(pMinX-0.30, bayX1-P.bayWidth);
  const bayDepth=Math.max(P.bayDepth, -pMinY+0.5);
  // 道路幅は実コース3.0m固定。車体（鼻先）は反対縁石の上空にはみ出すが、タイヤが越えなければ脱輪ではない
  const aisleY1=P.roadWidth, aX0=Math.min(-1.2,sMinX-0.4), aX1=Math.max(TX+(C.wheelbase+C.frontOverhang)+0.8,sMaxX+0.4);
  return { id:'perpR', title:'方向転換（右バック）', lockLabel:'右', successKind:'perp', turnRefX:TX, appY:APP_Y,
    rects:[rect(aX0,0,aX1,aisleY1),rect(bayX0,-bayDepth,bayX1,0)], obstacles:[],
    bay:rect(bayX0,-bayDepth,bayX1,0), poles:[{x:bayX0,y:0},{x:bayX1,y:0}], parkedCars:[], curbY:null,
    curbs:[{x0:aX0,x1:aX1,y:aisleY1,dir:+1}],
    ideal:{path,end}, start:{x:Math.max(0.6,aX0+C.rearOverhang+0.5),y:APP_Y,th:0},
    coach:'前進(D)で青ラインまで→止まって、後退(R)＋右いっぱいでポケットへ' };
}
function reflectModel(m){ const A=m.appY, ry=y=>2*A-y, rr=r=>rect(r.x0,ry(r.y0),r.x1,ry(r.y1)), rp=p=>({x:p.x,y:ry(p.y),th:-p.th});
  return { id:'perpL', title:'方向転換（左バック）', lockLabel:'左', successKind:'perp', turnRefX:m.turnRefX, appY:A,
    rects:m.rects.map(rr), obstacles:[], bay:rr(m.bay), poles:m.poles.map(p=>({x:p.x,y:ry(p.y)})), parkedCars:[], curbY:null,
    curbs:(m.curbs||[]).map(cb=>({x0:cb.x0,x1:cb.x1,y:ry(cb.y),dir:-cb.dir})),
    ideal:{path:m.ideal.path.map(rp), end:rp(m.ideal.end)}, start:rp(m.start),
    coach:m.coach.replace('右いっぱい','左いっぱい') }; }
function buildParallel(){
  const P=CONFIG.parallel, TX=P.turninX, th1=P.theta1Deg*DEG;
  const s={x:TX,y:P.approachY,th:0,steer:-MAXSTEER,v:-C.creep}; const path=[{x:s.x,y:s.y,th:s.th}]; let ph=1,n=0;
  while(n++<40000){ if(ph===1){s.steer=-MAXSTEER; if(s.th>=th1)ph=2;} else {s.steer=MAXSTEER; if(s.th<=0){s.th=0;path.push({x:s.x,y:s.y,th:0});break;}}
    bicycle(s,0.008); path.push({x:s.x,y:s.y,th:s.th}); }
  const end={...s}, front=C.wheelbase+C.frontOverhang, hw=C.width/2, fx0=end.x-C.rearOverhang, fx1=end.x+front, curbY=end.y-hw-P.curbGap;
  const bay=rect(fx0-P.bayPad,curbY,fx1+P.bayPad,curbY+P.slotDepth);
  const frontCar=rect(fx1+P.frontClear,curbY,fx1+P.frontClear+P.parkedLen,curbY+P.parkedW);
  const rearCar=rect(fx0-P.rearClear-P.parkedLen,curbY,fx0-P.rearClear,curbY+P.parkedW);
  let sMaxY=-1e9; for(const p of path)for(const c of carCorners(p)) if(c.y>sMaxY)sMaxY=c.y;
  const road=rect(rearCar.x0-1.5,curbY,frontCar.x1+2.0,Math.max(P.approachY+hw+1.2,sMaxY+0.4));
  return { id:'parallel', title:'縦列駐車', lockLabel:'右', successKind:'parallel', turnRefX:TX, theta1:th1, appY:P.approachY,
    rects:[road], obstacles:[frontCar,rearCar], bay, poles:[], parkedCars:[frontCar,rearCar], curbY,
    ideal:{path,end}, start:{x:TX-2.6,y:P.approachY,th:0},
    coach:'前進で前の車と横に並ぶ→後退＋右いっぱい。斜め約40°で「左いっぱい」に切り返して真っ直ぐ' };
}

/* 坂道発進：10%勾配の坂の途中で停止線に前輪を合わせて停止 → サイドで保持 →

function buildHill(){
  const HW=1.75, X0=-10, X1=52;                       // 3.5m幅の坂路（ゴール後の余走を確保）
  const rampA=6, rampB=26, GRADE=0.10, STOP=17;       // 停止線は坂の中腹

    curbs:[{x0:X0,x1:X1,y:HW,dir:+1},{x0:X0,x1:X1,y:-HW,dir:-1}],
    ramps:[{a:{x:rampA,y:0},b:{x:rampB,y:0},halfWidth:HW+0.5,grade:GRADE,trans:3}],
    stopLineX:STOP, goalX:35,

/* 信号機：青→黄→赤を周期で回す。路上教習でも同じ部品を使う。 */
const SIGNAL={ green:9.0, yellow:3.0, red:9.0 };
function signalUpdate(dt){
  if(!M||!M.signals) return;
  for(const sg of M.signals){
    sg.t=(sg.t||0)+dt;
    const cyc=SIGNAL.green+SIGNAL.yellow+SIGNAL.red;
    const p=(sg.t+(sg.phase||0))%cyc;
    sg.state = p<SIGNAL.green ? 'green' : p<SIGNAL.green+SIGNAL.yellow ? 'yellow' : 'red';
    sg.remain = p<SIGNAL.green ? SIGNAL.green-p
              : p<SIGNAL.green+SIGNAL.yellow ? SIGNAL.green+SIGNAL.yellow-p : cyc-p;
  }
}
/* 中心線を純追従で走らせて実際の走行軌跡を得る（理想経路＝解ける幾何の保証） */
function truncForRunoff(center, runoff){
  let acc=0, i=center.length-1;
  for(; i>1; i--){ acc+=Math.hypot(center[i].x-center[i-1].x, center[i].y-center[i-1].y); if(acc>=runoff) break; }
  return center.slice(0, Math.max(2,i+1));
}
function followCenterline(center, start, speed, look){
  const s={x:start.x,y:start.y,th:start.th,steer:0,v:speed};
  const out=[{x:s.x,y:s.y,th:s.th}]; let idx=0;
  for(let n=0;n<20000;n++){
    const LA=look||2.6;
    while(idx<center.length-1 && Math.hypot(center[idx].x-s.x,center[idx].y-s.y)<LA) idx++;
    const tgt=center[idx];
    const dx=tgt.x-s.x, dy=tgt.y-s.y;
    const lx= Math.cos(s.th)*dx + Math.sin(s.th)*dy;
    const ly=-Math.sin(s.th)*dx + Math.cos(s.th)*dy;
    const L2=lx*lx+ly*ly;
    const curv = L2>1e-6 ? (2*ly/L2) : 0;
    s.steer = clamp(Math.atan(curv*C.wheelbase), -MAXSTEER, MAXSTEER);
    bicycle(s,0.02);
    out.push({x:s.x,y:s.y,th:s.th});
    if(idx>=center.length-1 && Math.hypot(tgt.x-s.x,tgt.y-s.y)<0.6) break;
  }
  return out;
}
/* ---- S字カーブ：半径8mの左右反転した円弧をつないだ幅3.5mの曲線路 --------------
   中心線をコリドー（中心線＋半幅）で表すため、曲線の縁も自然に丸くなる。 */
function buildSCurve(){
  const HW=1.75, R=8;
  const pts=[];
  for(let i=0;i<=4;i++) pts.push({x:-6+i*1.5, y:0});                    // 進入直線
  for(let a=-90;a<=0;a+=4){ const t=a*DEG; pts.push({x:R*Math.cos(t), y:R+R*Math.sin(t)}); }   // 左カーブ
  for(let a=180;a>=90;a-=4){ const t=a*DEG; pts.push({x:2*R+R*Math.cos(t), y:R+R*Math.sin(t)}); } // 右カーブ
  for(let i=1;i<=10;i++) pts.push({x:2*R, y:2*R+i*1.5});                // 退出直線（前輪の余走を確保）
  const goal=rect(2*R-HW, 2*R+4.0, 2*R+HW, 2*R+8.0);
  const path=followCenterline(truncForRunoff(pts,5),{x:-6,y:0,th:0},C.creep,2.8);
  return { id:'scurve', title:'S字カーブ', lockLabel:'右', successKind:'course', speedLimitMs:2.6,
    turnRefX:0, appY:0, rects:[goal], corridors:[{pts,hw:HW}], obstacles:[], bay:goal,
    poles:[], parkedCars:[], curbY:null, curbs:[],
    ideal:{path,end:path[path.length-1]}, start:{x:-6,y:0,th:0},
    goalRect:goal, coach:'ふちに寄せすぎず、内側の後輪を意識してゆっくり通過' };
}
/* ---- クランク：直角に折れる幅3.5mの狭路。角が正確な直角になるよう矩形で構成 ---- */
/* 踏切：停止線でいったん完全停止し、窓を開けて左右を確認してから一気に渡る。
   踏切不停止は実際の検定でも即中止なので、そのまま再現する。 */
/* 信号交差点：赤で停止線の手前に止まり、青で発進して交差点を渡る。
   赤信号で交差点に進入したら実際の検定どおり即中止。 */
function buildSignal(){
  const HW=1.75, X0=-20, X1=60, IX=26, CROSS=4.0, STOP=IX-CROSS-1.2;
  const goal=rect(IX+10,-HW,IX+22,HW);
  const center=[]; for(let x=X0;x<=X1;x+=0.5) center.push({x,y:0});
  const path=followCenterline(truncForRunoff(center,5),{x:X0+2,y:0,th:0},C.creep,2.6);
  return { id:'signal', title:'信号交差点', lockLabel:'右', successKind:'signal', speedLimitMs:6.5,
    turnRefX:STOP, appY:0,
    rects:[rect(X0,-HW,X1,HW), rect(IX-CROSS,-14,IX+CROSS,14)],   // 本線＋交差する道路
    corridors:[], obstacles:[], bay:goal, poles:[], parkedCars:[], curbY:null, curbs:[],
    signals:[{x:IX-CROSS-2.2, y:-HW-0.8, t:0, phase:0, state:'green'}],
    stopLineX:STOP, goalX:IX+10, interX0:IX-CROSS, interX1:IX+CROSS,
    ideal:{path,end:path[path.length-1]}, start:{x:X0+2,y:0,th:0},
    goalRect:goal, coach:'信号を早めに確認。黄で止まれるなら止まる。赤で交差点に入ったら即中止' };
}
function buildRailway(){
  const HW=1.75, X0=-16, X1=60, RAIL=24, STOP=RAIL-3.2;   // ゴール後の余走を十分に確保

function buildCrank(){
  const HW=1.75, R=5, X0=-14, XC=4, YC=9, X1=30;   // 角は中心線半径5mで丸める
  const c=[];

  for(let a=-90;a<=0;a+=5){ const t=a*DEG; c.push({x:XC-R+R*Math.cos(t), y:R+R*Math.sin(t)}); }   // 左へ
  for(let y=R+0.5;y<=YC-R;y+=0.5) c.push({x:XC,y});                               // 縦（北行き）
  for(let a=180;a>=90;a-=5){ const t=a*DEG; c.push({x:XC+R+R*Math.cos(t), y:YC-R+R*Math.sin(t)}); } // 右へ
  for(let x=XC+R+0.5;x<=X1;x+=0.5) c.push({x,y:YC});                              // 退出（東行き）

  const path=followCenterline(truncForRunoff(c,5),{x:X0,y:0,th:0},C.creep,2.6);

    poles:[], parkedCars:[], curbY:null, curbs:[],

}

function computeBounds(){ let a=[...M.rects,M.bay,...M.parkedCars], minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const r of a){ minX=Math.min(minX,r.x0);maxX=Math.max(maxX,r.x1);minY=Math.min(minY,r.y0);maxY=Math.max(maxY,r.y1);}
  if(M.corridors) for(const co of M.corridors) for(const p of co.pts){
    minX=Math.min(minX,p.x-co.hw);maxX=Math.max(maxX,p.x+co.hw);
    minY=Math.min(minY,p.y-co.hw);maxY=Math.max(maxY,p.y+co.hw);}
  bounds={minX:minX-0.6,maxX:maxX+0.6,minY:minY-0.6,maxY:maxY+0.6}; }
// 点と線分の距離（コリドー判定用）
function distToSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t = L2>1e-9 ? ((px-ax)*dx+(py-ay)*dy)/L2 : 0; t=t<0?0:t>1?1:t;
  return Math.hypot(px-(ax+dx*t), py-(ay+dy*t));
}
// 中心線からの距離が半幅以内ならコリドー内。S字のような曲線路を矩形の集合にせず表せる
function inCorridor(co,x,y){
  const p=co.pts;
  for(let i=0;i<p.length-1;i++) if(distToSeg(x,y,p[i].x,p[i].y,p[i+1].x,p[i+1].y)<=co.hw) return true;
  return false;
}

  for(const r of M.rects) if(inRect(r,x,y)){ok=true;break;}
  if(!ok&&M.corridors) for(const co of M.corridors) if(inCorridor(co,x,y)){ok=true;break;}
  if(!ok)return false;
  for(const o of M.obstacles) if(inRect(o,x,y))return false; return true; }

/* ==================== 入力（Pointer Events未対応の簡易WebView向けフォールバック付き） ==================== */
// AirDrop/LINE等のプレビュー表示（Quick Look系）ではPointer Events APIが動かないことがあるため、
// 対応していれば従来通りpointer*を使い、非対応ならtouch/mouseに自動フォールバックする。
const HAS_POINTER = typeof window.PointerEvent === 'function';
function audioUnlock(){ if(!SimAudio.ready){ if(SimAudio.init()) SimAudio.start(); } else SimAudio.resume(); }
function bindDrag(el,{start,move,end}){
  const _s0=start; start=(x,y)=>{ audioUnlock(); _s0&&_s0(x,y); };
  if(HAS_POINTER){
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} start&&start(e.clientX,e.clientY); });
    el.addEventListener('pointermove',e=>{ move&&move(e.clientX,e.clientY); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{ end&&end(); }));
  } else {
    el.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0]; start&&start(t.clientX,t.clientY); },{passive:false});
    el.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; move&&move(t.clientX,t.clientY); },{passive:false});
    ['touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>{ end&&end(); }));
    let mdown=false;
    el.addEventListener('mousedown',e=>{ mdown=true; start&&start(e.clientX,e.clientY); });
    window.addEventListener('mousemove',e=>{ if(mdown) move&&move(e.clientX,e.clientY); });
    window.addEventListener('mouseup',()=>{ if(mdown){ mdown=false; end&&end(); } });
  }
}
// タップは click ではなく pointerup で直接発火させる。
// 理由：ブレーキを別の指で押さえたまま（pointerキャプチャ中／別タッチ継続中）だと
// clickが抑制される端末があるため。pointerupなら他の指の保持中でも確実に反応する＝
// 実車のように「ブレーキを踏みながらシフト・サイドを操作」ができる。
function bindTap(el,fn){
  // ラッパーは通常関数＋call で this（＝要素）を保持する。アロー関数にすると
  // this.classList を使うトグル系ハンドラが全滅するので注意。
  const _f0=fn; fn=function(e){ audioUnlock(); return _f0&&_f0.call(this,e); };
  if(HAS_POINTER){
    let sx=null,sy=null,moved=false;
    el.addEventListener('pointerdown',e=>{ sx=e.clientX; sy=e.clientY; moved=false; });
    el.addEventListener('pointermove',e=>{ if(sx!=null&&Math.hypot(e.clientX-sx,e.clientY-sy)>12) moved=true; });
    // fn は必ず el を this にして呼ぶ（this.classList を使うトグル系ハンドラのため）
    el.addEventListener('pointerup',e=>{ if(sx!=null&&!moved){ e.preventDefault(); fn.call(el,e); } sx=null; });
    el.addEventListener('pointercancel',()=>{ sx=null; });
  } else {
    el.addEventListener('touchend',e=>{ e.preventDefault(); fn.call(el,e); },{passive:false});
    el.addEventListener('click',e=>{ fn.call(el,e); });   // PointerEvent非対応のデスクトップ（マウス）向け
  }
}
