/* ============================================================================
   標高（坂道）— 平面ワールドに1次元スロープを重ねる軽量ハイトフィールド
   教習所の坂は「一本の勾配路」なので汎用ハイトマップは不要。始点a→終点bの
   区間に勾配を与え、出入口を滑らかに繋いだ高さ z(x,y) と勾配 grade(x,y) を返す。
   mkProj は元から pz を受け取るので、投影側は z を渡すだけで立体になる。
   ========================================================================== */
function smoothstep(e0,e1,x){ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); }

/* ramp = {a:{x,y}, b:{x,y}, halfWidth, grade, trans} を配列で持つ。
   区間に沿う距離 s に対し、勾配を trans[m] でなめらかに立ち上げ／終端で寝かせる。 */
function rampHeight(rp, x, y){
  const ax=rp.a.x, ay=rp.a.y, bx=rp.b.x, by=rp.b.y;
  const dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy); if(L<1e-6) return null;
  const ux=dx/L, uy=dy/L;
  const px=x-ax, py=y-ay;
  const s=px*ux+py*uy;                       // 進行方向の距離
  const off=Math.abs(-px*uy+py*ux);          // 中心線からの横距離
  const hw=rp.halfWidth||3.0;
  if(off>hw+0.6) return null;                // 路肩外は影響なし
  const tr=Math.max(0.5, rp.trans||3.0), g=rp.grade||0;
  // 高さ = 勾配を s に沿って積分（出入口を smoothstep で滑らかに）
  let z;
  if(s<=0) z=0;
  else if(s>=L) z=g*(L-tr);                  // 全区間の総上昇（両端の緩和分を差し引く）
  else {
    // 立ち上がり：0..tr で線形→勾配、終端：L-tr..L で勾配→0
    const upEnd=Math.min(tr,L), dnStart=Math.max(0,L-tr);
    let acc;
    if(s<=upEnd) acc=g*s*s/(2*tr);
    else if(s<=dnStart) acc=g*(upEnd/2)+g*(s-upEnd);
    else { const t=s-dnStart, rem=L-dnStart;
      acc=g*(upEnd/2)+g*(dnStart-upEnd)+g*(t-t*t/(2*Math.max(1e-6,rem))); }
    z=acc;
  }
  // 幅方向の縁は緩やかに0へ（縁石外へなだらかに落とす）
  const wf=1-smoothstep(hw,hw+0.6,off);
  return { z:z*wf, s, L, g:(s>0&&s<L)? g*wf*(s<tr? s/tr : (s>L-tr? (L-s)/tr : 1)) : 0 };
}
/* ワールド全体の高さ。M.ramps が無ければ常に 0（＝従来通りの平面）。 */
function zAt(x,y){
  if(!M||!M.ramps||!M.ramps.length) return 0;
  let z=0; for(const rp of M.ramps){ const r=rampHeight(rp,x,y); if(r) z+=r.z; }
  return z;
}
/* 進行方向の勾配（rise/run）。駆動系の重力項に渡す。前後の高さ差から数値微分。 */
function gradeAlong(x,y,th,ds){
  if(!M||!M.ramps||!M.ramps.length) return 0;
  const d=ds||1.0, c=Math.cos(th), s=Math.sin(th);
  return (zAt(x+c*d, y+s*d) - zAt(x-c*d, y-s*d)) / (2*d);
}

/* ============================================================================
   Drivetrain — 実在の駆動系を模した縦方向ダイナミクス
   エンジン（トルク曲線）→トルコン→AT→終減速→タイヤ→駆動力
   走行抵抗（転がり・空気・勾配・ブレーキ）と釣り合わせて加速度を積分する。
   低速の駐車フィール（クリープ約0.55m/s）は実測して合わせてあるため、
   既存の課題ジオメトリ・採点はそのまま通る。
   ========================================================================== */
const DT = {
  mass: 1400,            // kg（アクセラセダン相当）
  wheelR: 0.31,          // m 駆動輪半径
  finalDrive: 4.33,
  gears: { P:0, R:-3.20, N:0, D1:3.55, D2:2.02, D3:1.35, D4:1.00, D5:0.72 },
  idle: 700, redline: 6200, stall: 450,
  effi: 0.88,            // 駆動系効率
  Crr: 0.014,            // 転がり抵抗係数
  CdA: 0.68,             // 空気抵抗 Cd*A (m^2)
  rhoAir: 1.2,
  brakeMaxN: 9000,       // 最大制動力(N)
  creepTorqueN: 355,     // トルコンのクリープ推力(N)：平地の釣り合いが約0.55m/sになるよう較正
  gravity: 9.81,
  shiftUp:   [0, 2600, 2900, 3050, 3200],   // 各段からのシフトアップ回転
  shiftDown: [0, 0, 1250, 1350, 1450],
};
// 全開時のトルク曲線（Nm）：アイドル〜レッドラインの実車らしい山形
function engineTorqueWOT(rpm){
  const r = Math.max(DT.stall, Math.min(DT.redline, rpm));
  // 200Nm 級のNAガソリン：3800rpm 付近でピーク、上下でだれる
  const peak = 200, x = (r - 3800) / 2600;
  let t = peak * (1 - 0.55 * x * x);
  if (r > 5600) t *= 1 - (r - 5600) / 1400 * 0.35;      // 高回転の落ち込み
  return Math.max(18, t);
}
// エンジンブレーキのトルク（Nm・常に正の値）。アクセルを戻すほど大きい
function engineBrakeTorque(rpm, throttle){ return (1 - throttle) * (22 + rpm / 140); }
const DTstate = { rpm: DT.idle, gearNum: 1, shiftTimer: 0, load: 0, slip: 0, running: true };

// 現在ギアの総減速比（P/N は 0）
function ratioFor(gear, gearNum){
  if (gear === 'P' || gear === 'N') return 0;
  if (gear === 'R') return DT.gears.R;
  return DT.gears['D' + gearNum] || DT.gears.D1;
}
/* 1フレーム分の縦方向更新。throttle/brake は 0..1。grade は勾配(rise/run)。
   戻り値：サウンドとHUDが使う {rpm, load, slip, gearNum} */
function driveUpdate(car, dt, throttle, brake, gear, handbrake, grade){
  const S = DTstate;
  const dir = gear === 'D' ? 1 : gear === 'R' ? -1 : 0;
  const v = car.v, sp = Math.abs(v);

  // --- AT の変速（Dのみ・ヒステリシスとシフト間インターバル付き） ---
  S.shiftTimer = Math.max(0, S.shiftTimer - dt);
  if (gear === 'D' && S.shiftTimer === 0){
    if (S.gearNum < 5 && S.rpm > DT.shiftUp[S.gearNum]   + (throttle>0.7? 1500:0)){ S.gearNum++; S.shiftTimer = 0.5; }
    else if (S.gearNum > 1 && S.rpm < DT.shiftDown[S.gearNum]){ S.gearNum--; S.shiftTimer = 0.4; }
  } else if (gear !== 'D') S.gearNum = 1;

  const ratio = ratioFor(gear, S.gearNum) * DT.finalDrive;
  // --- 回転数：車速から逆算。トルコンのスリップでアイドルを下回らない ---
  const wheelRad = sp / DT.wheelR;                                  // rad/s
  let rpmFromWheel = Math.abs(wheelRad * ratio) * 60 / (2 * Math.PI);
  const conv = sp < 3 ? 1 - sp / 3 : 0;                             // 低速ほどトルコンが滑る
  S.rpm += ((Math.max(DT.idle, rpmFromWheel) + throttle * (1200 + 2200 * conv)) - S.rpm) * Math.min(1, dt * 6);
  S.rpm = Math.max(DT.idle * 0.9, Math.min(DT.redline, S.rpm));

  // --- 駆動力（常にギアの向き dir に働く。エンジンブレーキは抵抗側で扱う） ---
  let F = 0;
  if (dir !== 0 && !handbrake && gear !== 'P'){
    const tq = engineTorqueWOT(S.rpm) * throttle;                    // 正のトルクのみ
    F = tq * Math.abs(ratio) * DT.effi / DT.wheelR * dir;
    // トルコンのクリープ（ブレーキを離すとにじり出る力）。停止付近だけ効く
    if (sp < 1.2) F += DT.creepTorqueN * dir * (1 - sp / 1.2);
    if (S.rpm >= DT.redline * 0.995) F *= 0.25;                      // レブリミット
  }
  // --- 抵抗（進行方向 sgn に逆らう向き＝符号付きで合算し、最後に F と釣り合わせる） ---
  const sgn = v > 0.001 ? 1 : v < -0.001 ? -1 : 0;
  let R = 0;
  R += DT.Crr * DT.mass * DT.gravity * sgn;                          // 転がり
  R += 0.5 * DT.rhoAir * DT.CdA * v * sp;                            // 空気（符号込み）
  R += (grade || 0) * DT.mass * DT.gravity;                          // 勾配（登りで正＝後ろへ引く）
  // エンジンブレーキ：ギアが入っていて走行中のみ、進行方向と逆に効く。
  // ただしトルコンが滑る低速域では伝わらない（実車がクリープで進めるのはこのため）。
  if (dir !== 0 && sgn !== 0 && Math.abs(ratio) > 0){
    const lockup = Math.max(0, Math.min(1, (sp - 1.5) / 4));
    R += engineBrakeTorque(S.rpm, throttle) * Math.abs(ratio) * DT.effi / DT.wheelR * sgn * lockup;
  }
  // ブレーキ／サイド／P：速度をゼロへ引き戻す向きにのみ働く
  const bF = brake * DT.brakeMaxN + (handbrake ? 4200 : 0) + (gear === 'P' ? 12000 : 0);
  R += bF * sgn;

  const net = F - R;
  let nv = v + (net / DT.mass) * dt;
  // 制動系で行き過ぎてゼロを跨いだら止める（振動防止）
  if (bF > 0 && sgn !== 0 && Math.sign(nv) !== sgn) nv = 0;
  if (gear === 'P' || (handbrake && Math.abs(nv) < 0.05)) nv = 0;
  // 静止摩擦：ほぼ止まっていて押す力も無いなら完全停止（ハンチング防止）
  if (Math.abs(nv) < 0.012 && Math.abs(net) < 60) nv = 0;
  car.v = nv;
  const a = (nv - v) / dt;

  // --- サウンド用の負荷とスリップ ---
  S.load += ((throttle * 0.8 + Math.min(0.2, Math.abs(a) / 6)) - S.load) * Math.min(1, dt * 5);
  const grip = 7000;                                                  // タイヤの限界駆動力(N)
  S.slip += ((Math.max(0, Math.abs(F) - grip) / grip) - S.slip) * Math.min(1, dt * 8);
  return { rpm: S.rpm, load: Math.max(0, Math.min(1, S.load)), slip: Math.max(0, Math.min(1, S.slip)), gearNum: S.gearNum };
}
/* ---- 横方向：グリップ限界つき積分 ----------------------------------------
   bicycle() 自体は変更しない。必要な旋回加速度が μg を超えるときだけ実効切れ角を
   落として渡す＝アンダーステア。低速（駐車速度域）では scale=1 となり従来と完全に同一。 */
const LAT = { mu: 0.95, margin: 0.95, slip: 0, scrub: 0, steerRate: 0 };
function integrateLat(car, dt){
  const v = car.v, t = Math.tan(car.steer);
  const need = v * v * Math.abs(t) / C.wheelbase;          // 必要横加速度
  const cap = LAT.mu * DT.gravity * LAT.margin;            // タイヤが出せる横加速度
  if (need > cap && Math.abs(t) > 1e-6){
    const scale = Math.sqrt(cap * C.wheelbase / (v * v * Math.abs(t)));
    LAT.slip = clamp(1 - scale, 0, 1);
    const saved = car.steer;
    car.steer = Math.atan(t * scale);                      // 曲がりきれない＝外へ膨らむ
    bicycle(car, dt);
    car.steer = saved;
  } else {
    LAT.slip *= Math.max(0, 1 - dt * 6);
    bicycle(car, dt);
  }
}
/* ---- 操舵：速度が上がるほど素早くは切れない（据え切りは人間のドラッグ速度より十分速い上限） */
function applySteerRate(car, target, dt){
  const maxRate = 3.6 - 2.0 * Math.min(Math.abs(car.v) / 16, 1);
  const d = clamp(target - car.steer, -maxRate * dt, maxRate * dt);
  car.steer += d;
  LAT.steerRate = dt > 0 ? d / dt : 0;
  // 据え切り（低速で大きく回す）＝タイヤのこすれ音。単フレームの跳ねを平滑化
  const raw = clamp(Math.abs(LAT.steerRate) * (1 - Math.min(Math.abs(car.v) / 2, 1)) * 0.85, 0, 1);
  LAT.scrub += (raw - LAT.scrub) * clamp(dt * (raw > LAT.scrub ? 6 : 9), 0, 1);
}
function driveReset(){ LAT.slip=0; LAT.scrub=0; LAT.steerRate=0; DTstate.rpm = DT.idle; DTstate.gearNum = 1; DTstate.shiftTimer = 0; DTstate.load = 0; DTstate.slip = 0; }

/* ============================================================================
   SimAudio v2 — 手続き生成サウンドエンジン（Web Audio API のみ／音声ファイル不使用）
   ---------------------------------------------------------------------------
   ・CSP厳格環境でも動く：AudioWorklet/blob URL/外部ファイルを一切使わない。
     使用ノードは Oscillator(PeriodicWave) / BufferSource / Biquad / WaveShaper /
     Gain / StereoPanner / Convolver(JS生成IR) / DynamicsCompressor のみ。
   ・4気筒ガソリン車の吸排気を「点火次数の加算合成＋排気パルスAM＋負荷で開く共鳴LPF
     ＋ソフトクリップ」で再現。オルガン的にならないよう倍音は位相分散した PeriodicWave
     を1本の発振器にまとめ、位相ロックさせている（実車の質感の要）。
   ・全パラメータは setTargetAtTime で補間（ジッパーノイズ皆無）。差分が小さい時は
     呼び出し自体をスキップして電話でも軽い。
   ・AudioContext 不可／初期化失敗時は全APIが安全な no-op になる。
   ---------------------------------------------------------------------------
   公開API
     init() start() resume() suspend() reset()
     setEnabled(on) isEnabled() setMasterVolume(v) setBus(name,v) setQuality(q)
     setAmbience('off'|'yard'|'street') setDuck(x) setRedline(rpm)
     update(state)                      ← 毎フレーム1回
     indicator('L'|'R'|null)  railBell(on)  belt(on)
     engine.start() engine.stop() engine.rpm engine.state
     sfx.{gear,handbrake,curb,scrape,crash,brakeSqueal,chime,ok,ng,blip,
          door,seatbelt,horn,reject,winker}
   update(state) が受け取るもの（すべて省略可）
     speed[m/s, 符号付き] rpm load[0..1] slip[0..1] gearNum[AT段数]
     throttle[0..1] brake[0..1] scrub[0..1] gear['P'|'R'|'N'|'D']
     handbrake[bool] surface[string] engineOn[bool] wind[0..1]
   ・rpm 省略時は速度とスロットルから AT 相当の回転を内部推定するので、駆動系が
     未実装でも成立する。gearNum を渡せば変速ショック音とトルク抜けが付く。
   ========================================================================== */
const SimAudio = (()=>{
  "use strict";

  /* ---------------- 内部状態 ---------------- */
  let AX=null, ready=false, enabled=true, started=false, quality='high';
  let master=null, comp=null, cabinSend=null;
  let vol=0.85, duck=1, ambience='yard';
  const BUS={};                       // engine / road / wind / world / ui / ambient
  const E={}, R={}, WD={}, AM={};     // 各サブシステムのノード置き場
  let nzA=null, nzB=null, nzBrown=null;
  let voices=0; const MAXV=18;
  const now=()=>AX.currentTime;
  const fin=v=>(typeof v==='number'&&isFinite(v))?v:0;
  const cl=(v,a,b)=>v<a?a:v>b?b:v;

  /* パラメータ補間：差分が無視できるほど小さければ何もしない（毎フレームの節約） */
  function ramp(p,v,tau){
    if(!p) return; v=fin(v);
    const l=p._lv;
    if(l!==undefined && Math.abs(l-v) <= Math.abs(v)*0.004+1e-4) return;
    p._lv=v;
    try{ p.setTargetAtTime(v, AX.currentTime, tau>0.004?tau:0.004); }
    catch(_){ try{ p.value=v; }catch(__){} }
  }

  /* ---------------- 素材生成（すべてJS） ---------------- */
  function whiteBuf(sec,seed){
    const n=Math.floor(AX.sampleRate*sec), b=AX.createBuffer(1,n,AX.sampleRate), d=b.getChannelData(0);
    let s=seed||12345;
    for(let i=0;i<n;i++){ s=(s*1664525+1013904223)|0; d[i]=(s/2147483648); }
    return b;
  }
  function brownBuf(sec){
    const n=Math.floor(AX.sampleRate*sec), b=AX.createBuffer(1,n,AX.sampleRate), d=b.getChannelData(0);
    let s=99117, last=0;
    for(let i=0;i<n;i++){ s=(s*1103515245+12345)|0; const w=s/2147483648;
      last=(last+0.021*w)/1.021; d[i]=last*7.2; }
    // ループ継ぎ目のクリック防止（末尾をクロスフェード）
    const f=Math.floor(AX.sampleRate*0.05);
    for(let i=0;i<f;i++){ const k=i/f; d[n-f+i]=d[n-f+i]*(1-k)+d[i]*k; }
    return b;
  }
  function loopSrc(buf,rate){
    const s=AX.createBufferSource(); s.buffer=buf; s.loop=true;
    if(rate) s.playbackRate.value=rate;
    return s;
  }
  function makeIR(){ // 車室の短い残響（220ms）＋初期反射。畳み込み1本で"車内にいる"感じを出す
    const sr=AX.sampleRate, n=Math.floor(sr*0.22), b=AX.createBuffer(2,n,sr);
    for(let ch=0;ch<2;ch++){
      const d=b.getChannelData(ch); let s=7717+ch*931;
      for(let i=0;i<n;i++){ s=(s*1664525+1013904223)|0; const t=i/n;
        d[i]=(s/2147483648)*Math.pow(1-t,3.4)*0.5; }
      for(const er of [[2.9,0.55],[5.3,0.4],[8.9,0.27],[13.1,0.19],[19.7,0.11]]){
        const k=Math.floor(sr*er[0]/1000)+ch*11; if(k<n) d[k]+=er[1]*(ch?-1:1);
      }
    }
    return b;
  }
  /* ソフトクリップ。左右非対称にしてあるのが肝：完全対称な tanh は偶数次倍音を打ち消して
     しまい、4気筒特有の2次（点火の倍）成分が消えて“合成くさい”音になる。実際の排気圧も
     片側に偏った波形なので、バイアスを与えて偶数次を残す（生じるDCは後段のHPFで除去）。 */
  function softCurve(k){
    const n=1024, c=new Float32Array(n), b=0.18, d=Math.tanh(k*(1+b));
    for(let i=0;i<n;i++){ const x=i*2/(n-1)-1; c[i]=(Math.tanh(k*(x+b))-Math.tanh(k*b))/d; }
    return c;
  }
  /* 位相を分散させた倍音列＝1本の発振器で"録音した機械音"の質感を出す */
  function pWave(n,amp){
    const re=new Float32Array(n+1), im=new Float32Array(n+1);
    for(let i=1;i<=n;i++){ const a=amp(i), ph=(i*i*0.73+i*1.37)%(Math.PI*2);
      re[i]=a*Math.cos(ph); im[i]=a*Math.sin(ph); }
    try{ return AX.createPeriodicWave(re,im,{disableNormalization:false}); }
    catch(_){ return AX.createPeriodicWave(re,im); }
  }
  function panner(){ // 旧Safari対策
    if(AX.createStereoPanner) return AX.createStereoPanner();
    const g=AX.createGain(); g.pan={value:0,setTargetAtTime(){},linearRampToValueAtTime(){},setValueAtTime(){}}; return g;
  }

  /* ---------------- 初期化 ---------------- */
  function autoQuality(){
    const ua=(navigator.userAgent||''), mob=/Android|iPhone|iPad|iPod|Mobile/i.test(ua);
    const cores=navigator.hardwareConcurrency||4;
    return (mob&&cores<=4)?'low':'high';
  }
  function init(){
    if(ready) return true;
    if(!enabled) return false;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC){ enabled=false; return false; }
    try{ AX=new AC({latencyHint:'interactive'}); }
    catch(_){ try{ AX=new AC(); }catch(__){ enabled=false; return false; } }
    try{
      quality=autoQuality();
      // iOS：ジェスチャ内で無音バッファを1発鳴らしてアンロック
      try{ const s=AX.createBufferSource(); s.buffer=AX.createBuffer(1,1,AX.sampleRate); s.connect(AX.destination); s.start(0); }catch(_){}

      master=AX.createGain(); master.gain.value=0.0001;
      comp=AX.createDynamicsCompressor();
      comp.threshold.value=-8; comp.knee.value=8; comp.ratio.value=9;
      comp.attack.value=0.004; comp.release.value=0.13;
      comp.connect(master); master.connect(AX.destination);

      if(quality!=='low'){
        const cv=AX.createConvolver(); cv.buffer=makeIR(); cv.normalize=true;
        cabinSend=AX.createGain(); cabinSend.gain.value=0.16;
        cabinSend.connect(cv); cv.connect(comp);
      }
      for(const k of ['engine','road','wind','world','ui','ambient']){
        const g=AX.createGain(); g.gain.value=1; g.connect(comp);
        if(cabinSend && (k==='engine'||k==='road'||k==='world')) g.connect(cabinSend);
        BUS[k]=g;
      }
      BUS.ambient.gain.value=0.9;

      nzA=whiteBuf(2.0,20250725); nzB=whiteBuf(2.3,777001); nzBrown=brownBuf(3.0);
      buildEngine(); buildRoad(); buildWind(); buildAmbient();

      ready=true;
      ramp(master.gain, vol*duck, 0.25);
      bindLifecycle();
      return true;
    }catch(err){
      try{ AX.close(); }catch(_){}
      AX=null; ready=false; enabled=false; return false;
    }
  }
  function bindLifecycle(){
    try{
      document.addEventListener('visibilitychange',()=>{
        if(!ready) return;
        if(document.hidden){ try{AX.suspend();}catch(_){} }
        else if(enabled){ try{AX.resume();}catch(_){} }
      });
    }catch(_){}
  }

  /* ============================================================
     エンジン
     f0（点火周波数）= rpm/60 * (気筒数/2) = rpm/30   ※4気筒4サイクル
     層1 低次(f0/2)  : クランク1次のうねり＝アイドルのドコドコ
     層2 本体(f0)    : 排気の主成分（穏やか）
     層3 荒れ(f0)    : 高負荷/高回転で混ぜる歪んだ倍音
     層4 排気ノイズ  : バンドパスノイズを点火パルスでAM＝"ボボボ"の粒立ち
     層5 メカ音      : ギヤ/補機のうなり（Rでは強調＝実車のATの逆転音）
     出力段          : プリゲイン(負荷)→ソフトクリップ→共鳴LPF→胴鳴りピーク
     ============================================================ */
  function buildEngine(){
    const mix=AX.createGain(); mix.gain.value=1;
    const drive=AX.createGain(); drive.gain.value=1;
    const sh=AX.createWaveShaper(); sh.curve=softCurve(2.1); sh.oversample=(quality==='low')?'none':'2x';
    const lp=AX.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=480; lp.Q.value=1.0;
    const bp=AX.createBiquadFilter(); bp.type='peaking'; bp.frequency.value=140; bp.Q.value=1.1; bp.gain.value=6;
    const hp=AX.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=42;
    const out=AX.createGain(); out.gain.value=0.0001;
    mix.connect(drive); drive.connect(sh); sh.connect(lp); lp.connect(bp); bp.connect(hp); hp.connect(out); out.connect(BUS.engine);

    const WLOW =pWave(12,i=>(i%2?1:0.42)/Math.pow(i,1.15));
    const WMID =pWave(20,i=>(1/Math.pow(i,0.95))*(i===2?1.30:i===3?0.60:i===4?0.92:1));
    const WHAR =pWave(26,i=>(1/Math.pow(i,0.60))*(i%2?1:0.78));
    const WPUL =pWave(10,i=>1/Math.pow(i,0.28));

    const mk=(w,g0)=>{ const o=AX.createOscillator(); o.setPeriodicWave(w); o.frequency.value=24;
                       const g=AX.createGain(); g.gain.value=g0; o.connect(g); g.connect(mix); o.start(); return {o,g}; };
    const low=mk(WLOW,0.5), mid=mk(WMID,0.5), har=mk(WHAR,0.0);

    // 機械的な揺らぎ（アイドルの不安定さ）— 非整数比の2本で"ランダムに聞こえる"周期
    const w1=AX.createOscillator(); w1.type='sine'; w1.frequency.value=5.7;
    const w2=AX.createOscillator(); w2.type='sine'; w2.frequency.value=1.31;
    const wg=AX.createGain(); wg.gain.value=6;
    w1.connect(wg); w2.connect(wg);
    wg.connect(low.o.detune); wg.connect(mid.o.detune); wg.connect(har.o.detune);
    w1.start(); w2.start();

    // 排気ノイズ（点火パルスでAM）
    const en=loopSrc(nzB,1), ef=AX.createBiquadFilter(); ef.type='bandpass'; ef.frequency.value=200; ef.Q.value=0.9;
    const eg=AX.createGain(); eg.gain.value=0.05;
    en.connect(ef); ef.connect(eg); eg.connect(mix); en.start();
    const pul=AX.createOscillator(); pul.setPeriodicWave(WPUL); pul.frequency.value=24;
    const pd=AX.createGain(); pd.gain.value=0.05; pul.connect(pd); pd.connect(eg.gain);
    const pd2=AX.createGain(); pd2.gain.value=0.10; pul.connect(pd2); pd2.connect(mid.g.gain); // 本体にもチャフ感
    pul.start();

    // メカ音（ギヤうなり）
    const wh=AX.createOscillator(); wh.type='triangle'; wh.frequency.value=300;
    const whf=AX.createBiquadFilter(); whf.type='bandpass'; whf.frequency.value=900; whf.Q.value=3.5;
    const whg=AX.createGain(); whg.gain.value=0.0001;
    wh.connect(whf); whf.connect(whg); whg.connect(mix); wh.start();

    Object.assign(E,{mix,drive,sh,lp,bp,out,low,mid,har,ef,eg,pul,pd,pd2,wh,whg,wg,
      state:'off', tState:0});
  }

  /* 始動：セルモーター（うなり＋圧縮の脈動）→初爆→ファーストアイドル */
  function engineStart(){
    if(!ready||E.state==='cranking'||E.state==='run') return;
    E.state='cranking'; E.tState=now(); started=true;
    const t=now(), dur=0.95;
    // セルのうなり
    const o=AX.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(1250,t); o.frequency.linearRampToValueAtTime(1520,t+0.5); o.frequency.linearRampToValueAtTime(1180,t+dur);
    const bf=AX.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=1400; bf.Q.value=5;
    const g=AX.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.05,t+0.06); g.gain.setTargetAtTime(0.0001,t+dur-0.12,0.05);
    o.connect(bf); bf.connect(g); g.connect(BUS.engine); o.start(t); o.stop(t+dur+0.1);
    // 圧縮の脈動（クランキング＝約250rpm→8.3Hz）
    const n=loopSrc(nzA,1), nf=AX.createBiquadFilter(); nf.type='lowpass'; nf.frequency.value=420;
    const ng2=AX.createGain(); ng2.gain.setValueAtTime(0.06,t);
    const lfo=AX.createOscillator(); lfo.type='sine'; lfo.frequency.value=8.3;
    const ld=AX.createGain(); ld.gain.value=0.055; lfo.connect(ld); ld.connect(ng2.gain);
    n.connect(nf); nf.connect(ng2); ng2.connect(BUS.engine);
    ng2.gain.setTargetAtTime(0.0001,t+dur-0.2,0.06);
    n.start(t); lfo.start(t); n.stop(t+dur+0.1); lfo.stop(t+dur+0.1);
    // 状態遷移は必ず「音声クロック」で進める。setTimeout はタブが非アクティブだと
    // 間引かれ、セルが回りっぱなしで始動しない事故になる。
  }
  function engineStop(){
    if(!ready||E.state==='off'||E.state==='stopping') return;
    E.state='stopping'; E.tState=now(); started=false;
    noiseHit(0.09,0.10,'lowpass',260,0.7,BUS.engine,0.62);   // 停止時のカタン
  }

  /* ============================================================
     路面（タイヤ）
     ============================================================ */
  const SURF={
    asphalt :{roll:1.00,f:1.00,grit:0.00,sq:1.00},
    concrete:{roll:1.12,f:1.18,grit:0.06,sq:1.15},
    crossing:{roll:1.20,f:1.10,grit:0.10,sq:0.9 },
    rail    :{roll:1.35,f:0.95,grit:0.18,sq:0.7 },
    gravel  :{roll:1.55,f:1.30,grit:1.00,sq:0.35},
    grass   :{roll:0.85,f:0.55,grit:0.55,sq:0.20},
    wet     :{roll:1.30,f:1.45,grit:0.12,sq:0.55}
  };
  function buildRoad(){
    // 転がり音：速度でバンドパスが上がり、トレッドブロックのAMで粒立ちを出す
    const rn=loopSrc(nzA,1);
    const rf=AX.createBiquadFilter(); rf.type='bandpass'; rf.frequency.value=260; rf.Q.value=0.7;
    const rl=AX.createBiquadFilter(); rl.type='lowpass';  rl.frequency.value=1400;
    const rg=AX.createGain(); rg.gain.value=0.0001;
    rn.connect(rf); rf.connect(rl); rl.connect(rg); rg.connect(BUS.road); rn.start();
    const tre=AX.createOscillator(); tre.type='sine'; tre.frequency.value=4;
    const trd=AX.createGain(); trd.gain.value=0.0001; tre.connect(trd); trd.connect(rg.gain); tre.start();
    // 砂利・草
    const gn=loopSrc(nzB,0.85);
    const gf=AX.createBiquadFilter(); gf.type='highpass'; gf.frequency.value=1800;
    const gg=AX.createGain(); gg.gain.value=0.0001;
    gn.connect(gf); gf.connect(gg); gg.connect(BUS.road); gn.start();
    // 据え切り（スクラブ）：低くザリッとした擦れ
    const sn=loopSrc(nzB,1.07);
    const sf=AX.createBiquadFilter(); sf.type='bandpass'; sf.frequency.value=320; sf.Q.value=2.4;
    const sg=AX.createGain(); sg.gain.value=0.0001;
    sn.connect(sf); sf.connect(sg); sg.connect(BUS.road); sn.start();
    // スキール：高Qノイズ＋ビブラート付き倍音（純ノイズだけでは"鳴き"にならない）
    const qn=loopSrc(nzA,1.19);
    const q1=AX.createBiquadFilter(); q1.type='bandpass'; q1.frequency.value=1250; q1.Q.value=13;
    const q2=AX.createBiquadFilter(); q2.type='bandpass'; q2.frequency.value=2600; q2.Q.value=9;
    const qg=AX.createGain(); qg.gain.value=0.0001;
    qn.connect(q1); q1.connect(q2); q2.connect(qg); qg.connect(BUS.road); qn.start();
    const qo=AX.createOscillator(); qo.type='sawtooth'; qo.frequency.value=1100;
    const qog=AX.createGain(); qog.gain.value=0.16; qo.connect(qog); qog.connect(q1); qo.start();
    const vib=AX.createOscillator(); vib.type='sine'; vib.frequency.value=7.3;
    const vibg=AX.createGain(); vibg.gain.value=45; vib.connect(vibg); vibg.connect(qo.frequency); vib.start();
    // ブレーキ鳴き（低速時に薄く出入りする常設層）
    const bn=loopSrc(nzB,0.93);
    const bf2=AX.createBiquadFilter(); bf2.type='bandpass'; bf2.frequency.value=3000; bf2.Q.value=20;
    const bg=AX.createGain(); bg.gain.value=0.0001;
    bn.connect(bf2); bf2.connect(bg); bg.connect(BUS.road); bn.start();
    Object.assign(R,{rf,rl,rg,tre,trd,gg,gf,sf,sg,q1,qg,qo,bf2,bg,squealSeed:0});
  }

  /* 風切り＋バフェット */
  function buildWind(){
    const n=loopSrc(nzBrown,1);
    const hp=AX.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=500;
    const pk=AX.createBiquadFilter(); pk.type='peaking'; pk.frequency.value=1200; pk.Q.value=0.8; pk.gain.value=4;
    const g=AX.createGain(); g.gain.value=0.0001;
    n.connect(hp); hp.connect(pk); pk.connect(g); g.connect(BUS.wind); n.start();
    const b=loopSrc(nzBrown,0.61);
    const bl=AX.createBiquadFilter(); bl.type='lowpass'; bl.frequency.value=190;
    const bg=AX.createGain(); bg.gain.value=0.0001;
    b.connect(bl); bl.connect(bg); bg.connect(BUS.wind); b.start();
    const lfo=AX.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.37;
    const ld=AX.createGain(); ld.gain.value=0.004; lfo.connect(ld); ld.connect(bg.gain); lfo.start();
    Object.assign(WD,{hp,g,bg});
  }

  /* 環境音：遠くの交通のベッド＋小鳥＋通過車（音声クロックでスケジュール） */
  function buildAmbient(){
    const n=loopSrc(nzBrown,0.5);
    const lp=AX.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=320;
    const g=AX.createGain(); g.gain.value=0.0001;
    n.connect(lp); lp.connect(g); g.connect(BUS.ambient); n.start();
    const lfo=AX.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.055;
    const ld=AX.createGain(); ld.gain.value=0.006; lfo.connect(ld); ld.connect(g.gain); lfo.start();
    Object.assign(AM,{g,lp,birdAt:0,carAt:0});
  }

  /* ---------------- 単発音プリミティブ（発声数を上限で保護） ---------------- */
  function voice(){ if(voices>=MAXV) return false; voices++; return true; }
  function freeV(){ voices--; }
  function tone(f,dur,type,v,to,dest,at){
    if(!ready||!voice()) return;
    const t=now()+(at||0), o=AX.createOscillator(), g=AX.createGain();
    o.type=type||'sine'; f=cl(fin(f),8,18000);
    o.frequency.setValueAtTime(f,t);
    if(to) o.frequency.exponentialRampToValueAtTime(cl(fin(to),8,18000),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v||0.2),t+Math.min(0.015,dur*0.25));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest||BUS.ui); o.start(t); o.stop(t+dur+0.03);
    o.onended=freeV;
  }
  function noiseHit(dur,v,type,f,q,dest,at,sweepTo){
    if(!ready||!voice()) return;
    const t=now()+(at||0), s=AX.createBufferSource(); s.buffer=(Math.random()<0.5?nzA:nzB);
    s.playbackRate.value=0.8+Math.random()*0.4;
    const b=AX.createBiquadFilter(); b.type=type||'bandpass';
    b.frequency.setValueAtTime(cl(fin(f)||800,20,18000),t);
    if(sweepTo) b.frequency.exponentialRampToValueAtTime(cl(fin(sweepTo),20,18000),t+dur);
    b.Q.value=q||1;
    const g=AX.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,v||0.3),t+Math.min(0.008,dur*0.2));
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(b); b.connect(g); g.connect(dest||BUS.world);
    const off=Math.random()*1.5;
    try{ s.start(t,off,dur+0.05); }catch(_){ s.start(t); s.stop(t+dur+0.05); }
    s.onended=freeV;
  }

  /* ---------------- 効果音ライブラリ ---------------- */
  function relayClick(on){                      // ウインカーのリレー
    if(on){ noiseHit(0.012,0.16,'bandpass',2600,1.4,BUS.ui); tone(1780,0.022,'square',0.055,1500,BUS.ui,0.004); }
    else  { noiseHit(0.010,0.11,'bandpass',1750,1.6,BUS.ui); tone(1180,0.020,'square',0.038,980,BUS.ui,0.004); }
  }
  function gearClunk(from,to){                  // セレクターのゴトッ（P入れはパーキングポールのラチェット付き）
    noiseHit(0.055,0.20,'lowpass',360,0.8,BUS.world);
    tone(88,0.10,'sine',0.10,62,BUS.world);
    noiseHit(0.008,0.10,'bandpass',2300,2.2,BUS.world,0.012);
    if(to==='P'){ for(let i=0;i<3;i++) noiseHit(0.012,0.09,'bandpass',1500+i*140,3,BUS.world,0.05+i*0.035); }
    if(from==='P'&&to==='R') noiseHit(0.05,0.09,'lowpass',300,0.7,BUS.world,0.05);
  }
  function ratchet(set){                        // サイドブレーキ
    if(set){
      for(let i=0;i<7;i++) noiseHit(0.016,0.13,'bandpass',1180+i*55,4.5,BUS.world,i*0.043);
      noiseHit(0.16,0.05,'bandpass',420,1.2,BUS.world,0.02,760);      // レバーの軋み
    }else{
      noiseHit(0.018,0.14,'bandpass',1450,4,BUS.world);
      noiseHit(0.22,0.07,'highpass',900,0.7,BUS.world,0.03,2400);     // ケーブルが戻る音
      tone(120,0.09,'sine',0.05,80,BUS.world,0.02);
    }
  }
  function curbHit(I){                          // 脱輪・縁石ヒット
    I=cl(fin(I)||1,0.2,1.5);
    tone(78,0.16,'sine',0.20*I,40,BUS.world);
    noiseHit(0.10,0.34*I,'lowpass',320,0.8,BUS.world);
    noiseHit(0.055,0.16*I,'bandpass',1100,1.6,BUS.world,0.01);
    if(I>0.7) noiseHit(0.26,0.10*I,'bandpass',900,2.6,BUS.world,0.05,520);
  }
  function scrape(I){ noiseHit(0.30,0.10*cl(fin(I)||1,0.2,1.4),'bandpass',760,3.2,BUS.world,0,1250); }
  function crash(sev){                          // 衝突
    sev=cl(fin(sev)||1,0.25,1.5);
    noiseHit(0.42,0.42*sev,'lowpass',240,0.5,BUS.world);
    tone(58,0.40,'sawtooth',0.26*sev,28,BUS.world);
    for(let i=0;i<3;i++) noiseHit(0.11+Math.random()*0.1,0.20*sev,'bandpass',600+Math.random()*1900,2.4,BUS.world,Math.random()*0.07);
    if(sev>0.6) for(let i=0;i<5;i++) tone(2600+Math.random()*2600,0.06,'sine',0.035*sev,undefined,BUS.world,0.05+Math.random()*0.25);
  }
  function shiftJolt(up){                        // ATの変速ショック（セレクター音より軽い）
    noiseHit(0.045,0.09,'lowpass',230,0.7,BUS.world);
    tone(64,0.07,'sine',0.045,46,BUS.world);
    if(!up) noiseHit(0.03,0.045,'bandpass',700,1.6,BUS.world,0.012);
  }
  function chime2(){ tone(880,0.20,'sine',0.11,undefined,BUS.ui); tone(660,0.28,'sine',0.10,undefined,BUS.ui,0.19); }
  function horn(dur){
    dur=dur||0.5;
    const mk=f=>{ if(!voice())return; const t=now(), o=AX.createOscillator(), g=AX.createGain();
      o.type='sawtooth'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.075,t+0.018);
      g.gain.setValueAtTime(0.075,t+dur-0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      const b=AX.createBiquadFilter(); b.type='lowpass'; b.frequency.value=2400;
      o.connect(b); b.connect(g); g.connect(BUS.world); o.start(t); o.stop(t+dur+0.03); o.onended=freeV; };
    mk(440); mk(554.4);
  }
  function bellStrike(hi){                       // 踏切の警報機
    const f=hi?1180:980;
    for(const m of [1,2.76,5.4]) tone(f*m,0.42/m,'sine',(hi?0.075:0.07)/m,undefined,BUS.world);
    noiseHit(0.02,0.05,'bandpass',f*2,3,BUS.world);
  }
  const SFX={
    winker(){ relayClick(true); },
    gear(from,to){ gearClunk(from,to); },
    handbrake(set){ ratchet(set===undefined?true:!!set); },
    reject(){ noiseHit(0.07,0.16,'lowpass',180,0.6,BUS.world); tone(70,0.09,'sine',0.07,50,BUS.world); },
    curb(I){ curbHit(I); },
    scrape,
    crash,
    brakeSqueal(){ tone(2600,0.32,'sine',0.035,2150,BUS.road); },
    chime:chime2,
    door(open){ noiseHit(0.05,0.22,'bandpass',900,1.2,BUS.world); tone(110,0.12,'sine',0.10,70,BUS.world,0.01);
                if(!open) noiseHit(0.09,0.12,'lowpass',260,0.7,BUS.world,0.03); },
    seatbelt(){ noiseHit(0.10,0.10,'highpass',1800,0.8,BUS.world,0,3200); noiseHit(0.02,0.20,'bandpass',2100,2.4,BUS.world,0.13); },
    horn,
    blip(){ tone(1320,0.05,'sine',0.07,undefined,BUS.ui); },
    ok(){ tone(880,0.10,'sine',0.11,undefined,BUS.ui); tone(1320,0.17,'sine',0.10,undefined,BUS.ui,0.10); },
    ng(){ tone(320,0.18,'square',0.11,undefined,BUS.ui); tone(200,0.30,'square',0.10,undefined,BUS.ui,0.15); }
  };

  /* ---------------- 反復音（音声クロックでスケジュール） ---------------- */
  let indSide=null, indNext=0, indOn=false, onIndTick=null;
  let bellOn=false, bellNext=0, bellHi=false;
  let beltOn=false, beltNext=0;
  function indicator(side){
    side=side||null;
    if(side===indSide) return;
    indSide=side; indOn=false;
    if(ready&&side){ indNext=now(); }
  }
  function railBell(on){ bellOn=!!on; if(ready&&on) bellNext=now(); }
  function belt(on){ beltOn=!!on; if(ready&&on) beltNext=now(); }
  function pumpTimers(){
    const t=now();
    if(indSide){
      if(indNext<t-1.5) indNext=t;
      while(indNext<=t){ indOn=!indOn; relayClick(indOn); if(onIndTick) try{onIndTick(indOn);}catch(_){}
        indNext+=indOn?0.36:0.34; }
    }
    if(bellOn){ if(bellNext<t-1.5) bellNext=t;
      while(bellNext<=t){ bellHi=!bellHi; bellStrike(bellHi); bellNext+=0.29; } }
    if(beltOn){ if(beltNext<t-3) beltNext=t;
      while(beltNext<=t){ tone(1046,0.12,'sine',0.075,undefined,BUS.ui); beltNext+=0.85; } }
  }

  /* ---------------- 環境音のスケジュール ---------------- */
  function pumpAmbient(){
    if(ambience==='off') return;
    const t=now();
    if(t>AM.birdAt){
      AM.birdAt=t+(ambience==='yard'?4+Math.random()*10:9+Math.random()*18);
      const f=2200+Math.random()*1100, n=2+((Math.random()*3)|0);
      for(let i=0;i<n;i++){
        const ff=f*(0.9+Math.random()*0.3);
        tone(ff,0.055+Math.random()*0.04,'sine',0.028,ff*(Math.random()<0.5?1.4:0.72),BUS.ambient,i*0.11);
      }
    }
    if(ambience==='street'&&t>AM.carAt){
      AM.carAt=t+5+Math.random()*11;
      if(!voice()) return;
      const s=loopSrc(nzBrown,0.8+Math.random()*0.5);
      const b=AX.createBiquadFilter(); b.type='bandpass'; b.frequency.value=300; b.Q.value=0.9;
      const g=AX.createGain(), p=panner();
      const d=1.6+Math.random()*0.8, dir=Math.random()<0.5?1:-1;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.035,t+d*0.45);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      b.frequency.setValueAtTime(240,t); b.frequency.linearRampToValueAtTime(620,t+d*0.5); b.frequency.linearRampToValueAtTime(200,t+d);
      try{ p.pan.setValueAtTime(-dir,t); p.pan.linearRampToValueAtTime(dir,t+d); }catch(_){}
      s.connect(b); b.connect(g); g.connect(p); p.connect(BUS.ambient);
      s.start(t); s.stop(t+d+0.05); s.onended=freeV;
    }
  }

  /* ============================================================
     毎フレーム更新
     ============================================================ */
  let prevGear=null, prevGearNum=null, frame=0, lastT=0, rpmS=700, burbleAt=0, cutUntil=0, REDLINE=6500;
  function fakeRpm(st){
    // パワートレイン未実装時の暫定AT：トルコンの滑り（停止付近で回転が先に上がる）を模す
    const sp=Math.abs(fin(st.speed)), thr=cl(fin(st.throttle),0,1), drive=(st.gear==='D'||st.gear==='R');
    if(!drive) return 720+thr*3400;
    const stall=sp<3?(1-sp/3):0;                       // 0..1（低速ほど滑る）
    return 720+thr*(1150+2500*stall)+sp*(st.gear==='R'?260:150);
  }
  function update(st){
    if(!ready||!enabled) return;
    if(AX.state!=='running'){ if(AX.state==='suspended'&&!document.hidden){ try{AX.resume();}catch(_){} } return; }
    st=st||{};
    frame++;
    const t=now(), dt=cl(t-lastT,0,0.1)||0.016; lastT=t;

    const sp    = Math.abs(fin(st.speed));
    const gear  = st.gear||'P';
    // スロットルが渡されなければ負荷で代用（駆動系側が load しか出さない場合に対応）
    const thr   = st.throttle!==undefined ? cl(fin(st.throttle),0,1) : cl(fin(st.load),0,1);
    const brk   = cl(fin(st.brake),0,1);
    const slip  = cl(fin(st.slip),0,1);
    const scrub = cl(fin(st.scrub),0,1);
    const surf  = SURF[st.surface]||SURF.asphalt;
    const engOn = st.engineOn===undefined?true:!!st.engineOn;

    /* --- RPM：始動/停止シーケンス中は内部モデルを優先し、その後実RPMへ滑らかに戻る --- */
    let rpmIn = (st.rpm!==undefined&&st.rpm!==null)?fin(st.rpm):fakeRpm(st);
    if(E.state==='cranking'){
      rpmIn=250+Math.sin(t*22)*40;
      if(t-E.tState>0.88){ E.state='catch'; E.tState=t; }
    } else if(E.state==='catch'){
      const k=cl((t-E.tState)/0.75,0,1);
      // 初爆で1350rpmまで吹け上がり、そこからアイドルへ落ち着く（ファーストアイドル）
      rpmIn=Math.max(rpmIn, 250+1100*Math.min(1,k*3.2)-(k>0.32?(k-0.32)*1250:0));
      if(k>=1) E.state='run';
    } else if(E.state==='stopping'){
      const k=cl((t-E.tState)/0.65,0,1);
      rpmIn=720*(1-k)*(1+0.10*Math.sin(t*30));         // ディーゼリング風の揺れ
      if(k>=1) E.state='off';
    } else if(E.state==='off'){
      if(!engOn) rpmIn=0;
      else E.state='run';                               // 始動音なしで動かす場合の保険
    }

    rpmS += (cl(rpmIn,0,7600)-rpmS)*Math.min(1,dt*14);  // 表示RPMの平滑化
    const rpm=rpmS, on=(rpm>60);
    const f0 = rpm/30;                                   // 4気筒の点火周波数[Hz]
    const revN = cl((rpm-700)/5300,0,1);
    // 負荷：与えられていればそれ、無ければスロットル＋ストール分から推定
    const load = st.load!==undefined ? cl(fin(st.load),0,1)
               : cl(thr*0.85 + (gear!=='P'&&gear!=='N'&&sp<1.0?0.12:0) + revN*0.1, 0, 1);

    /* --- エンジン --- */
    ramp(E.low.o.frequency, cl(f0*0.5,4,4000), 0.03);
    ramp(E.mid.o.frequency, cl(f0,8,8000),     0.03);
    ramp(E.har.o.frequency, cl(f0,8,8000),     0.03);
    ramp(E.pul.frequency,   cl(f0,4,4000),     0.03);
    ramp(E.wh.frequency,    cl(rpm/60*7,20,9000), 0.05);
    ramp(E.low.g.gain, on?(0.55-0.22*load)*(1-0.35*revN):0, 0.06);
    const midG = on?(0.42+0.22*load):0;
    ramp(E.mid.g.gain, midG, 0.05);
    ramp(E.har.g.gain, on?(0.10+0.55*load*load+0.30*revN*revN):0, 0.06);
    const exG = on?(0.035+0.10*load+0.03*revN):0;
    ramp(E.eg.gain, exG, 0.05);
    ramp(E.pd.gain, exG*(1.15-0.5*revN), 0.05);          // 低回転ほど粒立ちを強く
    ramp(E.pd2.gain, midG*(0.42-0.30*revN), 0.05);
    ramp(E.ef.frequency, cl(140+f0*2.2,80,3400), 0.05);
    ramp(E.ef.Q, 0.7+load*1.2, 0.08);
    ramp(E.drive.gain, 1+2.4*load+0.9*revN, 0.06);
    ramp(E.lp.frequency, cl(300+2500*load+rpm*0.30, 220, 9000), 0.05);
    ramp(E.lp.Q, 0.9+1.3*load, 0.08);
    ramp(E.bp.frequency, cl(f0*1.5,80,340), 0.06);
    ramp(E.wg.gain, 3+22*Math.max(0,1-revN*3)*(1-load*0.7), 0.12);   // アイドルの揺らぎ
    ramp(E.whg.gain, on?(0.006+0.012*revN)*(gear==='R'?2.6:1):0, 0.08);
    // 出力：レブリミッターは音声時計に同期した断続で表現。変速中はトルク抜けで一瞬痩せる
    let egOut = on?(0.075+0.33*load+0.24*revN):0;
    if(rpm>REDLINE-150&&thr>0.5){ egOut *= ((t*13)%1>0.42?1:0.22); }
    if(t<cutUntil) egOut *= 0.55;
    ramp(E.out.gain, egOut, 0.045);
    // オーバーラン時のアフターファイア（パンパン）
    if(on&&thr<0.06&&rpm>2600&&t>burbleAt){
      burbleAt=t+0.05+Math.random()*0.16;
      if(Math.random()<0.55){ noiseHit(0.045,0.05+0.05*revN,'bandpass',380+Math.random()*500,1.4,BUS.engine); }
    }

    /* --- タイヤ・路面（30Hzで十分） --- */
    if(frame&1){
      const roll=Math.min(0.15, sp*0.026)*surf.roll;
      ramp(R.rg.gain, roll, 0.07);
      ramp(R.rf.frequency, (200+sp*24)*surf.f, 0.07);
      ramp(R.rl.frequency, cl(700+sp*260,600,6000), 0.09);
      ramp(R.tre.frequency, cl(sp/1.95*6, 1.5, 140), 0.07);   // タイヤ1回転あたり6ブロック
      ramp(R.trd.gain, roll*0.38*Math.min(1,sp/2), 0.07);
      ramp(R.gg.gain, Math.min(0.09, sp*0.02)*surf.grit, 0.08);
      ramp(R.gf.frequency, 1500+sp*90, 0.1);
      // 据え切り＝低速で速く回すほど強い
      ramp(R.sg.gain, scrub*0.055, 0.05);
      ramp(R.sf.frequency, 250+scrub*300, 0.06);
      // スキール（滑り）：ある程度速度がないと鳴かない
      const sq=Math.max(0,slip-0.12)*Math.min(1,sp/2.5)*surf.sq;
      ramp(R.qg.gain, sq*0.14, 0.04);
      ramp(R.qo.frequency, 900+slip*820+sp*7, 0.05);
      ramp(R.q1.frequency, 1150+slip*900, 0.05);
      // ブレーキ鳴き：低速＋踏力＋ランダムな出入り
      if(frame%64===0) R.squealSeed=Math.random();
      const squeal=(brk>0.25&&sp>0.15&&sp<2.2&&R.squealSeed<0.45)?(0.02+0.02*brk):0;
      ramp(R.bg.gain, squeal, 0.12);
      ramp(R.bf2.frequency, 2500+R.squealSeed*1400, 0.2);
      /* --- 風 --- */
      const w=cl(fin(st.wind),0,1);
      ramp(WD.g.gain, Math.min(0.085, sp*sp*0.0012+w*0.02), 0.12);
      ramp(WD.hp.frequency, 420+sp*34, 0.12);
      ramp(WD.bg.gain, Math.min(0.03, sp*sp*0.0004), 0.15);
    }

    /* --- 環境・反復音（毎フレームだが分岐だけで基本ノーコスト） --- */
    pumpTimers();
    if((frame&7)===0) pumpAmbient();

    /* --- シフト操作音：セレクター(P/R/N/D)と AT の変速(1..5)を別音で --- */
    if(st.gear&&st.gear!==prevGear){ if(prevGear!==null) gearClunk(prevGear,st.gear); prevGear=st.gear; }
    if(st.gearNum!==undefined&&st.gearNum!==prevGearNum){
      if(prevGearNum!==null&&on){ shiftJolt(st.gearNum>prevGearNum); cutUntil=t+0.22; }
      prevGearNum=st.gearNum;
    }
  }

  /* ---------------- 制御API ---------------- */
  function setEnabled(on){
    enabled=!!on;
    if(ready){ ramp(master.gain, enabled?vol*duck:0.0001, 0.12);
      if(enabled){ try{AX.resume();}catch(_){} } }
    if(!enabled){ indicator(null); railBell(false); belt(false); }
    return enabled;
  }
  function setMasterVolume(v){ vol=cl(fin(v),0,1); if(ready&&enabled) ramp(master.gain, vol*duck, 0.1); }
  function setDuck(x){ duck=cl(fin(x)||0,0.05,1); if(ready&&enabled) ramp(master.gain, vol*duck, 0.12); }
  function setBus(name,v){ if(ready&&BUS[name]) ramp(BUS[name].gain, cl(fin(v),0,2), 0.08); }
  function setQuality(q){ quality=q; if(ready&&E.sh) E.sh.oversample=(q==='low')?'none':'2x'; }
  function setRedline(v){ REDLINE=cl(fin(v)||6500,2000,9000); }   // 駆動系の DT.redline に合わせる
  function setAmbience(k){ ambience=k||'off';
    if(!ready) return;
    ramp(AM.g.gain, ambience==='off'?0.0001:(ambience==='street'?0.030:0.012), 0.5);
    ramp(AM.lp.frequency, ambience==='street'?460:300, 0.5);
  }
  function reset(){                                  // シナリオ切替時：反復音を止め、状態を初期化
    indicator(null); railBell(false); belt(false);
    prevGear=null; prevGearNum=null; rpmS=700; burbleAt=0; cutUntil=0;
    if(ready&&E.state!=='off'&&E.state!=='run') E.state='run';
  }
  function resume(){ if(AX&&AX.state==='suspended'){ try{AX.resume();}catch(_){} } }
  function suspend(){ if(AX&&AX.state==='running'){ try{AX.suspend();}catch(_){} } }
  function start(){ if(!ready||started) return; engineStart(); setAmbience(ambience); }

  return {
    init, start, resume, suspend, reset, update,
    setEnabled, isEnabled:()=>enabled, setMasterVolume, setBus, setQuality, setAmbience, setDuck, setRedline,
    indicator, railBell, belt,
    engine:{ start:engineStart, stop:engineStop, get rpm(){ return rpmS; }, get state(){ return E.state; } },
    sfx:SFX,
    set onIndicatorTick(f){ onIndTick=f; }, get onIndicatorTick(){ return onIndTick; },
    get ready(){ return ready; }, get ctx(){ return AX; }, get quality(){ return quality; }
  };
})();

/* ==================== 更新ループ ==================== */
let last=null, tick=0;
let drive={rpm:DT.idle,load:0,slip:0,gearNum:1};   // 駆動系の出力（音・HUDが参照）
function step(ts){ if(last==null)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; tick++;
  if(M && !result && !menu.classList.contains('show')){
    if(recenterWheel){ wheelAngle+=Math.sign(-wheelAngle)*Math.min(Math.abs(wheelAngle),8*dt); if(Math.abs(wheelAngle)<0.02){wheelAngle=0;recenterWheel=false;} }
    // 遊び（デッドゾーン）を挟んでハンドル→前輪切れ角
    // ハンドルを時計回り(右)に回す=wheelAngle正 → 前輪は右に切れる=car.steer負、という向きなので符号を反転する
    const eff=Math.max(0,Math.abs(wheelAngle)-WHEEL_PLAY)*Math.sign(wheelAngle);
    const targetSteer=-MAXSTEER*clamp(eff/(WHEEL_LOCK-WHEEL_PLAY),-1,1);
    if(demoMode) car.steer=targetSteer; else applySteerRate(car,targetSteer,dt);
    // 速度：実演は従来の目標追従（お手本の決定性を保つ）／通常運転は駆動系の物理で解く
    const dir=gear==='D'?1:gear==='R'?-1:0;
    // サイドを引いたままアクセルを「踏み続けた」ときだけ減点。坂道発進の正しい手順
    // （アクセルを当ててからサイドを緩める）を誤って減点しないよう猶予を持たせる
    if(handbrake&&accelHeld&&dir){ hbHoldT+=dt; } else hbHoldT=0;
    if(hbHoldT>1.5&&!hbWarned){ hbWarned=true; deduct('サイドブレーキ戻し忘れ',10); setCoach('サイドブレーキが掛かっています！左下で解除','bad'); }
    if(demoMode){ car.v+=(demoTargetV-car.v)*Math.min(1,dt*5); if(Math.abs(car.v)<0.015&&demoTargetV===0)car.v=0;
      drive={rpm:700+Math.abs(car.v)*900,load:0.15,slip:0,gearNum:1};
    } else {
      // 課題ごとの上限速度に近づくとスロットルを絞る（構内課題での非現実的な速度超過を防ぐ）
      const vmax=(M&&M.speedLimitMs)||2.2, sp0=Math.abs(car.v);
      let thr=accelHeld? clamp(1-(sp0-vmax*0.7)/(vmax*0.6),0,1) : 0;
      if(!creepMode&&!accelHeld) thr=0;
      const brk=brakeHeld?1:0;
      drive=driveUpdate(car,dt,thr,brk,gear,handbrake,gradeAlong(car.x,car.y,car.th));
    }
    integrateLat(car,dt);
    // 自分の軌跡（後車軸）を記録
    if(Math.abs(car.v)>0.03){ const lt=trail[trail.length-1];
      if(!lt||Math.hypot(car.x-lt.x,car.y-lt.y)>0.12){ trail.push({x:car.x,y:car.y}); if(trail.length>2500)trail.shift(); } }
    // --- サウンド：現状の速度/操作から回転数と負荷を推定して駆動（ドライブトレイン実装後は実RPMに差し替え） ---
    SimAudio.update({rpm:drive.rpm,speed:Math.abs(car.v),load:drive.load,
      slip:Math.max(drive.slip,LAT.slip,LAT.scrub*0.7),gear,braking:brakeHeld});
    signalUpdate(dt);
    if(demoMode) demoUpdate(dt); else updateLogic();
    handAnim(dt);
  }
  renderScene(); renderFront(); renderWheel(); renderMirror('L'); renderMirror('R'); renderRearview(); updateGauges();
  requestAnimationFrame(step);
}
function updateLogic(){
  const reversing=car.v<-0.05;
  if(car.v>0.05&&wasReversing){ reverses++;
    if(reverses===2||reverses===3){ deduct(`切り返し${reverses}回目`,5); if(!examMode)setCoach(`切り返し${reverses}回目（−5点）`,'warn'); }
    if(reverses>=4){ finish('fail','切り返し超過（4回）'); return; } }
  if(reversing)wasReversing=true; else if(car.v>0.05)wasReversing=false;
  // 後退開始時の安全確認チェック
  if(reversing&&gear==='R'&&!revCheckDone){ revCheckDone=true; safetyOK=allChecked();
    if(!safetyOK){ deduct('後退時の安全不確認',10); if(!examMode)setCoach('安全確認が不足！ルーム→左右ミラー→👀目視をタップしてから後退','bad'); } }
  // 速度の出しすぎ
  const spdCap=((M&&M.speedLimitMs)||2.2)*1.35;   // 課題ごとの上限に余裕をみた閾値
  if(Math.abs(car.v)>spdCap){ if(++spdTicks>50&&!spdWarned){ spdWarned=true; deduct('速度の出しすぎ',5); if(!examMode)setCoach('この課題では速度を抑えて','warn'); } } else spdTicks=0;
  // 「柵の角が見えてから下がる」の癖づけ（＝手前すぎ後退の矯正。今回の検定NGの真因対策）
  if(M.successKind==='perp' && cuePoleRef){
    if(!poleSeenEver && poleInMirror && !reversing){ poleSeenEver=true;
      if(!examMode) setCoach(`${M.lockLabel}ミラーに柵の角が見えた！青ラインまで進んで止まる`,'ok'); }
    if(reversing && !earlyReverseWarned && !poleSeenEver){ earlyReverseWarned=true;
      advice=`後退開始が手前すぎ：${M.lockLabel}ミラーに柵の角がはっきり見えてから下がる癖を`;
      if(!examMode) setCoach('まだ早い！ミラーに柵の角が見えてから後退','bad'); }
  }
  // 基準点タイミング（結果パネル用にadviceも保存）
  if(M.successKind==='perp' && reversing && !cutRecorded && Math.abs(car.steer)>MAXSTEER*0.5){ cutRecorded=true; const d=M.turnRefX-car.x;
    if(d>0.4){ advice=`早切り癖：あと約${(d*100)|0}cm前に出てから切るとお手本の弧に乗る`; if(!examMode)setCoach(advice,'warn'); }
    else if(d<-0.4){ advice=`切り遅れ：${((-d)*100)|0}cmほど手前で切り始めると余裕が出る`; if(!examMode)setCoach(advice,'warn'); }
    else { advice=''; if(!examMode)setCoach(`切り始めOK！このまま${M.lockLabel}いっぱいで奥まで`,'ok'); } }
  if(M.successKind==='parallel' && reversing && parPhase===0 && Math.abs(normAng(car.th))>=M.theta1*0.85){ parPhase=1; if(!examMode)setCoach('今！ここから「左いっぱい」に切り返して真っ直ぐに','warn'); }
  // 検定基準の当たり判定：タイヤが縁石を越える＝脱輪／車体がポール・駐車車両に触れる＝接触
  // （鼻先やオーバーハングが縁石の上空にはみ出すだけなら減点なし＝実際の検定と同じ）
  const cs=carCorners(car);
  for(const o of M.obstacles){ for(const p of carPerimeter(car)) if(inRect(o,p.x,p.y)){ contactFail=true;
    finish('fail','接触（駐車車両）'); return; } }
  if(poleHit(car)){ contactFail=true; finish('fail','ポール接触'); return; }
  const wpz=wheelPositions(car);
  for(const k in wpz){ if(!drivable(wpz[k].x,wpz[k].y)){ contactFail=true;
    finish('fail','脱輪（タイヤが縁石を越えた）'); return; } }
  // 鼻先のはみ出しは正常な挙動であることを一度だけ通知
  if(!examMode&&!noseInfoShown){ for(const p of carPerimeter(car)) if(!drivable(p.x,p.y)){ noseInfoShown=true;
    setCoach('鼻先が縁石の上に出るのは正常。タイヤが越えなければ脱輪ではない','ok'); break; } }
  // --- 坂道発進：停止線での停止 → 逆行させずに発進 → 坂上のゴール ---
  if(M.successKind==='hill'){ hillLogic(); return; }
  // --- 信号交差点：赤で停止、青で発進、赤進入は即中止 ---
  if(M.successKind==='signal'){ signalLogic(); return; }
  // --- 踏切：停止線での一時停止 → 安全確認 → 渡り切ってゴール ---
  if(M.successKind==='railway'){ railwayLogic(); return; }
  // --- 通過型（S字・クランク）：脱輪せずゴール枠へ入り、停止→P→サイドで完了 ---
  if(M.successKind==='course'){
    if(inGoalZone()&&Math.abs(car.v)<0.05){
      if(gear==='P'&&handbrake) finish('success');
      else if(tick%40===0&&!examMode) setCoach('ゴール！停止 → P → サイドで完了','ok'); }
    return; }
  // 正着判定 → 完了手順（停止→P→サイド）で終了
  const posOK = M.successKind==='perp'
    ? (inRect(M.bay,cs[2].x,cs[2].y)&&inRect(M.bay,cs[3].x,cs[3].y)&&alignedV(car.th))
    : (cs.every(p=>inRect(M.bay,p.x,p.y))&&alignedH(car.th));
  if(posOK&&Math.abs(car.v)<0.03){
    if(gear==='P'&&handbrake){ finish('success'); }
    else if(tick%40===0) setCoach('OK！ここで停止 → シフトP → サイドを掛けて完了','ok');
  }
}
// 通過型コースのゴール判定：後車軸がゴール帯の中にあれば到達とみなす
function inGoalZone(){ const gr=M.goalRect; if(!gr) return false;
  return inRect(gr,car.x,car.y) || carCorners(car).every(p=>inRect(gr,p.x,p.y)); }
/* 信号の判定：赤・黄での進入可否と、交差点内での停止 */
function signalLogic(){
  const sg=M.signals[0], nose=Math.max(...carCorners(car).map(p=>p.x));
  const enteringNow = nose>=M.interX0 && car.x<M.interX1;
  if(!sigEntered && enteringNow){                    // 交差点へ進入した瞬間の信号で判定
    sigEntered=true;
    if(sg.state==='red'){ finish('fail','信号無視（赤で進入）'); return; }
    if(sg.state==='yellow' && sigCouldStop){ deduct('黄信号で進入',10);
      if(!examMode) setCoach('黄信号は「止まれ」が原則（−10点）','warn'); }
  }
  // 黄に変わった時点で、停止線まで余裕をもって止まれたかを記録しておく
  if(sg.state==='yellow' && !sigYellowSeen){ sigYellowSeen=true;
    const dist=M.stopLineX-nose, brakeDist=(car.v*car.v)/(2*4.0);   // 減速度4m/s^2 想定
    sigCouldStop = dist>brakeDist+0.5; }
  if(sg.state==='green') { sigYellowSeen=false; sigCouldStop=false; }
  if(!examMode && !sigEntered && tick%30===0){
    const d=M.stopLineX-nose;
    if(sg.state==='red'&&d>0&&d<12) setCoach('赤信号。停止線の手前で止まる','warn');
    else if(sg.state==='green'&&d>0&&d<14) setCoach('青。交差点の左右も確認して通過','ok'); }
  // ゴール
  if(sigEntered && car.x>M.interX1 && inGoalZone() && Math.abs(car.v)<0.05){
    if(gear==='P'&&handbrake) finish('success');
    else if(tick%40===0&&!examMode) setCoach('ゴール！停止 → P → サイドで完了','ok'); }
}
/* 踏切の判定：①停止線の手前で完全停止 ②左右の安全確認 ③渡り切る（不停止＝即中止） */
function railwayLogic(){
  const nose=Math.max(...carCorners(car).map(p=>p.x));
  if(railPhase===0){                                  // 停止線へ接近
    if(Math.abs(car.v)<0.05 && nose>M.stopLineX-2.5 && nose<M.stopLineX+0.3){
      railPhase=1; railStopTick=tick;
      if(!examMode) setCoach('停止OK！左右の安全を確認（ミラー／目視）してから渡る','ok'); }
    else if(nose>M.stopLineX+0.3){ finish('fail','踏切不停止'); return; }
  } else if(railPhase===1){                           // 停止保持＋安全確認
    if(tick-railStopTick>30){                          // 0.5秒以上止まっていれば発進可
      if(allChecked()||railWarned){ railPhase=2;
        if(!examMode) setCoach('確認OK！ここからは止まらず一気に渡り切る','ok'); }
      else if(car.v>0.25){ railWarned=true; railPhase=2;
        deduct('踏切での安全確認不足',10);
        if(!examMode) setCoach('左右の確認をしてから渡る（−10点）','warn'); } }
  } else if(railPhase===2){                           // 渡っている最中
    if(Math.abs(car.v)<0.03 && Math.abs(car.x-M.railX)<2.5 && !railStalled){ railStalled=true;
      deduct('踏切内で停止',20); if(!examMode) setCoach('踏切の中で止まらない！（−20点）','bad'); }
    if(car.x>M.railX+3) railPhase=3;
  } else {                                            // ゴール
    if(inGoalZone()&&Math.abs(car.v)<0.05){
      if(gear==='P'&&handbrake) finish('success');
      else if(tick%40===0&&!examMode) setCoach('ゴール！停止 → P → サイドで完了','ok'); }
  }
}
/* 坂道発進の判定：①停止線に前端を合わせて停止 ②サイドで保持 ③逆行30cm以内で発進 ④ゴール */
function hillLogic(){
  const nose=Math.max(...carCorners(car).map(p=>p.x));
  const stopped=Math.abs(car.v)<0.05;
  if(hillPhase===0){                                   // 停止線をねらう
    if(nose>M.stopLineX+0.30 && !hillOver){ hillOver=true;      // 行き過ぎは減点。ただし課題は続行する
      deduct('停止線オーバー',10); if(!examMode) setCoach('停止線を越えた（−10点）そのまま坂道発進へ','warn'); }
    // 停止線の手前2mから+30cmで止まれば正規。行き過ぎた場合も止まれば発進フェーズへ進む
    if(stopped && nose>M.stopLineX-2.0){
      hillPhase=1; hillHoldTick=tick; hillMinX=car.x;
      if(!examMode&&!hillOver) setCoach('停止OK！サイドブレーキを引いて、発進の準備','ok'); }
  } else if(hillPhase===1){                            // 停止保持 → 発進待ち
    if(hillStartX0===null) hillStartX0=car.x;          // 基準は「停止した位置」（逆行量の起点）
    hillMinX=Math.min(hillMinX,car.x);
    if(handbrake) hillUsedHb=true;
    if(car.v>0.25){ hillPhase=2; if(!examMode) setCoach('発進！このまま坂の上のゴールへ','ok'); }
    const back=hillStartX0-car.x;                      // 起点より後ろ＝逆行
    if(back>0.30 && !hillRolled){ hillRolled=true;
      if(back>0.5){ finish('fail','逆行（30cm超）'); return; }
      deduct('逆行',10); if(!examMode) setCoach('逆行した（−10点）サイドを使って発進','bad'); }
    if(!hillUsedHb && tick-hillHoldTick>150 && !hillHbWarned){ hillHbWarned=true;
      if(!examMode) setCoach('坂ではサイドブレーキを使って発進するのが基本','warn'); }
  } else {                                             // ゴール判定
    if(car.x>=M.goalX && Math.abs(car.v)<0.05 && gear==='P' && handbrake) finish('success');
    else if(car.x>=M.goalX && tick%40===0 && !examMode) setCoach('ゴール！停止 → P → サイドで完了','ok');
  }
}
/* ==================== お手本実演（自動運転チュートリアル） ==================== */
// 教習所の標準技法をそのまま見せる：「止まって回し切る → 弧の間は保持 → 止まって戻し切る」
// （切り始め・戻し始めが遅れて切り量が増える癖への矯正教材）
const sideTurns=(WHEEL_LOCK/(2*Math.PI)).toFixed(1);           // 中央→ロック ≈1.4回転
const fullTurns=(WHEEL_LOCK*2/(2*Math.PI)).toFixed(1);         // ロック→逆ロック ≈2.8回転
function startDemo(withTutor){ loadScenario(M.id); demoMode=true; tutorMode=!!withTutor; tutorFired=new Set();
  handbrake=false; updateHbUI(); gear='D'; setGearUI();
  setCoach('【お手本】① 前進：切り始めラインまで進む（ポールが見えてもラインまで）','ok');
  if(M.successKind==='perp')
    tutor('t0',`進入の「寄せ」は縁石から約40cm。\n道路幅3mでは寄せないと前タイヤが反対の縁石を越えて脱輪。\n逆にベタ寄せは内側後輪が角を巻き込むので、40cm前後が正解。`);
  else
    tutor('p0',`前の車と50cmほど間隔をとって、平行に並ぶ位置まで前進。\nここでも寄せすぎ・離れすぎは後の弧がズレる原因。`); }
// 解説付きモード：要所で自動停止して解説をポップアップ（タップで再開）
function tutor(id,text){ if(!tutorMode||tutorFired.has(id))return; tutorFired.add(id);
  tutorWait=true; demoTargetV=0;
  document.getElementById('tutorTxt').textContent=text;
  const p=document.getElementById('tutorPop');
  p.classList.remove('show'); void p.offsetWidth; p.classList.add('show'); }
function demoUpdate(dt){
  if(tutorWait){ demoTargetV=0; return; }
  demoT+=dt;
  const dw=demoWheelTarget-wheelAngle;
  wheelAngle+=clamp(dw,-DEMO_WHEEL_RATE*dt,DEMO_WHEEL_RATE*dt);
  const lockSign=M.lockLabel==='右'?1:-1;                       // wheelAngle正＝右回し
  const doChecks=()=>{ if(demoChecksDone)return; demoChecksDone=true;
    registerCheck('C'); setTimeout(()=>registerCheck('L'),350); setTimeout(()=>registerCheck('R'),700); setTimeout(()=>{checks.back=tick;},1050); };
  if(M.successKind==='perp'){
    const targetTh=lockSign*Math.PI/2;
    switch(demoPhase){
      case 0: demoTargetV=C.creep;
        if(poleInMirror) tutor('t1',`${M.lockLabel}ミラーに柵の角が見えた！\nでも、ここではまだ下がらない。見えてから「さらに青ラインまで」進む。\n（ここで下がるのが“手前すぎ”＝入りきらない典型原因）`);
        if(car.x>=M.turnRefX){ demoPhase=1; demoT=0; setCoach('【お手本】② 停止 → 安全確認（ミラー3枚＋目視）→ R','ok');
          tutor('t2',`停止位置がすべて。青ライン＝「後輪」を合わせる。\n体感の目安：自分のお尻（車の後端）が柵の角を過ぎて半歩。\n浅い（手前）と後からは絶対に直せない→切り返し確定。`); } break;
      case 1: demoTargetV=0;
        if(Math.abs(car.v)<0.02){ if(demoT>0.4){ doChecks(); setRearGlance(true);      // 振り返り視界に切替
            tutor('t2b',`後方目視に切替：後ろを振り返ると、リヤウインド越しに「柵の角」が見える。\n角がCピラーの際（🎯）に来ていれば、切り始めの位置に正しく止まれている証拠。`); }
          if(demoT>2.0){ gear='R'; setGearUI(); demoPhase=2; demoT=0; demoWheelTarget=lockSign*WHEEL_LOCK;
            setCoach(`【お手本】③ 止まったまま${M.lockLabel}へ回し切る（約${sideTurns}回転）`,'ok');
            tutor('t3',`後退の前に${M.lockLabel}ミラーを下向きに調整して「後輪」を映す（停止中の調整は減点なし）。\n後退中に見るのは“後輪と縁石の間隔”だけでいい。`); } } break;
      case 2: demoTargetV=0;
        if(Math.abs(dw)<0.03){ demoPhase=3; setCoach('【お手本】④ ハンドル保持のまま、ゆっくり後退（弧の間は動かさない）','ok');
          tutor('t4',`止まったまま${M.lockLabel}いっぱいへ回し切った（約${sideTurns}回転）。\nこれで軌道は決まった。弧の間はハンドルを動かさず「保持」。`); } break;
      case 3: demoTargetV=-C.creep;
        { const prog=Math.abs(normAng(car.th));
          if(prog>25*DEG) tutor('t5',`ミラーで後輪と縁石の間隔をチェック。\n・近すぎ → 少しだけ戻せば離れる（直せる）\n・遠い → もう直せない（＝開始位置が浅かった証拠）`);
          if(prog>52*DEG) tutor('t6',`鼻先が反対側の縁石の上に出るのは「正常」。\nタイヤさえ越えなければ脱輪ではない（検定基準）。\n慌ててハンドルを戻さないこと。`); }
        if(Math.abs(normAng(car.th-targetTh))<2.5*DEG){ demoPhase=4; demoT=0; demoWheelTarget=0;
          setCoach(`【お手本】⑤ 止まって逆へ戻し切る（約${sideTurns}回転でまっすぐ）`,'ok');
          tutor('t7',`車が直角になったら停止 → 止まったまま逆へ戻し切る（約${sideTurns}回転）。\n動きながらダラダラ戻すと戻し量が分からなくなる。`); } break;
      case 4: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&Math.abs(wheelAngle)<0.03){ demoPhase=5; setCoach('【お手本】⑥ まっすぐ奥まで後退','ok'); } break;
      case 5: demoTargetV=-C.creep*0.8;
        if(lockSign>0? car.y<=M.ideal.end.y+0.05 : car.y>=M.ideal.end.y-0.05){ demoPhase=6; demoT=0; } break;
      case 6: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&demoT>0.3){ gear='P'; setGearUI(); handbrake=true; updateHbUI(); result='demo'; demoMode=false; setRearGlance(false);
          setCoach('【お手本】⑦ P→サイドで完了！コツ＝「止まって回し切る・弧は保持・止まって戻し切る」','ok'); } break;
    }
  } else { // 縦列
    switch(demoPhase){
      case 0: demoTargetV=C.creep;
        if(car.x>=M.turnRefX){ demoPhase=1; demoT=0; setCoach('【お手本】② 停止 → 安全確認 → R','ok');
          tutor('p1','自分の後輪が「前の車の後端」と並んだあたりで停止。\nここが縦列の切り始めの基準点。'); } break;
      case 1: demoTargetV=0;
        if(Math.abs(car.v)<0.02){ if(demoT>0.4) doChecks();
          if(demoT>2.0){ gear='R'; setGearUI(); demoPhase=2; demoT=0; demoWheelTarget=WHEEL_LOCK;
            setCoach(`【お手本】③ 止まったまま右へ回し切る（約${sideTurns}回転）`,'ok'); } } break;
      case 2: demoTargetV=0;
        if(Math.abs(dw)<0.03){ demoPhase=3; setCoach('【お手本】④ 後退：車が斜め約40°になるまで','ok'); } break;
      case 3: demoTargetV=-C.creep;
        if(Math.abs(normAng(car.th))>=M.theta1){ demoPhase=4; demoT=0; demoWheelTarget=-WHEEL_LOCK;
          setCoach(`【お手本】⑤ 止まって左へ回し切る（逆いっぱいまで約${fullTurns}回転）`,'ok');
          tutor('p4',`ここが切り返し点：車が斜め約40°になった瞬間。\n止まって「左いっぱい」へ（逆ロックまで約${fullTurns}回転）。\n遅れると後輪が縁石に刺さる。`); } break;
      case 4: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&Math.abs(dw)<0.03){ demoPhase=5; setCoach('【お手本】⑥ 左いっぱいのまま後退、まっすぐになるまで','ok'); } break;
      case 5: demoTargetV=-C.creep;
        if(Math.abs(normAng(car.th))<2*DEG){ demoPhase=6; demoT=0; demoWheelTarget=0;
          setCoach(`【お手本】⑦ 止まってまっすぐに戻す（約${sideTurns}回転）`,'ok'); } break;
      case 6: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&Math.abs(wheelAngle)<0.03&&demoT>0.3){ gear='P'; setGearUI(); handbrake=true; updateHbUI(); result='demo'; demoMode=false;
          setCoach('【お手本】完了！コツ＝「回し切る↔戻し切る」は毎回止まってから','ok'); } break;
    }
  }
}

/* ==================== 採点・結果 ==================== */
function finish(kind,reason){ result=kind; car.v=0;
  if(kind==='fail'){ if(reason&&/脱輪/.test(reason)) SimAudio.sfx.curb(); else SimAudio.sfx.crash(); setTimeout(()=>SimAudio.sfx.ng(),320); }
  else if(kind==='success') SimAudio.sfx.ok();
  if(kind==='fail'&&reason) deductions.push({name:reason+'＝検定中止',pts:100});
  const total=deductions.reduce((a,d)=>a+d.pts,0), score=Math.max(0,100-total);
  const pass=kind==='success'&&score>=70;
  setCoach(kind==='success'?`完了！切り返し ${reverses} 回`:'検定中止','ok');
  showResult(pass,score,kind);
}
function showResult(pass,score,kind){
  const t=document.getElementById('resTitle'), s=document.getElementById('resScore'), b=document.getElementById('resBody');
  t.textContent=pass?'🎉 合格ライン！':'不合格'; t.className=pass?'pass':'fail';
  s.textContent=`${score}点 ／ 100点（70点以上で合格${examMode?'・検定モード':'・練習モード'}）`;
  const ded=deductions.length?('<ul>'+deductions.map(d=>`<li>${d.name}：−${d.pts>=100?'中止':d.pts+'点'}</li>`).join('')+'</ul>'):'<ul><li>減点なし！</li></ul>';
  const ck=[
    ['サイドブレーキ操作', hbWarned?'✗ 戻し忘れ':'✓'],
    ['後退前の安全確認', safetyOK===false?'✗ 不足':safetyOK===null?'−（未後退）':'✓'],
    ['切り返し回数', `${reverses}回 ${reverses<=1?'✓':reverses<=3?'△':'✗'}`],
    ['接触・脱輪', contactFail?'✗':'✓'],
    ['枠内に正着', kind==='success'?'✓':'✗'],
  ].map(([k,v])=>`<li>${k}：${v}</li>`).join('');
  b.innerHTML=`<div class="sec-t">減点内訳</div>${ded}<div class="sec-t">手順チェック</div><ul>${ck}</ul>`+(advice?`<div class="adv">💡 ${advice}</div>`:'');
  document.getElementById('resultPanel').classList.add('show');
}

/* ==================== 俯瞰の描画（左） ==================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let PPM=22,W=0,H=0,ox=0,oyTop=0,frontBottom=0;
// 俯瞰カメラ：小さい課題は全体表示、長いコースは自車追従にする（サーキット／路上に必須）
const CAM={ follow:false, cx:0, cy:0, viewX:0, viewY:0, viewW:0, viewH:0 };
// アスファルトの質感パターン（初回のみ生成）
const asphPat=(()=>{ const c=document.createElement('canvas'); c.width=c.height=48; const g=c.getContext('2d');
  for(let i=0;i<150;i++){ g.fillStyle=`rgba(${185+Math.random()*45|0},${195+Math.random()*40|0},${215+Math.random()*30|0},${0.04+Math.random()*0.09})`;

function resize(){ const r=document.getElementById('app').getBoundingClientRect(), dpr=window.devicePixelRatio||1;

/* ==================== ステアリング＋手（右ダッシュボード） ==================== */
const hand={grip:[0,0], anim:[0,0]}; const HAND_HOME=[0,Math.PI], COMF=150*DEG;
function handAnim(dt){ hand.anim[0]=Math.max(0,hand.anim[0]-dt*4); hand.anim[1]=Math.max(0,hand.anim[1]-dt*4); }
function renderWheel(){ const g=wheelCv.getContext('2d'), w=wheelCv.getBoundingClientRect().width, h=wheelCv.getBoundingClientRect().height;
  g.clearRect(0,0,w,h); const cx=w/2, cy=h/2, R=Math.min(w,h)/2-10;
  g.save(); g.translate(cx,cy);
  // 目盛り（中心・固定）
  g.strokeStyle='#39435c'; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,-R-4); g.lineTo(0,-R+6); g.stroke();
  g.save(); g.rotate(wheelAngle);
  // リム
  g.strokeStyle='#e6ecf6'; g.lineWidth=Math.max(6,R*0.16); g.beginPath(); g.arc(0,0,R,0,7); g.stroke();
  // スポーク

  g.fillStyle='#cbd5e6'; g.beginPath(); g.arc(0,0,R*0.18,0,7); g.fill();
  g.fillStyle='#4da3ff'; g.beginPath(); g.arc(0,-R,R*0.1,0,7); g.fill();  // 上部マーカー
  g.restore();
  // 手（持ち替えアニメ）
  for(let i=0;i<2;i++){ let rel=wheelAngle-hand.grip[i];
    while(rel>COMF){ hand.grip[i]+=COMF; rel-=COMF; hand.anim[i]=1; }
    while(rel<-COMF){ hand.grip[i]-=COMF; rel+=COMF; hand.anim[i]=1; }
    const ang=HAND_HOME[i]+rel, lift=hand.anim[i], rr=R*(1-0.14*lift);
    const hx=Math.cos(ang)*rr, hy=Math.sin(ang)*rr;
    g.save(); g.translate(hx,hy); g.rotate(ang+Math.PI/2); g.globalAlpha=1-0.25*lift;
    g.fillStyle='#f0c9a8'; g.strokeStyle='#c99b76'; g.lineWidth=1.5;
    roundRectG(g,-9,-7,18,15,5); g.fill(); g.stroke();
    for(let k=-1;k<=2;k++){ g.beginPath(); roundRectG(g,-8+ (k+1)*4.2,-11,3.4,6,1.6); g.fill(); g.stroke(); } // 指

  g.restore();

  g.fillStyle='#93a1b8'; g.font='11px system-ui'; g.textAlign='center';
  const turns=(wheelAngle/(2*Math.PI)), sd=Math.round(Math.abs(car.steer)/DEG);
  const rTxt=Math.abs(car.steer)<0.5*DEG?'直進':`R${Math.abs(C.wheelbase/Math.tan(car.steer)).toFixed(1)}m`;
  g.fillText(`${turns>=0?'右':'左'}${Math.abs(turns).toFixed(1)}回転｜舵角${sd}°｜${rTxt}`, cx, h-4);
}
function roundRectG(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ==================== ミラー（3D投影・リアル化：自車の車体＋タイヤ＋ルームミラー） ==================== */
const CARCOL='#c23a34';

function mkProj(camx,camy,camH,look,focal,horizon,w,sgn=-1){ const cs=Math.cos(look), sn=Math.sin(look);
  return (px,py,pz)=>{ const dx=px-camx,dy=py-camy, depth=dx*cs+dy*sn; if(depth<=0.18)return null;
    const cr=dx*sn-dy*cs; return {x:w/2 + sgn*focal*(cr/depth), y:horizon - focal*((pz-camH)/depth), depth}; }; }
function mSky(g,w,h,horizon){ const hz=clamp(horizon,0,h);

function mFencePost(proj,g,x,y,top,corner){ const a=proj(x,y,0); if(!a)return;

  const lw=clamp((corner?46:34)/a.depth,2,POST_LW_CAP), shR=clamp(26/a.depth,3,POST_LW_CAP*1.4);

  if(cb0&&cb1&&gb0&&gb1 && Math.min(cb0.depth,cb1.depth)>0.8){ g.fillStyle='#7f8b9e'; g.beginPath();
    g.moveTo(cb0.x,cb0.y); g.lineTo(cb1.x,cb1.y); g.lineTo(gb1.x,gb1.y); g.lineTo(gb0.x,gb0.y); g.closePath(); g.fill();

/* ポケット（枠）を囲う縁石＋柵。入口辺は開けて左右の角支柱だけ立てる */
function mFence(proj,g){ if(!M.bay||!M.poles.length)return; const b=M.bay;
  const entY=Math.abs(b.y0-M.appY)<Math.abs(b.y1-M.appY)?b.y0:b.y1, backY=entY===b.y0?b.y1:b.y0;

/* 縁石：上面の白線＋立ち上がり面で立体に */
function mCurb(proj,g,y){

    const a0=proj(x,y,0.13),a1=proj(x+0.5,y,0.13),b0=proj(x,y,0),b1=proj(x+0.5,y,0);

    g.fillStyle='#8a97ab'; g.beginPath(); g.moveTo(a0.x,a0.y); g.lineTo(a1.x,a1.y); g.lineTo(b1.x,b1.y); g.lineTo(b0.x,b0.y); g.closePath(); g.fill();
    g.strokeStyle='#e8edf4'; g.lineWidth=2; g.beginPath(); g.moveTo(a0.x,a0.y); g.lineTo(a1.x,a1.y); g.stroke(); }
}
/* 目標枠を路面に塗って見せる */
function mBayFill(proj,g){ if(!M.bay)return;
  const c=[[M.bay.x0,M.bay.y0],[M.bay.x1,M.bay.y0],[M.bay.x1,M.bay.y1],[M.bay.x0,M.bay.y1]].map(([x,y])=>proj(x,y,0.015));
  if(c.some(p=>!p)){ mRect(proj,g,M.bay,'rgba(150,195,150,.5)',2,0.02); return; }
  g.beginPath(); c.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.closePath();
  g.fillStyle='rgba(90,170,110,.15)'; g.fill();
  g.setLineDash([6,5]); g.strokeStyle='rgba(195,232,205,.7)'; g.lineWidth=2; g.stroke(); g.setLineDash([]); }
/* 奥行きグリッド（距離感） */
function drawMirrorGrid(g,proj,camx,camy,look){ g.strokeStyle='rgba(60,70,84,.22)'; g.lineWidth=1;
  const cs=Math.cos(look),sn=Math.sin(look);
  for(let d=2;d<=14;d+=2){ let prev=null; for(let o=-8;o<=8;o+=2){ const p=proj(camx+cs*d-sn*o,camy+sn*d+cs*o,0);

function mCarBox(proj,g,r,ht){ const c=[[r.x0,r.y0],[r.x1,r.y0],[r.x1,r.y1],[r.x0,r.y1]];

// コリドーの左右のふちを3D縁石として描く（前方視界・ミラー・振り返りで共通）

    const edge=[];

      const a=co.pts[Math.max(0,i-1)], b=co.pts[Math.min(co.pts.length-1,i+1)];
      const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy)||1;

      const b0=proj(edge[i].x,edge[i].y,0),    b1=proj(edge[i+1].x,edge[i+1].y,0);
      if(!a0||!a1||!b0||!b1) continue;

      g.moveTo(a0.x,a0.y); g.lineTo(a1.x,a1.y); g.lineTo(b1.x,b1.y); g.lineTo(b0.x,b0.y); g.closePath(); g.fill();

function mRails(proj,g){

function mSignals(proj,g){

function mWorld(proj,g){

function mHousing(g,w,h){ let sh=g.createLinearGradient(0,0,0,h); sh.addColorStop(0,'rgba(255,255,255,.12)'); sh.addColorStop(0.18,'rgba(255,255,255,0)');

// 点群の凸包（Andrew's monotone chain）
function convexHull(pts){ if(pts.length<3)return pts.slice();

  const lo=[]; for(const p of P){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop(); lo.push(p); }
  const hi=[]; for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(hi.length>=2&&cr(hi[hi.length-2],hi[hi.length-1],p)<=0)hi.pop(); hi.push(p); }

// 後輪を3D円柱として投影して描く。ドアミラーは後輪を斜め前・上から見るため

function mWheelSolid(proj,g,rwx,rwy,side,fender){
  const R=0.31, halfW=0.11, th=car.th;
  const fwd=[Math.cos(th),Math.sin(th)], axle=[-Math.sin(th),Math.cos(th)], S=side==='L'?1:-1;
  const face=off=>{ const arr=[]; for(let i=0;i<=18;i++){ const a=2*Math.PI*i/18;
    const wx=rwx+axle[0]*S*off+fwd[0]*Math.cos(a)*R, wy=rwy+axle[1]*S*off+fwd[1]*Math.cos(a)*R, wz=R+Math.sin(a)*R;

  if(fender){ const topArc=hull.filter(p=>p.y<c.y-rad*0.06).sort((a,b)=>a.x-b.x);

      g.strokeStyle=CARCOL; g.lineWidth=Math.max(4,rad*0.5);

      g.beginPath(); topArc.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.stroke();

function roundRectSub(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ============================================================================
   PHOTOREAL DOOR MIRROR  (renderDoorMirror) — DEFINITIVE UNIFIED BLUEPRINT
   Replaces the OLD renderMirror block (index.html lines ~893-1136).
   Convex/aspheric Brown-Conrady barrel warp wrapped around mkProj (sgn=-1 kept);
   full tessellated own-car flank (never collapses; tyre fallback); realistic

const _mirAutoTilt={L:0,R:0};                     // 0..1 : Rギアで下向きへ自動チルト
// アスファルトの微細ノイズ（1度だけ生成してタイル化＝ちらつかない）
let _asphaltTile=null;
function asphaltTile(){ if(_asphaltTile) return _asphaltTile;
  const t=document.createElement('canvas'); t.width=t.height=56; const c=t.getContext('2d');
  c.fillStyle='#9aa2aa'; c.fillRect(0,0,56,56);
  for(let i=0;i<260;i++){ const x=Math.random()*56,y=Math.random()*56,s=Math.random()*1.7+0.3, v=Math.random();

    c.beginPath(); c.arc(x,y,s,0,7); c.fill(); }

}
// 凸面に沿って曲がる地平線で空／路面を塗り分け＋アスファルト質感。hzMid を返す。
// 空／路面（フラットな地平線＝安定。歪みは掛けない）＋昼のアスファルト質感
function mMirGround(g,w,h,horizon){
  const hz=Math.max(0,Math.min(h,horizon));
  const gr=g.createLinearGradient(0,Math.max(1,hz),0,h);
  gr.addColorStop(0,'#868e96'); gr.addColorStop(0.6,'#9aa2aa'); gr.addColorStop(1,'#b4bcc3');
  g.fillStyle=gr; g.fillRect(0,0,w,h);

    const sky=g.createLinearGradient(0,0,0,Math.max(2,hz)); sky.addColorStop(0,'#8fc1ea'); sky.addColorStop(1,'#dbeaf4');
    g.fillStyle=sky; g.fillRect(0,0,w,hz);
    const tb=Math.max(3,h*0.05); g.fillStyle='#7f9c76'; g.fillRect(0,Math.max(0,hz-tb),w,tb);
    g.fillStyle='rgba(110,140,100,.5)'; g.fillRect(0,Math.max(0,hz-tb*0.5),w,tb*0.5);
  }
  const clipTop=Math.max(0,hz);                    // アスファルト質感（地面のみ・遠方フェード）
  g.save(); g.beginPath(); g.rect(0,clipTop,w,h-clipTop); g.clip();
  const pat=g.createPattern(asphaltTile(),'repeat'); if(pat){ g.globalAlpha=0.5; g.fillStyle=pat; g.fillRect(0,clipTop,w,h-clipTop); g.globalAlpha=1; }

  fade.addColorStop(0,'rgba(150,158,166,.5)'); fade.addColorStop(0.35,'rgba(150,158,166,0)');

  g.restore();
}
// 短バー（ドアハンドル）
function mBar(g,x0,y0,x1,y1,wd,col){ g.strokeStyle=col; g.lineWidth=wd; g.lineCap='round';
  g.beginPath(); g.moveTo(x0,y0); g.lineTo(x1,y1); g.stroke(); g.lineCap='butt'; }
/* 自車フランクを縦ステーション列でテッセレートして投影：下回り影→赤ボディ(スカイ反射)→
   鏡面グリント→ロッカー→クローム帯→キャラクターライン→ガラス→Cピラー→ドアハンドル→
   ホイールアーチ＋後輪(3D)→手前エッジ。有効ステーション<2 でも後輪だけは描く（消失防止）。*/
function mEgoPano(proj,g,side,w,h){
  const S=side==='L'?1:-1, ly=S*(C.width/2);
  const rw=side==='L'?wheelPositions(car).RL:wheelPositions(car).RR;
  const N=16, lxF=0.7, lxR=-(C.rearOverhang+0.05);
  // 投影点の健全性チェック（画面外・至近・非有限は捨てる＝偽の点を作らない）
  const ok=p=> !!p && isFinite(p.x)&&isFinite(p.y) && p.y>-0.6*h && p.y<1.7*h && p.x>-0.9*w && p.x<1.9*w && (p.depth===undefined||p.depth>0.3);
  const st=[];
  for(let i=0;i<=N;i++){ const lx=lxF+(lxR-lxF)*i/N, wp=toWorld(car,lx,ly);
    const gg=proj(wp.x,wp.y,0.02), sl=proj(wp.x,wp.y,0.34), bl=proj(wp.x,wp.y,0.74),
          wn=proj(wp.x,wp.y,0.82), rf=proj(wp.x,wp.y,1.04);
    if(!ok(gg)||!ok(sl)||!ok(bl)) continue;              // 下半身が要る
    st.push({ g:gg, sill:sl, belt:bl, win:ok(wn)?wn:null, roof:ok(rf)?rf:null, D:bl.D||1 });
  }
  const n=st.length;
  if(n<2){ mWheelSolid(proj,g,rw.x,rw.y,side); return; }   // フォールバック：後輪だけ
  const G=st.map(s=>s.g), SILL=st.map(s=>s.sill), BELT=st.map(s=>s.belt);
  const yBeltTop=Math.min(...BELT.map(p=>p.y)), ySillBot=Math.max(...SILL.map(p=>p.y)), yGbot=Math.max(...G.map(p=>p.y));
  const strip=(A,B,mk)=>{ const m=A.length; g.beginPath(); g.moveTo(A[0].x,A[0].y);
    for(let i=1;i<m;i++) g.lineTo(A[i].x,A[i].y);
    for(let i=B.length-1;i>=0;i--) g.lineTo(B[i].x,B[i].y); g.closePath(); g.fillStyle=mk; g.fill(); };
  // 1) 下回り影（接地＝車体を地面に固定）
  strip(SILL,G,'#14171b');
  // 2) 赤ボディ（スカイ反射：上ほど明るく脱彩、下ほど暗く回り込む）
  const bg=g.createLinearGradient(0,yBeltTop,0,ySillBot);
  bg.addColorStop(0,'#f2938c'); bg.addColorStop(0.22,'#d9524a'); bg.addColorStop(0.5,CARCOL);
  bg.addColorStop(0.82,'#8b2721'); bg.addColorStop(1,'#5c1914');
  strip(BELT,SILL,bg);
  // 3) 鏡面グリント（加算合成、save/restoreで隔離）
  const gi=Math.max(0,(n*0.4)|0), gx=BELT[gi].x, gy=(yBeltTop+ySillBot)/2, grd=Math.max(10,(ySillBot-yBeltTop)*0.9);
  g.save(); g.globalCompositeOperation='lighter';
  const gl=g.createRadialGradient(gx,gy-grd*0.2,1,gx,gy,grd);
  gl.addColorStop(0,'rgba(255,235,230,.5)'); gl.addColorStop(0.5,'rgba(255,200,190,.1)'); gl.addColorStop(1,'rgba(255,200,190,0)');
  g.fillStyle=gl; g.beginPath(); g.ellipse(gx,gy,grd,grd*0.55,0,0,7); g.fill(); g.restore();
  // 4) ロッカー／サイドシルのハイライト
  g.strokeStyle='rgba(240,180,175,.5)'; g.lineWidth=1.2; g.beginPath();
  g.moveTo(SILL[0].x,SILL[0].y); for(let i=1;i<n;i++) g.lineTo(SILL[i].x,SILL[i].y); g.stroke();
  // 5) キャラクターライン（明るいクリース＋影線）
  g.lineWidth=Math.max(1.2,1.8*(BELT[0].D||1)); g.strokeStyle='#ffd0ca'; g.beginPath();
  g.moveTo(BELT[0].x,BELT[0].y); for(let i=1;i<n;i++) g.lineTo(BELT[i].x,BELT[i].y); g.stroke();
  g.lineWidth=1; g.strokeStyle='rgba(90,25,20,.55)'; g.beginPath();
  g.moveTo(BELT[0].x,BELT[0].y+2); for(let i=1;i<n;i++) g.lineTo(BELT[i].x,BELT[i].y+2); g.stroke();
  // 6) ガラスハウス：window/roof が両方有効な連続区間だけ描く（偽点を作らないので破綻しない）
  let run=null,best=null;
  for(let i=0;i<n;i++){ if(st[i].win&&st[i].roof){ run=run?{a:run.a,b:i}:{a:i,b:i};
      if(!best||(run.b-run.a)>(best.b-best.a))best=run; } else run=null; }
  if(best && best.b>best.a){
    const seg=st.slice(best.a,best.b+1), R=seg.map(s=>s.roof), Wn=seg.map(s=>s.win), Bl=seg.map(s=>s.belt);
    const yRoofTop=Math.min(...R.map(p=>p.y));
    // クローム・ベルトモール（belt〜win）
    strip(Wn,Bl,'rgba(206,214,224,.8)');
    // 暗いガラス＋上端に空反射帯
    const rg=g.createLinearGradient(0,yRoofTop,0,Math.max(yRoofTop+2,Wn[0].y));
    rg.addColorStop(0,'#4a5a6b'); rg.addColorStop(0.4,'#2a333d'); rg.addColorStop(1,'#151b23');
    strip(R,Wn,rg);

    if(seg.length>=2){ const c=Math.max(0,seg.length-2);
