<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>教習所トレーナー（方向転換・縦列）</title>
<style>
  :root{
    --bg:#0f1420; --panel:#1a2130; --ink:#e8edf6; --sub:#93a1b8;
    --ok:#37d67a; --warn:#ffb020; --bad:#ff5c5c; --accent:#4da3ff; --accent2:#7c5cff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",sans-serif;
    overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none;}
  #app{display:flex; flex-direction:column; height:100%; max-width:820px; margin:0 auto; position:relative;}
  header{display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel);}
  header h1{font-size:14px; margin:0; font-weight:700; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header .spacer{flex:1;}
  header button{background:#26304a; color:var(--ink); border:0; border-radius:8px;
    padding:7px 9px; font-size:12px; font-weight:600; white-space:nowrap;}
  header button.on{background:var(--accent); color:#04101f;}
  header button.menu{background:var(--accent2); color:#fff;}
  #stage{position:relative; flex:1; min-height:0;}
  canvas{display:block; width:100%; height:100%; background:#0b1524;}
  #hud{position:absolute; left:10px; top:10px; right:10px; display:flex; gap:8px;
    pointer-events:none; font-size:12px; flex-wrap:wrap;}
  .chip{background:rgba(16,22,36,.78); border:1px solid #2b364d; border-radius:8px; padding:6px 9px; line-height:1.35;}
  .chip b{color:var(--accent);}
  #coach{position:absolute; left:10px; right:10px; bottom:10px; text-align:center; font-size:14.5px; font-weight:700; pointer-events:none;}
  #coach .msg{display:inline-block; background:rgba(16,22,36,.86); border:1px solid #2b364d; border-radius:10px; padding:8px 13px; max-width:100%;}
  .msg.ok{color:var(--ok); border-color:var(--ok);}
  .msg.warn{color:var(--warn); border-color:var(--warn);}
  .msg.bad{color:var(--bad); border-color:var(--bad);}
  #controls{background:var(--panel); padding:10px 10px 14px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .pad{display:flex; flex-direction:column; gap:8px;}
  .pad .lbl{font-size:11px; color:var(--sub); text-align:center; font-weight:600;}
  .btn{border:0; border-radius:14px; padding:16px 0; font-size:19px; font-weight:800; color:var(--ink);
    background:#28324a; box-shadow:0 2px 0 #141a28; text-align:center;}
  .btn:active,.btn.held{background:var(--accent); color:#04101f; box-shadow:0 1px 0 #141a28; transform:translateY(1px);}
  .btn.small{font-size:13px; padding:12px 0; background:#222b40;}
  footer{font-size:11px; color:var(--sub); text-align:center; padding:0 10px 8px;}
  /* メニュー */
  #menu{position:absolute; inset:0; background:rgba(8,12,20,.92); backdrop-filter:blur(3px);
    display:none; flex-direction:column; gap:12px; padding:20px 16px; overflow:auto; z-index:20;}
  #menu.show{display:flex;}
  #menu h2{margin:4px 0 0; font-size:18px;}
  #menu p.lead{margin:0 0 6px; color:var(--sub); font-size:12.5px; line-height:1.5;}
  .card{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid #2b364d;
    border-radius:14px; padding:14px; text-align:left;}
  .card:active{border-color:var(--accent);}
  .card .ico{width:52px; height:52px; flex:0 0 52px;}
  .card .t{font-size:16px; font-weight:800;}
  .card .d{font-size:12px; color:var(--sub); margin-top:2px; line-height:1.4;}
  #menu .close{align-self:center; margin-top:6px; background:#26304a; color:var(--ink); border:0; border-radius:10px; padding:10px 18px; font-weight:700;}
  #menu .note{color:var(--sub); font-size:11px; text-align:center; line-height:1.5;}
</style>

<div id="app">
  <header>
    <button class="menu" id="btnMenu">≡ 課題</button>
    <h1 id="title">方向転換（右バック）</h1>
    <span class="spacer"></span>
    <button id="btnGuide" class="on">お手本</button>
    <button id="btnMirror" class="on">合図</button>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="chip">速度 <b id="hSpeed">0.0</b> m/s</div>
      <div class="chip">切り返し <b id="hReverses">0</b> 回</div>
    </div>
    <div id="coach"><span class="msg" id="coachMsg">課題を選んでスタート</span></div>
  </div>

  <div id="controls">
    <div class="pad">
      <div class="lbl">ハンドル</div>
      <button class="btn" id="bLeft">◀ 左</button>
      <button class="btn small" id="bStraight">まっすぐ</button>
    </div>
    <div class="pad">
      <div class="lbl">アクセル</div>
      <button class="btn" id="bFwd">▲ 前進 D</button>
      <button class="btn" id="bRev">▼ 後退 R</button>
    </div>
    <div class="pad">
      <div class="lbl">&nbsp;</div>
      <button class="btn" id="bRight">右 ▶</button>
      <button class="btn small" id="bReset">やり直し</button>
    </div>
  </div>
  <footer id="foot">寸法は仮の標準値。教習車＝マツダ アクセラ セダン想定。コース実寸をCONFIGに入れると本人仕様に。</footer>

  <div id="menu">
    <h2>課題をえらぶ</h2>
    <p class="lead">卒検で崩れやすい3課題。まずは「お手本の軌跡」と「切り始めの位置」を体で覚える練習です。</p>
    <button class="card" data-id="perpR">
      <canvas class="ico" width="52" height="52" data-ico="perpR"></canvas>
      <div><div class="t">方向転換（右バック）</div><div class="d">右のポケットへ後退で入れる。切り始めのタイミング矯正。</div></div>
    </button>
    <button class="card" data-id="perpL">
      <canvas class="ico" width="52" height="52" data-ico="perpL"></canvas>
      <div><div class="t">方向転換（左バック）</div><div class="d">左のポケットへ。右バックの左右反転版。</div></div>
    </button>
    <button class="card" data-id="parallel">
      <canvas class="ico" width="52" height="52" data-ico="parallel"></canvas>
      <div><div class="t">縦列駐車</div><div class="d">前の車と並ぶ→右いっぱい→斜めで左に切り返し→真っ直ぐ。</div></div>
    </button>
    <div class="note">※ コース寸法は現在“仮の標準値”です。実寸が入ると基準点が本人仕様になります。</div>
    <button class="close" id="menuClose">閉じる</button>
  </div>
</div>

<script>
"use strict";
const DEG=Math.PI/180;

/* ====================================================================
   CONFIG — 実寸に差し替えると本人仕様になります
   ==================================================================== */
const CONFIG={
  // 教習車＝マツダ アクセラ セダン(BM/BY型)のカタログ値
  car:{ length:4.58, width:1.795, wheelbase:2.70, frontOverhang:0.92,
        maxSteerDeg:36, steerRateDeg:130, creep:0.75 },
  // 方向転換の枠（採寸して置換）
  perp:{ bayWidth:3.0, bayDepth:5.5, turninX:6.0 },
  // 縦列駐車（採寸して置換）
  parallel:{ approachY:3.2, turninX:8.0, theta1Deg:42,
             slotDepth:2.5, parkedLen:4.5, parkedW:1.75, curbGap:0.25,
             frontClear:2.0, rearClear:0.5, bayPad:0.4 }
};
const C=CONFIG.car;
C.rearOverhang=C.length-C.wheelbase-C.frontOverhang;
const MAXSTEER=C.maxSteerDeg*DEG;

/* ---- 物理・車体 ---- */
function bicycle(s,dt){
  s.x+=s.v*Math.cos(s.th)*dt; s.y+=s.v*Math.sin(s.th)*dt;
  s.th+=(s.v/C.wheelbase)*Math.tan(s.steer)*dt;
}
function carCorners(s){
  const c=Math.cos(s.th), sn=Math.sin(s.th);
  const fx=C.wheelbase+C.frontOverhang, rx=-C.rearOverhang, hw=C.width/2;
  return [[fx,hw],[fx,-hw],[rx,-hw],[rx,hw]].map(([lx,ly])=>({x:s.x+lx*c-ly*sn, y:s.y+lx*sn+ly*c}));
}
function driverMirror(s,side){
  const c=Math.cos(s.th), sn=Math.sin(s.th);
  const lx=C.wheelbase*0.55, ly=(side==='L'? +1:-1)*(C.width/2+0.15);
  return {x:s.x+lx*c-ly*sn, y:s.y+lx*sn+ly*c};
}
function normAng(a){ a=(a+Math.PI)%(2*Math.PI); if(a<0)a+=2*Math.PI; return a-Math.PI; }
function alignedV(th){ return Math.min(Math.abs(normAng(th-Math.PI/2)),Math.abs(normAng(th+Math.PI/2)))<10*DEG; }
function alignedH(th){ return Math.abs(normAng(th))<10*DEG; }

/* ---- 矩形ユーティリティ ---- */
function rect(x0,y0,x1,y1){ return {x0:Math.min(x0,x1),y0:Math.min(y0,y1),x1:Math.max(x0,x1),y1:Math.max(y0,y1)}; }
function inRect(r,x,y){ return x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1; }

/* ====================================================================
   課題ビルダー：お手本の軌跡を先に物理計算し、着地点に枠を置く
   ==================================================================== */
function buildPerpR(){
  const P=CONFIG.perp, APP_Y=C.width/2+0.10, TX=P.turninX;
  // 右いっぱい(-)＋後退 で90°回るまで
  const s={x:TX,y:APP_Y,th:0,steer:-MAXSTEER,v:-C.creep};
  const path=[{x:s.x,y:s.y,th:s.th}]; let n=0;
  while(n++<8000){ bicycle(s,0.01); path.push({x:s.x,y:s.y,th:s.th}); if(s.th>=Math.PI/2)break; }
  const end={...s};
  const bayCX=end.x, bayX0=bayCX-P.bayWidth/2, bayX1=bayCX+P.bayWidth/2, bayTop=0, bayBot=-P.bayDepth;
  // スイングを包む通路
  let sMaxY=-1e9,sMaxX=-1e9,sMinX=1e9;
  for(const p of path) for(const c of carCorners(p)){ if(c.y>sMaxY)sMaxY=c.y; if(c.x>sMaxX)sMaxX=c.x; if(c.x<sMinX)sMinX=c.x; }
  const aisleY1=Math.max(APP_Y+C.width/2+0.8, sMaxY+0.4);
  const aX0=Math.min(-1.2,sMinX-0.4), aX1=Math.max(TX+(C.wheelbase+C.frontOverhang)+0.8, sMaxX+0.4);
  const aisle=rect(aX0,0,aX1,aisleY1);
  const apron=rect(aX0,-0.9,aX1,0);        // ポケット手前の路面
  const bay=rect(bayX0,bayBot,bayX1,bayTop);
  const poleL={x:bayX0,y:0}, poleR={x:bayX1,y:0};
  const start={x:Math.max(0.6, aX0+C.rearOverhang+0.5), y:APP_Y, th:0};
  const cutBearing=(()=>{ const m=driverMirror({x:TX,y:APP_Y,th:0},'R'); return Math.atan2(poleR.y-m.y,poleR.x-m.x); })();
  return {
    id:'perpR', title:'方向転換（右バック）', mirrorSide:'R', lockLabel:'右',
    rects:[aisle,apron,bay], obstacles:[], bay, poles:[poleL,poleR], parkedCars:[], curbY:null,
    ideal:{path,end}, start, turnRefX:TX, successKind:'perp',
    cuePole:poleR, cutBearing, appY:APP_Y,
    coach:'前進(D)で青ラインまで進む→止まって、後退(R)＋右いっぱいでポケットへ'
  };
}
function reflectModel(m){
  const A=m.appY, ry=y=>2*A-y;
  const rr=r=>rect(r.x0,ry(r.y0),r.x1,ry(r.y1));
  const rp=p=>({x:p.x,y:ry(p.y),th:-p.th});
  const rpt=p=>({x:p.x,y:ry(p.y)});
  return {
    id:'perpL', title:'方向転換（左バック）', mirrorSide:'L', lockLabel:'左',
    rects:m.rects.map(rr), obstacles:[], bay:rr(m.bay), poles:m.poles.map(rpt), parkedCars:[], curbY:null,
    ideal:{path:m.ideal.path.map(rp), end:rp(m.ideal.end)}, start:rp(m.start),
    turnRefX:m.turnRefX, successKind:'perp',
    cuePole:{x:m.cuePole.x,y:ry(m.cuePole.y)}, cutBearing:-m.cutBearing, appY:A,
    coach:m.coach.replace('右いっぱい','左いっぱい')
  };
}
function buildParallel(){
  const P=CONFIG.parallel, TX=P.turninX, th1=P.theta1Deg*DEG;
  // S字：右いっぱい(-)後退で+θ1まで→左いっぱい(+)で0°に戻す
  const s={x:TX,y:P.approachY,th:0,steer:-MAXSTEER,v:-C.creep};
  const path=[{x:s.x,y:s.y,th:s.th}]; let ph=1,n=0;
  while(n++<40000){
    if(ph===1){ s.steer=-MAXSTEER; if(s.th>=th1)ph=2; }
    else { s.steer=+MAXSTEER; if(s.th<=0){ s.th=0; path.push({x:s.x,y:s.y,th:0}); break; } }
    bicycle(s,0.008); path.push({x:s.x,y:s.y,th:s.th});
  }
  const end={...s};
  const front=C.wheelbase+C.frontOverhang, hw=C.width/2;
  const fx0=end.x-C.rearOverhang, fx1=end.x+front;       // 停め終わりの車体前後端
  const curbY=end.y-hw-P.curbGap;
  const bay=rect(fx0-P.bayPad, curbY, fx1+P.bayPad, curbY+P.slotDepth);          // 成功判定＝車体ぴったり
  const frontCar=rect(fx1+P.frontClear, curbY, fx1+P.frontClear+P.parkedLen, curbY+P.parkedW); // 前車＝スイング包絡線の先
  const rearCar =rect(fx0-P.rearClear-P.parkedLen, curbY, fx0-P.rearClear, curbY+P.parkedW);
  let sMaxY=-1e9;
  for(const p of path) for(const c of carCorners(p)) if(c.y>sMaxY)sMaxY=c.y;
  const roadTop=Math.max(P.approachY+hw+1.2, sMaxY+0.4);
  const road=rect(rearCar.x0-1.5, curbY, frontCar.x1+2.0, roadTop);
  const start={x:TX-2.6, y:P.approachY, th:0};
  return {
    id:'parallel', title:'縦列駐車', mirrorSide:'R', lockLabel:'右',
    rects:[road], obstacles:[frontCar,rearCar], bay, poles:[], parkedCars:[frontCar,rearCar], curbY,
    ideal:{path,end}, start, turnRefX:TX, successKind:'parallel', theta1:th1,
    cuePole:null, cutBearing:0, appY:P.approachY,
    coach:'前進で前の車と横に並ぶ→止まって、後退＋右いっぱい。斜め約35°で「左いっぱい」に切り返して真っ直ぐに'
  };
}
const _perpR=buildPerpR();
const MODELS={ perpR:_perpR, perpL:reflectModel(_perpR), parallel:buildParallel() };

/* ====================================================================
   エンジン（共通）
   ==================================================================== */
let M=null, bounds=null;
const car={x:0,y:0,th:0,steer:0,v:0};
let reverses=0, wasReversing=false, result=null, cutRecorded=false, parPhase=0;

function computeBounds(){
  let a=[...M.rects,M.bay,...M.parkedCars];
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const r of a){ minX=Math.min(minX,r.x0); maxX=Math.max(maxX,r.x1); minY=Math.min(minY,r.y0); maxY=Math.max(maxY,r.y1); }
  bounds={minX:minX-0.6,maxX:maxX+0.6,minY:minY-0.6,maxY:maxY+0.6};
}
function drivable(x,y){
  let ok=false; for(const r of M.rects) if(inRect(r,x,y)){ok=true;break;}
  if(!ok)return false;
  for(const o of M.obstacles) if(inRect(o,x,y))return false;
  return true;
}
function loadScenario(id){
  M=MODELS[id]; car.x=M.start.x; car.y=M.start.y; car.th=M.start.th; car.steer=0; car.v=0;
  reverses=0; wasReversing=false; result=null; cutRecorded=false; parPhase=0;
  document.getElementById('title').textContent=M.title;
  document.getElementById('hReverses').textContent='0';
  setCoach(M.coach,'');
  computeBounds(); resize(); closeMenu();
}
function resetCar(){ loadScenario(M.id); }

const coachEl=document.getElementById('coachMsg');
function setCoach(t,cls){ coachEl.textContent=t; coachEl.className='msg'+(cls?(' '+cls):''); }

/* ---- 入力 ---- */
const held={left:false,right:false,fwd:false,rev:false}; let straighten=false;
function bindHold(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault(); held[key]=true; el.classList.add('held');};
  const off=e=>{e.preventDefault(); held[key]=false; el.classList.remove('held');};
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off));
}
bindHold('bLeft','left'); bindHold('bRight','right'); bindHold('bFwd','fwd'); bindHold('bRev','rev');
const bstr=document.getElementById('bStraight');
bstr.addEventListener('pointerdown',e=>{e.preventDefault(); straighten=true;});
['pointerup','pointercancel','pointerleave'].forEach(ev=>bstr.addEventListener(ev,e=>{e.preventDefault(); straighten=false;}));
document.getElementById('bReset').addEventListener('click',resetCar);
let showGuide=true, showMirror=true;
document.getElementById('btnGuide').addEventListener('click',function(){showGuide=!showGuide; this.classList.toggle('on',showGuide);});
document.getElementById('btnMirror').addEventListener('click',function(){showMirror=!showMirror; this.classList.toggle('on',showMirror);});
addEventListener('keydown',e=>{ if(e.repeat)return;
  if(e.key==='ArrowLeft')held.left=true; if(e.key==='ArrowRight')held.right=true;
  if(e.key==='ArrowUp')held.fwd=true; if(e.key==='ArrowDown')held.rev=true;
  if(e.key===' ')straighten=true; if(e.key==='r'||e.key==='R')resetCar(); });
addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft')held.left=false; if(e.key==='ArrowRight')held.right=false;
  if(e.key==='ArrowUp')held.fwd=false; if(e.key==='ArrowDown')held.rev=false;
  if(e.key===' ')straighten=false; });

/* ---- メニュー ---- */
const menu=document.getElementById('menu');
function openMenu(){ menu.classList.add('show'); }
function closeMenu(){ menu.classList.remove('show'); }
document.getElementById('btnMenu').addEventListener('click',openMenu);
document.getElementById('menuClose').addEventListener('click',closeMenu);
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>loadScenario(c.dataset.id)));

/* ====================================================================
   更新ループ
   ==================================================================== */
let last=null, tick=0;
function step(ts){
  if(last==null)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; tick++;
  if(M && !result && !menu.classList.contains('show')){
    const rate=C.steerRateDeg*DEG*dt;
    if(straighten){ car.steer+=Math.sign(-car.steer)*Math.min(Math.abs(car.steer),rate); }
    else{ if(held.left)car.steer=Math.min(MAXSTEER,car.steer+rate); if(held.right)car.steer=Math.max(-MAXSTEER,car.steer-rate); }
    let target=0; if(held.fwd)target=C.creep; else if(held.rev)target=-C.creep;
    car.v+=(target-car.v)*Math.min(1,dt*8); if(Math.abs(car.v)<0.02&&target===0)car.v=0;
    bicycle(car,dt);
    updateLogic();
  }
  render();
  requestAnimationFrame(step);
}
function updateLogic(){
  const reversing=car.v<-0.05;
  if(car.v>0.05&&wasReversing){ reverses++; document.getElementById('hReverses').textContent=reverses; }
  if(reversing)wasReversing=true; else if(car.v>0.05)wasReversing=false;

  // 方向転換：早切り／行き過ぎ
  if(M.successKind==='perp' && reversing && !cutRecorded && Math.abs(car.steer)>MAXSTEER*0.5){
    cutRecorded=true; const d=M.turnRefX-car.x;
    if(d>0.4) setCoach(`早切りかも：あと約${(d*100)|0}cm前に出てから切ると青い線に乗ります`,'warn');
    else if(d<-0.4) setCoach(`行き過ぎ：${((-d)*100)|0}cmほど手前で切り始めると余裕が出ます`,'warn');
    else setCoach(`切り始めバッチリ！このまま${M.lockLabel}いっぱいで奥まで`,'ok');
  }
  // 縦列：切り返しの合図
  if(M.successKind==='parallel' && reversing){
    if(parPhase===0 && Math.abs(normAng(car.th))>=M.theta1*0.85){ parPhase=1; setCoach('今！ここから「左いっぱい」に切り返して真っ直ぐに',' warn'.trim()); }
  }

  const cs=carCorners(car);
  for(const p of cs){ if(!drivable(p.x,p.y)){ result='fail';
    setCoach(M.successKind==='parallel'?'車・縁石に接触。やり直し(右下)':'脱輪／接触。やり直し(右下)','bad'); car.v=0; return; } }

  if(M.successKind==='perp'){
    const rearIn=inRect(M.bay,cs[2].x,cs[2].y)&&inRect(M.bay,cs[3].x,cs[3].y);
    if(rearIn && alignedV(car.th) && Math.abs(car.v)<0.03 && !(held.fwd||held.rev)){
      result='success'; setCoach(`入りました！切り返し ${reverses} 回。この切り始めの見え方を覚えましょう`,'ok'); }
  }else{
    const allIn=cs.every(p=>inRect(M.bay,p.x,p.y));
    if(allIn && alignedH(car.th) && Math.abs(car.v)<0.03 && !(held.fwd||held.rev)){
      result='success'; setCoach(`きれいに入りました！切り返し ${reverses} 回`,'ok'); }
  }
}

/* ====================================================================
   描画
   ==================================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let PPM=22,W=0,H=0,ox=0,oy=0;
function resize(){
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  W=r.width; H=r.height; if(!bounds)return;
  const ww=bounds.maxX-bounds.minX, wh=bounds.maxY-bounds.minY;
  PPM=Math.min(W/ww,H/wh); ox=(W-ww*PPM)/2; oy=(H-wh*PPM)/2;
}
addEventListener('resize',resize);
function wx(x){ return ox+(x-bounds.minX)*PPM; }
function wy(y){ return H-oy-(y-bounds.minY)*PPM; }
function fillR(r,col){ ctx.fillStyle=col; ctx.fillRect(wx(r.x0),wy(r.y1),(r.x1-r.x0)*PPM,(r.y1-r.y0)*PPM); }
function strokeR(r,col,w){ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.strokeRect(wx(r.x0),wy(r.y1),(r.x1-r.x0)*PPM,(r.y1-r.y0)*PPM); }

function render(){
  ctx.clearRect(0,0,W,H); if(!M||!bounds)return;
  for(const r of M.rects) fillR(r,'#212a3c');            // 路面
  fillR(M.bay,'#1b2c46');                                 // 目標枠
  strokeR(M.bay,'#3d5170',2);
  for(const o of M.parkedCars){ fillR(o,'#39435c'); strokeR(o,'#586a8c',1.5); }
  if(M.curbY!=null){ ctx.strokeStyle='#5b6b86'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(wx(bounds.minX),wy(M.curbY)); ctx.lineTo(wx(bounds.maxX),wy(M.curbY)); ctx.stroke(); }

  if(showGuide){
    ctx.strokeStyle='rgba(77,163,255,.55)'; ctx.lineWidth=3; ctx.setLineDash([8,7]);
    ctx.beginPath(); M.ideal.path.forEach((p,i)=>{const X=wx(p.x),Y=wy(p.y); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='rgba(77,163,255,.95)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(wx(M.turnRefX),wy(bounds.maxY)); ctx.lineTo(wx(M.turnRefX),wy(bounds.minY)); ctx.stroke();
    ctx.fillStyle='rgba(77,163,255,.95)'; ctx.font='12px system-ui';
    ctx.fillText('切り始めの目安ライン', wx(M.turnRefX)+6, wy(bounds.maxY)+16);
  }
  ctx.fillStyle='#ffb020';
  for(const p of M.poles){ ctx.beginPath(); ctx.arc(wx(p.x),wy(p.y),5,0,7); ctx.fill(); }

  drawCar(car, result==='fail'?'#ff5c5c':(result==='success'?'#37d67a':'#dfe7f5'));
  drawCourseCue();
  drawSteeringWheel();
  if(showMirror) drawCueGauge();

  document.getElementById('hSpeed').textContent=Math.abs(car.v).toFixed(1);
}
function drawCar(s,color){
  const cs=carCorners(s);
  ctx.beginPath(); cs.forEach((p,i)=>{const X=wx(p.x),Y=wy(p.y); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}); ctx.closePath();
  ctx.fillStyle=color; ctx.globalAlpha=.92; ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle='#0b1524'; ctx.lineWidth=1.5; ctx.stroke();
  const c=Math.cos(s.th),sn=Math.sin(s.th), fx=C.wheelbase+C.frontOverhang;
  ctx.fillStyle='#0b1524'; ctx.beginPath(); ctx.arc(wx(s.x+fx*c),wy(s.y+fx*sn),3,0,7); ctx.fill();
  const fw={x:s.x+C.wheelbase*c,y:s.y+C.wheelbase*sn}, wa=s.th+s.steer, wl=0.9;
  ctx.strokeStyle='#0b1524'; ctx.lineWidth=3; ctx.beginPath();
  ctx.moveTo(wx(fw.x-Math.cos(wa)*wl/2),wy(fw.y-Math.sin(wa)*wl/2));
  ctx.lineTo(wx(fw.x+Math.cos(wa)*wl/2),wy(fw.y+Math.sin(wa)*wl/2)); ctx.stroke();
}
/* ハンドルの向きを絵で表示（上部左・HUDの下） */
function drawSteeringWheel(){
  const R=Math.min(32,W*0.10), cx=R+18, cy=52+R;
  ctx.textAlign='center';
  ctx.fillStyle='#93a1b8'; ctx.font='10px system-ui'; ctx.fillText('ハンドル', cx, cy+R+14);
  ctx.fillStyle='#6b7890'; ctx.font='9px system-ui';
  ctx.fillText('◀左', cx-R-4, cy-R-3); ctx.fillText('右▶', cx+R+4, cy-R-3);
  ctx.save(); ctx.translate(cx,cy);
  ctx.rotate(-(car.steer/MAXSTEER)*130*DEG);   // steer>0(左)→反時計回り
  ctx.strokeStyle='#dfe7f5'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(0,0,R,0,7); ctx.stroke();
  ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,R); ctx.moveTo(-R,0); ctx.lineTo(R,0); ctx.stroke();
  ctx.fillStyle='#dfe7f5'; ctx.beginPath(); ctx.arc(0,0,6,0,7); ctx.fill();
  ctx.fillStyle=Math.abs(car.steer)<0.02?'#93a1b8':'#4da3ff';
  ctx.beginPath(); ctx.arc(0,-R,7,0,7); ctx.fill();     // 上の目印＝回転が見える
  ctx.restore(); ctx.textAlign='left';
}

/* 動作に直結した「合図ゲージ」：いつ切る／いつ切り返すか（右上） */
function drawCueGauge(){
  const iw=Math.min(184,W*0.46), ih=60, px=W-iw-10, py=10;
  ctx.fillStyle='rgba(10,16,26,.92)'; ctx.strokeStyle='#2b364d'; ctx.lineWidth=1;
  roundRect(px,py,iw,ih,8); ctx.fill(); ctx.stroke();
  let lo,hi,gz0,gz1,val,title,lL,rL,gL,active;
  if(M.successKind==='perp'){
    lo=M.turnRefX-2; hi=M.turnRefX+2; gz0=M.turnRefX-0.4; gz1=M.turnRefX+0.4; val=car.x;
    title='切り始めの位置'; lL='手前'; rL='行き過ぎ'; gL='ここで止めて切る'; active=Math.abs(car.v)>0.02;
  }else{
    lo=0; hi=M.theta1*1.5; gz0=M.theta1*0.85; gz1=M.theta1*1.15; val=Math.abs(normAng(car.th));
    title='切り返しの角度'; lL='真っ直ぐ'; rL='深い'; gL='左に切り返し'; active=car.v<-0.02;
  }
  const tx=px+12, tw=iw-24, ty=py+34;
  const map=v=>tx+Math.max(0,Math.min(1,(v-lo)/(hi-lo)))*tw;
  ctx.textAlign='left'; ctx.fillStyle='#cdd7e6'; ctx.font='11px system-ui'; ctx.fillText(title, px+10, py+15);
  ctx.fillStyle='#2b364d'; ctx.fillRect(tx,ty,tw,6);                                  // トラック
  ctx.fillStyle='rgba(55,214,122,.5)'; ctx.fillRect(map(gz0),ty-3,map(gz1)-map(gz0),12); // 緑ゾーン
  ctx.font='9px system-ui'; ctx.fillStyle='#93a1b8';
  ctx.fillText(lL,tx,ty+16); ctx.textAlign='right'; ctx.fillText(rL,tx+tw,ty+16);
  ctx.textAlign='center'; ctx.fillStyle='#37d67a'; ctx.font='9px system-ui'; ctx.fillText(gL,(map(gz0)+map(gz1))/2,ty-8);
  const mxp=map(val), inZone=val>=gz0&&val<=gz1;                                       // 現在マーカー
  ctx.fillStyle=inZone?'#37d67a':'#ffb020'; ctx.beginPath();
  ctx.moveTo(mxp,ty-1); ctx.lineTo(mxp-5,ty-9); ctx.lineTo(mxp+5,ty-9); ctx.closePath(); ctx.fill();
  if(inZone&&active){ ctx.fillStyle='#37d67a'; ctx.font='bold 11px system-ui'; ctx.textAlign='left'; ctx.fillText('今！',mxp+8,ty-2); }
  ctx.textAlign='left';
}

/* コース上に「今、切る！」を車のそばへ点滅表示 */
function drawCourseCue(){
  if(result)return;
  let show=null;
  if(M.successKind==='perp'){ if(Math.abs(car.x-M.turnRefX)<0.45) show=`ここで止めて ${M.lockLabel}いっぱい`; }
  else{ const a=Math.abs(normAng(car.th)); if(car.v<-0.05 && a>=M.theta1*0.85 && a<=M.theta1*1.2) show='今、左いっぱい！'; }
  if(!show)return;
  const alpha=0.5+0.5*Math.abs(Math.sin(tick*0.12));
  const X=wx(car.x), Y=wy(car.y)-30;
  ctx.textAlign='center'; ctx.font='bold 14px system-ui';
  const w=ctx.measureText(show).width+16;
  ctx.globalAlpha=alpha*0.9; ctx.fillStyle='rgba(6,12,20,.92)'; roundRect(X-w/2,Y-17,w,24,7); ctx.fill();
  ctx.globalAlpha=alpha; ctx.fillStyle='#37d67a'; ctx.fillText(show,X,Y); ctx.globalAlpha=1; ctx.textAlign='left';
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ---- メニューのアイコン（各課題のミニ図） ---- */
function drawIcons(){
  document.querySelectorAll('canvas[data-ico]').forEach(cv=>{
    const g=cv.getContext('2d'), id=cv.dataset.ico, m=MODELS[id];
    g.clearRect(0,0,52,52);
    let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
    for(const r of [...m.rects,m.bay]){ minX=Math.min(minX,r.x0);maxX=Math.max(maxX,r.x1);minY=Math.min(minY,r.y0);maxY=Math.max(maxY,r.y1); }
    const s=Math.min(48/(maxX-minX),48/(maxY-minY)), px=x=>2+(x-minX)*s, py=y=>50-(y-minY)*s;
    g.fillStyle='#2a3346'; for(const r of m.rects) g.fillRect(px(r.x0),py(r.y1),(r.x1-r.x0)*s,(r.y1-r.y0)*s);
    g.fillStyle='#1b2c46'; g.fillRect(px(m.bay.x0),py(m.bay.y1),(m.bay.x1-m.bay.x0)*s,(m.bay.y1-m.bay.y0)*s);
    g.fillStyle='#586a8c'; for(const o of m.parkedCars) g.fillRect(px(o.x0),py(o.y1),(o.x1-o.x0)*s,(o.y1-o.y0)*s);
    g.strokeStyle='#4da3ff'; g.lineWidth=1.6; g.setLineDash([3,2]); g.beginPath();
    m.ideal.path.forEach((p,i)=>{const X=px(p.x),Y=py(p.y); i?g.lineTo(X,Y):g.moveTo(X,Y);}); g.stroke(); g.setLineDash([]);
  });
}

/* 起動 */
drawIcons(); loadScenario('perpR'); requestAnimationFrame(step);
</script>
