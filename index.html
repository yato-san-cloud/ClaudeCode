<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#8ecae6">
<title>まきばのしずく 🐄 — 牧場経営シミュレータ</title>
<style>

/* ==== styles.css ==== */
/* =========================================================================
   まきばのしずく — styles.css
   The cute visual system: rounded cream/wood panels, soft shadows, bouncy
   buttons, warm-brown text, pastel accents. Owned by Game.UI (13-ui.js).
   All game DOM lives inside #app; the Canvas world sits behind the overlay.
   Respects state.settings.reduceMotion (via .reduce-motion on #app).
   ========================================================================= */

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  overflow: hidden; background: #cdeaf6;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Rounded Mplus 1c",
    "Segoe UI", system-ui, -apple-system, "Noto Sans JP", sans-serif;
  color: var(--ink);
  font-weight: 700;
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none;
}
button { font-family: inherit; font-weight: 800; color: var(--ink); cursor: pointer; border: none; background: none; }
canvas { display: block; }

/* ---------- palette ---------- */
:root {
  --grass: #93D95C; --grass-hi: #B6E870; --grass-mid: #6EBB45; --grass-dark: #4F9A37;
  --soil: #A9744A; --water: #6FBDD6;
  --wood: #B77F4E; --wood-dark: #8A5A34;
  --roof: #E27A5F; --roof-blue: #7FB4D6;

  --cream: #FFF6E3; --panel: #FFFBF0; --panel-2: #FFF3DC;
  --border: #E7C596; --border-2: #D9AE77;
  --ink: #6B4A2F; --ink-soft: #A98B6E; --ink-faint: #C3A886;

  --pink: #FF9CC2; --pink-deep: #FF6FA5; --blush: #FFD1E3;
  --mint: #85E0BE; --mint-deep: #4FC79C;
  --yellow: #FFD84D; --gold: #F6B93B;
  --sky: #8FD6F2; --lavender: #C9B6F2;

  --alert: #FF6B6B; --amber: #FFB454; --good: #7ED957;

  --need-hunger: #FFB454; --need-happy: #FF9CC2; --need-health: #7ED957; --need-clean: #8FD6F2;

  --shadow: 0 6px 0 rgba(138,90,52,.18), 0 12px 26px rgba(138,90,52,.20);
  --shadow-sm: 0 3px 0 rgba(138,90,52,.16), 0 6px 14px rgba(138,90,52,.16);
  --radius: 22px; --radius-sm: 14px; --radius-lg: 30px;
  --dock-h: 92px; --hud-h: 56px;
  --ease-back: cubic-bezier(.34,1.56,.64,1);
}

/* ---------- app shell ---------- */
.app { position: fixed; inset: 0; overflow: hidden; }
.world-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  touch-action: none; image-rendering: -webkit-optimize-contrast;
}

/* Layers that only host pointer-through overlays */
.hud, .panels, .toast-layer, .overlay-layer, .ui-banner, .ui-tooltip, .ui-modal-layer {
  position: absolute; z-index: 10;
}

/* =========================================================================
   HUD
   ========================================================================= */
.hud {
  top: 0; left: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 8px; padding: 10px 12px calc(env(safe-area-inset-top, 0px));
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  pointer-events: none;
}
.hud-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hud-right { justify-content: flex-end; }

.hud-chip {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--panel); border: 3px solid var(--border);
  border-radius: 999px; padding: 6px 14px; min-height: 44px;
  box-shadow: var(--shadow-sm);
  font-size: 16px; line-height: 1;
}
.hud-chip .coin { font-size: 20px; filter: drop-shadow(0 2px 0 rgba(246,185,59,.5)); }
.money-chip .money-val { font-size: 19px; color: var(--ink); letter-spacing: .3px; min-width: 54px; }
.money-chip.flash { animation: chip-pop .4s var(--ease-back); }

.date-chip { gap: 10px; }
.date-chip .sep { width: 2px; height: 18px; background: var(--border); border-radius: 2px; opacity: .6; }
.date-chip .season { color: var(--mint-deep); }
.date-chip .weather { font-size: 18px; }
.date-chip .clock { color: var(--ink-soft); font-variant-numeric: tabular-nums; min-width: 42px; }

.rank-chip { flex-direction: column; align-items: stretch; gap: 3px; padding: 6px 14px; border-radius: 18px; }
.rank-chip .stars { font-size: 14px; letter-spacing: 1px; color: var(--gold); text-align: center; height: 15px; }
.rank-chip .xpbar { width: 96px; height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; border: 1.5px solid var(--border); }
.rank-chip .xpbar > i { display: block; height: 100%; width: 0%; border-radius: 999px;
  background: linear-gradient(90deg, var(--yellow), var(--gold)); transition: width .5s var(--ease-back); }

.hud-btn {
  pointer-events: auto;
  width: 44px; height: 44px; border-radius: 16px;
  background: var(--panel); border: 3px solid var(--border);
  box-shadow: var(--shadow-sm); font-size: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .12s var(--ease-back), background .12s;
}
.hud-btn:active { transform: translateY(2px) scale(.94); }
.hud-btn.on { background: var(--blush); border-color: var(--pink-deep); }

.speed-group { pointer-events: auto; display: inline-flex; background: var(--panel);
  border: 3px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-sm); overflow: hidden; }
.speed-group .sp {
  width: 38px; height: 44px; font-size: 14px; color: var(--ink-soft);
  display: inline-flex; align-items: center; justify-content: center; background: transparent;
  transition: background .12s, color .12s;
}
.speed-group .sp + .sp { border-left: 2px solid var(--border); }
.speed-group .sp.active { background: var(--mint); color: #2f6b52; }

/* =========================================================================
   Dock
   ========================================================================= */
.dock {
  left: 0; right: 0; bottom: 0;
  display: flex; gap: 8px; justify-content: center; align-items: flex-end;
  padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events: none; overflow-x: auto; overflow-y: visible;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.dock::-webkit-scrollbar { display: none; }
.dock-inner { display: flex; gap: 8px; pointer-events: auto; padding: 4px 2px; }
.dock-btn {
  flex: 0 0 auto;
  width: 66px; min-height: 66px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: var(--panel); border: 3px solid var(--border);
  border-radius: 20px; box-shadow: var(--shadow);
  padding: 8px 4px 6px; transition: transform .14s var(--ease-back), background .14s, border-color .14s;
}
.dock-btn .ic { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(138,90,52,.12)); }
.dock-btn .lb { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.dock-btn:hover { transform: translateY(-3px); background: var(--cream); }
.dock-btn:active { transform: translateY(1px) scale(.95); }
.dock-btn.active { background: var(--blush); border-color: var(--pink-deep); }
.dock-btn.active .lb { color: var(--pink-deep); }

/* =========================================================================
   Panels
   ========================================================================= */
.panels { inset: 0; pointer-events: none; }
.panel-scrim {
  position: absolute; inset: 0; background: rgba(60,40,25,.20);
  opacity: 0; transition: opacity .28s ease; pointer-events: auto;
}
.panel-scrim.show { opacity: 1; }

.panel {
  position: absolute; pointer-events: auto;
  top: calc(var(--hud-h) + 14px); right: 12px; bottom: calc(var(--dock-h) + 6px);
  width: min(460px, calc(100vw - 24px));
  background: var(--panel); border: 4px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
  transform: translateX(24px) scale(.96); opacity: 0;
  transition: transform .32s var(--ease-back), opacity .26s ease;
}
.panel.open { transform: translateX(0) scale(1); opacity: 1; }
.panel.closing { transform: translateX(24px) scale(.96); opacity: 0; }

.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 14px 12px; border-bottom: 3px dashed var(--border);
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  flex: 0 0 auto;
}
.panel-head .p-ic { font-size: 26px; }
.panel-head .p-title { font-size: 20px; color: var(--ink); flex: 1; }
.panel-close {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--cream); border: 3px solid var(--border);
  font-size: 20px; color: var(--ink-soft); box-shadow: var(--shadow-sm);
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .12s var(--ease-back), background .12s;
}
.panel-close:hover { background: var(--blush); }
.panel-close:active { transform: scale(.9); }

.panel-body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 14px; -webkit-overflow-scrolling: touch; }
.panel-body::-webkit-scrollbar { width: 10px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid var(--panel); }

/* tabs */
.tabbar { display: flex; gap: 6px; margin: -4px -4px 12px; flex-wrap: wrap; }
.tab {
  flex: 1 1 auto; min-width: 66px; padding: 9px 6px; border-radius: 14px;
  background: var(--cream); border: 2.5px solid var(--border); color: var(--ink-soft);
  font-size: 13px; transition: background .12s, color .12s, transform .1s;
}
.tab:active { transform: scale(.96); }
.tab.active { background: var(--mint); border-color: var(--mint-deep); color: #2f6b52; }

/* =========================================================================
   Cards / grids (shop, upgrades, almanac)
   ========================================================================= */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.card {
  position: relative; background: var(--panel-2); border: 3px solid var(--border);
  border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
  box-shadow: var(--shadow-sm); overflow: hidden;
}
.card .card-top { display: flex; align-items: center; gap: 6px; }
.card .portrait { width: 66px; height: 66px; border-radius: 14px; background:
  radial-gradient(circle at 50% 35%, #fff, var(--cream)); border: 2.5px solid var(--border);
  margin: 0 auto; display: block; }
.card .c-name { font-size: 14px; color: var(--ink); text-align: center; line-height: 1.2; }
.card .c-emoji { font-size: 16px; }
.card .c-blurb { font-size: 11px; color: var(--ink-soft); line-height: 1.35; font-weight: 700; }
.card .c-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 12px; }
.rarity { font-size: 10px; padding: 2px 7px; border-radius: 999px; color: #fff; }
.rarity.common { background: #b9c4a0; } .rarity.uncommon { background: var(--mint-deep); }
.rarity.rare { background: var(--sky); } .rarity.epic { background: var(--lavender); }
.rarity.legendary { background: linear-gradient(90deg, var(--gold), var(--pink-deep)); }

.price { color: var(--gold); font-size: 13px; display: inline-flex; align-items: center; gap: 2px; }
.price::before { content: "🪙"; font-size: 12px; }

.pill { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--cream);
  border: 1.5px solid var(--border); color: var(--ink-soft); }
.pill.season { background: var(--blush); border-color: var(--pink); color: var(--pink-deep); }
.pill.good { background: #e8fbe6; border-color: var(--good); color: #4e9b3a; }

/* buttons */
.btn {
  border-radius: 14px; padding: 10px 12px; font-size: 14px;
  background: linear-gradient(180deg, #fff, var(--cream)); border: 3px solid var(--border);
  color: var(--ink); box-shadow: var(--shadow-sm);
  transition: transform .12s var(--ease-back), filter .12s, background .12s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: translateY(2px) scale(.97); }
.btn:hover { filter: brightness(1.03); }
.btn.wide { width: 100%; }
.btn.pri { background: linear-gradient(180deg, #FFE6A0, var(--yellow)); border-color: var(--gold); color: #7a5a1e; }
.btn.mint { background: linear-gradient(180deg, #b6f2da, var(--mint)); border-color: var(--mint-deep); color: #2f6b52; }
.btn.pink { background: linear-gradient(180deg, #ffd0e4, var(--pink)); border-color: var(--pink-deep); color: #9c355f; }
.btn.sky  { background: linear-gradient(180deg, #cdeefb, var(--sky)); border-color: #58b6e0; color: #2c6383; }
.btn.danger { background: linear-gradient(180deg, #ffd0d0, #ff9d9d); border-color: var(--alert); color: #a33; }
.btn.sm { padding: 7px 10px; font-size: 12.5px; border-width: 2.5px; }
.btn.ghost { background: var(--cream); box-shadow: none; }
.btn[disabled] { opacity: .5; filter: grayscale(.4); pointer-events: none; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 auto; }

/* locked overlay */
.locked { filter: grayscale(.55) brightness(.98); }
.lock-badge {
  position: absolute; top: 8px; right: 8px; background: var(--panel);
  border: 2px solid var(--border); border-radius: 999px; padding: 2px 8px;
  font-size: 11px; color: var(--ink-soft); box-shadow: var(--shadow-sm);
}
.card-lock-veil {
  position: absolute; inset: 0; background: rgba(255,251,240,.55);
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
  color: var(--ink-soft); font-size: 12px; text-align: center; border-radius: 15px;
}
.card-lock-veil .big { font-size: 24px; }

/* =========================================================================
   Need bars (barn / inspector)
   ========================================================================= */
.needs { display: flex; flex-direction: column; gap: 7px; }
.need { display: flex; align-items: center; gap: 8px; }
.need .n-ic { width: 20px; text-align: center; font-size: 14px; }
.need .n-lb { width: 40px; font-size: 11px; color: var(--ink-soft); }
.need .n-track { flex: 1; height: 12px; background: var(--panel-2); border: 2px solid var(--border);
  border-radius: 999px; overflow: hidden; }
.need .n-fill { height: 100%; border-radius: 999px; transition: width .4s var(--ease-back); }
.need .n-val { width: 30px; text-align: right; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.need.hunger .n-fill { background: linear-gradient(90deg, #ffd18a, var(--need-hunger)); }
.need.happy  .n-fill { background: linear-gradient(90deg, #ffc4dc, var(--need-happy)); }
.need.health .n-fill { background: linear-gradient(90deg, #b6f0a2, var(--need-health)); }
.need.clean  .n-fill { background: linear-gradient(90deg, #c2ecfa, var(--need-clean)); }
.need.low .n-fill { background: linear-gradient(90deg, #ffb0b0, var(--alert)) !important; }

/* animal row (barn list) */
.a-row {
  display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 8px;
  background: var(--panel-2); border: 2.5px solid var(--border); border-radius: 16px;
  box-shadow: var(--shadow-sm); transition: transform .12s var(--ease-back), background .12s;
}
.a-row:hover { background: var(--cream); transform: translateX(2px); }
.a-row:active { transform: scale(.98); }
.a-row .a-port { width: 54px; height: 54px; border-radius: 12px; flex: 0 0 auto;
  background: radial-gradient(circle at 50% 35%, #fff, var(--cream)); border: 2px solid var(--border); }
.a-row .a-info { flex: 1; min-width: 0; }
.a-row .a-name { font-size: 15px; color: var(--ink); display: flex; align-items: center; gap: 5px; }
.a-row .a-mood { font-size: 11px; color: var(--ink-soft); }
.a-row .mini-needs { display: flex; gap: 3px; margin-top: 4px; }
.mini-needs .mn { flex: 1; height: 6px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); overflow: hidden; }
.mini-needs .mn > i { display: block; height: 100%; }

.section-title { font-size: 13px; color: var(--ink-soft); margin: 14px 2px 8px; display: flex; align-items: center; gap: 6px; }
.section-title::after { content: ""; flex: 1; height: 2px; background: var(--border); border-radius: 2px; opacity: .5; }

/* =========================================================================
   Inspector
   ========================================================================= */
.insp-hero { display: flex; gap: 12px; align-items: center; margin-bottom: 12px;
  background: linear-gradient(180deg, var(--blush), var(--panel-2)); border: 3px solid var(--border);
  border-radius: 20px; padding: 12px; }
.insp-hero .hero-port { width: 108px; height: 108px; border-radius: 18px; flex: 0 0 auto;
  background: radial-gradient(circle at 50% 40%, #fff, var(--cream)); border: 3px solid var(--border); }
.insp-hero .hero-meta { flex: 1; min-width: 0; }
.insp-hero .hero-name { font-size: 22px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.insp-hero .hero-sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; line-height: 1.5; }
.insp-hero .hero-mood { display: inline-block; margin-top: 6px; font-size: 12px; padding: 3px 10px;
  background: var(--panel); border: 2px solid var(--border); border-radius: 999px; }
.blurb { font-size: 12.5px; color: var(--ink-soft); line-height: 1.55; background: var(--cream);
  border: 2px dashed var(--border); border-radius: 14px; padding: 10px; margin: 12px 0; }
.prod-status { display: flex; align-items: center; gap: 8px; background: var(--panel-2);
  border: 2.5px solid var(--border); border-radius: 14px; padding: 10px; margin: 10px 0; font-size: 13px; }
.prod-status .ps-ic { font-size: 22px; }
.trait-badge { font-size: 10.5px; padding: 2px 8px; border-radius: 999px; background: var(--lavender); color: #4b3a78; }
.storage-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 13px; border-bottom: 1.5px dashed var(--border); }

/* =========================================================================
   Market
   ========================================================================= */
.mkt-row { display: flex; align-items: center; gap: 10px; padding: 9px 8px; margin-bottom: 8px;
  background: var(--panel-2); border: 2.5px solid var(--border); border-radius: 16px; }
.mkt-row .m-ic { font-size: 24px; width: 30px; text-align: center; }
.mkt-row .m-main { flex: 1; min-width: 0; }
.mkt-row .m-name { font-size: 14px; color: var(--ink); }
.mkt-row .m-sub { font-size: 11px; color: var(--ink-soft); }
.mkt-row .m-price { font-size: 15px; color: var(--gold); text-align: right; }
.spark { width: 62px; height: 26px; flex: 0 0 auto; }
.spark polyline { fill: none; stroke: var(--mint-deep); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.trend-up { color: var(--good); } .trend-dn { color: var(--alert); } .trend-flat { color: var(--ink-faint); }
.empty-note { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; line-height: 1.7; }
.empty-note .big { font-size: 40px; display: block; margin-bottom: 8px; }

/* =========================================================================
   Goals / achievements
   ========================================================================= */
.goal { background: var(--panel-2); border: 2.5px solid var(--border); border-radius: 16px;
  padding: 10px 12px; margin-bottom: 9px; }
.goal .g-top { display: flex; align-items: center; gap: 8px; font-size: 13.5px; margin-bottom: 7px; }
.goal .g-ic { font-size: 17px; }
.goal .g-num { margin-left: auto; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.goal .g-track { height: 12px; background: var(--panel); border: 2px solid var(--border); border-radius: 999px; overflow: hidden; }
.goal .g-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--mint), var(--mint-deep)); transition: width .5s var(--ease-back); }
.goal.done .g-fill { background: linear-gradient(90deg, var(--yellow), var(--gold)); }
.goal.done .g-top { color: var(--gold); }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ach { display: flex; gap: 8px; align-items: center; background: var(--panel-2); border: 2.5px solid var(--border);
  border-radius: 14px; padding: 8px; }
.ach .a-badge { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex: 0 0 auto; background: var(--cream); border: 2.5px solid var(--border); }
.ach.got .a-badge { background: radial-gradient(circle at 40% 35%, #fff6cf, var(--yellow)); border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(246,185,59,.25); }
.ach.locked { opacity: .62; } .ach.locked .a-badge { filter: grayscale(1); }
.ach .a-txt .t1 { font-size: 12.5px; color: var(--ink); }
.ach .a-txt .t2 { font-size: 10.5px; color: var(--ink-soft); line-height: 1.35; }

/* =========================================================================
   Settings
   ========================================================================= */
.set-group { background: var(--panel-2); border: 2.5px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
.set-group h4 { margin: 0 0 10px; font-size: 14px; color: var(--ink); }
.set-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 13px; }
.set-row:last-child { margin-bottom: 0; }
.set-row .s-lb { width: 78px; color: var(--ink-soft); flex: 0 0 auto; }
input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 10px; border-radius: 999px;
  background: var(--panel); border: 2px solid var(--border); outline: none; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #fff, var(--pink)); border: 3px solid var(--pink-deep); box-shadow: var(--shadow-sm); cursor: pointer; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%;
  background: var(--pink); border: 3px solid var(--pink-deep); cursor: pointer; }
.toggle { width: 58px; height: 32px; border-radius: 999px; background: var(--panel); border: 2.5px solid var(--border);
  position: relative; transition: background .16s; flex: 0 0 auto; }
.toggle > i { position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
  background: #fff; border: 2px solid var(--border); transition: left .18s var(--ease-back); }
.toggle.on { background: var(--mint); border-color: var(--mint-deep); }
.toggle.on > i { left: 28px; border-color: var(--mint-deep); }
.seg { display: inline-flex; border: 2.5px solid var(--border); border-radius: 12px; overflow: hidden; }
.seg > button { padding: 7px 14px; font-size: 13px; background: var(--panel); color: var(--ink-soft); }
.seg > button + button { border-left: 2px solid var(--border); }
.seg > button.active { background: var(--mint); color: #2f6b52; }
.credits { text-align: center; font-size: 11.5px; color: var(--ink-soft); line-height: 1.8; padding: 6px; }
.io-area { width: 100%; height: 84px; border-radius: 12px; border: 2.5px solid var(--border); background: var(--cream);
  padding: 8px; font-size: 11px; color: var(--ink); font-family: monospace; resize: none; }

/* =========================================================================
   Toasts
   ========================================================================= */
.toast-layer {
  left: 0; right: 0; top: calc(var(--hud-h) + 18px);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none; padding: 0 12px;
}
.toast {
  pointer-events: auto; max-width: min(420px, 92vw);
  display: flex; align-items: center; gap: 10px;
  background: var(--panel); border: 3px solid var(--border); border-radius: 999px;
  padding: 10px 18px; box-shadow: var(--shadow); font-size: 14px; color: var(--ink);
  transform: translateY(-14px) scale(.9); opacity: 0;
  transition: transform .34s var(--ease-back), opacity .28s ease;
}
.toast.show { transform: translateY(0) scale(1); opacity: 1; }
.toast.hide { transform: translateY(-10px) scale(.92); opacity: 0; }
.toast .t-ic { font-size: 20px; }
.toast.good { border-color: var(--good); background: #f2fdef; }
.toast.warn { border-color: var(--amber); background: #fff7e8; }
.toast.bad  { border-color: var(--alert); background: #fff0f0; }

/* =========================================================================
   Tooltip
   ========================================================================= */
.ui-tooltip {
  pointer-events: none; z-index: 60; max-width: 220px;
  background: var(--ink); color: #fff6e3; font-size: 12px; line-height: 1.4;
  padding: 7px 11px; border-radius: 12px; box-shadow: var(--shadow);
  transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .14s ease;
}
.ui-tooltip.show { opacity: .97; }
.ui-tooltip::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: var(--ink); }

/* =========================================================================
   Modal / dialog
   ========================================================================= */
.ui-modal-layer { inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center;
  background: rgba(55,36,22,.34); opacity: 0; transition: opacity .24s ease; pointer-events: auto; padding: 18px; }
.ui-modal-layer.show { opacity: 1; }
.ui-modal {
  width: min(400px, 94vw); max-height: 86vh; overflow: hidden; display: flex; flex-direction: column;
  background: var(--panel); border: 4px solid var(--border); border-radius: 26px; box-shadow: var(--shadow);
  transform: scale(.86) translateY(12px); transition: transform .34s var(--ease-back);
}
.ui-modal-layer.show .ui-modal { transform: scale(1) translateY(0); }
.ui-modal .m-head { padding: 16px 18px 8px; font-size: 20px; color: var(--ink); text-align: center; display: flex; gap: 8px; align-items: center; justify-content: center; }
.ui-modal .m-body { padding: 4px 20px 14px; font-size: 14px; color: var(--ink-soft); line-height: 1.65; text-align: center; overflow-y: auto; }
.ui-modal .m-body .big-emoji { font-size: 48px; display: block; margin: 4px 0 10px; }
.ui-modal .m-foot { display: flex; gap: 8px; padding: 6px 16px 18px; flex-wrap: wrap; }
.ui-modal .m-foot > .btn { flex: 1 1 40%; }
.m-input { width: 100%; padding: 11px 14px; font-size: 16px; border-radius: 14px; border: 3px solid var(--border);
  background: var(--cream); color: var(--ink); text-align: center; font-weight: 800; margin: 6px 0; }
.m-input:focus { outline: none; border-color: var(--pink-deep); }
.choice-cost { font-size: 11px; color: var(--gold); margin-left: 4px; }

/* =========================================================================
   Placement banner
   ========================================================================= */
.ui-banner {
  top: calc(var(--hud-h) + 20px); left: 50%; transform: translateX(-50%);
  display: none; align-items: center; gap: 12px; z-index: 40;
  background: var(--panel); border: 3px solid var(--pink); border-radius: 999px;
  padding: 9px 12px 9px 18px; box-shadow: var(--shadow); font-size: 14px; color: var(--ink);
  pointer-events: auto; max-width: 92vw;
}
.ui-banner.show { display: flex; animation: chip-pop .34s var(--ease-back); }
.ui-banner .b-cancel { width: 34px; height: 34px; border-radius: 50%; background: var(--cream);
  border: 2.5px solid var(--border); font-size: 16px; display: inline-flex; align-items: center; justify-content: center; }

/* =========================================================================
   Title overlay
   ========================================================================= */
.overlay-layer { inset: 0; z-index: 100; pointer-events: none; }
.title-screen {
  position: absolute; inset: 0; pointer-events: auto; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  background: linear-gradient(180deg, #bfe9fb 0%, #d9f3c9 60%, #cbead0 100%);
  transition: opacity .5s ease; text-align: center; padding: 24px;
}
.title-screen.hide { opacity: 0; pointer-events: none; }
.title-screen .t-drop { font-size: 84px; filter: drop-shadow(0 8px 0 rgba(111,189,214,.4)); animation: floaty 3.2s ease-in-out infinite; }
.title-screen h1 { margin: 6px 0 2px; font-size: 42px; color: var(--ink); text-shadow: 0 3px 0 #fff, 0 5px 10px rgba(138,90,52,.2); letter-spacing: 1px; }
.title-screen .t-sub { font-size: 14px; color: var(--wood-dark); margin-bottom: 24px; }
.title-screen .t-menu { display: flex; flex-direction: column; gap: 12px; width: min(280px, 80vw); }
.title-screen .t-menu .btn { font-size: 18px; padding: 14px; }
.title-screen .t-foot { position: absolute; bottom: 18px; font-size: 11px; color: var(--wood-dark); opacity: .8; }
.title-cloud { position: absolute; font-size: 60px; opacity: .85; animation: drift 26s linear infinite; }

/* =========================================================================
   Animations
   ========================================================================= */
@keyframes chip-pop { 0% { transform: scale(.8); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@keyframes drift { from { transform: translateX(-14vw); } to { transform: translateX(114vw); } }
@keyframes wiggle { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.pop-in { animation: chip-pop .34s var(--ease-back); }

/* reduce motion */
.reduce-motion * { animation-duration: .001s !important; animation-iteration-count: 1 !important;
  transition-duration: .04s !important; }
.reduce-motion .title-screen .t-drop, .reduce-motion .title-cloud { animation: none; }

/* =========================================================================
   Responsive (phones)
   ========================================================================= */
@media (max-width: 620px) {
  :root { --dock-h: 84px; }
  .panel {
    left: 0; right: 0; bottom: 0; top: auto; width: 100%;
    height: min(74vh, 620px);
    border-radius: 28px 28px 0 0; border-bottom: none;
    transform: translateY(28px);
  }
  .panel.open { transform: translateY(0); }
  .panel.closing { transform: translateY(30px); }
  .dock { justify-content: flex-start; }
  .dock-btn { width: 60px; min-height: 60px; }
  .dock-btn .ic { font-size: 23px; }
  .hud-chip { font-size: 14px; padding: 5px 11px; min-height: 40px; }
  .rank-chip .xpbar { width: 76px; }
  .title-screen h1 { font-size: 34px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
}
@media (max-width: 380px) {
  .date-chip .clock { display: none; }
  .card-grid { grid-template-columns: 1fr 1fr; }
}

dG":100000,"rewardBlurb":"最高級・和牛の取引許可がおりた！","unlocksBlurb":"和牛・育種ラボ・配送トラック・ソーラーパネルなど上級設備"},{"star":5,"name":"マイスター牧場主","requiredG":350000,"rewardBlurb":"黄金の牛鈴を授かり、牧場が名所として知れわたる！","unlocksBlurb":"黄金の牛鈴・ドローン牧童・プレミアム契約など最上位自動化"},{"star":6,"name":"レジェンド牧場主","requiredG":1000000,"rewardBlurb":"伝説の設備がすべて解放、牧場は一大帝国に！","unlocksBlurb":"全設備の最終アップグレードとエンドゲーム経営要素"},{"star":7,"name":"しずくの守り人","requiredG":5000000,"rewardBlurb":"牧場に妖精が住みつき、まきばのしずくの伝説となる。","unlocksBlurb":"すべて解放・特別エンドコンテンツと称号「しずくの守り人」"}]},"balance":{"_meta":{"schema":"makiba-balance","version":1,"unit":"All need bars are 0-100. Money is G. Yields are 'units/day' unless a cycleDays is given. Time is expressed as day-fractions t in [0,1) where t=0 is dawn/morning.","sourceOfTruth":"docs/design/game-design.md sections 5,6,7,16. Base prices, rank net-worth thresholds and the 12-day/48-day calendar are copied verbatim from that doc; all sibling agents must align to it.","calendarNote":"daysPerSeason is 12 (NOT the task's generic ~14 default) to match the canonical calendar in game-design.md 5.8/16.6 so seasonal events authored in content.json line up.","consumedBy":["state","time","economy","crops","animals","world","ui"],"pairsWith":"data/content.json (owns the upgrades[]/achievements[]/events[]/shop arrays; this file specs their mini-languages and all tuning constants)"},"start":{"money":500,"day":1,"year":1,"season":"spring","weather":"sunny","startingCow":"holstein","ranchSize":[16,12],"worldSize":[96,72],"_worldNote":"ranchSize is the single rundown starter plot the player begins on; worldSize is the full vast grid revealed plot-by-plot (see landPlots). Vastness pillar: the map is ~36x the starter plot.","startingBuildings":[{"id":"house","pos":[2,2]},{"id":"barn","pos":[6,3]},{"id":"pasture","pos":[9,6]},{"id":"market_stall","pos":[3,8]}],"_startingBuildingsNote":"Positions are suggested defaults inside the 16x12 starter plot; world/world-gen agent may relocate. No well/silo/dairy at start (those are Stage 2/3 unlocks). market_stall is deliberately the 'rickety' free starter stall.","startingSeeds":{"grass":8,"carrot":2,"turnip":2},"startingFeed":{"hay":6},"startingCowStats":{"age":"adult","ageDays":30,"hunger":85,"happiness":70,"health":85,"cleanliness":80,"temperament":52},"tutorialGoalId":"sell_5_milk"},"time":{"realSecondsPerGameDay":120,"daysPerSeason":12,"seasonsPerYear":4,"daysPerYear":48,"seasonOrder":["spring","summer","autumn","winter"],"dawnIsDayStart":true,"phasesPerDay":{"morning":[0,0.25],"day":[0.25,0.58],"evening":[0.58,0.8],"night":[0.8,1]},"phaseClock":{"morningStart":"06:00","dayStart":"10:00","eveningStart":"18:00","nightStart":"22:00"},"ambientLight":{"morning":0.72,"day":1,"evening":0.6,"night":0.3},"lightTintHint":{"morning":"#ffe6c2","day":"#ffffff","evening":"#ffcf99","night":"#3a4a8c"},"speeds":[1,2,3],"defaultSpeed":1,"canPause":true,"sleepToMorning":true,"autosaveAtMorning":true,"productionRollsAt":"morning","newDayFraction":0},"dailyTick":{"_note":"Canonical order of operations each in-game morning. animals.js/economy.js/crops.js must follow this so results are deterministic and agents agree.","order":["1. advance clock: day++, roll season/year on boundary (12/48).","2. market: step every price index (clamped random walk), decay supplyGlut, recompute today's prices.","3. weather: roll today's weather from weather.oddsBySeason.","4. crops: apply water (rain or sprinkler or manual-yesterday), advance growth, run wither/overripe checks.","5. animals: decay hunger & cleanliness; feed_trough auto-feeds from silo; recompute happinessTarget and ease happiness; update health; decay pet stacks; age babies toward adult.","6. production: for each adult, compute yield, roll quality tier, deposit to storage (clamped by warehouse capacity; overflow is auto-sold at 70% with a gentle toast).","7. processing: advance dairy timers; emit finished products into storage.","8. passive: accumulate manure; apply companion/decor auras; apply dog/cat market aura for the day.","9. events & goals: evaluate event triggers (chancePerDay/cooldown), fire effects; tally lifetime stats; check achievements; check goal board & rank-up.","10. autosave."]},"needs":{"scale":[0,100],"startingDefaults":{"hunger":80,"happiness":65,"health":80,"cleanliness":78},"hungerDecayPerDay":40,"hungerDecayWeatherMult":{"sunny":1,"cloudy":1,"rainy":1.05,"snowy":1.2},"cleanlinessDecayPerDay":30,"cleanlinessDecayWeatherMult":{"sunny":1,"cloudy":1,"rainy":1.6,"snowy":1.3},"cleanRestore":{"sweep":60,"sprinklerAuto":25,"groom":45,"wellWater":40},"happinessBase":45,"happinessFromFed":25,"happinessFromClean":15,"happinessFromPet":18,"happinessFromCompanion":8,"happinessFromShelter":6,"happinessEasePerDay":0.5,"happinessWeatherPenaltyUnsheltered":{"sunny":0,"cloudy":-2,"rainy":-6,"snowy":-8},"petDecayPerDay":12,"petMaxStacks":3,"petPerTapHappiness":6,"companionAuraCap":24,"healthFromHappyPerDay":8,"healthLossFromStarvingPerDay":10,"healthLossFromDirtyPerDay":5,"healthBaselinePull":60,"healthBaselineEasePerDay":0.1,"thresholds":{"starving":20,"hungry":45,"dirty":35,"sick":30,"unhappy":35,"content":60,"happy":75,"blissful":88},"formulas":{"hungerUpdate":"hunger = clamp(hunger - hungerDecayPerDay*hungerDecayWeatherMult[weather] + fedThisDay, 0, 100)","cleanlinessUpdate":"cleanliness = clamp(cleanliness - cleanlinessDecayPerDay*cleanlinessDecayWeatherMult[weather] + cleanedThisDay, 0, 100)","happinessTarget":"clamp(happinessBase + happinessFromFed*(hunger/100) + happinessFromClean*(cleanliness/100) + petBonus + min(companionBonus, companionAuraCap) + shelterBonus + (sheltered ? 0 : happinessWeatherPenaltyUnsheltered[weather]), 0, 100)","happinessUpdate":"happiness += (happinessTarget - happiness) * happinessEasePerDay","petBonus":"petStacks * happinessFromPet, where petStacks decays by (petDecayPerDay/ (happinessFromPet)) worth per day; simplest impl: petBonus = clamp(petBonus - petDecayPerDay, 0, happinessFromPet*petMaxStacks)","healthUpdate":"health += (happiness\u003e=thresholds.happy ? healthFromHappyPerDay : 0) - (hunger\u003cthresholds.starving ? healthLossFromStarvingPerDay : 0) - (cleanliness\u003cthresholds.dirty ? healthLossFromDirtyPerDay : 0) + (health\u003chealthBaselinePull ? (healthBaselinePull-health)*healthBaselineEasePerDay : 0); clamp 0..100","neglectIsSoft":"No need ever causes death or debt; low needs only reduce production and quality (see production). Recovery to full is always possible with care."}},"speciesTraits":{"_note":"heat/cold resist 0..1 feed seasonMult for every animal's production (cows override with per-breed values in production.byBreed). Higher resist = smaller seasonal yield loss.","chicken":{"heatResist":0.5,"coldResist":0.4},"duck":{"heatResist":0.6,"coldResist":0.6},"sheep":{"heatResist":0.3,"coldResist":0.85},"goat":{"heatResist":0.6,"coldResist":0.6},"pig":{"heatResist":0.45,"coldResist":0.4},"alpaca":{"heatResist":0.25,"coldResist":0.9},"rabbit":{"heatResist":0.4,"coldResist":0.6},"horse":{"heatResist":0.5,"coldResist":0.6},"dog":{"heatResist":0.5,"coldResist":0.6},"cat":{"heatResist":0.6,"coldResist":0.5}},"production":{"milkYield":{"formula":"milkYield = baseMilkPerDay[breed] * happinessMult * healthMult * seasonMult * feedMult * upgradeMult * ageMult","happinessMult":"clamp(0.40 + 0.008*happiness, 0.40, 1.20)","healthMult":"clamp(0.55 + 0.0045*health, 0.55, 1.00)","seasonMult":"spring =\u003e 1.05 ; autumn =\u003e 1.00 ; summer =\u003e 1 - heatStress*(1 - heatResist[breed]) ; winter =\u003e 1 - coldStress*(1 - coldResist[breed])","heatStress":0.25,"coldStress":0.3,"feedMult":"premium feed (alfalfa) =\u003e 1.15 ; good feed (corn/wheat) =\u003e 1.05 ; basic feed (grass/hay/clover) =\u003e 0.95 ; starving (hunger\u003cthresholds.starving) =\u003e 0.70","ageMult":"baby =\u003e 0.0 ; juvenile =\u003e 0.0 ; adult =\u003e 1.0 (production begins the day an animal reaches adult; see breeding.babyGrowthDays)","upgradeMult":"product of all bought upgrade effects whose target is milkYield or allYield (default 1.0)","uncollectedCapDays":2,"_uncollectedNote":"Milk keeps accumulating up to 2 days of yield if the player does not collect; beyond that it soft-caps (no waste toast is scary, just 'ミルクがいっぱい！')."},"byBreed":{"holstein":{"baseMilkPerDay":7,"temperamentBase":45,"premiumAffinity":0.5,"heatResist":0.3,"coldResist":0.55,"feedEfficiency":1,"tier":1},"jersey":{"baseMilkPerDay":4.5,"temperamentBase":70,"premiumAffinity":1,"heatResist":0.6,"coldResist":0.35,"feedEfficiency":1,"tier":3},"brown_swiss":{"baseMilkPerDay":5.5,"temperamentBase":60,"premiumAffinity":0.7,"heatResist":0.55,"coldResist":0.6,"feedEfficiency":0.95,"tier":4},"highland":{"baseMilkPerDay":2.5,"temperamentBase":65,"premiumAffinity":0.4,"heatResist":0.1,"coldResist":0.95,"feedEfficiency":0.9,"tier":4},"belted_galloway":{"baseMilkPerDay":3.5,"temperamentBase":60,"premiumAffinity":0.5,"heatResist":0.45,"coldResist":0.7,"feedEfficiency":0.95,"tier":4},"wagyu":{"baseMilkPerDay":2.5,"temperamentBase":90,"premiumAffinity":1.2,"heatResist":0.5,"coldResist":0.45,"feedEfficiency":0.85,"tier":6},"mini_cow":{"baseMilkPerDay":1,"temperamentBase":75,"premiumAffinity":0.3,"heatResist":0.5,"coldResist":0.5,"feedEfficiency":0.6,"tier":4},"dexter":{"baseMilkPerDay":3,"temperamentBase":62,"premiumAffinity":0.6,"heatResist":0.55,"coldResist":0.65,"feedEfficiency":0.75,"tier":4}},"quality":{"qualityScoreFormula":"0.40*happiness + 0.25*health + 0.20*(feedQuality*100) + 0.15*temperament","feedQualityRef":"feedQuality is the 0..1 value of what the animal last ate (see feed.feedItems); unfed defaults to 0.3","premiumChanceFormula":"clamp((qualityScore - 60)/40, 0, 1) * premiumAffinity[breed]","premiumOutcome":"each production day, if rng() \u003c premiumChance the whole day's milk is produced as quality_milk instead of milk; otherwise milk.","tiers":{"normal":"qualityScore \u003c 70","fine":"70 \u003c= qualityScore \u003c 85 (raw milk sells at +8% if not upgraded to quality_milk)","premium":"qualityScore \u003e= 85 or a successful premium roll -\u003e yields quality_milk"},"wagyuAlwaysPremium":true,"_wagyuNote":"wagyu milk is always emitted as quality_milk regardless of roll (prestige breed); still scaled by all yield multipliers."},"otherAnimals":{"_note":"egg/wool/goat_milk/etc. reuse the SAME happinessMult, healthMult and seasonMult (using that species' speciesTraits resist) as milk. Only the base rate and product id change.","chicken":{"product":"egg","perDay":1,"doubleChance":0.08},"duck":{"product":"egg","perDay":0.6,"pondBonusPerDay":0.3},"sheep":{"product":"wool","cycleDays":4,"perCycle":1,"qualityAffectsSellPrice":true},"alpaca":{"product":"fine_wool","cycleDays":5,"perCycle":1},"goat":{"product":"goat_milk","perDay":2.5,"premiumAffinity":0.6},"pig":{"product":"truffle","cycleDays":6,"perCycle":1,"requiresForageTile":true,"foragePenaltyIfNone":0.4},"allAnimals":{"product":"manure","perDay":0.5}},"processing":{"_note":"Recipe definitions live here for balance; content.json may reference by id. Times are in in-game hours (a day = 24h; realSecondsPerGameDay=120 so 8h ~ 40s at 1x).","dairy":{"baseSlots":2,"speedMultByTier":[1,0.8,0.65],"slotsByTier":[2,3,5],"recipes":{"cheese":{"in":{"milk":3},"out":{"cheese":1},"hours":8},"butter":{"in":{"milk":2},"out":{"butter":1},"hours":5},"yogurt":{"in":{"milk":1},"out":{"yogurt":1},"hours":3},"premium_cheese":{"in":{"quality_milk":3},"out":{"cheese":1},"hours":8,"outQuality":"premium","sellMult":1.6,"tierRequired":2},"goat_cheese":{"in":{"goat_milk":3},"out":{"cheese":1},"hours":8,"sellMult":1.15}},"marginNote":"3 milk (75G) -\u003e 1 cheese (120G): +60% before fees, but gated by slots/time so raw-vs-process is a real choice."}}},"feed":{"consumptionPerDay":{"cow":2,"sheep":1,"goat":1,"pig":1.5,"chicken":0.5,"duck":0.5,"alpaca":1.2,"rabbit":0.3,"horse":2.5,"default":1},"consumptionUsesBreedFeedEfficiency":true,"feedItems":{"grass":{"hunger":15,"feedQuality":0.4,"buyCost":5,"tier":"basic"},"hay":{"hunger":22,"feedQuality":0.5,"buyCost t":{"modifies":"feed.feedItems[].buyCost","improveDirection":"\u003c1","default":1},"feedUse":{"modifies":"feed.consumptionPerDay","improveDirection":"\u003c1","default":1},"priceBonus":{"modifies":"added to sell multiplier (like an extra market_stall bonus)","improveDirection":"+","default":0,"example":"priceBonus+0.1 = +10% sell price"},"cheeseSpeed":{"modifies":"processing dairy hours (TIME)","improveDirection":"\u003c1","default":1},"processSlots":{"modifies":"dairy parallel slots","improveDirection":"+","default":0},"capacity":{"modifies":"the target building's capacity (context: which building the upgrade card names)","improveDirection":"+","default":0,"example":"capacity+5"},"needsDecay":{"modifies":"global multiplier on hunger & cleanliness decay","improveDirection":"\u003c1","default":1,"example":"needsDecay*0.85 = needs drain 15% slower"},"happinessGain":{"modifies":"multiplier on happiness recovery/eases","improveDirection":"\u003e1","default":1},"autoCollectRadius":{"modifies":"tiles auto-collected around player/buildings","improveDirection":"+","default":0},"waterRadius":{"modifies":"well/sprinkler coverage tiles","improveDirection":"+","default":0},"moveSpeed":{"modifies":"player move speed","improveDirection":"\u003e1","default":1}},"flags":{"autoMilk":"cows auto-collect milk each morning (no manual tap needed)","autoFeed":"enables trough auto-feed globally even without a trough nearby (ranch-wide feeder research)","autoWater":"all crops auto-watered each morning (ranch-wide, like blanket sprinklers)","autoCollect":"eggs/wool/etc. auto-collected each morning","autoShear":"sheep/alpaca auto-sheared on cycle","bulkSell":"unlock one-tap sell-all in the market panel","nightWork":"production/processing continues through the night phase at normal rate","rainShelter":"animals count as sheltered from rain/snow happiness penalties ranch-wide"},"examples":["milkYield*1.15","cropGrow*0.8","feedCost*0.9","priceBonus+0.1","capacity+5","needsDecay*0.85","cheeseSpee (function(){
/*
 * 00-data.js — normalizes the raw content+balance JSON (injected by the build as
 * Game.RAW) into the frozen Game.DATA API. This is the SINGLE place that reconciles
 * the content DB's field names with the rest of the code. All logic modules read
 * balance/content exclusively through Game.DATA (never magic numbers).
 *
 * Field-name notes (content.json actual fields, preserved as-is):
 *   cowBreeds[]:  {id,name,emoji,rarity,buyPrice,sellValue,baseMilkPerDay,milkQuality,
 *                  matureAgeDays,lifespanDays,feedPerDay,coldResist,heatResist,
 *                  cutenessBlurb,personality,unlockRank}

 *                  buildingNeeded,cutenessBlurb,unlockRank}

 *                  waterNeed,isDecor,yieldAmount,cutenessBlurb}

 *                  unlockRank,upgradeOf,cutenessBlurb}
 *   products[]:   {id,name,emoji,basePrice,category,spoilDays,craftedFrom?}
 *   upgrades[]:   {id,name,emoji,cost,effect,description,unlockRank,requires[]}
 *   ranks[]:      {star,name,requiredG,rewardBlurb,unlocksBlurb}

 * rougher display value). Mechanics source of truth = balance.json; display = content.json.

  'use strict';
  var RAW = (Game.RAW && typeof Game.RAW === 'object') ? Game.RAW : { content: {}, balance: {} };
  var C = RAW.content || {};
  var B = RAW.balance || {};

  function byId(arr, key) {
    var m = {};

    return m;
  }

  var cowBreeds = C.cowBreeds || [];
  var otherAnimals = C.animals || [];

  var species = {};

    cowBreedsList: cowBreeds,
    animalsList: otherAnimals,
    cropsList: C.crops || [],
    productsList: C.products || [],
    buildingsList: C.buildings || [],
    upgradesList: C.upgrades || [],
    achievementsList: C.achievements || [],
    eventsList: C.events || [],
    npcsList: C.npcs || [],
    decorationsList: C.decorations || [],
    ranksList: C.ranks || [],

    // ---- keyed maps (for O(1) lookup by id) ----

    animalsById: byId(otherAnimals, 'id'), // non-cow species only
    species: species,                   // everything keepable, by id
    crops: byId(C.crops, 'id'),
    products: byId(C.products, 'id'),
    buildings: byId(C.buildings, 'id'),
    upgrades: byId(C.upgrades, 'id'),
    achievements: byId(C.achievements, 'id'),
    events: byId(C.events, 'id'),
    npcs: byId(C.npcs, 'id'),
    decorations: byId(C.decorations, 'id'),

    production: B.production || {},

    MINUTES_PER_DAY: 1440,
    TICKS_PER_DAY: 1440,
    SIM_HZ: 8,
    REAL_SECONDS_PER_DAY: t.realSecondsPerGameDay || 120,
    SPEEDS: (t.speeds && t.speeds.length ? t.speeds : [1, 2, 3]),
    START_MINUTE: 360, // 06:00 dawn
    PHASES: t.phasesPerDay || { morning: [0, 0.25], day: [0.25, 0.58], evening: [0.58, 0.8], night: [0.8, 1] },
    AMBIENT_LIGHT: t.ambientLight || { morning: 0.72, day: 1, evening: 0.6, night: 0.3 },
    LIGHT_TINT: t.lightTintHint || { morning: '#ffe6c2', day: '#ffffff', evening: '#ffcf99', night: '#3a4a8c' },
    ZOOM_MIN: 0.55,
    ZOOM_MAX: 2.6,
    // Playable world size (vast but performant with culling). One contiguous ranch.
    WORLD_W: 48,
    WORLD_H: 36,
    PLOT_W: (lp.plotSizeTiles && lp.plotSizeTiles[0]) || 16,
    PLOT_H: (lp.plotSizeTiles && lp.plotSizeTiles[1]) || 12,
    // Season display names / colors (art layer may override tints)
    SEASON_NAMES: { spring: '春', summer: '夏', autumn: '秋', winter: '冬' },
    WEATHER_NAMES: { sunny: '晴れ', cloudy: 'くもり', rainy: '雨', snowy: '雪' }
  };

  // Rank net-worth thresholds: balance.costs is authoritative for mechanics.
  DATA.rankNetWorth = (B.costs && B.costs.rankNetWorthThreshold) || { 1: 500, 2: 5000, 3: 30000, 4: 150000, 5: 750000, 6: 3000000, 7: 15000000 };
  DATA.rankTitles = (B.costs && B.costs.rankTitles) || {};
  DATA.referencePrices = (B.costs && B.costs.referencePrices) || {};

  // Generic accessor: Game.DATA.get('crops','corn'), Game.DATA.get('ranks', 3)
  DATA.get = function (category, id) {
    var m = DATA[category];
    if (!m) return undefined;
    if (Array.isArray(m)) {
      for (var i = 0; i < m.length; i++) {
        if (m[i] && (m[i].id === id || m[i].star === id)) return m[i];
      }
      return undefined;
    }
    return m[id];
  };

  DATA.isCow = function (id) { return !!DATA.breeds[id]; };
  DATA.productOf = function (speciesId) {
    var s = DATA.species[speciesId];
    if (!s) return null;
    if (s.isCow) return 'milk';
    return s.product || null;
  };
  DATA.basePrice = function (itemId) {
    var mk = (B.market && B.market.basePrices) || {};
    if (mk[itemId] != null) return mk[itemId];
    var p = DATA.products[itemId];
    if (p && p.basePrice != null) return p.basePrice;
    var cr = DATA.crops[itemId];
    if (cr && cr.sellValue != null) return cr.sellValue;
    return 1;
  };

  // Best-effort deep freeze (data is modest in size).
  function freeze(o) {
    if (o && typeof o === 'object' && !Object.isFrozen(o)) {
      Object.freeze(o);
      var ks = Object.keys(o);
      for (var i = 0; i < ks.length; i++) freeze(o[ks[i]]);
    }
    return o;
  }
  freeze(DATA);
  return DATA;
})();

})();

(function(){
/*
 * util.js — Game.Util helpers + Game.bus (EventBus singleton).
 * No state ownership. Pure helpers. Game.Util.rng() reads/advances
 * Game.state.rngState so gameplay randomness is seeded & deterministic
 * across save/load. (Initial seed generation in state.js is the ONE place
 * Math.random/Date.now are allowed.)

  'use strict';

  // ---------- EventBus ----------
  function makeEventBus() {
    var map = Object.create(null);
    function on(ev, fn) {
      (map[ev] || (map[ev] = [])).push(fn);
      return function unsub() { off(ev, fn); };
    }
    function once(ev, fn) {
      var u = on(ev, function (p) { u(); fn(p); });
      return u;
    }
    function off(ev, fn) {
      var a = map[ev]; if (!a) return;
      var i = a.indexOf(fn); if (i >= 0) a.splice(i, 1);
    }
    function emit(ev, payload) {
      var a = map[ev]; if (!a) return;
      // copy so handlers can unsubscribe during dispatch
      var list = a.slice();
      for (var i = 0; i < list.length; i++) {
        try { list[i](payload); }
        catch (e) {
          if (Game._recordError) Game._recordError('bus:' + ev, e);
          else if (typeof console !== 'undefined') console.error('bus handler error [' + ev + ']', e);
        }
      }

    return { on: on, once: once, off: off, emit: emit, _map: map };
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };

  // module-local cursor before Game.state exists.
  function rng() {
    var s = Game.state;
    var a = s ? (s.rngState >>> 0) : _fallbackSeed;
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    var out = ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    if (s) s.rngState = a >>> 0; else _fallbackSeed = a >>> 0;
    return out;

  function randRange(min, max) { return min + rng() * (max - min); }
  function pick(arr) { return arr[(rng() * arr.length) | 0]; }

    for (var i = a.length - 1; i > 0; i--) { var j = (rng() * (i + 1)) | 0; var tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
    return a;
  }
  // Deterministic hash-based pseudo-random for cosmetic per-entity jitter that
  // must NOT disturb the sim RNG stream (e.g. render sway). Stable per (id,salt).
  function hash01(n, salt) {
    var h = ((n | 0) * 374761393 + (salt | 0) * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- math ----------
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function invLerp(a, b, v) { return b === a ? 0 : (v - a) / (b - a); }
  function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; }
  function aabb(ax, ay, aw, ah, bx, by, bw, bh) { return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by; }
  function approach(cur, target, maxDelta) {
    if (cur < target) return Math.min(cur + maxDelta, target);
    if (cur > target) return Math.max(cur - maxDelta, target);
    return target;
  }

  var ease = {
    linear: function (t) { return t; },
    inOut: function (t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; },
    out: function (t) { return 1 - (1 - t) * (1 - t); },
    in: function (t) { return t * t; },
    outBack: function (t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: function (t) {

      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };

  // ---------- formatting ----------
  function formatG(n) {
    n = Math.round(n || 0);
    var neg = n < 0; if (neg) n = -n;
    var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + s + 'G';
  }
  function formatNum(n) {
    n = Math.round(n || 0);
    var neg = n < 0; if (neg) n = -n;
    return (neg ? '-' : '') + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    min = ((Math.floor(min) % 1440) + 1440) % 1440;

    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;

    if (src == null || typeof src !== 'object') return target;
    Object.keys(src).forEach(function (k) {
      var sv = src[k];
      if (sv && typeof sv === 'object' && !Array.isArray(sv)) {

      } else if (target[k] === undefined) {
        target[k] = Array.isArray(sv) ? sv.slice() : sv;
      }
    });
    return target;
  }

    makeRng: makeRng, rng: rng, randInt: randInt, randRange: randRange,
    pick: pick, chance: chance, shuffle: shuffle, hash01: hash01,
    clamp: clamp, lerp: lerp, invLerp: invLerp, dist2: dist2, aabb: aabb, approach: approach,
    ease: ease,
    formatG: formatG, formatNum: formatNum, formatTime: formatTime,
    uid: uid, deepClone: deepClone, deepMerge: deepMerge
  };
})();

// Singleton event bus used across all modules.
Game.bus = Game.Util.makeEventBus();

})();

 * newGame() returns a COMPLETE initial world as plain data (grid, starter
 * buildings, the free first cow, inventory, market). Module init() methods
 * only wire behavior; they never create starter content.
 *
 * Convention: all modules read the LIVE global `Game.state`. Never cache the
 * state object reference — Save.load()/test.newGame() swap it via State.set().
 */
Game.State = (function () {
  'use strict';
  var U = Game.Util, D = Game.DATA, K = Game.DATA.const;
  var SCHEMA_VERSION = 1;

  function makeSeed() {
    // The one sanctioned use of Math.random/Date.now: pick a fresh master seed.
    var a = (Date.now() >>> 0) ^ ((Math.random() * 0xffffffff) >>> 0);
    return (a >>> 0) || 123456789;
  }

  function makeGrid(w, h) {
    var tiles = new Array(w * h);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        tiles[y * w + x] = {
          terrain: 'grass', buildingId: null, cropId: null,
          walkable: true, fenced: false, unlocked: true, variant: (U.hash01(x * 131 + y * 57, 7) * 4) | 0
        };
      }
    }
    return { w: w, h: h, tiles: tiles };
  }

  function tileIdx(grid, x, y) { return y * grid.w + x; }
  function setTerrainRect(grid, x, y, w, h, terrain, walkable) {
    for (var yy = y; yy < y + h; yy++) for (var xx = x; xx < x + w; xx++) {
      if (xx < 0 || yy < 0 || xx >= grid.w || yy >= grid.h) continue;
      var t = grid.tiles[tileIdx(grid, xx, yy)];
      t.terrain = terrain; if (walkable != null) t.walkable = walkable;
    }
  }

  function placeBuilding(state, type, tx, ty) {
    var b = D.buildings[type]; if (!b) return null;
    var fp = b.footprint || [2, 2], w = fp[0], h = fp[1];
    var id = U.uid(state, 'nextBuildingId');
    var cap = b.capacity || 0;
    var bld = {
      id: id, type: type, tx: tx, ty: ty, w: w, h: h, level: 1,
      capacity: cap, inhabitants: [], storage: {}, progress: 0, builtDay: 1
    };
    state.buildings.push(bld);
    for (var yy = ty; yy < ty + h; yy++) for (var xx = tx; xx < tx + w; xx++) {
      if (xx < 0 || yy < 0 || xx >= state.grid.w || yy >= state.grid.h) continue;
      var t = state.grid.tiles[tileIdx(state.grid, xx, yy)];
      t.buildingId = id; t.walkable = false; if (t.terrain === 'grass') t.terrain = 'dirt';
    }
    return bld;
  }

  function unlockedFor(rank) {
    function ids(list) { return (list || []).filter(function (o) { return (o.unlockRank || 1) <= rank; }).map(function (o) { return o.id; }); }
    return {
      buildings: ids(D.buildingsList),
      animals: ids(D.cowBreedsList).concat(ids(D.animalsList)),
      crops: (D.cropsList || []).map(function (c) { return c.id; }) // crops gated by season, all buyable
    };
  }

  function newGame(seed) {
    seed = (seed >>> 0) || makeSeed();
    var start = D.startSpec || {};
    var W = K.WORLD_W, H = K.WORLD_H;

    var state = {
      version: SCHEMA_VERSION,
      seed: seed,
      rngState: seed,
      createdAt: Date.now(),
      playtimeMs: 0,

      money: start.money != null ? start.money : 500,
      rank: 1,
      rankXp: 0,

      tick: 0,
      minuteOfDay: K.START_MINUTE,
      day: 1,
      dayOfSeason: 1,
      season: start.season || 'spring',
      year: start.year || 1,
      weather: start.weather || 'sunny',
      weatherTicksLeft: 0,

      grid: makeGrid(W, H),
      buildings: [],
      nextBuildingId: 1,

      crops: [],
      nextCropId: 1,

      animals: [],
      nextAnimalId: 1,

      inventory: {},
      seeds: {},

      market: { prices: {}, trend: {}, index: {}, glut: {}, lastUpdateDay: 1, history: {} },

      upgrades: {},
      unlocked: unlockedFor(1),
      research: 0,

      buffs: [],           // temporary event buffs: {target, mult, add, daysLeft, label}
      loan: { principal: 0 },
      lastStipendDay: -99,

      goals: {},
      achievements: {},

      tutorial: { active: true, step: 0, seen: {} },

      settings: {
        master: 0.8, sfx: 0.9, music: 0.5, muted: false,
        speed: 1, showParticles: true, reduceMotion: false, lang: 'ja'
      },
      paused: false,

      camera: { x: 0, y: 0, zoom: 1 },

      stats: {
        totalEarned: 0, totalSpent: 0, totalSales: 0, animalsBorn: 0,
        cropsHarvested: 0, itemsSold: 0, buildingsBuilt: 0, daysPlayed: 0,
        totalMilk: 0, totalCheese: 0, totalEggs: 0, totalTruffle: 0,
        totalWool: 0, totalPets: 0, maxAnimals: 1
      },

      flags: {}            // misc one-shot flags (event onceOnly, etc.)
    };

    // --- terrain flavor: a pond + a couple of paths (cosmetic, still cute) ---
    var pondX = Math.floor(W * 0.62), pondY = Math.floor(H * 0.30);
    setTerrainRect(state.grid, pondX, pondY, 3, 2, 'water', false);

    // --- starter buildings, spaced so typical footprints (<=4) never collide ---
    var cx = Math.floor(W * 0.30), cy = Math.floor(H * 0.42);
    var layout = [
      { type: 'house', tx: cx, ty: cy },
      { type: 'barn', tx: cx + 6, ty: cy },
      { type: 'market_stall', tx: cx, ty: cy + 6 },
      { type: 'pasture', tx: cx + 6, ty: cy + 6 }
    ];
    var barn = null;
    layout.forEach(function (L) {
      var b = placeBuilding(state, L.type, L.tx, L.ty);
      if (b && L.type === 'barn') barn = b;
    });
    // a little dirt path between house and barn
    setTerrainRect(state.grid, cx + 3, cy + 1, 3, 1, 'path', true);

    // --- the free first cow (adult), living in the barn ---
    var cowStats = start.startingCowStats || { hunger: 85, happiness: 70, health: 85, cleanliness: 80, temperament: 52, ageDays: 30 };
    var breedId = start.startingCow || 'holstein';
    var homeId = barn ? barn.id : null;
    var spawnTx = barn ? barn.tx + barn.w + 1 : cx + 8;
    var spawnTy = barn ? barn.ty + 1 : cy + 1;
    var cow = makeAnimal(state, breedId, spawnTx, spawnTy, {
      adult: true, ageDays: cowStats.ageDays || 30, name: 'モモ', sex: 'f',
      homeBuildingId: homeId, needs: {
        hunger: cowStats.hunger, happiness: cowStats.happiness,
        health: cowStats.health, cleanliness: cowStats.cleanliness
      }, temperament: cowStats.temperament
    });
    if (barn) barn.inhabitants.push(cow.id);

    // --- starting inventory & seeds ---
    var sf = start.startingFeed || { hay: 6 };
    Object.keys(sf).forEach(function (k) { state.inventory[k] = (state.inventory[k] || 0) + sf[k]; });
    var ss = start.startingSeeds || { grass: 8, carrot: 2, turnip: 2 };
    Object.keys(ss).forEach(function (k) { state.seeds[k] = (state.seeds[k] || 0) + ss[k]; });

    // --- seed market prices at index 1.0 from base prices ---
    var bp = (D.market && D.market.basePrices) || {};
    Object.keys(bp).forEach(function (id) {
      state.market.prices[id] = bp[id];
      state.market.index[id] = 1.0;
      state.market.trend[id] = 0;
      state.market.glut[id] = 0;
      state.market.history[id] = [bp[id]];
    });

    // --- achievements map (all locked) ---
    (D.achievementsList || []).forEach(function (a) { state.achievements[a.id] = null; });

    // camera centered on the starter cluster (world units)
    state.camera.x = (cx - 4) * K.TILE;
    state.camera.y = (cy - 3) * K.TILE;
    state.camera.zoom = 1;

    return state;
  }

  // Build a bare animal record (used by newGame and Animals.spawn).
  function makeAnimal(state, breedId, tx, ty, opts) {
    opts = opts || {};
    var sp = D.species[breedId] || {};
    var id = U.uid(state, 'nextAnimalId');
    var needs = opts.needs || { hunger: 80, happiness: 65, health: 80, cleanliness: 78 };
    var itemId = D.productOf(breedId);
    var a = {
      id: id, breed: breedId, species: sp.species || (sp.isCow ? 'cow' : breedId),
      name: opts.name || defaultName(breedId, id),
      tx: tx, ty: ty, x: (tx + 0.5) * K.TILE, y: (ty + 0.5) * K.TILE,
      ageDays: opts.ageDays != null ? opts.ageDays : 0,
      adult: opts.adult != null ? opts.adult : false,
      sex: opts.sex || (U.chance(0.5) ? 'f' : 'm'),
      temperament: opts.temperament != null ? opts.temperament : 50,
      traits: opts.traits || [],
      needs: {
        hunger: needs.hunger, happiness: needs.happiness,
        health: needs.health, cleanliness: needs.cleanliness
      },
      lastFeedQuality: 0.3,
      petBonus: 0,
      production: { ready: false, itemId: itemId, amount: 0, cooldownDays: 0, cycleProgress: 0 },
      pregnant: false, gestationDaysLeft: 0, mateBreed: null, cooldownDaysLeft: 0,
      homeBuildingId: opts.homeBuildingId != null ? opts.homeBuildingId : null,
      ai: { mode: 'idle', targetTx: null, targetTy: null, blinkTimer: U.randRange(1, 5), hopPhase: U.randRange(0, 6.28), moveCd: U.randRange(1, 4), facing: 1 }
    };
    state.animals.push(a);
    return a;
  }

  var NAME_POOL = ['モモ', 'ミルク', 'ハナ', 'そら', 'こむぎ', 'だいふく', 'マロン', 'ぷりん', 'きなこ', 'あんこ', 'ゆき', 'ちょこ', 'まめ', 'くり', 'ラテ', 'もち', 'すず', 'こはる', 'ひなた', 'つき'];
  function defaultName(breedId, id) {
    return NAME_POOL[id % NAME_POOL.length];
  }

  function set(stateObj) { Game.state = stateObj; return Game.state; }
  function defaults() { return newGame(1); }

  return {
    SCHEMA_VERSION: SCHEMA_VERSION,
    newGame: newGame,
    makeAnimal: makeAnimal,
    placeBuilding: placeBuilding,
    unlockedFor: unlockedFor,
    defaultName: defaultName,
    set: set,
    defaults: defaults
  };
})();

})();

/* ======================= module: save ======================= */
(function(){
/*
 * save.js — Game.Save: localStorage persistence, migration, autosave.
 * Degrades gracefully to in-memory if localStorage is unavailable (sandboxed
 * iframes sometimes block it). Never throws to callers.
 */
Game.Save = (function () {
  'use strict';
  var U = Game.Util;
  var PREFIX = 'makiba.save.v1.slot';
  var SETTINGS_KEY = 'makiba.settings';
  var _mem = {};        // in-memory fallback store
  var _lsOk = null;     // cached availability

  function ls() {
    if (_lsOk === false) return null;
    try {
      var k = '__makiba_probe__';
      window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k);
      _lsOk = true; return window.localStorage;
    } catch (e) { _lsOk = false; return null; }
  }
  function readRaw(key) { var s = ls(); try { return s ? s.getItem(key) : (_mem[key] || null); } catch (e) { return _mem[key] || null; } }
  function writeRaw(key, val) { var s = ls(); try { if (s) s.setItem(key, val); else _mem[key] = val; } catch (e) { _mem[key] = val; } }
  function removeRaw(key) { var s = ls(); try { if (s) s.removeItem(key); else delete _mem[key]; } catch (e) { delete _mem[key]; } }

  function keyFor(slot) { return PREFIX + (slot || 0); }

  function serialize(state) {
    var wrapper = { v: Game.State.SCHEMA_VERSION, t: Date.now(), state: state };
    return JSON.stringify(wrapper);
  }
  function deserialize(str) {
    var w = JSON.parse(str);
    return w;
  }

  // migrations[from] = function(state)->state, applied until v === SCHEMA_VERSION
  var migrations = {};

  function migrate(wrapper) {
    var v = wrapper.v || 1;
    while (v < Game.State.SCHEMA_VERSION) {
      var m = migrations[v];
      if (!m) { v = Game.State.SCHEMA_VERSION; break; }
      wrapper.state = m(wrapper.state);
      v++;
      wrapper.v = v;
    }
    return wrapper;
  }

  function save(slot) {
    slot = slot || 0;
    try {
      var str = serialize(Game.state);
      writeRaw(keyFor(slot), str);
      saveSettings();
      Game.bus.emit('save', { slot: slot, version: Game.State.SCHEMA_VERSION });
      return true;
    } catch (e) {
      if (Game._recordError) Game._recordError('save', e);
      return false;
    }
  }

  function load(slot) {
    slot = slot || 0;
    var raw = readRaw(keyFor(slot));
    if (!raw) return false;
    try {
      var w = deserialize(raw);
      if (!w || !w.state) return false;
      if (w.v > Game.State.SCHEMA_VERSION) { return false; } // newer save: refuse, keep current
      w = migrate(w);
      // backfill any missing top-level keys from a fresh default
      var merged = U.deepMerge(w.state, Game.State.defaults());
      Game.State.set(merged);
      Game.bus.emit('load', { slot: slot, version: w.v });
      Game.bus.emit('state:replaced', { reason: 'load' });
      return true;
    } catch (e) {
      if (Game._recordError) Game._recordError('load', e);
      return false;
    }
  }

  function hasSave(slot) { return !!readRaw(keyFor(slot || 0)); }
  function deleteSave(slot) { removeRaw(keyFor(slot || 0)); }

  function saveSettings() {
    try { if (Game.state && Game.state.settings) writeRaw(SETTINGS_KEY, JSON.stringify(Game.state.settings)); } catch (e) { }
  }
  function loadSettings() {
    var raw = readRaw(SETTINGS_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  var _autosaveDays = 1, _autosaveArmed = false, _lastAutosaveDay = 0;
  function enableAutosave(days) {
    _autosaveDays = days || 1;
    if (_autosaveArmed) return;
    _autosaveArmed = true;
    Game.bus.on('day:advance', function (p) {
      if ((p.day - _lastAutosaveDay) >= _autosaveDays) { _lastAutosaveDay = p.day; save(0); }
    });
    try {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') save(0);
      });
    } catch (e) { }
  }

  function exportString() {
    try { return btoa(unescape(encodeURIComponent(serialize(Game.state)))); }
    catch (e) { return ''; }
  }
  function importString(b64) {
    try {
      var str = decodeURIComponent(escape(atob(b64)));
      var w = migrate(deserialize(str));
      if (!w || !w.state) return false;
      Game.State.set(U.deepMerge(w.state, Game.State.defaults()));
      Game.bus.emit('state:replaced', { reason: 'import' });
      return true;
    } catch (e) { return false; }
  }

  function init() { /* nothing at init; boot decides load-or-new */ }

  return {
    init: init, save: save, load: load, hasSave: hasSave, deleteSave: deleteSave,
    serialize: serialize, deserialize: deserialize, migrate: migrate,
    enableAutosave: enableAutosave, exportString: exportString, importString: importString,
    saveSettings: saveSettings, loadSettings: loadSettings, migrations: migrations
  };
})();

})();

/* ======================= module: time ======================= */
(function(){
/*
 * time.js — Game.Time: the game clock.
 * Owns: tick, minuteOfDay, day, dayOfSeason, season, year, weather.
 * step(minutes) advances the clock and, on each day rollover, rolls weather
 * then emits 'day:advance' (and 'season:change'/'weather:change'). ALL heavy
 * simulation lives in day:advance handlers (see dailyTick order), so advancing
 * many days at once (fast-forward / test.advanceDays) is exact and deterministic.
 */
Game.Time = (function () {
  'use strict';
  var U = Game.Util, D = Game.DATA, K = Game.DATA.const;
  var bus = Game.bus;

  function clock() {
    var s = Game.state;
    return { minuteOfDay: s.minuteOfDay, day: s.day, dayOfSeason: s.dayOfSeason, season: s.season, year: s.year, weather: s.weather };
  }

  function phaseAt(minuteOfDay) {
    var t = (minuteOfDay % 1440) / 1440;
    var P = K.PHASES;
    if (t < P.morning[1]) return 'morning';
    if (t < P.day[1]) return 'day';
    if (t < P.evening[1]) return 'evening';
    return 'night';
  }
  function isNight() { return phaseAt(Game.state.minuteOfDay) === 'night'; }

  // Smooth 0..1 light level interpolated across phase ambient values.
  function lightLevel() {
    var s = Game.state, amb = K.AMBIENT_LIGHT;
    var t = (s.minuteOfDay % 1440) / 1440;
    // control points (fraction -> light)
    var pts = [
      [0.00, amb.night], [0.03, amb.night], [0.10, amb.morning], [0.25, amb.day],
      [0.55, amb.day], [0.66, amb.evening], [0.83, amb.night], [1.00, amb.night]
    ];
    for (var i = 0; i < pts.length - 1; i++) {
      if (t >= pts[i][0] && t <= pts[i + 1][0]) {
        var f = U.invLerp(pts[i][0], pts[i + 1][0], t);
        return U.lerp(pts[i][1], pts[i + 1][1], f);
      }
    }
    return amb.day;
  }

  function rollWeather() {
    var s = Game.state;
    var odds = (D.weatherModel && D.weatherModel.oddsBySeason && D.weatherModel.oddsBySeason[s.season]) || { sunny: 1 };
    var r = U.rng(), acc = 0, chosen = 'sunny';
    var keys = Object.keys(odds);
    for (var i = 0; i < keys.length; i++) { acc += odds[keys[i]]; if (r <= acc) { chosen = keys[i]; break; } }
    return chosen;
  }
  function setWeather(w) {
    var s = Game.state, prev = s.weather;
    s.weather = w;
    if (w !== prev) bus.emit('weather:change', { weather: w, prev: prev });
  }

  function advanceDay() {
    var s = Game.state;
    s.day += 1;
    s.dayOfSeason += 1;
    var seasonChanged = false;
    if (s.dayOfSeason > K.DAYS_PER_SEASON) {
      s.dayOfSeason = 1;
      var order = K.SEASON_ORDER;
      var idx = order.indexOf(s.season);
      idx = (idx + 1) % order.length;
      s.season = order[idx];
      if (idx === 0) s.year += 1;
      seasonChanged = true;
    }
    // roll tomorrow's weather BEFORE day handlers so crops see today's water, etc.
    setWeather(rollWeather());
    if (seasonChanged) bus.emit('season:change', { season: s.season, year: s.year });
    bus.emit('day:advance', { day: s.day, dayOfSeason: s.dayOfSeason, season: s.season, year: s.year });
  }

  // Advance the clock by `minutes` game-minutes (may be fractional / large).
  function step(minutes) {
    var s = Game.state;
    if (!minutes || minutes <= 0) return;
    s.tick += minutes;
    var prevPhase = phaseAt(s.minuteOfDay);
    s.minuteOfDay += minutes;
    // handle day rollovers (supports large jumps for fast-forward)
    var guard = 0;
    while (s.minuteOfDay >= 1440) {
      s.minuteOfDay -= 1440;
      advanceDay();
      if (++guard > 3650) { s.minuteOfDay = s.minuteOfDay % 1440; break; } // 10-year safety
    }
    var newPhase = phaseAt(s.minuteOfDay);
    if (newPhase !== prevPhase) {
      if (newPhase === 'night') bus.emit('night:fall', { minuteOfDay: s.minuteOfDay });
      else if (prevPhase === 'night') bus.emit('day:break', { minuteOfDay: s.minuteOfDay });
    }
    bus.emit('tick', { tick: s.tick, dt: minutes });
  }

  function init() { /* clock state comes from newGame/load */ }

  return {
    init: init, step: step, clock: clock,
    isNight: isNight, phaseAt: phaseAt, lightLevel: lightLevel,
    rollWeather: rollWeather, setWeather: setWeather, advanceDay: advanceDay
  };
})();

})();

/* ======================= module: economy ======================= */
(function(){
/*
 * economy.js — Game.Economy: the economic heart of まきばのしずく.
 *
 * Owns: money, rank, rankXp, inventory, seeds, market, upgrades, unlocked,
 *       goals, achievements, stats, buffs, loan, research, lastStipendDay, flags.
 *
 * Daily model (see architecture §4 / brief §0.7):
 *   - Handler A (updateMarket) is registered in init() so it is the FIRST
 *     day:advance subscriber -> runs before Crops/Animals.
 *   - Handler B (processing, overflow, events, goals, achievements, rank-up,
 *     stipend, buff decay) is bound on 'game:ready' so it runs AFTER Crops and
 *     Animals have taken their day:advance turn (canonical order).
 *
 * All money flows through debit/credit; all inventory through addItem/removeItem.
 * Every cross-module reference (World/Animals/Time) is looked up lazily and
 * null-guarded. All randomness uses Game.Util.rng.
 */
Game.Economy = (function () {
  'use strict';

  var U = Game.Util, D = Game.DATA, bus = Game.bus;
  var K = D.const;

  // ---- convenience live-state accessor (NEVER cache the object) ----
  function S() { return Game.state; }

  // Additive-natured upgrade/buff targets (base 0, tokens sum). Everything else
  // is treated multiplicatively (base 1, '*' tokens multiply).
  var ADDITIVE_TARGETS = {
    priceBonus: 0, capacity: 0, processSlots: 0, autoCollectRadius: 0,
    waterRadius: 0, offspringQuality: 0, coldResist: 0, heatResist: 0,
    allHappiness: 0, milkQuality: 0, research: 0
  };

  // Targets that legacy event effect-strings map onto as temporary buffs read
  // back through upgradeMult() by other modules (milk/egg/crop yield etc.).
  var YIELD_BUFF_TARGETS = {
    milkYield: 1, allYield: 1, eggYield: 1, woolYield: 1, goatMilkYield: 1,
    truffleYield: 1, cropYield: 1, cropGrow: 1, dairyYield: 1, feedCost: 1,
    shopDiscount: 1, happinessGain: 1, feedProduction: 1
  };

  var _effectCache = {};   // upgrade effect string -> parsed token array
  var _dailyBound = false; // guard so Handler B binds exactly once
  var _pendingEvents = {}; // id -> event def awaiting resolveEvent()

  // ------------------------------------------------------------------
  //  Effect / condition mini-language parsing
  // ------------------------------------------------------------------

  function parseToken(tok) {

    return { target: tok, op: null, val: null, bare: true, raw: tok };

    if (effect == null) return [];
    if (Array.isArray(effect)) {
      return effect.map(parseToken).filter(Boolean);
    }
    var key = String(effect);
    if (_effectCache[key]) return _effectCache[key];
    var out = key.split(',').map(parseToken).filter(Boolean);

    return out;
  }

  //  Notifications / particle helpers
  // ------------------------------------------------------------------
  function notify(text, kind, icon, ttl) {

    catch (e) { Game._recordError('economy.notify', e); }

  // ------------------------------------------------------------------
  //  Money
  // ------------------------------------------------------------------

  function debit(amount, reason) {

    if ((s.money || 0) < amount) return false; // graceful fail; never overdraw
