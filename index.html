<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>教習所トレーナー（運転席モード）</title>
<style>
  :root{ --bg:#0d1118; --panel:#161c28; --panel2:#1d2534; --ink:#e8edf6; --sub:#93a1b8;
    --ok:#37d67a; --warn:#ffb020; --bad:#ff5c5c; --accent:#4da3ff; --accent2:#7c5cff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;}
  #app{position:relative; width:100%; height:100%; overflow:hidden; background:#0a1220;}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block;}
  /* 上部バー */
  #topbar{position:absolute; top:0; left:0; right:0; height:28px; display:flex; align-items:center; gap:5px; padding:3px 8px; z-index:8; pointer-events:none;}
  #topbar .t{font-size:11px; font-weight:700; background:rgba(12,18,28,.6); padding:2px 6px; border-radius:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:30%;}
  #topbar button{pointer-events:auto; background:#26304a; color:var(--ink); border:0; border-radius:6px; padding:4px 7px; font-size:10.5px; font-weight:700; white-space:nowrap;}
  #topbar button.on{background:var(--accent); color:#04101f;} #topbar button.menu{background:var(--accent2); color:#fff;} #topbar .sp{flex:1;}
  #btnExam.on{background:#ff8b3d; color:#241000;}
  .mir.checked{border-color:var(--ok); box-shadow:0 0 8px rgba(55,214,122,.7);}
  /* 結果パネル */
  #resultPanel{position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:40; background:rgba(5,8,14,.6);}
  #resultPanel.show{display:flex;}
  #resultPanel .box{width:min(92%,410px); max-height:92%; overflow:auto; background:#141a26; border:1px solid #2b364d; border-radius:14px; padding:13px 16px;}
  #resultPanel h3{margin:0 0 2px; font-size:18px;}
  #resultPanel h3.pass{color:var(--ok);} #resultPanel h3.fail{color:var(--bad);}
  #resultPanel .score{font-size:12.5px; color:var(--sub); margin-bottom:6px;}
  #resultPanel ul{margin:5px 0; padding-left:18px; font-size:12px; line-height:1.55;}
  #resultPanel .sec-t{font-size:11px; color:var(--sub); font-weight:700; margin-top:7px;}
  #resultPanel .adv{font-size:12px; color:var(--warn); margin:6px 0 0;}
  #resultPanel .btns{display:flex; gap:8px; margin-top:11px;}
  #resultPanel .btns button{flex:1; border:0; border-radius:9px; padding:10px 0; font-weight:800; background:var(--accent); color:#04101f;}
  #resultPanel .btns button.sec{background:#26304a; color:var(--ink);}
  /* フロントガラス視界（上帯）。ミラーは実車と同じくこの中に重ねる */
  #frontBox{position:absolute; top:28px; left:0; right:0; height:40%; z-index:5; overflow:hidden; background:#000; border-bottom:2px solid #05070b;}
  #frontBox canvas{display:block; width:100%; height:100%;}
  #frontBox .flab{position:absolute; left:6px; bottom:3px; font-size:9px; color:#9fb0c8; background:rgba(0,0,0,.45); padding:0 3px; border-radius:3px;}
  /* ミラー（フロント視界内：左右下隅＋上中央） */
  .mir{position:absolute; width:148px; height:66px; background:#000; border:1px solid #2b364d; border-radius:8px; overflow:hidden; z-index:6; touch-action:none;}
  #mirLbox{left:6px; top:calc(28px + 40% - 72px);} #mirRbox{right:6px; top:calc(28px + 40% - 72px);}
  #mirCbox{left:50%; transform:translateX(-50%); width:198px; height:58px; top:32px;}
  .mir .lab{font-size:10px;}
  .mir canvas{display:block; width:100%; height:100%;}
  .mir .lab{position:absolute; left:4px; top:2px; font-size:9px; color:#9fb0c8; background:rgba(0,0,0,.45); padding:0 3px; border-radius:3px;}
  .mir .adj{position:absolute; right:4px; bottom:2px; font-size:8px; color:#8fa0b8;}
  /* 速度・ギア（フロント視界の下端中央＝ダッシュ計器） */
  #spd{position:absolute; top:calc(28px + 37% - 32px); left:50%; transform:translateX(-50%); z-index:6; background:rgba(18,22,30,.88); border:1px solid #2b364d; border-radius:9px; padding:2px 11px; display:flex; align-items:baseline; gap:9px;}
  #spd .kmh{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
  #spd .u{font-size:9px; color:var(--sub);}
  #spd .gear b{font-size:13px; font-weight:800; color:#3b4560; margin:0 1px;} #spd .gear b.act{color:var(--accent);}
  /* コーチ（下中央） */
  #coach{position:absolute; left:50%; transform:translateX(-50%); bottom:6px; max-width:44%; text-align:center; z-index:6; pointer-events:none;}
  #coach .msg{display:inline-block; font-size:12.5px; font-weight:700; background:rgba(12,18,28,.86); border:1px solid #2b364d; border-radius:9px; padding:5px 10px;}
  .msg.ok{color:var(--ok);border-color:var(--ok);} .msg.warn{color:var(--warn);border-color:var(--warn);} .msg.bad{color:var(--bad);border-color:var(--bad);}
  /* 左親指：サイド/目視＋ペダル */
  #leftCluster{position:absolute; left:8px; bottom:8px; width:172px; z-index:9;}
  #prep{display:flex; gap:6px; margin-bottom:6px;}
  #prep button{flex:1; height:32px; border:0; border-radius:8px; background:var(--panel2); color:var(--ink); font-weight:800; font-size:11.5px;}
  #handbrake.on{background:#c2333f; color:#fff;}
  #lookback:active{background:var(--accent); color:#04101f;}
  #pedals{display:flex; gap:6px;}
  .pedal{flex:1; height:96px; border:0; border-radius:12px; font-weight:800; font-size:14px; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .pedal.brake{background:#7a2530;} .pedal.brake.held{background:var(--bad); transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  .pedal.accel{background:#1f5a37;} .pedal.accel.held{background:var(--ok); color:#04101f; transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  /* 右親指：シフト＋ハンドル */
  #rightCluster{position:absolute; right:8px; bottom:8px; display:flex; flex-direction:row; align-items:flex-end; gap:8px; z-index:9;}
  #shifter{display:flex; flex-direction:column; gap:5px; width:50px;}
  #shifter button{height:40px; border:0; border-radius:8px; background:var(--panel2); color:var(--sub); font-weight:800; font-size:15px;}
  #shifter button.act{background:var(--accent); color:#04101f;}
  #wheelBox{display:flex; flex-direction:column; align-items:center; gap:4px;}
  #recenter{background:#26304a; color:var(--ink); border:0; border-radius:8px; padding:5px 11px; font-size:11px; font-weight:700;}
  #wheel{touch-action:none; display:block;}
  /* メニュー */
  #menu{position:fixed; inset:0; background:#0b0f17; display:none; flex-direction:column; gap:10px; padding:14px 16px; overflow:auto; z-index:30;}
  #menu.show{display:flex;} #menu h2{margin:2px 0 0; font-size:16px;}
  #menu p.lead{margin:0; color:var(--sub); font-size:11.5px;}
  .cards{display:flex; gap:10px; flex-wrap:wrap;}
  .card{flex:1 1 200px; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid #2b364d; border-radius:12px; padding:10px; text-align:left;}
  .card:active{border-color:var(--accent);}
  .card canvas{width:46px;height:46px;flex:0 0 46px;} .card .t{font-size:14px;font-weight:800;} .card .d{font-size:11px;color:var(--sub);margin-top:2px;}
  #menu .close{align-self:center; background:#26304a; color:var(--ink); border:0; border-radius:9px; padding:9px 20px; font-weight:700;}
  #rotate{position:fixed; inset:0; background:#0d1118; color:var(--ink); display:none; align-items:center; justify-content:center; text-align:center; z-index:50; font-size:15px; padding:24px;}
  @media (orientation:portrait){ #rotate{display:flex;} }
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="topbar">
    <button class="menu" id="btnMenu">≡課題</button>
    <span class="t" id="title">方向転換（右バック）</span>
    <span class="sp"></span>

  <div id="frontBox"><canvas id="frontCv"></canvas><span class="flab">フロント</span></div>
  <div class="mir" id="mirLbox"><canvas id="mirL"></canvas><span class="lab">左ミラー</span><span class="adj">調整:ドラッグ</span></div>
  <div class="mir" id="mirRbox"><canvas id="mirR"></canvas><span class="lab">右ミラー</span><span class="adj">調整:ドラッグ</span></div>
  <div class="mir" id="mirCbox"><canvas id="mirC"></canvas><span class="lab">ルームミラー</span></div>

  </div></div>

    <div class="cards">
      <button class="card" data-id="perpR"><canvas data-ico="perpR"></canvas><div><div class="t">方向転換（右バック）</div><div class="d">右のポケットへ後退</div></div></button>
      <button class="card" data-id="perpL"><canvas data-ico="perpL"></canvas><div><div class="t">方向転換（左バック）</div><div class="d">左のポケットへ後退</div></div></button>
      <button class="card" data-id="parallel"><canvas data-ico="parallel"></canvas><div><div class="t">縦列駐車</div><div class="d">S字で切り返し</div></div></button>
    </div>
    <p class="lead">※ コース寸法は仮の標準値。教習車＝マツダ アクセラ セダン想定。実寸で本人仕様に。</p>
    <button class="close" id="menuClose">閉じる</button>
  </div>
</div>
<div id="rotate">📱 横向き（ランドスケープ）にしてください</div>

<script>
"use strict";
const DEG=Math.PI/180;

/* ==================== CONFIG（実寸に差し替え可） ==================== */
const CONFIG={
  car:{ length:4.58, width:1.795, wheelbase:2.70, frontOverhang:0.92, track:1.54,
        maxSteerDeg:36, steerPlayDeg:8, creep:0.55, maxSpeed:1.9 },
  perp:{ bayWidth:3.0, bayDepth:5.5, turninX:6.0 },
  parallel:{ approachY:3.2, turninX:8.0, theta1Deg:42, slotDepth:2.5, parkedLen:4.5,
             parkedW:1.75, curbGap:0.25, frontClear:2.0, rearClear:0.5, bayPad:0.4 }
};
const C=CONFIG.car; C.rearOverhang=C.length-C.wheelbase-C.frontOverhang;
const MAXSTEER=C.maxSteerDeg*DEG;
const WHEEL_LOCK=1.375*2*Math.PI;  // ロック・トゥ・ロック2.75回転（アクセラ実車相当。片側約1.4回転）
const WHEEL_PLAY=(C.steerPlayDeg||0)*DEG; // ハンドルの遊び（実車の感覚）

/* ==================== 物理・車体 ==================== */
function bicycle(s,dt){ s.x+=s.v*Math.cos(s.th)*dt; s.y+=s.v*Math.sin(s.th)*dt; s.th+=(s.v/C.wheelbase)*Math.tan(s.steer)*dt; }
function carCorners(s){ const c=Math.cos(s.th),sn=Math.sin(s.th),fx=C.wheelbase+C.frontOverhang,rx=-C.rearOverhang,hw=C.width/2;
  return [[fx,hw],[fx,-hw],[rx,-hw],[rx,hw]].map(([lx,ly])=>({x:s.x+lx*c-ly*sn,y:s.y+lx*sn+ly*c})); }
function toWorld(s,lx,ly){ const c=Math.cos(s.th),sn=Math.sin(s.th); return {x:s.x+lx*c-ly*sn,y:s.y+lx*sn+ly*c}; }
function wheelPositions(s){ const t=C.track/2; return {
  FL:toWorld(s,C.wheelbase,+t), FR:toWorld(s,C.wheelbase,-t), RL:toWorld(s,0,+t), RR:toWorld(s,0,-t) }; }
const POLE_R=0.06;
function carPerimeter(s,step=0.25){ const cs=carCorners(s), pts=[];
  for(let i=0;i<4;i++){ const a=cs[i], b=cs[(i+1)%4], d=Math.hypot(b.x-a.x,b.y-a.y), n=Math.max(1,Math.ceil(d/step));
    for(let k=0;k<n;k++) pts.push({x:a.x+(b.x-a.x)*k/n, y:a.y+(b.y-a.y)*k/n}); }
  return pts; }
function poleHit(s){ const c=Math.cos(s.th),sn=Math.sin(s.th);
  for(const p of M.poles){ const dx=p.x-s.x,dy=p.y-s.y, u=dx*c+dy*sn, v=-dx*sn+dy*c;
    const cu=clamp(u,-C.rearOverhang,C.wheelbase+C.frontOverhang), cv=clamp(v,-C.width/2,C.width/2);
    if(Math.hypot(u-cu,v-cv)<POLE_R) return true; } return false; }
function driverMirror(s,side){ return toWorld(s, C.wheelbase*0.55, (side==='L'?+1:-1)*(C.width/2+0.12)); }
function normAng(a){ a=(a+Math.PI)%(2*Math.PI); if(a<0)a+=2*Math.PI; return a-Math.PI; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function alignedV(th){ return Math.min(Math.abs(normAng(th-Math.PI/2)),Math.abs(normAng(th+Math.PI/2)))<10*DEG; }
function alignedH(th){ return Math.abs(normAng(th))<10*DEG; }
function rect(x0,y0,x1,y1){ return {x0:Math.min(x0,x1),y0:Math.min(y0,y1),x1:Math.max(x0,x1),y1:Math.max(y0,y1)}; }
function inRect(r,x,y){ return x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1; }

/* ==================== 課題ビルダー（検証済み） ==================== */
function buildPerpR(){
  const P=CONFIG.perp, APP_Y=C.width/2+0.60, TX=P.turninX;   // ポールラインから60cm離して進入（実車の寄せ方）
  const s={x:TX,y:APP_Y,th:0,steer:-MAXSTEER,v:-C.creep}; const path=[{x:s.x,y:s.y,th:s.th}]; let n=0;
  while(n++<8000){ bicycle(s,0.01); path.push({x:s.x,y:s.y,th:s.th}); if(s.th>=Math.PI/2)break; }
  const end={...s};
  // 車体外周のスイープ包絡線からポケット寸法を決める（余裕0.3m＝実コース同様、擦らず入る設計）
  let sMaxY=-1e9,sMaxX=-1e9,sMinX=1e9, mouthMaxX=-1e9, pMinX=1e9, pMinY=1e9;
  for(const p of path)for(const c of carPerimeter(p,0.2)){
    if(c.y>sMaxY)sMaxY=c.y; if(c.x>sMaxX)sMaxX=c.x; if(c.x<sMinX)sMinX=c.x;
    if(c.y<0){ pMinX=Math.min(pMinX,c.x); pMinY=Math.min(pMinY,c.y); }
    if(c.y<0.30&&c.y>-0.35){ const yy=Math.min(0.09,c.y*c.y); mouthMaxX=Math.max(mouthMaxX,c.x+Math.sqrt(0.09-yy)); } }
  const bayX1=mouthMaxX, bayX0=Math.min(pMinX-0.30, bayX1-P.bayWidth);
  const bayDepth=Math.max(P.bayDepth, -pMinY+0.5);
  const aisleY1=Math.max(APP_Y+C.width/2+0.8,sMaxY+0.4), aX0=Math.min(-1.2,sMinX-0.4), aX1=Math.max(TX+(C.wheelbase+C.frontOverhang)+0.8,sMaxX+0.4);
  return { id:'perpR', title:'方向転換（右バック）', lockLabel:'右', successKind:'perp', turnRefX:TX, appY:APP_Y,
    rects:[rect(aX0,0,aX1,aisleY1),rect(bayX0,-bayDepth,bayX1,0)], obstacles:[],
    bay:rect(bayX0,-bayDepth,bayX1,0), poles:[{x:bayX0,y:0},{x:bayX1,y:0}], parkedCars:[], curbY:null,
    ideal:{path,end}, start:{x:Math.max(0.6,aX0+C.rearOverhang+0.5),y:APP_Y,th:0},
    coach:'前進(D)で青ラインまで→止まって、後退(R)＋右いっぱいでポケットへ' };
}
function reflectModel(m){ const A=m.appY, ry=y=>2*A-y, rr=r=>rect(r.x0,ry(r.y0),r.x1,ry(r.y1)), rp=p=>({x:p.x,y:ry(p.y),th:-p.th});
  return { id:'perpL', title:'方向転換（左バック）', lockLabel:'左', successKind:'perp', turnRefX:m.turnRefX, appY:A,
    rects:m.rects.map(rr), obstacles:[], bay:rr(m.bay), poles:m.poles.map(p=>({x:p.x,y:ry(p.y)})), parkedCars:[], curbY:null,
    ideal:{path:m.ideal.path.map(rp), end:rp(m.ideal.end)}, start:rp(m.start),
    coach:m.coach.replace('右いっぱい','左いっぱい') }; }
function buildParallel(){
  const P=CONFIG.parallel, TX=P.turninX, th1=P.theta1Deg*DEG;
  const s={x:TX,y:P.approachY,th:0,steer:-MAXSTEER,v:-C.creep}; const path=[{x:s.x,y:s.y,th:s.th}]; let ph=1,n=0;
  while(n++<40000){ if(ph===1){s.steer=-MAXSTEER; if(s.th>=th1)ph=2;} else {s.steer=MAXSTEER; if(s.th<=0){s.th=0;path.push({x:s.x,y:s.y,th:0});break;}}
    bicycle(s,0.008); path.push({x:s.x,y:s.y,th:s.th}); }
  const end={...s}, front=C.wheelbase+C.frontOverhang, hw=C.width/2, fx0=end.x-C.rearOverhang, fx1=end.x+front, curbY=end.y-hw-P.curbGap;
  const bay=rect(fx0-P.bayPad,curbY,fx1+P.bayPad,curbY+P.slotDepth);
  const frontCar=rect(fx1+P.frontClear,curbY,fx1+P.frontClear+P.parkedLen,curbY+P.parkedW);
  const rearCar=rect(fx0-P.rearClear-P.parkedLen,curbY,fx0-P.rearClear,curbY+P.parkedW);
  let sMaxY=-1e9; for(const p of path)for(const c of carCorners(p)) if(c.y>sMaxY)sMaxY=c.y;
  const road=rect(rearCar.x0-1.5,curbY,frontCar.x1+2.0,Math.max(P.approachY+hw+1.2,sMaxY+0.4));
  return { id:'parallel', title:'縦列駐車', lockLabel:'右', successKind:'parallel', turnRefX:TX, theta1:th1, appY:P.approachY,
    rects:[road], obstacles:[frontCar,rearCar], bay, poles:[], parkedCars:[frontCar,rearCar], curbY,
    ideal:{path,end}, start:{x:TX-2.6,y:P.approachY,th:0},
    coach:'前進で前の車と横に並ぶ→後退＋右いっぱい。斜め約40°で「左いっぱい」に切り返して真っ直ぐ' };
}
const _perpR=buildPerpR();
const MODELS={ perpR:_perpR, perpL:reflectModel(_perpR), parallel:buildParallel() };

/* ==================== 状態・エンジン ==================== */
let M=null, bounds=null;
const car={x:0,y:0,th:0,steer:0,v:0};
let wheelAngle=0, gear='P', brakeHeld=false, accelHeld=false, creepMode=true;
let reverses=0, wasReversing=false, result=null, cutRecorded=false, parPhase=0;
let showGuide=true, showLines=true, examMode=false;
let handbrake=true, hbWarned=false, revCheckDone=false, safetyOK=null, spdWarned=false, spdTicks=0;
let deductions=[], advice='', contactFail=false;
let cuePoleRef=null, poleInMirror=false, poleSeenEver=false, earlyReverseWarned=false;
let demoMode=false, demoPhase=0, demoT=0, demoTargetV=0, demoWheelTarget=0, demoChecksDone=false;
const DEMO_WHEEL_RATE=WHEEL_LOCK/2.0;   // 約2秒で回し切る（実車の据え切りの手応え感）
const checks={room:-1e9,L:-1e9,R:-1e9,back:-1e9};
const trail=[];

function deduct(name,pts){ deductions.push({name,pts}); }
function allChecked(){ return (tick-checks.room<900)&&(tick-checks.L<900)&&(tick-checks.R<900)&&(tick-checks.back<900); }

function computeBounds(){ let a=[...M.rects,M.bay,...M.parkedCars], minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const r of a){ minX=Math.min(minX,r.x0);maxX=Math.max(maxX,r.x1);minY=Math.min(minY,r.y0);maxY=Math.max(maxY,r.y1);}
  bounds={minX:minX-0.6,maxX:maxX+0.6,minY:minY-0.6,maxY:maxY+0.6}; }
function drivable(x,y){ let ok=false; for(const r of M.rects) if(inRect(r,x,y)){ok=true;break;} if(!ok)return false;
  for(const o of M.obstacles) if(inRect(o,x,y))return false; return true; }

  deductions=[]; advice=''; contactFail=false; trail.length=0;
  demoMode=false; demoPhase=0; demoT=0; demoTargetV=0; demoWheelTarget=0; demoChecksDone=false;

  cuePoleRef=M.poles.length?M.poles.reduce((a,b)=>Math.abs(b.x-M.turnRefX)<Math.abs(a.x-M.turnRefX)?b:a):null;

/* ==================== 入力（Pointer Events未対応の簡易WebView向けフォールバック付き） ==================== */
// AirDrop/LINE等のプレビュー表示（Quick Look系）ではPointer Events APIが動かないことがあるため、
// 対応していれば従来通りpointer*を使い、非対応ならtouch/mouseに自動フォールバックする。
const HAS_POINTER = typeof window.PointerEvent === 'function';
function bindDrag(el,{start,move,end}){
  if(HAS_POINTER){
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} start&&start(e.clientX,e.clientY); });
    el.addEventListener('pointermove',e=>{ move&&move(e.clientX,e.clientY); });
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>{ end&&end(); }));
  } else {
    el.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0]; start&&start(t.clientX,t.clientY); },{passive:false});
    el.addEventListener('touchmove',e=>{ e.preventDefault(); const t=e.touches[0]; move&&move(t.clientX,t.clientY); },{passive:false});
    ['touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>{ end&&end(); }));
    let mdown=false;
    el.addEventListener('mousedown',e=>{ mdown=true; start&&start(e.clientX,e.clientY); });
    window.addEventListener('mousemove',e=>{ if(mdown) move&&move(e.clientX,e.clientY); });
    window.addEventListener('mouseup',()=>{ if(mdown){ mdown=false; end&&end(); } });
  }
}
function bindTap(el,fn){
  if(HAS_POINTER){ el.addEventListener('click',fn); }
  else { el.addEventListener('touchend',e=>{ e.preventDefault(); fn(e); },{passive:false}); }
}

function bindMirrorAdjust(id,side){ const el=document.getElementById(id); let lx=0,ly=0,sx=0,sy=0,moved=0;

      mirrorPitch[side]=clamp(mirrorPitch[side]+(y-ly)*0.003,-0.4,0.4); lx=x; ly=y; },

/* ==================== 更新ループ ==================== */
let last=null, tick=0;
function step(ts){ if(last==null)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; tick++;
  if(M && !result && !menu.classList.contains('show')){
    if(recenterWheel){ wheelAngle+=Math.sign(-wheelAngle)*Math.min(Math.abs(wheelAngle),8*dt); if(Math.abs(wheelAngle)<0.02){wheelAngle=0;recenterWheel=false;} }
    // 遊び（デッドゾーン）を挟んでハンドル→前輪切れ角
    // ハンドルを時計回り(右)に回す=wheelAngle正 → 前輪は右に切れる=car.steer負、という向きなので符号を反転する
    const eff=Math.max(0,Math.abs(wheelAngle)-WHEEL_PLAY)*Math.sign(wheelAngle);
    car.steer=-MAXSTEER*clamp(eff/(WHEEL_LOCK-WHEEL_PLAY),-1,1);
    // 速度：ギア＋サイド＋クリープ＋アクセル−ブレーキ（実演中は自動制御）
    const dir=gear==='D'?1:gear==='R'?-1:0; let target=0, rate=6;
    if(demoMode){ target=demoTargetV; rate=5; }
    else if(gear==='P'){ target=0; rate=12; }
    else if(handbrake){ target=0; rate=10;
      if(accelHeld&&dir&&!hbWarned){ hbWarned=true; deduct('サイドブレーキ戻し忘れ',10); setCoach('サイドブレーキが掛かっています！左下で解除','bad'); } }
    else if(brakeHeld){ target=0; rate=10; }
    else if(accelHeld && dir){ target=dir*C.maxSpeed; }
    else if(creepMode && dir){ target=dir*C.creep; }
    else { target=0; rate=4; }
    car.v+=(target-car.v)*Math.min(1,dt*rate); if(Math.abs(car.v)<0.015&&target===0)car.v=0;
    bicycle(car,dt);
    // 自分の軌跡（後車軸）を記録
    if(Math.abs(car.v)>0.03){ const lt=trail[trail.length-1];
      if(!lt||Math.hypot(car.x-lt.x,car.y-lt.y)>0.12){ trail.push({x:car.x,y:car.y}); if(trail.length>2500)trail.shift(); } }
    if(demoMode) demoUpdate(dt); else updateLogic();
    handAnim(dt);
  }
  renderScene(); renderFront(); renderWheel(); renderMirror('L'); renderMirror('R'); renderRearview(); updateGauges();
  requestAnimationFrame(step);
}
function updateLogic(){
  const reversing=car.v<-0.05;
  if(car.v>0.05&&wasReversing){ reverses++;
    if(reverses===2||reverses===3){ deduct(`切り返し${reverses}回目`,5); if(!examMode)setCoach(`切り返し${reverses}回目（−5点）`,'warn'); }
    if(reverses>=4){ finish('fail','切り返し超過（4回）'); return; } }
  if(reversing)wasReversing=true; else if(car.v>0.05)wasReversing=false;
  // 後退開始時の安全確認チェック
  if(reversing&&!revCheckDone){ revCheckDone=true; safetyOK=allChecked();
    if(!safetyOK){ deduct('後退時の安全不確認',10); if(!examMode)setCoach('安全確認が不足！ルーム→左右ミラー→👀目視をタップしてから後退','bad'); } }
  // 速度の出しすぎ
  if(Math.abs(car.v)>1.7){ if(++spdTicks>50&&!spdWarned){ spdWarned=true; deduct('速度の出しすぎ',5); if(!examMode)setCoach('課題中はもっとゆっくり（クリープ＋ブレーキ）','warn'); } } else spdTicks=0;
  // 「角ポールが見えてから下がる」の癖づけ（＝手前すぎ後退の矯正。今回の検定NGの真因対策）
  if(M.successKind==='perp' && cuePoleRef){
    if(!poleSeenEver && poleInMirror && !reversing){ poleSeenEver=true;
      if(!examMode) setCoach(`${M.lockLabel}ミラーに角ポールが見えた！青ラインまで進んで止まる`,'ok'); }
    if(reversing && !earlyReverseWarned && !poleSeenEver){ earlyReverseWarned=true;
      advice=`後退開始が手前すぎ：${M.lockLabel}ミラーに角ポールがはっきり見えてから下がる癖を`;
      if(!examMode) setCoach('まだ早い！ミラーに角ポールが見えてから後退','bad'); }
  }
  // 基準点タイミング（結果パネル用にadviceも保存）
  if(M.successKind==='perp' && reversing && !cutRecorded && Math.abs(car.steer)>MAXSTEER*0.5){ cutRecorded=true; const d=M.turnRefX-car.x;
    if(d>0.4){ advice=`早切り癖：あと約${(d*100)|0}cm前に出てから切るとお手本の弧に乗る`; if(!examMode)setCoach(advice,'warn'); }
    else if(d<-0.4){ advice=`切り遅れ：${((-d)*100)|0}cmほど手前で切り始めると余裕が出る`; if(!examMode)setCoach(advice,'warn'); }
    else { advice=''; if(!examMode)setCoach(`切り始めOK！このまま${M.lockLabel}いっぱいで奥まで`,'ok'); } }
  if(M.successKind==='parallel' && reversing && parPhase===0 && Math.abs(normAng(car.th))>=M.theta1*0.85){ parPhase=1; if(!examMode)setCoach('今！ここから「左いっぱい」に切り返して真っ直ぐに','warn'); }
  // 接触・脱輪＝検定中止（車体の外周を細かくサンプリング＋ポールは円柱当たり）
  const cs=carCorners(car);
  for(const p of carPerimeter(car)){ if(!drivable(p.x,p.y)){ contactFail=true;
    finish('fail',M.parkedCars.length?'接触（車・縁石）':'脱輪・コース外'); return; } }
  if(poleHit(car)){ contactFail=true; finish('fail','ポール接触'); return; }
  // 正着判定 → 完了手順（停止→P→サイド）で終了
  const posOK = M.successKind==='perp'
    ? (inRect(M.bay,cs[2].x,cs[2].y)&&inRect(M.bay,cs[3].x,cs[3].y)&&alignedV(car.th))
    : (cs.every(p=>inRect(M.bay,p.x,p.y))&&alignedH(car.th));
  if(posOK&&Math.abs(car.v)<0.03){
    if(gear==='P'&&handbrake){ finish('success'); }
    else if(tick%40===0) setCoach('OK！ここで停止 → シフトP → サイドを掛けて完了','ok');
  }
}
/* ==================== お手本実演（自動運転チュートリアル） ==================== */
// 教習所の標準技法をそのまま見せる：「止まって回し切る → 弧の間は保持 → 止まって戻し切る」
// （切り始め・戻し始めが遅れて切り量が増える癖への矯正教材）
const sideTurns=(WHEEL_LOCK/(2*Math.PI)).toFixed(1);           // 中央→ロック ≈1.4回転
const fullTurns=(WHEEL_LOCK*2/(2*Math.PI)).toFixed(1);         // ロック→逆ロック ≈2.8回転
function startDemo(){ loadScenario(M.id); demoMode=true;
  handbrake=false; updateHbUI(); gear='D'; setGearUI();
  setCoach('【お手本】① 前進：切り始めラインまで進む（ポールが見えてもラインまで）','ok'); }
function demoUpdate(dt){
  demoT+=dt;
  const dw=demoWheelTarget-wheelAngle;
  wheelAngle+=clamp(dw,-DEMO_WHEEL_RATE*dt,DEMO_WHEEL_RATE*dt);
  const lockSign=M.lockLabel==='右'?1:-1;                       // wheelAngle正＝右回し
  const doChecks=()=>{ if(demoChecksDone)return; demoChecksDone=true;
    registerCheck('C'); setTimeout(()=>registerCheck('L'),350); setTimeout(()=>registerCheck('R'),700); setTimeout(()=>{checks.back=tick;},1050); };
  if(M.successKind==='perp'){
    const targetTh=lockSign*Math.PI/2;
    switch(demoPhase){
      case 0: demoTargetV=C.creep;
        if(car.x>=M.turnRefX){ demoPhase=1; demoT=0; setCoach('【お手本】② 停止 → 安全確認（ミラー3枚＋目視）→ R','ok'); } break;
      case 1: demoTargetV=0;
        if(Math.abs(car.v)<0.02){ if(demoT>0.4) doChecks();
          if(demoT>2.0){ gear='R'; setGearUI(); demoPhase=2; demoT=0; demoWheelTarget=lockSign*WHEEL_LOCK;
            setCoach(`【お手本】③ 止まったまま${M.lockLabel}へ回し切る（約${sideTurns}回転）`,'ok'); } } break;
      case 2: demoTargetV=0;
        if(Math.abs(dw)<0.03){ demoPhase=3; setCoach('【お手本】④ ハンドル保持のまま、ゆっくり後退（弧の間は動かさない）','ok'); } break;
      case 3: demoTargetV=-C.creep;
        if(Math.abs(normAng(car.th-targetTh))<2.5*DEG){ demoPhase=4; demoT=0; demoWheelTarget=0;
          setCoach(`【お手本】⑤ 止まって逆へ戻し切る（約${sideTurns}回転でまっすぐ）`,'ok'); } break;
      case 4: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&Math.abs(wheelAngle)<0.03){ demoPhase=5; setCoach('【お手本】⑥ まっすぐ奥まで後退','ok'); } break;
      case 5: demoTargetV=-C.creep*0.8;
        if(lockSign>0? car.y<=M.ideal.end.y+0.05 : car.y>=M.ideal.end.y-0.05){ demoPhase=6; demoT=0; } break;
      case 6: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&demoT>0.3){ gear='P'; setGearUI(); handbrake=true; updateHbUI(); result='demo'; demoMode=false;
          setCoach('【お手本】⑦ P→サイドで完了！コツ＝「止まって回し切る・弧は保持・止まって戻し切る」','ok'); } break;
    }
  } else { // 縦列
    switch(demoPhase){
      case 0: demoTargetV=C.creep;
        if(car.x>=M.turnRefX){ demoPhase=1; demoT=0; setCoach('【お手本】② 停止 → 安全確認 → R','ok'); } break;
      case 1: demoTargetV=0;
        if(Math.abs(car.v)<0.02){ if(demoT>0.4) doChecks();
          if(demoT>2.0){ gear='R'; setGearUI(); demoPhase=2; demoT=0; demoWheelTarget=WHEEL_LOCK;
            setCoach(`【お手本】③ 止まったまま右へ回し切る（約${sideTurns}回転）`,'ok'); } } break;
      case 2: demoTargetV=0;
        if(Math.abs(dw)<0.03){ demoPhase=3; setCoach('【お手本】④ 後退：車が斜め約40°になるまで','ok'); } break;
      case 3: demoTargetV=-C.creep;
        if(Math.abs(normAng(car.th))>=M.theta1){ demoPhase=4; demoT=0; demoWheelTarget=-WHEEL_LOCK;
          setCoach(`【お手本】⑤ 止まって左へ回し切る（逆いっぱいまで約${fullTurns}回転）`,'ok'); } break;
      case 4: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&Math.abs(dw)<0.03){ demoPhase=5; setCoach('【お手本】⑥ 左いっぱいのまま後退、まっすぐになるまで','ok'); } break;
      case 5: demoTargetV=-C.creep;
        if(Math.abs(normAng(car.th))<2*DEG){ demoPhase=6; demoT=0; demoWheelTarget=0;
          setCoach(`【お手本】⑦ 止まってまっすぐに戻す（約${sideTurns}回転）`,'ok'); } break;
      case 6: demoTargetV=0;
        if(Math.abs(car.v)<0.02&&Math.abs(wheelAngle)<0.03&&demoT>0.3){ gear='P'; setGearUI(); handbrake=true; updateHbUI(); result='demo'; demoMode=false;
          setCoach('【お手本】完了！コツ＝「回し切る↔戻し切る」は毎回止まってから','ok'); } break;
    }
  }
}

/* ==================== 採点・結果 ==================== */
function finish(kind,reason){ result=kind; car.v=0;
  if(kind==='fail'&&reason) deductions.push({name:reason+'＝検定中止',pts:100});
  const total=deductions.reduce((a,d)=>a+d.pts,0), score=Math.max(0,100-total);
  const pass=kind==='success'&&score>=70;
  setCoach(kind==='success'?`完了！切り返し ${reverses} 回`:'検定中止','ok');
  showResult(pass,score,kind);
}
function showResult(pass,score,kind){
  const t=document.getElementById('resTitle'), s=document.getElementById('resScore'), b=document.getElementById('resBody');
  t.textContent=pass?'🎉 合格ライン！':'不合格'; t.className=pass?'pass':'fail';
  s.textContent=`${score}点 ／ 100点（70点以上で合格${examMode?'・検定モード':'・練習モード'}）`;
  const ded=deductions.length?('<ul>'+deductions.map(d=>`<li>${d.name}：−${d.pts>=100?'中止':d.pts+'点'}</li>`).join('')+'</ul>'):'<ul><li>減点なし！</li></ul>';
  const ck=[
    ['サイドブレーキ操作', hbWarned?'✗ 戻し忘れ':'✓'],
    ['後退前の安全確認', safetyOK===false?'✗ 不足':safetyOK===null?'−（未後退）':'✓'],
    ['切り返し回数', `${reverses}回 ${reverses<=1?'✓':reverses<=3?'△':'✗'}`],
    ['接触・脱輪', contactFail?'✗':'✓'],
    ['枠内に正着', kind==='success'?'✓':'✗'],
  ].map(([k,v])=>`<li>${k}：${v}</li>`).join('');
  b.innerHTML=`<div class="sec-t">減点内訳</div>${ded}<div class="sec-t">手順チェック</div><ul>${ck}</ul>`+(advice?`<div class="adv">💡 ${advice}</div>`:'');
  document.getElementById('resultPanel').classList.add('show');
}

/* ==================== 俯瞰の描画（左） ==================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let PPM=22,W=0,H=0,ox=0,oyTop=0,frontBottom=0;
// アスファルトの質感パターン（初回のみ生成）
const asphPat=(()=>{ const c=document.createElement('canvas'); c.width=c.height=48; const g=c.getContext('2d');

  for(let i=0;i<SEG;i++){ const p0=proj(x,y,top*i/SEG), p1=proj(x,y,top*(i+1)/SEG); if(!p0||!p1)continue;
    g.strokeStyle=i%2?'#f4f6fa':'#ff8c1a'; g.lineWidth=lw;
    g.beginPath(); g.moveTo(p0.x,p0.y); g.lineTo(p1.x,p1.y); g.stroke(); }
  const t=proj(x,y,top); if(t){ g.fillStyle='#ff8c1a'; g.beginPath(); g.arc(t.x,t.y,lw*0.62,0,7); g.fill();
    g.strokeStyle='#7a4200'; g.lineWidth=1; g.stroke(); }
}
/* 縁石：上面の白線＋立ち上がり面で立体に */
function mCurb(proj,g,y){
  for(let x=bounds.minX;x<bounds.maxX;x+=0.5){
    const a0=proj(x,y,0.13),a1=proj(x+0.5,y,0.13),b0=proj(x,y,0),b1=proj(x+0.5,y,0);
    if(!a0||!a1||!b0||!b1)continue;
    g.fillStyle='#8a97ab'; g.beginPath(); g.moveTo(a0.x,a0.y); g.lineTo(a1.x,a1.y); g.lineTo(b1.x,b1.y); g.lineTo(b0.x,b0.y); g.closePath(); g.fill();
    g.strokeStyle='#e8edf4'; g.lineWidth=2; g.beginPath(); g.moveTo(a0.x,a0.y); g.lineTo(a1.x,a1.y); g.stroke(); }
}
/* 目標枠を路面に塗って見せる */
function mBayFill(proj,g){ if(!M.bay)return;
  const c=[[M.bay.x0,M.bay.y0],[M.bay.x1,M.bay.y0],[M.bay.x1,M.bay.y1],[M.bay.x0,M.bay.y1]].map(([x,y])=>proj(x,y,0.015));
  if(c.some(p=>!p)){ mRect(proj,g,M.bay,'rgba(150,195,150,.5)',2,0.02); return; }
  g.beginPath(); c.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y)); g.closePath();
  g.fillStyle='rgba(90,170,110,.15)'; g.fill();
  g.setLineDash([6,5]); g.strokeStyle='rgba(195,232,205,.7)'; g.lineWidth=2; g.stroke(); g.setLineDash([]); }
/* 奥行きグリッド（距離感） */
function drawMirrorGrid(g,proj,camx,camy,look){ g.strokeStyle='rgba(120,140,170,.15)'; g.lineWidth=1;
  const cs=Math.cos(look),sn=Math.sin(look);
  for(let d=2;d<=14;d+=2){ let prev=null; for(let o=-8;o<=8;o+=2){ const p=proj(camx+cs*d-sn*o,camy+sn*d+cs*o,0);
    if(p&&prev){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke();} prev=p; } } }
function mCarBox(proj,g,r,ht){ const c=[[r.x0,r.y0],[r.x1,r.y0],[r.x1,r.y1],[r.x0,r.y1]];
  const bot=c.map(([x,y])=>proj(x,y,0)), top=c.map(([x,y])=>proj(x,y,ht)); if(bot.some(p=>!p)||top.some(p=>!p))return;
  g.fillStyle='rgba(66,76,100,.96)'; for(let i=0;i<4;i++){ const j=(i+1)%4; g.beginPath(); g.moveTo(bot[i].x,bot[i].y);g.lineTo(bot[j].x,bot[j].y);g.lineTo(top[j].x,top[j].y);g.lineTo(top[i].x,top[i].y);g.closePath(); g.fill(); }
  g.fillStyle='#68748e'; g.beginPath(); g.moveTo(top[0].x,top[0].y); for(let i=1;i<4;i++)g.lineTo(top[i].x,top[i].y); g.closePath(); g.fill(); g.strokeStyle='#8a96b0'; g.lineWidth=1; g.stroke(); }
function mWorld(proj,g){
  for(const r of M.rects) mRect(proj,g,r,'rgba(200,215,235,.10)',1,0);
  mBayFill(proj,g);
  if(M.curbY!=null) mCurb(proj,g,M.curbY);
  for(const o of M.parkedCars) mCarBox(proj,g,o,1.42);
  for(const p of M.poles) mPole(proj,g,p.x,p.y,1.0);
}
function mHousing(g,w,h){ let sh=g.createLinearGradient(0,0,0,h); sh.addColorStop(0,'rgba(255,255,255,.12)'); sh.addColorStop(0.18,'rgba(255,255,255,0)');
  g.fillStyle=sh; g.fillRect(0,0,w,h); g.strokeStyle='#05070b'; g.lineWidth=3; g.strokeRect(1.5,1.5,w-3,h-3); }
function mEgoFlank(proj,g,side){                 // 自車の側面（ドアミラー内側）＝ボディ＋ガラス＋ホイールアーチ＋後輪
  const S=side==='L'?1:-1, ly=S*(C.width/2);
  const lxs=[0.7,0.0,-0.8,-1.5,-C.rearOverhang-0.05], bodyZ=0.72, roofZ=1.0;
  const top=[],mid=[],bot=[];
  for(const lx of lxs){ const p=toWorld(car,lx,ly); top.push(proj(p.x,p.y,roofZ)); mid.push(proj(p.x,p.y,bodyZ)); bot.push(proj(p.x,p.y,0)); }
  if(mid.some(p=>!p)||bot.some(p=>!p))return;
  // 下部ボディ
  g.beginPath(); g.moveTo(mid[0].x,mid[0].y); for(let i=1;i<mid.length;i++)g.lineTo(mid[i].x,mid[i].y);
  for(let i=bot.length-1;i>=0;i--)g.lineTo(bot[i].x,bot[i].y); g.closePath();
  const grd=g.createLinearGradient(0,mid[0].y,0,bot[0].y); grd.addColorStop(0,'#e6635a'); grd.addColorStop(0.5,CARCOL); grd.addColorStop(1,'#6f1f1b');
  g.fillStyle=grd; g.fill(); g.strokeStyle='#4c1210'; g.lineWidth=1.3; g.stroke();
  // 上部（ガラス・グラスハウス）
  if(top.every(p=>p)){ g.beginPath(); g.moveTo(top[0].x,top[0].y); for(let i=1;i<top.length;i++)g.lineTo(top[i].x,top[i].y);
    for(let i=mid.length-1;i>=0;i--)g.lineTo(mid[i].x,mid[i].y); g.closePath();
    const gg=g.createLinearGradient(0,top[0].y,0,mid[0].y); gg.addColorStop(0,'#2b3440'); gg.addColorStop(1,'#141a21'); g.fillStyle=gg; g.fill(); g.strokeStyle='#3a1512'; g.lineWidth=1; g.stroke(); }
  // 後輪＋アーチ
  const rw=side==='L'?wheelPositions(car).RL:wheelPositions(car).RR;
  const wc=proj(rw.x,rw.y,0.17), wg=proj(rw.x,rw.y,0);
  if(wc&&wg){ const rr=Math.max(5,58/wc.depth);
    g.fillStyle='rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(wg.x,wg.y,rr*1.25,rr*0.4,0,0,7); g.fill();        // 接地影
    g.fillStyle='#2a0f0d'; g.beginPath(); g.arc(wc.x,wc.y,rr*1.15,Math.PI,2*Math.PI); g.closePath(); g.fill(); // アーチ
    g.fillStyle='#131418'; g.beginPath(); g.ellipse(wc.x,wc.y,rr*0.72,rr,0,0,7); g.fill();                    // タイヤ
    g.fillStyle='#474d59'; g.beginPath(); g.ellipse(wc.x,wc.y,rr*0.34,rr*0.55,0,0,7); g.fill();               // ホイール
    g.fillStyle='#20242c'; g.beginPath(); g.ellipse(wc.x,wc.y,rr*0.13,rr*0.22,0,0,7); g.fill(); }             // ハブ
}
function renderMirror(side){
  const el=document.getElementById(side==='L'?'mirL':'mirR'); if(!el)return; const g=el.getContext('2d');
  const w=el.getBoundingClientRect().width, h=el.getBoundingClientRect().height; if(!M||w<2)return;
  g.clearRect(0,0,w,h);
  const cam=driverMirror(car,side), camH=1.02, sgn=side==='R'?1:-1;
  const look=car.th+Math.PI + sgn*0.32 + mirrorPan[side];
  const focal=w*0.46, horizon=clamp(h*0.46 - mirrorPitch[side]*h, 8, h-8);
  mSky(g,w,h,horizon); const proj=mkProj(cam.x,cam.y,camH,look,focal,horizon,w);
  drawMirrorGrid(g,proj,cam.x,cam.y,look);
  mWorld(proj,g);
  // 「角ポールが見えた」検知＋強調（方向転換のみ・ロック側ミラー）
  if(M.successKind==='perp' && cuePoleRef && side===(M.lockLabel==='右'?'R':'L') && !result){
    const pr=proj(cuePoleRef.x,cuePoleRef.y,0.5);
    const vis=!!pr && pr.x>w*0.10 && pr.x<w*0.96 && pr.depth>0.8;
    poleInMirror=vis;
    if(vis && !wasReversing){
      const rr=Math.max(10,64/pr.depth), al=0.45+0.4*Math.abs(Math.sin(tick*0.15));
      g.strokeStyle=`rgba(55,214,122,${al})`; g.lineWidth=3;
      g.beginPath(); g.ellipse(pr.x,pr.y,rr,rr*1.6,0,0,7); g.stroke();
      g.fillStyle='#37d67a'; g.font='bold 12px system-ui'; g.textAlign='center';
      g.fillText('角ポール',pr.x,Math.max(14,pr.y-rr*1.9)); g.textAlign='left';
    }
  }
  mEgoFlank(proj,g,side); mHousing(g,w,h);
}
/* フロントガラス視界：前方の目標（ポール・枠・目安ライン）が実際どう見えるか */
function renderFront(){
  const el=document.getElementById('frontCv'); if(!el)return; const g=el.getContext('2d');
  const w=el.getBoundingClientRect().width, h=el.getBoundingClientRect().height; if(!M||w<2)return;
  g.clearRect(0,0,w,h);
  const cam=toWorld(car,1.5,-(C.width/2-0.55)), camH=1.22;        // 右ハンドル運転席の目線
  const look=car.th, focal=w*0.46, horizon=h*0.50;
  mSky(g,w,h,horizon);
  const proj=mkProj(cam.x,cam.y,camH,look,focal,horizon,w,+1);    // 前方＝鏡像なし
  // 地面の奥行きグリッド（速度感・距離感）
  g.strokeStyle='rgba(120,140,170,.18)'; g.lineWidth=1;
  const cs0=Math.cos(look), sn0=Math.sin(look);
  for(let d=2;d<=16;d+=2){ let prev=null; for(let o=-8;o<=8;o+=2){ const p=proj(cam.x+cs0*d-sn0*o, cam.y+sn0*d+cs0*o, 0);
    if(p&&prev){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke();} prev=p; } }
  mWorld(proj,g);
  // 切り始めの目安ライン（地面の青ライン）が前方に見える
  if(showGuide&&!examMode){ let prev=null; g.strokeStyle='rgba(77,163,255,.85)'; g.lineWidth=3;
    for(let y=bounds.minY;y<=bounds.maxY;y+=0.4){ const p=proj(M.turnRefX,y,0.02); if(p&&prev){g.beginPath();g.moveTo(prev.x,prev.y);g.lineTo(p.x,p.y);g.stroke();} prev=p; } }
  // 自車のボンネット（RHDで少し右寄りに見える）
  const cs2=carCorners(car), pl=proj(cs2[0].x,cs2[0].y,0.98), pr=proj(cs2[1].x,cs2[1].y,0.98);
  if(pl&&pr){ const topY=Math.min(pl.y,pr.y); const grd=g.createLinearGradient(0,topY,0,h);
    grd.addColorStop(0,'#e6635a'); grd.addColorStop(0.45,CARCOL); grd.addColorStop(1,'#5f1b17');
    g.beginPath(); g.moveTo(-8,h+8); g.lineTo(pl.x,pl.y); g.lineTo(pr.x,pr.y); g.lineTo(w+8,h+8); g.closePath();
    g.fillStyle=grd; g.fill();
    g.strokeStyle='#521512'; g.lineWidth=2; g.beginPath(); g.moveTo(pl.x,pl.y); g.lineTo(pr.x,pr.y); g.stroke();
    const shine=g.createLinearGradient(0,topY,0,topY+18);
    shine.addColorStop(0,'rgba(255,255,255,.28)'); shine.addColorStop(1,'rgba(255,255,255,0)');
    g.beginPath(); g.moveTo(pl.x,pl.y); g.lineTo(pr.x,pr.y); g.lineTo(pr.x,pr.y+16); g.lineTo(pl.x,pl.y+16); g.closePath(); g.fillStyle=shine; g.fill(); }
  // Aピラー（窓のフレーム感）
  const pw=Math.max(10,w*0.02);
  for(const [x0,x1] of [[0,pw],[w-pw,w]]){ const pg=g.createLinearGradient(x0,0,x1,0);
    pg.addColorStop(x0===0?0:1,'#05070b'); pg.addColorStop(x0===0?1:0,'rgba(5,7,11,.25)');
    g.fillStyle=pg; g.beginPath();
    if(x0===0){ g.moveTo(0,0); g.lineTo(pw*2.2,0); g.lineTo(pw,h); g.lineTo(0,h); }
    else { g.moveTo(w,0); g.lineTo(w-pw*2.2,0); g.lineTo(w-pw,h); g.lineTo(w,h); }
    g.closePath(); g.fill(); }
  g.strokeStyle='#05070b'; g.lineWidth=2; g.strokeRect(1,1,w-2,h-2);
}
function renderRearview(){
  const el=document.getElementById('mirC'); if(!el)return; const g=el.getContext('2d');
  const w=el.getBoundingClientRect().width, h=el.getBoundingClientRect().height; if(!M||w<2)return;
  g.clearRect(0,0,w,h);
  const cam=toWorld(car,-0.2,0), camH=1.18;
  const look=car.th+Math.PI + mirrorPan.C;
  const focal=w*0.44, horizon=clamp(h*0.50 - mirrorPitch.C*h, 8, h-8);
  mSky(g,w,h,horizon); const proj=mkProj(cam.x,cam.y,camH,look,focal,horizon,w);
  drawMirrorGrid(g,proj,cam.x,cam.y,look);
  mWorld(proj,g);
  const rl=toWorld(car,-C.rearOverhang,C.width/2), rr=toWorld(car,-C.rearOverhang,-C.width/2);
  const a=proj(rl.x,rl.y,0.6), b=proj(rr.x,rr.y,0.6), a0=proj(rl.x,rl.y,0), b0=proj(rr.x,rr.y,0);
  if(a&&b&&a0&&b0){ const grd=g.createLinearGradient(0,Math.min(a.y,b.y),0,Math.max(a0.y,b0.y));
    grd.addColorStop(0,'#7a221d'); grd.addColorStop(1,'#3c0f0d'); g.fillStyle=grd;
    g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.lineTo(b0.x,b0.y); g.lineTo(a0.x,a0.y); g.closePath(); g.fill(); }
  mHousing(g,w,h);
}

/* ==================== ゲージ更新（DOM） ==================== */
function updateGauges(){ document.getElementById('kmh').textContent=Math.round(Math.abs(car.v)*3.6); }

/* ==================== メニューのアイコン ==================== */
function drawIcons(){ document.querySelectorAll('canvas[data-ico]').forEach(cv=>{ cv.width=46;cv.height=46; const g=cv.getContext('2d'), m=MODELS[cv.dataset.ico];
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9; for(const r of [...m.rects,m.bay]){ minX=Math.min(minX,r.x0);maxX=Math.max(maxX,r.x1);minY=Math.min(minY,r.y0);maxY=Math.max(maxY,r.y1);}
  const s=Math.min(42/(maxX-minX),42/(maxY-minY)), px=x=>2+(x-minX)*s, py=y=>44-(y-minY)*s;
  g.fillStyle='#2a3346'; for(const r of m.rects) g.fillRect(px(r.x0),py(r.y1),(r.x1-r.x0)*s,(r.y1-r.y0)*s);
  g.fillStyle='#17253c'; g.fillRect(px(m.bay.x0),py(m.bay.y1),(m.bay.x1-m.bay.x0)*s,(m.bay.y1-m.bay.y0)*s);
  g.fillStyle='#5a6a8c'; for(const o of m.parkedCars) g.fillRect(px(o.x0),py(o.y1),(o.x1-o.x0)*s,(o.y1-o.y0)*s);
  g.strokeStyle='#4da3ff'; g.lineWidth=1.6; g.setLineDash([3,2]); g.beginPath(); m.ideal.path.forEach((p,i)=>{const X=px(p.x),Y=py(p.y);i?g.lineTo(X,Y):g.moveTo(X,Y);}); g.stroke(); g.setLineDash([]); }); }

/* 起動 */
drawIcons(); loadScenario('perpR'); setGearUI(); requestAnimationFrame(step);
</script>
