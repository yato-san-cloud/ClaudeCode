<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0524" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="スマホで遊べる、くそ面白いミニゲーム集。反射神経・連打・ガチャ・叫びメーターで盛り上がろう！" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>ヒマ神 - くそ面白いミニゲーム集</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- ホーム画面 -->
    <section id="home" class="screen active">
      <header class="hero">
        <h1 class="logo">ヒマ<span>神</span></h1>
        <p class="tagline">くそ面白いミニゲーム集</p>
      </header>
      <nav class="game-grid">
        <button class="game-card" data-game="reaction" style="--c1:#ff4d6d;--c2:#ff8a5b">
          <span class="emoji">⚡️</span>
          <span class="name">反射神経テスト</span>
          <span class="desc">光ったら即タップ！</span>
        </button>
        <button class="game-card" data-game="tap" style="--c1:#7b2ff7;--c2:#f107a3">
          <span class="emoji">🔥</span>
          <span class="name">連打スピード</span>
          <span class="desc">5秒で何回押せる？</span>
        </button>
        <button class="game-card" data-game="gacha" style="--c1:#00c9a7;--c2:#00b4d8">
          <span class="emoji">🎰</span>
          <span class="name">運命のガチャ</span>
          <span class="desc">今日のレア度は？</span>
        </button>
        <button class="game-card" data-game="scream" style="--c1:#f9c80e;--c2:#ff6b35">
          <span class="emoji">📢</span>
          <span class="name">叫びメーター</span>
          <span class="desc">声でメーターを振り切れ</span>
        </button>
        <button class="game-card" data-game="shake" style="--c1:#3a86ff;--c2:#8338ec">
          <span class="emoji">📱</span>
          <span class="name">シェイクバトル</span>
          <span class="desc">10秒で何回振れる？</span>
        </button>
        <button class="game-card" data-game="memory" style="--c1:#06d6a0;--c2:#118ab2">
          <span class="emoji">🧠</span>
          <span class="name">記憶ヘビ</span>
          <span class="desc">光る順番を覚えろ</span>
        </button>
      </nav>
      <footer class="home-foot">
        <p>🏆 ハイスコアは自動で保存されるよ</p>
      </footer>
    </section>

    <!-- ゲーム画面（共通） -->
    <section id="game" class="screen">
      <button id="backBtn" class="back-btn" aria-label="戻る">‹ もどる</button>
      <div id="gameStage"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
