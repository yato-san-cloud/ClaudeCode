<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>教習所トレーナー（運転席モード）</title>
<style>
  :root{ --bg:#0d1118; --panel:#161c28; --panel2:#1d2534; --ink:#e8edf6; --sub:#93a1b8;
    --ok:#37d67a; --warn:#ffb020; --bad:#ff5c5c; --accent:#4da3ff; --accent2:#7c5cff; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none;}
  #app{position:relative; width:100%; height:100%; overflow:hidden; background:#0a1220;}
  #cv{position:absolute; inset:0; width:100%; height:100%; display:block;}
  /* 上部バー */
  #topbar{position:absolute; top:0; left:0; right:0; height:34px; display:flex; align-items:center; gap:6px; padding:4px 8px; z-index:8; pointer-events:none;}
  #topbar .t{font-size:12px; font-weight:700; background:rgba(12,18,28,.6); padding:3px 7px; border-radius:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:32%;}
  #topbar button{pointer-events:auto; background:#26304a; color:var(--ink); border:0; border-radius:6px; padding:5px 8px; font-size:11px; font-weight:700; white-space:nowrap;}
  #topbar button.on{background:var(--accent); color:#04101f;} #topbar button.menu{background:var(--accent2); color:#fff;} #topbar .sp{flex:1;}
  /* ミラー（上・左右） */
  .mir{position:absolute; top:38px; width:148px; height:66px; background:#000; border:1px solid #2b364d; border-radius:8px; overflow:hidden; z-index:6; touch-action:none;}
  #mirLbox{left:8px;} #mirRbox{right:8px;}
  .mir canvas{display:block; width:100%; height:100%;}
  .mir .lab{position:absolute; left:4px; top:2px; font-size:9px; color:#9fb0c8; background:rgba(0,0,0,.45); padding:0 3px; border-radius:3px;}
  .mir .adj{position:absolute; right:4px; bottom:2px; font-size:8px; color:#8fa0b8;}
  /* 速度・ギア（上中央） */
  #spd{position:absolute; top:36px; left:50%; transform:translateX(-50%); z-index:6; background:rgba(18,22,30,.85); border:1px solid #2b364d; border-radius:9px; padding:3px 12px; display:flex; align-items:baseline; gap:9px;}
  #spd .kmh{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1;}
  #spd .u{font-size:9px; color:var(--sub);}
  #spd .gear b{font-size:13px; font-weight:800; color:#3b4560; margin:0 1px;} #spd .gear b.act{color:var(--accent);}
  /* コーチ（下中央） */
  #coach{position:absolute; left:50%; transform:translateX(-50%); bottom:6px; max-width:44%; text-align:center; z-index:6; pointer-events:none;}
  #coach .msg{display:inline-block; font-size:12.5px; font-weight:700; background:rgba(12,18,28,.86); border:1px solid #2b364d; border-radius:9px; padding:5px 10px;}
  .msg.ok{color:var(--ok);border-color:var(--ok);} .msg.warn{color:var(--warn);border-color:var(--warn);} .msg.bad{color:var(--bad);border-color:var(--bad);}
  /* 左親指：シフト＋ペダル */
  #leftCluster{position:absolute; left:8px; bottom:8px; width:168px; z-index:9;}
  #pedals{display:flex; gap:6px;}
  .pedal{flex:1; height:106px; border:0; border-radius:12px; font-weight:800; font-size:14px; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.4);}
  .pedal.brake{background:#7a2530;} .pedal.brake.held{background:var(--bad); transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  .pedal.accel{background:#1f5a37;} .pedal.accel.held{background:var(--ok); color:#04101f; transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4);}
  /* 右親指：シフト＋ハンドル */
  #rightCluster{position:absolute; right:8px; bottom:8px; display:flex; flex-direction:row; align-items:flex-end; gap:8px; z-index:9;}
  #shifter{display:flex; flex-direction:column; gap:5px; width:50px;}
  #shifter button{height:40px; border:0; border-radius:8px; background:var(--panel2); color:var(--sub); font-weight:800; font-size:15px;}
  #shifter button.act{background:var(--accent); color:#04101f;}
  #wheelBox{display:flex; flex-direction:column; align-items:center; gap:4px;}
  #recenter{background:#26304a; color:var(--ink); border:0; border-radius:8px; padding:5px 11px; font-size:11px; font-weight:700;}
  #wheel{touch-action:none; display:block;}
  /* メニュー */
  #menu{position:fixed; inset:0; background:#0b0f17; display:none; flex-direction:column; gap:10px; padding:14px 16px; overflow:auto; z-index:30;}
  #menu.show{display:flex;} #menu h2{margin:2px 0 0; font-size:16px;}
  #menu p.lead{margin:0; color:var(--sub); font-size:11.5px;}
  .cards{display:flex; gap:10px; flex-wrap:wrap;}
  .card{flex:1 1 200px; display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid #2b364d; border-radius:12px; padding:10px; text-align:left;}
  .card:active{border-color:var(--accent);}
  .card canvas{width:46px;height:46px;flex:0 0 46px;} .card .t{font-size:14px;font-weight:800;} .card .d{font-size:11px;color:var(--sub);margin-top:2px;}
  #menu .close{align-self:center; background:#26304a; color:var(--ink); border:0; border-radius:9px; padding:9px 20px; font-weight:700;}
  #rotate{position:fixed; inset:0; background:#0d1118; color:var(--ink); display:none; align-items:center; justify-content:center; text-align:center; z-index:50; font-size:15px; padding:24px;}
  @media (orientation:portrait){ #rotate{display:flex;} }
</style>

<div id="app">
  <canvas id="cv"></canvas>
  <div id="topbar">
    <button class="menu" id="btnMenu">≡課題</button>
    <span class="t" id="title">方向転換（右バック）</span>
    <span class="sp"></span>
    <button id="btnGuide" class="on">お手本</button>
    <button id="btnLines" class="on">タイヤ線</button>
    <button id="creep" class="on">クリープON</button>
    <button id="reset">やり直し</button>
  </div>
  <div class="mir" id="mirLbox"><canvas id="mirL"></canvas><span class="lab">左ミラー</span><span class="adj">調整:ドラッグ</span></div>
  <div class="mir" id="mirRbox"><canvas id="mirR"></canvas><span class="lab">右ミラー</span><span class="adj">調整:ドラッグ</span></div>
  <div id="spd"><span><span class="kmh" id="kmh">0</span> <span class="u">km/h</span></span><span class="gear"><b data-g="P">P</b><b data-g="R">R</b><b data-g="N">N</b><b data-g="D">D</b></span></div>
  <div id="coach"><span class="msg" id="coachMsg">課題を選んでスタート</span></div>

  <!-- 左親指：シフト＋ペダル -->
  <div id="leftCluster">
    <div id="pedals"><button class="pedal brake" id="brake">ブレーキ</button><button class="pedal accel" id="accel">アクセル</button></div>
  </div>
  <!-- 右親指：シフト＋ハンドル -->
  <div id="rightCluster">
    <div id="shifter"><button data-g="P" class="act">P</button><button data-g="R">R</button><button data-g="N">N</button><button data-g="D">D</button></div>
    <div id="wheelBox"><button id="recenter">まっすぐ</button><canvas id="wheel"></canvas></div>
  </div>

  <div id="menu">
    <h2>課題をえらぶ</h2>
    <p class="lead">卒検で崩れやすい3課題。横向き推奨・右手の親指で操作できます。</p>
    <div class="cards">
      <button class="card" data-id="perpR"><canvas data-ico="perpR"></canvas><div><div class="t">方向転換（右バック）</div><div class="d">右のポケットへ後退</div></div></button>
      <button class="card" data-id="perpL"><canvas data-ico="perpL"></canvas><div><div class="t">方向転換（左バック）</div><div class="d">左のポケットへ後退</div></div></button>
      <button class="card" data-id="parallel"><canvas data-ico="parallel"></canvas><div><div class="t">縦列駐車</div><div class="d">S字で切り返し</div></div></button>
    </div>
    <p class="lead">※ コース寸法は仮の標準値。教習車＝マツダ アクセラ セダン想定。実寸で本人仕様に。</p>
    <button class="close" id="menuClose">閉じる</button>
  </div>
</div>
<div id="rotate">📱 横向き（ランドスケープ）にしてください</div>

<script>
"use strict";
const DEG=Math.PI/180;

/* ==================== CONFIG（実寸に差し替え可） ==================== */
const CONFIG={
  car:{ length:4.58, width:1.795, wheelbase:2.70, frontOverhang:0.92, track:1.54,
        maxSteerDeg:36, creep:0.55, maxSpeed:1.9 },
  perp:{ bayWidth:3.0, bayDepth:5.5, turninX:6.0 },
  parallel:{ approachY:3.2, turninX:8.0, theta1Deg:42, slotDepth:2.5, parkedLen:4.5,
             parkedW:1.75, curbGap:0.25, frontClear:2.0, rearClear:0.5, bayPad:0.4 }
};
const C=CONFIG.car; C.rearOverhang=C.length-C.wheelbase-C.frontOverhang;
const MAXSTEER=C.maxSteerDeg*DEG;
const WHEEL_LOCK=1.25*2*Math.PI;   // ロック・トゥ・ロック2.5回転（片側1.25回転）

/* ==================== 物理・車体 ==================== */
function bicycle(s,dt){ s.x+=s.v*Math.cos(s.th)*dt; s.y+=s.v*Math.sin(s.th)*dt; s.th+=(s.v/C.wheelbase)*Math.tan(s.steer)*dt; }
function carCorners(s){ const c=Math.cos(s.th),sn=Math.sin(s.th),fx=C.wheelbase+C.frontOverhang,rx=-C.rearOverhang,hw=C.width/2;
  return [[fx,hw],[fx,-hw],[rx,-hw],[rx,hw]].map(([lx,ly])=>({x:s.x+lx*c-ly*sn,y:s.y+lx*sn+ly*c})); }
function toWorld(s,lx,ly){ const c=Math.cos(s.th),sn=Math.sin(s.th); return {x:s.x+lx*c-ly*sn,y:s.y+lx*sn+ly*c}; }
function wheelPositions(s){ const t=C.track/2; return {
  FL:toWorld(s,C.wheelbase,+t), FR:toWorld(s,C.wheelbase,-t), RL:toWorld(s,0,+t), RR:toWorld(s,0,-t) }; }
function driverMirror(s,side){ return toWorld(s, C.wheelbase*0.55, (side==='L'?+1:-1)*(C.width/2+0.12)); }
function normAng(a){ a=(a+Math.PI)%(2*Math.PI); if(a<0)a+=2*Math.PI; return a-Math.PI; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function alignedV(th){ return Math.min(Math.abs(normAng(th-Math.PI/2)),Math.abs(normAng(th+Math.PI/2)))<10*DEG; }
function alignedH(th){ return Math.abs(normAng(th))<10*DEG; }
function rect(x0,y0,x1,y1){ return {x0:Math.min(x0,x1),y0:Math.min(y0,y1),x1:Math.max(x0,x1),y1:Math.max(y0,y1)}; }
function inRect(r,x,y){ return x>=r.x0&&x<=r.x1&&y>=r.y0&&y<=r.y1; }

/* ==================== 課題ビルダー（検証済み） ==================== */
function buildPerpR(){
  const P=CONFIG.perp, APP_Y=C.width/2+0.10, TX=P.turninX;
  const s={x:TX,y:APP_Y,th:0,steer:-MAXSTEER,v:-C.creep}; const path=[{x:s.x,y:s.y,th:s.th}]; let n=0;
  while(n++<8000){ bicycle(s,0.01); path.push({x:s.x,y:s.y,th:s.th}); if(s.th>=Math.PI/2)break; }
  const end={...s}, bayCX=end.x, bayX0=bayCX-P.bayWidth/2, bayX1=bayCX+P.bayWidth/2;
  let sMaxY=-1e9,sMaxX=-1e9,sMinX=1e9;
  for(const p of path)for(const c of carCorners(p)){ if(c.y>sMaxY)sMaxY=c.y; if(c.x>sMaxX)sMaxX=c.x; if(c.x<sMinX)sMinX=c.x; }
  const aisleY1=Math.max(APP_Y+C.width/2+0.8,sMaxY+0.4), aX0=Math.min(-1.2,sMinX-0.4), aX1=Math.max(TX+(C.wheelbase+C.frontOverhang)+0.8,sMaxX+0.4);
  return { id:'perpR', title:'方向転換（右バック）', lockLabel:'右', successKind:'perp', turnRefX:TX, appY:APP_Y,
    rects:[rect(aX0,0,aX1,aisleY1),rect(aX0,-0.9,aX1,0),rect(bayX0,-P.bayDepth,bayX1,0)], obstacles:[],
    bay:rect(bayX0,-P.bayDepth,bayX1,0), poles:[{x:bayX0,y:0},{x:bayX1,y:0}], parkedCars:[], curbY:null,
    ideal:{path,end}, start:{x:Math.max(0.6,aX0+C.rearOverhang+0.5),y:APP_Y,th:0},
    coach:'前進(D)で青ラインまで→止まって、後退(R)＋右いっぱいでポケットへ' };
}
function reflectModel(m){ const A=m.appY, ry=y=>2*A-y, rr=r=>rect(r.x0,ry(r.y0),r.x1,ry(r.y1)), rp=p=>({x:p.x,y:ry(p.y),th:-p.th});
  return { id:'perpL', title:'方向転換（左バック）', lockLabel:'左', successKind:'perp', turnRefX:m.turnRefX, appY:A,
    rects:m.rects.map(rr), obstacles:[], bay:rr(m.bay), poles:m.poles.map(p=>({x:p.x,y:ry(p.y)})), parkedCars:[], curbY:null,
    ideal:{path:m.ideal.path.map(rp), end:rp(m.ideal.end)}, start:rp(m.start),
    coach:m.coach.replace('右いっぱい','左いっぱい') }; }
function buildParallel(){
  const P=CONFIG.parallel, TX=P.turninX, th1=P.theta1Deg*DEG;
  const s={x:TX,y:P.approachY,th:0,steer:-MAXSTEER,v:-C.creep}; const path=[{x:s.x,y:s.y,th:s.th}]; let ph=1,n=0;
  while(n++<40000){ if(ph===1){s.steer=-MAXSTEER; if(s.th>=th1)ph=2;} else {s.steer=MAXSTEER; if(s.th<=0){s.th=0;path.push({x:s.x,y:s.y,th:0});break;}}
    bicycle(s,0.008); path.push({x:s.x,y:s.y,th:s.th}); }
  const end={...s}, front=C.wheelbase+C.frontOverhang, hw=C.width/2, fx0=end.x-C.rearOverhang, fx1=end.x+front, curbY=end.y-hw-P.curbGap;
  const bay=rect(fx0-P.bayPad,curbY,fx1+P.bayPad,curbY+P.slotDepth);
  const frontCar=rect(fx1+P.frontClear,curbY,fx1+P.frontClear+P.parkedLen,curbY+P.parkedW);
  const rearCar=rect(fx0-P.rearClear-P.parkedLen,curbY,fx0-P.rearClear,curbY+P.parkedW);
  let sMaxY=-1e9; for(const p of path)for(const c of carCorners(p)) if(c.y>sMaxY)sMaxY=c.y;
  const road=rect(rearCar.x0-1.5,curbY,frontCar.x1+2.0,Math.max(P.approachY+hw+1.2,sMaxY+0.4));
  return { id:'parallel', title:'縦列駐車', lockLabel:'右', successKind:'parallel', turnRefX:TX, theta1:th1, appY:P.approachY,
    rects:[road], obstacles:[frontCar,rearCar], bay, poles:[], parkedCars:[frontCar,rearCar], curbY,
    ideal:{path,end}, start:{x:TX-2.6,y:P.approachY,th:0},
    coach:'前進で前の車と横に並ぶ→後退＋右いっぱい。斜め約40°で「左いっぱい」に切り返して真っ直ぐ' };
}
const _perpR=buildPerpR();
const MODELS={ perpR:_perpR, perpL:reflectModel(_perpR), parallel:buildParallel() };

/* ==================== 状態・エンジン ==================== */
let M=null, bounds=null;
const car={x:0,y:0,th:0,steer:0,v:0};
let wheelAngle=0, gear='P', brakeHeld=false, accelHeld=false, creepMode=true;
let reverses=0, wasReversing=false, result=null, cutRecorded=false, parPhase=0;
let showGuide=true, showLines=true;
const mirrorPan={L:0,R:0}, mirrorPitch={L:-0.05,R:-0.05};

function computeBounds(){ let a=[...M.rects,M.bay,...M.parkedCars], minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(const r of a){ minX=Math.min(minX,r.x0);maxX=Math.max(maxX,r.x1);minY=Math.min(minY,r.y0);maxY=Math.max(maxY,r.y1);}
  bounds={minX:minX-0.6,maxX:maxX+0.6,minY:minY-0.6,maxY:maxY+0.6}; }
function drivable(x,y){ let ok=false; for(const r of M.rects) if(inRect(r,x,y)){ok=true;break;} if(!ok)return false;
  for(const o of M.obstacles) if(inRect(o,x,y))return false; return true; }
function loadScenario(id){ M=MODELS[id]; car.x=M.start.x;car.y=M.start.y;car.th=M.start.th;car.steer=0;car.v=0;
  wheelAngle=0; gear='P'; setGearUI(); reverses=0;wasReversing=false;result=null;cutRecorded=false;parPhase=0;
  document.getElementById('title').textContent=M.title; setCoach(M.coach,''); computeBounds(); resize(); closeMenu(); }
function resetCar(){ loadScenario(M.id); }
const coachEl=document.getElementById('coachMsg');
function setCoach(t,cls){ coachEl.textContent=t; coachEl.className='msg'+(cls?(' '+cls):''); }

/* ==================== 入力 ==================== */
// ステアリング：ドラッグで連続回転（微調整可・2.5回転）
const wheelCv=document.getElementById('wheel');
let wdrag=false, wlast=0;
function pAngle(e){ const r=wheelCv.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2)); }
wheelCv.addEventListener('pointerdown',e=>{ e.preventDefault(); wdrag=true; wlast=pAngle(e); wheelCv.setPointerCapture(e.pointerId); });
wheelCv.addEventListener('pointermove',e=>{ if(!wdrag)return; const a=pAngle(e); wheelAngle=clamp(wheelAngle+normAng(a-wlast),-WHEEL_LOCK,WHEEL_LOCK); wlast=a; });
['pointerup','pointercancel'].forEach(ev=>wheelCv.addEventListener(ev,()=>wdrag=false));
document.getElementById('recenter').addEventListener('click',()=>{ recenterWheel=true; });
let recenterWheel=false;

// ペダル・ギア
function bindPedal(id,set){ const el=document.getElementById(id);
  const on=e=>{e.preventDefault(); set(true); el.classList.add('held');};
  const off=e=>{e.preventDefault(); set(false); el.classList.remove('held');};
  el.addEventListener('pointerdown',on); ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off)); }
bindPedal('brake',v=>brakeHeld=v); bindPedal('accel',v=>accelHeld=v);
function setGearUI(){ document.querySelectorAll('#shifter button').forEach(b=>b.classList.toggle('act',b.dataset.g===gear));
  document.querySelectorAll('#spd .gear b').forEach(b=>b.classList.toggle('act',b.dataset.g===gear)); }
document.querySelectorAll('#shifter button').forEach(b=>b.addEventListener('click',()=>{ gear=b.dataset.g; setGearUI(); }));
document.getElementById('creep').addEventListener('click',function(){ creepMode=!creepMode; this.classList.toggle('on',creepMode); this.textContent='クリープ '+(creepMode?'ON':'OFF'); });
document.getElementById('btnGuide').addEventListener('click',function(){ showGuide=!showGuide; this.classList.toggle('on',showGuide); });
document.getElementById('btnLines').addEventListener('click',function(){ showLines=!showLines; this.classList.toggle('on',showLines); });
document.getElementById('reset').addEventListener('click',resetCar);

// ミラー調整（各ミラーをドラッグ）
function bindMirrorAdjust(id,side){ const el=document.getElementById(id); let d=false,lx=0,ly=0;
  el.addEventListener('pointerdown',e=>{e.preventDefault(); d=true; lx=e.clientX; ly=e.clientY; el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointermove',e=>{ if(!d)return; mirrorPan[side]=clamp(mirrorPan[side]+(e.clientX-lx)*0.004,-0.6,0.6);
    mirrorPitch[side]=clamp(mirrorPitch[side]+(e.clientY-ly)*0.003,-0.4,0.4); lx=e.clientX; ly=e.clientY; });
  ['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>d=false)); }
bindMirrorAdjust('mirL','L'); bindMirrorAdjust('mirR','R');

// メニュー
const menu=document.getElementById('menu');
function openMenu(){menu.classList.add('show');} function closeMenu(){menu.classList.remove('show');}
document.getElementById('btnMenu').addEventListener('click',openMenu);
document.getElementById('menuClose').addEventListener('click',closeMenu);
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>loadScenario(c.dataset.id)));

/* ==================== 更新ループ ==================== */
let last=null, tick=0;
function step(ts){ if(last==null)last=ts; let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05; tick++;
  if(M && !result && !menu.classList.contains('show')){
    if(recenterWheel){ wheelAngle+=Math.sign(-wheelAngle)*Math.min(Math.abs(wheelAngle),8*dt); if(Math.abs(wheelAngle)<0.02){wheelAngle=0;recenterWheel=false;} }
    car.steer=MAXSTEER*clamp(wheelAngle/WHEEL_LOCK,-1,1);
    // 速度：ギア＋クリープ＋アクセル−ブレーキ
    const dir=gear==='D'?1:gear==='R'?-1:0; let target=0, rate=6;
    if(gear==='P'){ target=0; rate=12; }
    else if(brakeHeld){ target=0; rate=10; }
    else if(accelHeld && dir){ target=dir*C.maxSpeed; }
    else if(creepMode && dir){ target=dir*C.creep; }
    else { target=0; rate=4; }
    car.v+=(target-car.v)*Math.min(1,dt*rate); if(Math.abs(car.v)<0.015&&target===0)car.v=0;
    bicycle(car,dt); updateLogic();
    handAnim(dt);
  }
  renderScene(); renderWheel(); renderMirror('L'); renderMirror('R'); updateGauges();
  requestAnimationFrame(step);
}
function updateLogic(){
  const reversing=car.v<-0.05;
  if(car.v>0.05&&wasReversing){ reverses++; } if(reversing)wasReversing=true; else if(car.v>0.05)wasReversing=false;
  if(M.successKind==='perp' && reversing && !cutRecorded && Math.abs(car.steer)>MAXSTEER*0.5){ cutRecorded=true; const d=M.turnRefX-car.x;
    if(d>0.4)setCoach(`早切りかも：あと約${(d*100)|0}cm前に出てから切ると青い線に乗ります`,'warn');
    else if(d<-0.4)setCoach(`行き過ぎ：${((-d)*100)|0}cmほど手前で切り始めると余裕が出ます`,'warn');
    else setCoach(`切り始めOK！このまま${M.lockLabel}いっぱいで奥まで`,'ok'); }
  if(M.successKind==='parallel' && reversing && parPhase===0 && Math.abs(normAng(car.th))>=M.theta1*0.85){ parPhase=1; setCoach('今！ここから「左いっぱい」に切り返して真っ直ぐに','warn'); }
  const cs=carCorners(car);
  for(const p of cs){ if(!drivable(p.x,p.y)){ result='fail'; setCoach(M.parkedCars.length?'車・縁石に接触。やり直し':'脱輪／ポール接触。やり直し','bad'); car.v=0; return; } }
  const stopped=Math.abs(car.v)<0.03 && (brakeHeld||gear==='P'||gear==='N'||!creepMode);
  if(M.successKind==='perp'){ if(inRect(M.bay,cs[2].x,cs[2].y)&&inRect(M.bay,cs[3].x,cs[3].y)&&alignedV(car.th)&&stopped){ result='success'; setCoach(`入りました！切り返し ${reverses} 回`,'ok'); } }
  else { if(cs.every(p=>inRect(M.bay,p.x,p.y))&&alignedH(car.th)&&stopped){ result='success'; setCoach(`きれいに入りました！切り返し ${reverses} 回`,'ok'); } }
}

/* ==================== 俯瞰の描画（左） ==================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let PPM=22,W=0,H=0,ox=0,oyTop=0;
function resize(){ const r=document.getElementById('app').getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); W=r.width;H=r.height;
  if(bounds){ const ww=bounds.maxX-bounds.minX, wh=bounds.maxY-bounds.minY, availTop=44, availBot=Math.min(150,H*0.42), drawH=Math.max(70,H-availTop-availBot);
    PPM=Math.min(W/ww, drawH/wh)*0.98; ox=(W-ww*PPM)/2; oyTop=availTop+(drawH-wh*PPM)/2; }
  sizeCanvas(wheelCv); sizeCanvas(document.getElementById('mirL')); sizeCanvas(document.getElementById('mirR')); }
function sizeCanvas(c){ const dpr=window.devicePixelRatio||1;
  if(c.id==='wheel'){ const d=Math.round(Math.min(176,H*0.42,W*0.30)); c.style.width=d+'px'; c.style.height=d+'px'; c.width=d*dpr; c.height=d*dpr; }
  else { const r=c.getBoundingClientRect(); c.width=Math.max(1,r.width*dpr); c.height=Math.max(1,r.height*dpr); }
  c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
addEventListener('resize',()=>resize());
function wx(x){ return ox+(x-bounds.minX)*PPM; } function wy(y){ return oyTop+(bounds.maxY-y)*PPM; }
function fillR(r,col){ ctx.fillStyle=col; ctx.fillRect(wx(r.x0),wy(r.y1),(r.x1-r.x0)*PPM,(r.y1-r.y0)*PPM); }
function strokeR(r,col,w){ ctx.strokeStyle=col; ctx.lineWidth=w; ctx.strokeRect(wx(r.x0),wy(r.y1),(r.x1-r.x0)*PPM,(r.y1-r.y0)*PPM); }

function renderScene(){ ctx.clearRect(0,0,W,H); if(!M||!bounds)return;
  for(const r of M.rects) fillR(r,'#20293b');
  fillR(M.bay,'#17253c'); strokeR(M.bay,'#3d5170',2);
  // 縁石ハッチング（走行可能域の外周を強調）
  if(M.curbY!=null){ ctx.strokeStyle='#6d7f9c'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(wx(bounds.minX),wy(M.curbY)); ctx.lineTo(wx(bounds.maxX),wy(M.curbY)); ctx.stroke();
    ctx.strokeStyle='rgba(140,150,170,.5)'; ctx.lineWidth=1; for(let x=bounds.minX;x<bounds.maxX;x+=0.4){ ctx.beginPath(); ctx.moveTo(wx(x),wy(M.curbY)); ctx.lineTo(wx(x-0.25),wy(M.curbY)-6); ctx.stroke(); } }
  for(const o of M.parkedCars){ fillR(o,'#3a445d'); strokeR(o,'#5a6a8c',1.5); ctx.fillStyle='#7f8ea8'; }
  // お手本
  if(showGuide){ ctx.strokeStyle='rgba(77,163,255,.5)'; ctx.lineWidth=3; ctx.setLineDash([8,7]); ctx.beginPath();
    M.ideal.path.forEach((p,i)=>{const X=wx(p.x),Y=wy(p.y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle='rgba(77,163,255,.9)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(wx(M.turnRefX),wy(bounds.maxY)); ctx.lineTo(wx(M.turnRefX),wy(bounds.minY)); ctx.stroke();
    ctx.fillStyle='rgba(77,163,255,.9)'; ctx.font='11px system-ui'; ctx.fillText('切り始めの目安', wx(M.turnRefX)+5, wy(bounds.maxY)+14); }
  // ポール
  for(const p of M.poles){ ctx.fillStyle='#ffb020'; ctx.beginPath(); ctx.arc(wx(p.x),wy(p.y),6,0,7); ctx.fill(); ctx.strokeStyle='#7a5500'; ctx.lineWidth=1.5; ctx.stroke(); }
  if(showLines) drawWheelTrails(car);
  drawCar(car);
  drawCourseCue();
}
function drawWheelTrails(s){
  const w=wheelPositions(s), st=s.steer, D=2.6;
  const strong=Math.abs(st)>0.5*DEG;
  const draw=(wp,col,front)=>{ ctx.strokeStyle=col; ctx.lineWidth=2; ctx.setLineDash([5,4]); ctx.beginPath();
    if(!strong){ const dx=Math.cos(s.th)*D, dy=Math.sin(s.th)*D; ctx.moveTo(wx(wp.x-dx),wy(wp.y-dy)); ctx.lineTo(wx(wp.x+dx),wy(wp.y+dy)); }
    else{ const Rr=C.wheelbase/Math.tan(st), nx=-Math.sin(s.th), ny=Math.cos(s.th), IC={x:s.x+nx*Rr,y:s.y+ny*Rr};
      const rw=Math.hypot(wp.x-IC.x,wp.y-IC.y), a0=Math.atan2(wp.y-IC.y,wp.x-IC.x), span=D/rw;
      for(let k=-20;k<=20;k++){ const a=a0+span*k/20, X=wx(IC.x+Math.cos(a)*rw), Y=wy(IC.y+Math.sin(a)*rw); k===-20?ctx.moveTo(X,Y):ctx.lineTo(X,Y); } }
    ctx.stroke(); ctx.setLineDash([]); };
  // 前輪＝水色、後輪＝橙。右ハンドル想定で「遠い左輪・後輪」を意識できるよう色分け
  draw(w.FR,'rgba(90,200,255,.9)',true); draw(w.FL,'rgba(90,200,255,.55)',true);
  draw(w.RR,'rgba(255,176,32,.9)',false); draw(w.RL,'rgba(255,176,32,.55)',false);
  // 4輪本体（前輪は切れ角つき）
  const drawWheel=(wp,ang)=>{ ctx.save(); ctx.translate(wx(wp.x),wy(wp.y)); ctx.rotate(-ang); ctx.fillStyle='#e8edf6'; ctx.fillRect(-6,-3,12,6); ctx.restore(); };
  drawWheel(w.FL,s.th+st); drawWheel(w.FR,s.th+st); drawWheel(w.RL,s.th); drawWheel(w.RR,s.th);
}
function drawCar(s){ const cs=carCorners(s), col=result==='fail'?'#ff5c5c':result==='success'?'#37d67a':'#cfd8e8';
  ctx.beginPath(); cs.forEach((p,i)=>{const X=wx(p.x),Y=wy(p.y);i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}); ctx.closePath();
  ctx.fillStyle=col; ctx.globalAlpha=.85; ctx.fill(); ctx.globalAlpha=1; ctx.strokeStyle='#0b1524'; ctx.lineWidth=1.5; ctx.stroke();
  // 運転席（右）マーク
  const d=driverMirror(s,'R'); ctx.fillStyle='#0b1524'; ctx.beginPath(); ctx.arc(wx(d.x),wy(d.y),2.5,0,7); ctx.fill();
  const c=Math.cos(s.th),sn=Math.sin(s.th),fx=C.wheelbase+C.frontOverhang; ctx.fillStyle='#0b1524'; ctx.beginPath(); ctx.arc(wx(s.x+fx*c),wy(s.y+fx*sn),3,0,7); ctx.fill();
}
function drawCourseCue(){ if(result)return; let show=null;
  if(M.successKind==='perp'){ if(Math.abs(car.x-M.turnRefX)<0.45)show=`ここで止めて ${M.lockLabel}いっぱい`; }
  else{ const a=Math.abs(normAng(car.th)); if(car.v<-0.05&&a>=M.theta1*0.85&&a<=M.theta1*1.2)show='今、左いっぱい！'; }
  if(!show)return; const al=0.5+0.5*Math.abs(Math.sin(tick*0.12)), X=wx(car.x),Y=wy(car.y)-26;
  ctx.textAlign='center'; ctx.font='bold 13px system-ui'; const w=ctx.measureText(show).width+14;
  ctx.globalAlpha=al*0.9; ctx.fillStyle='rgba(6,12,20,.92)'; roundRect(X-w/2,Y-16,w,22,6); ctx.fill();
  ctx.globalAlpha=al; ctx.fillStyle='#37d67a'; ctx.fillText(show,X,Y); ctx.globalAlpha=1; ctx.textAlign='left'; }
function drawCueGauge(){ const iw=Math.min(170,W*0.5), ih=52, px=W-iw-8, py=34;
  ctx.fillStyle='rgba(10,16,26,.9)'; ctx.strokeStyle='#2b364d'; ctx.lineWidth=1; roundRect(px,py,iw,ih,8); ctx.fill(); ctx.stroke();
  let lo,hi,gz0,gz1,val,title,gL,active;
  if(M.successKind==='perp'){ lo=M.turnRefX-2;hi=M.turnRefX+2;gz0=M.turnRefX-0.4;gz1=M.turnRefX+0.4;val=car.x;title='切り始めの位置';gL='ここで切る';active=Math.abs(car.v)>0.02; }
  else{ lo=0;hi=M.theta1*1.5;gz0=M.theta1*0.85;gz1=M.theta1*1.15;val=Math.abs(normAng(car.th));title='切り返しの角度';gL='左に切り返し';active=car.v<-0.02; }
  const tx=px+10,tw=iw-20,ty=py+32,map=v=>tx+clamp((v-lo)/(hi-lo),0,1)*tw;
  ctx.textAlign='left'; ctx.fillStyle='#cdd7e6'; ctx.font='11px system-ui'; ctx.fillText(title,px+9,py+15);
  ctx.fillStyle='#2b364d'; ctx.fillRect(tx,ty,tw,6); ctx.fillStyle='rgba(55,214,122,.5)'; ctx.fillRect(map(gz0),ty-3,map(gz1)-map(gz0),12);
  ctx.textAlign='center'; ctx.fillStyle='#37d67a'; ctx.font='9px system-ui'; ctx.fillText(gL,(map(gz0)+map(gz1))/2,ty-6);
  const mxp=map(val), inZone=val>=gz0&&val<=gz1; ctx.fillStyle=inZone?'#37d67a':'#ffb020';
  ctx.beginPath(); ctx.moveTo(mxp,ty-1); ctx.lineTo(mxp-5,ty-9); ctx.lineTo(mxp+5,ty-9); ctx.closePath(); ctx.fill();
  if(inZone&&active){ ctx.fillStyle='#37d67a'; ctx.font='bold 11px system-ui'; ctx.textAlign='left'; ctx.fillText('今！',mxp+8,ty-2); } ctx.textAlign='left'; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ==================== ステアリング＋手（右ダッシュボード） ==================== */
const hand={grip:[0,0], anim:[0,0]}; const HAND_HOME=[0,Math.PI], COMF=150*DEG;
function handAnim(dt){ hand.anim[0]=Math.max(0,hand.anim[0]-dt*4); hand.anim[1]=Math.max(0,hand.anim[1]-dt*4); }
function renderWheel(){ const g=wheelCv.getContext('2d'), w=wheelCv.getBoundingClientRect().width, h=wheelCv.getBoundingClientRect().height;
  g.clearRect(0,0,w,h); const cx=w/2, cy=h/2, R=Math.min(w,h)/2-10;
  g.save(); g.translate(cx,cy);
  // 目盛り（中心・固定）
  g.strokeStyle='#39435c'; g.lineWidth=2;
  g.beginPath(); g.moveTo(0,-R-4); g.lineTo(0,-R+6); g.stroke();
  g.save(); g.rotate(wheelAngle);
  // リム
  g.strokeStyle='#e6ecf6'; g.lineWidth=Math.max(6,R*0.16); g.beginPath(); g.arc(0,0,R,0,7); g.stroke();
  // スポーク
  g.lineWidth=Math.max(5,R*0.12); g.beginPath(); g.moveTo(0,0); g.lineTo(0,R); g.moveTo(-R,0); g.lineTo(R,0); g.stroke();
  g.fillStyle='#cbd5e6'; g.beginPath(); g.arc(0,0,R*0.18,0,7); g.fill();
  g.fillStyle='#4da3ff'; g.beginPath(); g.arc(0,-R,R*0.1,0,7); g.fill();  // 上部マーカー
  g.restore();
  // 手（持ち替えアニメ）
  for(let i=0;i<2;i++){ let rel=wheelAngle-hand.grip[i];
    while(rel>COMF){ hand.grip[i]+=COMF; rel-=COMF; hand.anim[i]=1; }
    while(rel<-COMF){ hand.grip[i]-=COMF; rel+=COMF; hand.anim[i]=1; }
    const ang=HAND_HOME[i]+rel, lift=hand.anim[i], rr=R*(1-0.14*lift);
    const hx=Math.cos(ang)*rr, hy=Math.sin(ang)*rr;
    g.save(); g.translate(hx,hy); g.rotate(ang+Math.PI/2); g.globalAlpha=1-0.25*lift;
    g.fillStyle='#f0c9a8'; g.strokeStyle='#c99b76'; g.lineWidth=1.5;
    roundRectG(g,-9,-7,18,15,5); g.fill(); g.stroke();
    for(let k=-1;k<=2;k++){ g.beginPath(); roundRectG(g,-8+ (k+1)*4.2,-11,3.4,6,1.6); g.fill(); g.stroke(); } // 指
    g.restore(); }
  g.restore();
  // 舵角テキスト
  g.fillStyle='#93a1b8'; g.font='11px system-ui'; g.textAlign='center';
  const turns=(wheelAngle/ (2*Math.PI)); g.fillText(`舵角 ${Math.round(car.steer/DEG)}°  /  ${turns>=0?'左':'右'}${Math.abs(turns).toFixed(1)}回転`, cx, h-4);
}
function roundRectG(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ==================== ミラー（簡易3D投影） ==================== */
function renderMirror(side){ const el=document.getElementById(side==='L'?'mirL':'mirR'), g=el.getContext('2d');
  const w=el.getBoundingClientRect().width, h=el.getBoundingClientRect().height; g.clearRect(0,0,w,h);
  if(!M){return;}
  // 空/地面
  g.fillStyle='#0b1a2e'; g.fillRect(0,0,w,h); g.fillStyle='#1a2436'; g.fillRect(0,h*0.5,w,h*0.5);
  const cam=driverMirror(car,side), camH=1.05;
  const look=car.th+Math.PI+(side==='R'?-0.5:0.5)+mirrorPan[side];
  const cosL=Math.cos(look), sinL=Math.sin(look), focal=w*0.85, horizon=h*0.5 + mirrorPitch[side]*h*2;
  function proj(px,py,pz){ const dx=px-cam.x,dy=py-cam.y, depth=dx*cosL+dy*sinL, right=-dx*sinL+dy*cosL; if(depth<0.2)return null;
    return {x:w/2 - focal*(right/depth), y:horizon - focal*((pz-camH)/depth), depth}; }
  function post(px,py,top,col){ const a=proj(px,py,0), b=proj(px,py,top); if(!a||!b)return; g.strokeStyle=col; g.lineWidth=Math.max(2,60/a.depth); g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); }
  // 地面グリッド（奥行き感）
  g.strokeStyle='rgba(120,140,170,.25)'; g.lineWidth=1;
  for(let d=1;d<=8;d++){ const pts=[]; for(let o=-4;o<=4;o++){ const p=proj(cam.x+ (cosL*d) + (-sinL*o), cam.y+ (sinL*d)+(cosL*o),0); if(p)pts.push(p); } for(let i=1;i<pts.length;i++){ g.beginPath(); g.moveTo(pts[i-1].x,pts[i-1].y); g.lineTo(pts[i].x,pts[i].y); g.stroke(); } }
  // 縁石ライン
  if(M.curbY!=null){ let prev=null; for(let x=bounds.minX;x<=bounds.maxX;x+=0.5){ const p=proj(x,M.curbY,0.08); if(p&&prev){ g.strokeStyle='#8ea0bc'; g.lineWidth=2; g.beginPath(); g.moveTo(prev.x,prev.y); g.lineTo(p.x,p.y); g.stroke(); } prev=p; } }
  // ポール
  for(const p of M.poles) post(p.x,p.y,1.0,'#ffb020');
  // 駐車車両（角を柱で）
  for(const o of M.parkedCars){ post(o.x0,o.y0,1.2,'#9fb0c8'); post(o.x0,o.y1,1.2,'#9fb0c8'); post(o.x1,o.y1,1.2,'#9fb0c8'); }
  // 自車の後輪（そのミラー側）＝タイヤの目印
  const rw=side==='L'?wheelPositions(car).RL:wheelPositions(car).RR; const tp=proj(rw.x,rw.y,0.15);
  if(tp){ g.fillStyle='#20242c'; g.beginPath(); g.ellipse(tp.x,tp.y,Math.max(5,80/tp.depth),Math.max(3,44/tp.depth),0,0,7); g.fill(); g.fillStyle='#0c0e12'; g.fillText('',tp.x,tp.y); }
  // 自車ボディ端
  const bodyC=side==='L'?toWorld(car,-C.rearOverhang,C.width/2):toWorld(car,-C.rearOverhang,-C.width/2); const bp=proj(bodyC.x,bodyC.y,0.5);
  if(bp){ g.fillStyle='rgba(190,70,70,.55)'; g.fillRect(side==='L'?0:w-14,0,14,h); }
}

/* ==================== ゲージ更新（DOM） ==================== */
function updateGauges(){ document.getElementById('kmh').textContent=Math.round(Math.abs(car.v)*3.6); }

/* ==================== メニューのアイコン ==================== */
function drawIcons(){ document.querySelectorAll('canvas[data-ico]').forEach(cv=>{ cv.width=46;cv.height=46; const g=cv.getContext('2d'), m=MODELS[cv.dataset.ico];
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9; for(const r of [...m.rects,m.bay]){ minX=Math.min(minX,r.x0);maxX=Math.max(maxX,r.x1);minY=Math.min(minY,r.y0);maxY=Math.max(maxY,r.y1);}
  const s=Math.min(42/(maxX-minX),42/(maxY-minY)), px=x=>2+(x-minX)*s, py=y=>44-(y-minY)*s;
  g.fillStyle='#2a3346'; for(const r of m.rects) g.fillRect(px(r.x0),py(r.y1),(r.x1-r.x0)*s,(r.y1-r.y0)*s);
  g.fillStyle='#17253c'; g.fillRect(px(m.bay.x0),py(m.bay.y1),(m.bay.x1-m.bay.x0)*s,(m.bay.y1-m.bay.y0)*s);
  g.fillStyle='#5a6a8c'; for(const o of m.parkedCars) g.fillRect(px(o.x0),py(o.y1),(o.x1-o.x0)*s,(o.y1-o.y0)*s);
  g.strokeStyle='#4da3ff'; g.lineWidth=1.6; g.setLineDash([3,2]); g.beginPath(); m.ideal.path.forEach((p,i)=>{const X=px(p.x),Y=py(p.y);i?g.lineTo(X,Y):g.moveTo(X,Y);}); g.stroke(); g.setLineDash([]); }); }

/* 起動 */
drawIcons(); loadScenario('perpR'); setGearUI(); requestAnimationFrame(step);
</script>
